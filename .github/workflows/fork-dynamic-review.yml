name: Fork dynamic review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number statically approved by a collaborator
        required: true
        type: string
      head_sha:
        description: Exact 40-character PR head SHA approved for execution
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-dynamic-review-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  linux:
    name: Hosted Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Validate immutable inputs
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - name: Verify checked-out SHA before execution
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install trusted host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison ccache cmake flex libtool ninja-build
          python3 -m venv /tmp/yuzu-review-venv
          /tmp/yuzu-review-venv/bin/pip install --require-hashes -r requirements-ci.txt
          echo "/tmp/yuzu-review-venv/bin" >> "$GITHUB_PATH"

      - name: Set up isolated vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '4b77da7fed37817f124936239197833469f1b9a8'

      - name: Configure without shared caches
        env:
          VCPKG_BINARY_SOURCES: clear
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          ./scripts/setup.sh \
            --tests \
            --native-file meson/native/linux-gcc13.ini

      - name: Compile
        run: meson compile -C build-linux

      - name: Test
        run: meson test -C build-linux --print-errorlogs
