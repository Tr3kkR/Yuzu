name: Docs Lint

# Lightweight hygiene checks for the changelog (and docs). The `changelog-order`
# job publishes the **required** "CHANGELOG order" status check, so this
# workflow must run on EVERY pull request to main/dev. A `paths:` filter here
# was the bug: a PR that didn't touch CHANGELOG.md never reported the required
# check and got wedged forever on a status that never arrived (the
# path-filtered-required-check trap). The job is fast and dependency-light — no
# build, no vcpkg, no caches — so running it unconditionally is cheap.
on:
  # No paths filter: the required CHANGELOG-order status must report on every
  # PR. push fires only on mainline branches so a feature/fix branch with an
  # open PR runs docs lint exactly once via pull_request.
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog-order:
    name: CHANGELOG order
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CHANGELOG.md is in reverse chronological order
        run: python3 tests/test_changelog_order.py

      # Issue-lifecycle hygiene (ADR-3001 A1) lives under this REQUIRED job on
      # purpose: the meson `docs` suite also runs it, but only inside the heavy
      # platform jobs, which docs-only PRs skip (#1978 gate) — and docs-only
      # PRs are exactly the class that can push CLAUDE.md over its cap or break
      # the never-close list. This job runs on every PR, so the invariant
      # actually binds.
      - name: Issue-lifecycle docs hygiene (CLAUDE.md cap, do-not-close.txt)
        run: python3 tests/test_issue_docs.py

  # Changelog fragment convention (changelog.d/ — see changelog.d/README.md):
  # PRs add uniquely-named fragment files instead of editing CHANGELOG.md's
  # [Unreleased] section (the perpetual merge-conflict / approval-invalidation
  # hotspot). This job lints the fragments and fails any PR whose diff changes
  # the [Unreleased] section content directly — with a failure message that
  # tells the (human or agent) author exactly how to convert the edit into a
  # fragment. The release promote (CHANGELOG.md changes + fragment deletions
  # in the same diff) is recognised and allowed.
  changelog-fragments:
    name: Changelog fragments
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint changelog.d/ fragment files
        run: python3 scripts/assemble-changelog.py --check

      - name: Block direct edits to CHANGELOG.md [Unreleased]
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/assemble-changelog.py --guard "$BASE_SHA"

  # Prometheus alert rules are code that runs in production and never compiles,
  # so nothing caught a rule that parses perfectly and can still never fire for
  # the case it was written for — which is exactly how YuzuAuditRetentionNotRunning
  # shipped unable to fire for a crash-looping server (#2553). `check rules` is
  # the parse gate; `test rules` is the behaviour gate, and it is the one that
  # would have caught it.
  #
  # ITS OWN JOB, deliberately. These steps pull a container — the only Docker Hub
  # dependency in THIS workflow (other workflows have their own: pre-release.yml
  # runs distro images) — so a registry outage or an anonymous-pull rate limit
  # fails THIS check, under a name that says what actually broke, instead of
  # failing a required check called "CHANGELOG order" on a PR that never touched
  # an alert rule. (A workflow-level `paths:` filter would be the wrong fix: a
  # required check that is skipped rather than run never reports — the
  # path-filtered-required-check trap this file's own top-of-workflow header
  # documents.) Whether this job becomes a required check is a branch-protection
  # decision, not something this file can assert.
  #
  # The meson registration of the same cases (tests/meson.build →
  # tests/prometheus/run_promtool_tests.py) deliberately does NOT pull: it needs
  # a native promtool or an explicit opt-in, because flake-retry runs `meson
  # test` unfiltered on three required build legs and an earlier version of this
  # wiring put Docker Hub on all three.
  #
  # Runs on every PR rather than only rule changes: the rules and the code that
  # feeds them drift apart from either side, and the whole run is a few seconds
  # plus an image pull.
  prometheus-rules:
    name: Prometheus alert rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and unit-test alert rules (promtool)
        env:
          # Pinned by DIGEST, matching how this repo pins actions by SHA: a
          # floating tag would mean CI runs a promtool nobody validated against.
          # This digest is promtool 3.13.1, the build these tests were written
          # and mutation-checked against. Prometheus 3.0 made range selectors
          # left-open, which shifts increase()/resets() at window edges — the
          # exact thing these cases measure — so the major version is load-bearing.
          # tests/prometheus/run_promtool_tests.py asserts it pins this same
          # digest, so the two copies cannot drift silently.
          PROMTOOL_IMAGE: "prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893"
        run: |
          set -euo pipefail
          # Retry the pull: a transient registry hiccup should not read as a
          # broken alert rule.
          for attempt in 1 2 3; do
            if docker pull --quiet "$PROMTOOL_IMAGE"; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not pull $PROMTOOL_IMAGE after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          docker run --rm -v "$PWD":/w:ro \
            --entrypoint /bin/promtool "$PROMTOOL_IMAGE" \
            check rules /w/docs/prometheus/yuzu-alerts.yml
          docker run --rm -v "$PWD":/w:ro \
            --entrypoint /bin/promtool "$PROMTOOL_IMAGE" \
            test rules /w/tests/prometheus/yuzu-alerts.test.yml
