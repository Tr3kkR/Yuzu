name: Docs Lint

# Lightweight hygiene checks for the changelog (and docs). The `changelog-order`
# job publishes the **required** "CHANGELOG order" status check, so this
# workflow must run on EVERY pull request to main/dev. A `paths:` filter here
# was the bug: a PR that didn't touch CHANGELOG.md never reported the required
# check and got wedged forever on a status that never arrived (the
# path-filtered-required-check trap). The job is fast and dependency-light — no
# build, no vcpkg, no caches — so running it unconditionally is cheap.
on:
  # No paths filter: the required CHANGELOG-order status must report on every
  # PR. push fires only on mainline branches so a feature/fix branch with an
  # open PR runs docs lint exactly once via pull_request.
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog-order:
    name: CHANGELOG order
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CHANGELOG.md is in reverse chronological order
        run: python3 tests/test_changelog_order.py

      # Issue-lifecycle hygiene (ADR-3001 A1) lives under this REQUIRED job on
      # purpose: the meson `docs` suite also runs it, but only inside the heavy
      # platform jobs, which docs-only PRs skip (#1978 gate) — and docs-only
      # PRs are exactly the class that can push CLAUDE.md over its cap or break
      # the never-close list. This job runs on every PR, so the invariant
      # actually binds.
      - name: Issue-lifecycle docs hygiene (CLAUDE.md cap, do-not-close.txt)
        run: python3 tests/test_issue_docs.py

  # Changelog fragment convention (changelog.d/ — see changelog.d/README.md):
  # PRs add uniquely-named fragment files instead of editing CHANGELOG.md's
  # [Unreleased] section (the perpetual merge-conflict / approval-invalidation
  # hotspot). This job lints the fragments and fails any PR whose diff changes
  # the [Unreleased] section content directly — with a failure message that
  # tells the (human or agent) author exactly how to convert the edit into a
  # fragment. The release promote (CHANGELOG.md changes + fragment deletions
  # in the same diff) is recognised and allowed.
  changelog-fragments:
    name: Changelog fragments
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint changelog.d/ fragment files
        run: python3 scripts/assemble-changelog.py --check

      - name: Block direct edits to CHANGELOG.md [Unreleased]
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/assemble-changelog.py --guard "$BASE_SHA"
