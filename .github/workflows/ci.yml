name: CI

on:
  # push fires only on mainline branches (merges into dev/main) so feature/
  # fix branches with an open PR run CI exactly once via pull_request rather
  # than the previous duplicate (push + pull_request). For pre-PR feature
  # work, open the PR earlier; fork revisions use the explicit trusted-fork
  # workflow documented in docs/ci-architecture.md.
  #
  # tags-ignore is belt-and-suspenders: with `branches:` set, GitHub
  # already filters tag pushes — but explicitly excluding `v*` documents
  # the intent that release tags MUST NOT trip CI (the Release workflow
  # at release.yml owns the build matrix for tags). NOTE: this does NOT
  # eliminate the duplicate CI race we hit during v0.11.0 — that came
  # from branch pushes (the CHANGELOG promote commit landing on dev,
  # then fast-forwarded to main) firing two CI runs that contended for
  # the self-hosted runners against the release tag's workflow. A real
  # cross-workflow concurrency fix is needed for that; tracked as a
  # follow-up issue.
  push:
    branches: [main, dev]
    tags-ignore: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/runner-inventory.json'
      - '.github/workflows/runner-inventory-sentinel.yml'
  pull_request:
    branches: [main, dev]
    # No paths-ignore here (issue #1978). Filtering this whole workflow out
    # for docs-only PRs left the required contexts (Preflight, Proto
    # backward-compat, Linux/Windows/macOS debug) permanently "Expected —
    # waiting for status", so a non-admin could never merge a docs-only PR
    # (they had to be admin-bypassed). Instead the workflow always runs and
    # the `preflight` job's `code_changed` output gates the heavy build jobs:
    # a docs-only PR skips them, and a *skipped* required check is satisfied
    # whereas an *absent* one is not. The `push:` trigger above keeps its
    # paths-ignore — post-merge docs pushes need no build and gate nothing.
  workflow_call:
    inputs:
      pr_number:
        description: "Open fork PR number approved for trusted execution"
        required: true
        type: string
      head_sha:
        description: "Exact 40-character PR head SHA approved for execution"
        required: true
        type: string
    secrets:
      TRUSTED_FORK_CI_GATE:
        description: "Repository-only sentinel proving the trusted wrapper invoked this workflow"
        required: true
      RUNNER_INVENTORY_TOKEN:
        description: "Administration:read token used only by hosted runner-control preflight"
        required: true

# Scorecard Token-Permissions hardening: ci.yml builds and tests only —
# no registry pushes, no release creation. contents:read is all that's
# needed. (Image pushes live in ci-runner-image.yml, which keeps its
# packages:write.)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PRs cancel-in-progress (rapid iteration — every push obsoletes the last).
  # Pushes to dev / main do NOT cancel — they queue. Mid-flight pushes were
  # killing 10+ min of compile work on rapid landings, and the
  # squash-merge-mid-CI race plausibly explained the irreproducible
  # post-squash Windows test failure (#501). PR-4 of the CI overhaul plan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # meson pin lives in requirements-ci.txt (pip ecosystem tracked by
  # Dependabot). vcpkg baseline is tracked by the scheduled
  # .github/workflows/vcpkg-baseline-update.yml workflow.
  VCPKG_COMMIT: "4b77da7fed37817f124936239197833469f1b9a8"
  VCPKG_BINARY_SOURCES: "default"
  # Bumped 500M → 30G after measuring 94-97% direct-hit rate on the
  # self-hosted runners (yuzu-wsl2-linux + yuzu-local-windows). Yuzu has
  # ~700 TUs × multiple build_type/compiler matrix legs; 500M was
  # thrashing the cache between configs. The hosted macOS leg uploads
  # via actions/cache and gets capped at GitHub's 10 GB per-repo cache
  # limit, so this is effectively a "self-hosted gets the full cache"
  # bump — no risk of bloating the GitHub Actions cache budget.
  CCACHE_MAXSIZE: "30G"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "1"

jobs:
  # The reusable-workflow entry point is intentionally protected by a
  # repository-only secret. Ordinary pull_request runs still perform the
  # fail-closed fork check in preflight; only trusted-fork-ci.yml can invoke
  # this workflow against a fork SHA with secrets available.
  trusted_inputs:
    name: "Validate trusted CI inputs"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      checkout_repository: ${{ steps.validate.outputs.checkout_repository }}
      checkout_ref: ${{ steps.validate.outputs.checkout_ref }}
      checkout_sha: ${{ steps.validate.outputs.checkout_sha }}
      base_sha: ${{ steps.validate.outputs.base_sha }}
      trusted_execution: ${{ steps.validate.outputs.trusted_execution }}
    steps:
      - id: validate
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVED_SHA: ${{ inputs.head_sha }}
          TRUSTED_GATE: ${{ secrets.TRUSTED_FORK_CI_GATE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A reusable workflow inherits the caller's github.event_name, so
          # inputs.head_sha — which only the trusted wrapper supplies — is the
          # call-boundary discriminator. Do not use github.event_name here.
          if [[ -z "$APPROVED_SHA" ]]; then
            echo "checkout_repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "checkout_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "trusted_execution=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "base_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ -n "$TRUSTED_GATE" ]] || {
            echo "::error::TRUSTED_FORK_CI_GATE is required; direct reusable-workflow calls are forbidden."
            exit 1
          }

          pr_json=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          state=$(jq -r '.state' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")
          base_sha=$(jq -r '.base.sha' <<<"$pr_json")
          [[ "$state" == "open" ]] || {
            echo "::error::PR #$PR_NUMBER is not open."
            exit 1
          }
          [[ "$head_sha" == "$APPROVED_SHA" ]] || {
            echo "::error::PR #$PR_NUMBER head moved; approved=$APPROVED_SHA current=$head_sha"
            exit 1
          }
          [[ -n "$head_repo" && "$head_repo" != "$REPOSITORY" ]] || {
            echo "::error::trusted-fork-ci is only for fork-originated PRs."
            exit 1
          }

          # Checkout from the base repository at the immutable PR head SHA.
          # This keeps the comparison base and workflow definitions anchored to
          # the repository while still executing the approved fork revision.
          echo "checkout_repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$head_sha" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "trusted_execution=true" >> "$GITHUB_OUTPUT"
          echo "Trusted execution approved for $head_repo PR #$PR_NUMBER @ $head_sha"

  # ── Preflight: runner-health gate (PR-7 of CI overhaul plan) ──────────
  # Runs on a GHA-hosted runner (always available) and queries
  # /actions/runners. Each downstream job that targets a self-hosted
  # runner gates on the corresponding *_healthy output with explicit
  # `== 'true'` (fail-closed: an unhealthy or unknown runner skips the
  # job in <30s rather than queuing 30 min into a stalled runner).
  #
  # Output names are slugified runner names from .github/runner-inventory.json:
  #   yuzu-wsl2-linux  → yuzu_wsl2_linux_healthy
  #   yuzu-local-windows → yuzu_local_windows_healthy
  # Plus a pool gate:
  #   linux_pool_healthy → true iff >=1 [self-hosted, Linux, X64] runner is online
  #     (any yuzu-bigtam-* OR the yuzu-wsl2-linux Shulgi fallback). The Linux jobs
  #     gate on the pool, not a single named runner, so a free pool member keeps
  #     them running and a fully-offline pool still skips them fast.
  #
  # If the runner-control query is unavailable or a required pool is wholly
  # offline, preflight fails red. Required checks must never disappear behind
  # a successful skip merely because their control-plane evidence is missing.
  preflight:
    name: "Preflight (runner health)"
    needs: [trusted_inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow default (contents: read), so
    # both are listed. pull-requests: read is required by the code-vs-docs gate
    # below, which lists the PR's changed files via the REST API (issue #1978).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Pool gate for the [self-hosted, Linux, X64] jobs (proto-compat, linux):
      # true iff >=1 eligible Linux runner (any yuzu-bigtam-* OR the yuzu-wsl2-linux
      # Shulgi fallback) is online. Replaces the old single-named yuzu_wsl2_linux gate.
      linux_pool_healthy: ${{ steps.health.outputs.linux_pool_healthy }}
      # Big Tam sub-pool (yuzu-bigtam-linux) — gates the gcc-15/clang-21 compile
      # job, whose 26.04-only toolchain cannot run on the Shulgi 24.04 fallback.
      bigtam_pool_healthy: ${{ steps.health.outputs.bigtam_pool_healthy }}
      # Exact Wee Tam pool gate matching the Windows job's runs-on labels.
      # Shulgi is an operator testbed, not a production scheduling fallback.
      weetam_pool_healthy: ${{ steps.health.outputs.weetam_pool_healthy }}
      yuzu_wsl2_linux_healthy: ${{ steps.health.outputs.yuzu_wsl2_linux_healthy }}
      yuzu_local_windows_healthy: ${{ steps.health.outputs.yuzu_local_windows_healthy }}
      all_healthy: ${{ steps.health.outputs.all_healthy }}
      # code_changed (issue #1978): false iff every changed file in a PR is in
      # the docs/ignore set the pull_request trigger used to carry. Gates the
      # heavy build jobs (proto-compat, linux, windows, macos) so a docs-only
      # PR skips them instead of blocking forever on absent required checks.
      # Always true for non-PR events (push / workflow_dispatch build always).
      code_changed: ${{ steps.codegate.outputs.code_changed }}
      checkout_repository: ${{ needs.trusted_inputs.outputs.checkout_repository }}
      checkout_ref: ${{ needs.trusted_inputs.outputs.checkout_ref }}
      checkout_sha: ${{ needs.trusted_inputs.outputs.checkout_sha }}
      trusted_execution: ${{ needs.trusted_inputs.outputs.trusted_execution }}
    steps:
      # Control-plane code must come from the base workflow revision. In a
      # trusted fork run, the runner-inventory PAT is exposed only to this
      # hosted step, before any fork-controlled file is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # ── Docs-only vs code gate (issue #1978) ───────────────────────────
      # Decide whether the heavy build matrix runs for this PR. The
      # classification (which paths count as docs-only, the 3000-file API-cap
      # truncation guard) lives in scripts/ci/detect-code-change.sh and is
      # covered by tests/shell/test_detect_code_change.sh. Fail-closed
      # throughout: a non-PR event, an API/permission failure, an empty list,
      # or a truncated list all build rather than silently skip.
      - name: Determine code-vs-docs change set (docs-only gate)
        id: codegate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event (${{ github.event_name }}) — building unconditionally."
            exit 0
          fi
          # Fail-closed on any API/permission failure: build rather than block.
          if ! files=$(gh api --paginate \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --jq '.[].filename'); then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "PR files API failed — building to be safe (fail-closed)."
            exit 0
          fi
          echo "Changed files in PR #${{ github.event.pull_request.number }}:"
          printf '%s\n' "$files"
          if [[ -z "$files" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Empty changed-file list — building to be safe (fail-closed)."
            exit 0
          fi
          # changed_files is the authoritative total; the script fails closed if
          # the API list is shorter (truncated past the 3000-file cap). Wrap the
          # call so a classifier error fails toward BUILD (never toward a blocked
          # PR), independent of the runner's default shell error mode.
          if ! code_changed=$(printf '%s\n' "$files" \
                | bash scripts/ci/detect-code-change.sh "${{ github.event.pull_request.changed_files }}"); then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Classifier errored — building to be safe (fail-closed)."
            exit 0
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "Result: code_changed=$code_changed"

      - name: Probe runner health for code-bearing changes
        id: health
        # Docs-only same-repository PRs do not depend on the build fleet.
        # An automatic fork still runs this base-revision check and fails red
        # before querying, so it can never claim a healthy self-hosted pool.
        if: steps.codegate.outputs.code_changed == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        env:
          GH_TOKEN: ${{ secrets.RUNNER_INVENTORY_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: >-
          python3 scripts/ci/runner-health-check.py --mode preflight
          --require-pool bigtam --require-pool weetam

      # The checkout below is deliberately after the only step that receives
      # RUNNER_INVENTORY_TOKEN. A trusted fork may execute tests from this
      # revision, but it must never receive that administration-scoped secret.
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.trusted_inputs.outputs.checkout_repository }}
          ref: ${{ needs.trusted_inputs.outputs.checkout_ref }}
          persist-credentials: false
      - name: Verify resolved checkout
        env:
          EXPECTED_SHA: ${{ needs.trusted_inputs.outputs.checkout_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "::error::checkout mismatch: expected=$EXPECTED_SHA actual=$actual_sha"
            exit 1
          }

      # Hermetic shell-gate tests on the PR fast-path. The compose-version gate
      # otherwise only runs at release time, so a regex regression would surface
      # too late (after the full build matrix). No build deps — just bash.
      - name: Shell gate tests
        run: |
          bash tests/shell/test_check_compose_versions.sh
          bash tests/shell/test_detect_code_change.sh   # docs-only gate classifier (#1978)
          python3 scripts/ci/test_runner_health_check.py
          bash tests/shell/test_review_driver_substitution.sh  # patsub_replacement prompt corruption (#2644)

  # ── Lint (disabled — clang-format reorders Windows headers and breaks MSVC builds) ──
  # lint:
  #   name: "Lint (clang-format)"
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - name: Install clang-format
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y clang-format-18
  #     - name: Check formatting
  #       run: |
  #         find agents server sdk tests \
  #           -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
  #           | grep -v '\.pb\.' \
  #           | xargs clang-format-18 --dry-run --Werror

  # ── Proto backward-compatibility ───────────────────────────────────────
  proto-compat:
    name: "Proto backward-compat"
    needs: [preflight]
    # Pool gate: runs if any [self-hosted, Linux, X64] runner is online
    # (yuzu-bigtam-* or the Shulgi fallback). Fail-closed `== 'true'`.
    # `&& code_changed` (issue #1978): a docs-only PR skips this required job
    # (skipped == satisfied), so it no longer blocks the merge on an absent check.
    if: needs.preflight.outputs.linux_pool_healthy == 'true' && needs.preflight.outputs.code_changed == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.preflight.outputs.checkout_repository }}
          ref: ${{ needs.preflight.outputs.checkout_ref }}
          # Need history so buf can compare against the merge base
          fetch-depth: 0
          # A trusted fork never reuses a prior self-hosted workspace.
          clean: ${{ needs.preflight.outputs.trusted_execution == 'true' }}
          persist-credentials: false
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.50.0"
      - name: Lint protos
        run: buf lint proto
      - name: Check backward compatibility
        run: buf breaking proto --against '.git#subdir=proto,ref=origin/main'

      - name: Purge trusted-fork workspace
        if: ${{ always() && needs.preflight.outputs.trusted_execution == 'true' }}
        run: |
          git reset --hard
          git clean -ffdx

  # ── Linux (GCC + Clang, self-hosted yuzu-bigtam-linux) ────────────────
  linux:
    name: "Linux ${{ matrix.compiler }} ${{ matrix.build_type }}"
    needs: [preflight]
    # Pinned to the Big Tam sub-pool: the GCC 15 / Clang 21 toolchain is
    # 26.04-only and cannot build on the Shulgi 24.04 fallback, so gate on
    # bigtam_pool_healthy (>=1 yuzu-bigtam-linux runner online) rather than the
    # broader linux_pool. Fail-closed `== 'true'` (NOT `!= 'false'`) — an offline
    # Big Tam skips this job fast instead of queueing against an empty pool.
    # `&& code_changed` (issue #1978): docs-only PRs skip this required job.
    if: needs.preflight.outputs.bigtam_pool_healthy == 'true' && needs.preflight.outputs.code_changed == 'true'
    # Self-hosted: Big Tam (Threadripper 9970X, native Ubuntu 26.04). Persistent
    # ccache + vcpkg state between runs on the same workspace amortizes the
    # install cost. Trade-off: the runner process serializes this matrix, so
    # multi-commit pushes are slower end-to-end than on the parallel GHA-hosted
    # fleet. Mirrors the Windows migration in #374 — the optimization target is
    # Actions-minute spend, not per-PR latency.
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    timeout-minutes: 90
    env:
      # Each Big Tam runner is confined to one 8C/16T L3 domain. Keep Ninja's
      # process fan-out inside that boundary; affinity alone still leaves
      # Ninja seeing the host-wide 64 logical CPUs.
      YUZU_BUILD_JOBS: "16"
      # Big Tam runs 4 runners on one host. A gateway eunit test that boots the
      # app can transiently bring up Erlang distribution and trip the #659
      # insecure-default-cookie boot guard (observed flaking 1/4 legs). This is
      # the documented dev/CI override — the guard's policy logic is still
      # unit-tested directly by yuzu_gw_app_tests. The host-side per-runner
      # ERL_EPMD_PORT isolation (each runner's .env) removes the cross-runner
      # EPMD collision that triggers the transient distribution in the first place.
      YUZU_GW_ALLOW_DEFAULT_COOKIE: "1"
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-15, clang-21]
        build_type: [debug, release]
        exclude:
          # PRs: only gcc-15 debug (fast feedback)
          - build_type: ${{ github.event_name == 'pull_request' && 'release' || 'NONE' }}
          - compiler: ${{ github.event_name == 'pull_request' && 'clang-21' || 'NONE' }}

    steps:
      # PR-5 of the CI overhaul plan: normal CI keeps clean:false to preserve
      # build-linux/ across jobs. A maintainer-approved fork is the explicit
      # exception: it starts clean and uses only run-private caches below.
      # across jobs so meson + ninja can be incremental across pushes.
      # The branch-switch sentinel below is the safety net — if the
      # previous job on this runner was on a different branch, the
      # build dir's source paths and meson config are stale and must
      # be wiped (NEVER touch vcpkg/, vcpkg_installed/, or the
      # runner.tool_cache binary caches — those have their own
      # sentinel, see scripts/ci/vcpkg-triplet-sentinel.sh).
      - name: Wipe build-linux*/ on branch switch (pre-checkout)
        # Per-variant dirs (build-linux-gcc-15-debug, ...) — wipe all of
        # them on branch switch, not just the matrix-specific one, so
        # any stale variant-dir from a different branch is also cleared.
        run: |
          incoming="${GITHUB_REF#refs/heads/}"
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            current=$(git -C "$GITHUB_WORKSPACE" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
            if [[ -n "$current" && "$current" != "HEAD" && "$current" != "$incoming" ]]; then
              echo "branch switch: $current -> $incoming — wiping build-linux*/"
              rm -rf "$GITHUB_WORKSPACE"/build-linux-*
              # Also wipe legacy non-variant dir if it lingers from before
              # the per-variant migration.
              rm -rf "$GITHUB_WORKSPACE/build-linux"
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.preflight.outputs.checkout_repository }}
          ref: ${{ needs.preflight.outputs.checkout_ref }}
          submodules: recursive
          # clean:false — persist build-linux-{compiler}-{buildtype}/ +
          # vcpkg_installed/ between runs. Branch switches are handled
          # by the pre-checkout wipe step above; cache freshness is
          # handled by the vcpkg sentinel. Manual recovery: scripts/ci/
          # runner-reset.sh.
          clean: ${{ needs.preflight.outputs.trusted_execution == 'true' }}
          persist-credentials: false

      - name: Isolate trusted-fork build caches
        if: needs.preflight.outputs.trusted_execution == 'true'
        run: |
          cache_root="$RUNNER_TEMP/yuzu-trusted-fork-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          mkdir -p "$cache_root/ccache"
          echo "CCACHE_DIR=$cache_root/ccache" >> "$GITHUB_ENV"
          # Do not read or write runner.tool_cache. The trusted review is an
          # explicit code-execution decision, not permission to poison a
          # cache consumed by later normal CI jobs.
          echo "VCPKG_BINARY_SOURCES=clear" >> "$GITHUB_ENV"

      # One DB per runner agent, below runner.tool_cache and therefore outside
      # the checkout. ci-telemetry exports YUZU_TEST_DB for later steps and
      # records this exact matrix leg; reruns remain distinct by run_attempt.
      - name: Start persistent CI telemetry
        continue-on-error: true
        env:
          YUZU_TEST_DB: ${{ needs.preflight.outputs.trusted_execution == 'true' && format('{0}/yuzu-trusted-fork-test-runs-{1}.db', runner.temp, github.run_id) || format('{0}/yuzu-test-runs/{1}/test-runs.db', runner.tool_cache, runner.name) }}
        run: >-
          python3 scripts/ci/ci-telemetry.py start
          --job-name "Linux ${{ matrix.compiler }} ${{ matrix.build_type }}"
          --triplet x64-linux

      - name: Install system packages
        run: |
          # The Big Tam host runs 4 runners (r0-r3), so the matrix legs hit apt
          # concurrently and race the system locks (Shulgi was one runner, so its
          # matrix serialized and never contended). apt operations cannot run in
          # parallel by design. DPkg::Lock::Timeout only governs the dpkg FRONTEND
          # lock (install) — it does NOT cover `apt-get update`'s lists lock
          # (/var/lib/apt/lists/lock), which still failed instantly under
          # contention. So serialize the whole apt sequence across legs with flock
          # on a shared host lock (the standard fix — this is what apt-systemd-daily
          # itself does). Keep DPkg::Lock::Timeout inside as belt-and-suspenders
          # for the frontend lock vs. any background unattended-upgrades. Serializing
          # apt also staggers the legs, so they don't hit ensure-postgres
          # (per-agent yuzu-ci-postgres-<n> containers since #2094) or
          # pip --user ($HOME) all at once.
          # FD-9 flock pattern: the subshell opens the lock file on fd 9, flock
          # blocks up to 600s for it, and releases on subshell exit. /tmp is
          # 1777 so the runner can create the lock; all 4 runners are the same
          # user on the same host, so they share it.
          (
            flock -w 600 9 || { echo "::error::timed out waiting for apt lock"; exit 1; }
            sudo apt-get -o DPkg::Lock::Timeout=300 update
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
              cmake ninja-build pkg-config curl zip unzip tar python3-pip ccache \
              bison flex libsystemd-dev autoconf automake libtool \
              ${{ matrix.compiler == 'gcc-15' && 'gcc-15 g++-15' || 'clang-21' }}
          ) 9>/tmp/yuzu-ci-apt.lock
          pip3 install --user --break-system-packages --require-hashes -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # OTP + rebar3 for the gateway test legs. Without these, meson's
      # `find_program('rebar3', required: false)` returns not-found,
      # `gateway eunit` and `gateway ct` are silently skipped, and the
      # Linux matrix can't catch gateway regressions until they hit the
      # Windows leg (where rebar3 is pre-baked via choco). Pin matches
      # release.yml's "Build Gateway (Erlang)" job so any OTP bump moves
      # both halves together — see CLAUDE.md "Toolchain activation".
      # ImageOS is required because erlef/setup-beam can't auto-detect
      # the runner OS on self-hosted; set at step scope so the rest of
      # the job doesn't see it.
      # DELIBERATELY ubuntu24 even though Big Tam is Ubuntu 26.04: setup-beam
      # has NO ubuntu26 prebuilt OTP (supported ImageOS tops out at ubuntu24).
      # ImageOS only selects which prebuilt OTP tarball to fetch; the 24.04
      # build runs fine on 26.04 (same libcrypto.so.3 soname). Do NOT change to
      # ubuntu26 until setup-beam ships a 26.04 build — it would fail to resolve
      # the asset. Verified by gateway eunit on the Big Tam leg.
      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      # PKI PR5c: the gateway vendors a 2-line-patched grpcbox in
      # gateway/_checkouts/grpcbox. This supply-chain gate fails the PR build if
      # that copy is ever anything other than upstream grpcbox at the
      # rebar.config-pinned tag + the documented grpcbox.yuzu.patch (tamper /
      # drift / version skew). Runs on the merge-guarding path, not only release.
      - name: Verify vendored grpcbox integrity
        run: bash gateway/scripts/verify-vendored-grpcbox.sh

      # ADR-0016 / gov build-ci: the committed gateway _pb.erl are GENERATED from
      # the vendored proto (regen_pb.escript). Re-regenerate + byte-diff so an
      # un-regenerated, silently field-dropping _pb.erl (e.g. management_pb, which
      # no test exercises) fails the merge-guarding path — not only release.yml.
      # Warm gateway _build first: check-proto-codegen.sh needs _build/.../gpb/ebin,
      # which nothing earlier provisions. On a cold/wiped workspace the check would
      # otherwise exit before the meson build that warms _build — an unrecoverable
      # deadlock (gov build-ci). rebar3 compile is idempotent/fast on a warm runner.
      - name: Compile gateway (warm _build for the codegen check)
        run: cd gateway && rebar3 compile
      - name: Verify gateway proto codegen is up to date
        run: bash gateway/scripts/check-proto-codegen.sh

      # ccache cache lives at ~/.cache/ccache on the self-hosted Linux
      # runner, which persists in the github-runner user's home between
      # jobs by definition. No actions/cache round-trip needed — paying
      # the GHA upload cost would just reupload data that's already on
      # disk. Issue #569.
      - name: Reset ccache stats
        run: ccache -z

      # vcpkg_installed/ persists across runs under clean:false (PR-5).
      # The vcpkg sentinel below detects manifest / triplet / baseline
      # drift and wipes vcpkg_installed/<triplet>/ on mismatch. The
      # runner.tool_cache binary cache lives outside the workspace so
      # checkout cannot touch it regardless. Issue #569.
      # job rebuilds every port from source — symptom signature in the
      # build log is `Restored 0 package(s) from .../<uuid>/vcpkg_cache`.
      # Mirrors the sanitize-asan pattern at the VCPKG_DEFAULT_BINARY_CACHE
      # line further down. Issue #569.

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-linux)
        # Universal cache-key contract — see scripts/ci/vcpkg-triplet-sentinel.sh.
        run: bash scripts/ci/vcpkg-triplet-sentinel.sh x64-linux

      - name: Install vcpkg packages
        env:
          # Single shared cache across all matrix variants. The x64-linux
          # triplet produces bit-identical package zips regardless of the
          # consuming compiler (gcc-15 vs clang-21) or buildtype (vcpkg
          # builds with its own toolchain, not the consumer's). Sharing
          # one cache means the first matrix variant pays the from-source
          # cost (~25 min) and the other three restore in seconds, vs.
          # 4× from-source under per-matrix scoping. Issue #569.
          VCPKG_DEFAULT_BINARY_CACHE: ${{ needs.preflight.outputs.trusted_execution == 'true' && format('{0}/yuzu-trusted-fork-vcpkg-{1}', runner.temp, github.run_id) || format('{0}/yuzu-vcpkg-binary-cache-linux', runner.tool_cache) }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet x64-linux \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson)
        env:
          CC: ccache ${{ matrix.compiler == 'gcc-15' && 'gcc-15' || 'clang-21' }}
          CXX: ccache ${{ matrix.compiler == 'gcc-15' && 'g++-15' || 'clang++-21' }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux/lib/pkgconfig
        run: |
          # Under clean:false (PR-5) build-linux/ may already be configured
          # from a previous matrix variant or push. meson setup errors on
          # Per-variant build dir under PR-5 clean:false. Sharing one
          # build-linux/ across all 4 matrix legs (gcc-15/clang-21 ×
          # debug/release) trips a meson --reconfigure edge case where
          # the linker driver from a previous variant leaks into the
          # current one — observed historically in run #25070779695 (on
          # the then-current gcc-13/clang-19 matrix) where Linux gcc-13
          # release ended up linking yuzu-agent with `clang++-19 -flto`
          # instead of `g++-13 -flto`, producing CLI11 undefined
          # references. Per-variant dirs eliminate the reconfigure
          # entirely; ccache absorbs the per-TU work across matrix runs
          # so the disk cost is the only added cost (~1-2 GB × 4).
          BUILDDIR=build-linux-${{ matrix.compiler }}-${{ matrix.build_type }}
          reconfig=""
          [[ -d "$BUILDDIR/meson-info" ]] && reconfig="--reconfigure"
          meson setup $reconfig "$BUILDDIR" \
            --native-file meson/native/${{ matrix.compiler == 'gcc-15' && 'linux-gcc15.ini' || 'linux-clang21.ini' }} \
            --buildtype=${{ matrix.build_type }} \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-linux \
            -Dbuild_tests=true \
            ${{ matrix.build_type == 'release' && matrix.compiler == 'gcc-15' && '-Db_lto=true' || '' }}

      - name: Build
        run: meson compile -C build-linux-${{ matrix.compiler }}-${{ matrix.build_type }} -j "$YUZU_BUILD_JOBS"

      # Link-provenance assertion (#1331 review HIGH-2): prove the canary linked
      # vcpkg's static libpq archive, not a system/dynamic libpq. Per ADR-0008
      # ("Correction (2026-06-10)"): unix is static, Windows is deliberately a DLL.
      - name: Assert canary libpq link provenance (static on Linux)
        run: |
          bin="build-linux-${{ matrix.compiler }}-${{ matrix.build_type }}/server/core/yuzu_pg_canary"
          test -x "$bin" || { echo "::error::canary binary missing at $bin"; exit 1; }
          if ldd "$bin" | grep -qi 'libpq'; then
            echo "::error::canary dynamically links libpq — expected vcpkg static archive (ADR-0008)"
            ldd "$bin" | grep -i 'libpq'
            exit 1
          fi
          echo "OK: no dynamic libpq dependency — static archive linked"

      # Postgres for server tests (ADR-0006 decision 8, #1318). On this
      # self-hosted runner the script idempotently (re)uses a persistent
      # docker container — PER AGENT on the 4-runner pool
      # (`yuzu-ci-postgres-<n>` on 127.0.0.1:15440+<n>, #2094; the shared
      # `yuzu-ci-postgres` on :15432 remains for single-agent boxes) — and
      # exports YUZU_TEST_POSTGRES_DSN via GITHUB_ENV — one-time cost per
      # runner, no per-run install. Required since #1320 PR 1 (SOFT_EXIT=1):
      # a missing Postgres fails the job here, before the test step.
      - name: Ensure Postgres (server tests)
        run: bash scripts/ci/ensure-postgres.sh

      - name: Test
        run: python3 scripts/ci/flake-retry.py --builddir build-linux-${{ matrix.compiler }}-${{ matrix.build_type }} -- --print-errorlogs

      # Break-glass MFA-reset CLI contract (#1226) — exit codes + JSON output of
      # `yuzu-server --mfa-reset` are not exercisable by the Catch2 suite (which
      # does not drive main()), so cover them here against the just-built binary.
      - name: Break-glass CLI test
        env:
          YUZU_SERVER_BIN: build-linux-${{ matrix.compiler }}-${{ matrix.build_type }}/server/core/yuzu-server
        run: bash tests/shell/test_mfa_reset.sh

      # Graceful shutdown is not exercisable by the Catch2 suite (which never drives main(), so
      # never installs a signal handler). Nothing in unit, integration or CI failed if it broke
      # completely — and three shutdown defects shipped and were each caught only by a human
      # sending a signal by hand: O_NONBLOCK on both pipe ends (SIGTERM silently stopped being
      # graceful), a nested lock_guard that self-deadlocked Agent::stop() (the agent hung on every
      # SIGTERM while the suites and TSan stayed green), and handlers installed without a live
      # watcher (signal swallowed, agent unkillable). Needs no server: the agent's reconnect loop
      # against a closed port is a fully-booted steady state.
      - name: Agent graceful-shutdown smoke test
        env:
          YUZU_AGENT_BIN: build-linux-${{ matrix.compiler }}-${{ matrix.build_type }}/agents/core/yuzu-agent
          YUZU_PLUGIN_DIR: build-linux-${{ matrix.compiler }}-${{ matrix.build_type }}/agents/plugins
        run: bash scripts/test/agent-shutdown-smoke.sh

      # Mirror the windows job's upload step so a Linux test failure is
      # diagnosable. meson `--print-errorlogs` truncates per-test output to
      # the last 100 lines, which is enough for a Catch2 failure but loses
      # the failing test name when an Erlang eunit run reports
      # `Failed: 1. Passed: 144.` with no surviving `*failed*` marker.
      # Without this artifact we cannot identify which gateway test failed.
      - name: Upload meson-logs on test failure or cancel
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-logs-linux-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ github.run_attempt }}
          path: build-linux-${{ matrix.compiler }}-${{ matrix.build_type }}/meson-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: ccache stats + build observability
        if: always()
        run: |
          # Informational only — never fail the job from here (set +e).
          set +e
          ccache -s
          # Machine-readable parse for a job-summary: cache warmth + effective
          # parallelism + LTO. Mirrors the Windows leg (P3 observability) so
          # every self-hosted leg surfaces cold/fragmented caches and -j
          # behaviour automatically, instead of only by hand.
          s="$(ccache --print-stats 2>/dev/null)"
          get(){ printf '%s\n' "$s" | awk -F'\t' -v k="$1" '$1==k{v=$2} END{print v+0}'; }
          hits=$(( $(get direct_cache_hit) + $(get preprocessed_cache_hit) ))
          miss=$(get cache_miss)
          total=$(( hits + miss ))
          rate="n/a"; [ "$total" -gt 0 ] && rate=$(( 100 * hits / total ))
          {
            echo "### Linux ${{ matrix.compiler }} ${{ matrix.build_type }} — cache & parallelism"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| ccache hit rate | ${rate}% (${hits}/${total}) |"
            echo "| ccache misses | ${miss} |"
            echo "| effective -j | ${YUZU_BUILD_JOBS:-ninja default} |"
            echo "| LTO | ${{ matrix.build_type == 'release' && matrix.compiler == 'gcc-15' && 'yes (link-time, ccache cannot accelerate)' || 'no' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Cold-cache alarm: a near-zero hit rate over a meaningful sample on a
          # self-hosted runner means the shared caches aren't warming (the
          # fragmentation signal we previously only caught manually).
          if [ "$total" -gt 100 ] && [ "$rate" != "n/a" ] && [ "$rate" -lt 40 ]; then
            echo "::warning::ccache hit rate ${rate}% over ${total} compiles is low on the Big Tam self-hosted pool — caches may be cold/fragmented (see docs/ci-architecture.md)"
          fi
          exit 0

      - name: Finish persistent CI telemetry
        if: always()
        continue-on-error: true
        env:
          YUZU_TEST_DB: ${{ needs.preflight.outputs.trusted_execution == 'true' && format('{0}/yuzu-trusted-fork-test-runs-{1}.db', runner.temp, github.run_id) || format('{0}/yuzu-test-runs/{1}/test-runs.db', runner.tool_cache, runner.name) }}
          YUZU_CI_CONCLUSION: ${{ job.status }}
        run: >-
          python3 scripts/ci/ci-telemetry.py finish
          --job-name "Linux ${{ matrix.compiler }} ${{ matrix.build_type }}"
          --triplet x64-linux
          --builddir build-linux-${{ matrix.compiler }}-${{ matrix.build_type }}
          --conclusion "$YUZU_CI_CONCLUSION"

      - name: Purge trusted-fork workspace
        if: ${{ always() && needs.preflight.outputs.trusted_execution == 'true' }}
        run: |
          # Keep this narrow to the Actions checkout. runner.tool_cache and
          # the runner-local telemetry DB are deliberately outside this path.
          git reset --hard
          git clean -ffdx

  # ── Windows (MSVC, self-hosted Wee Tam pool) ────────────────────────────
  windows:
    name: "Windows MSVC ${{ matrix.build_type }}"
    needs: [preflight]
    # Skip if the exact Wee Tam job pool is unhealthy/empty. Fail-closed
    # `== 'true'`; the generic Shulgi testbed label cannot satisfy this job.
    # `&& code_changed` (issue #1978): docs-only PRs skip this required job.
    if: needs.preflight.outputs.weetam_pool_healthy == 'true' && needs.preflight.outputs.code_changed == 'true'
    # Self-hosted: 32-core / 48 GB host. gRPC alone takes ~90 min on the
    # GitHub-hosted 4-vCPU windows-2022 runners; self-hosted with cl /MP
    # finishes in a fraction of that and avoids the GitHub Actions minute
    # drain. Per-PR turnaround on the dependabot rollout is the
    # optimization target. See issue #374 for the full migration rationale.
    runs-on: [self-hosted, Windows, X64, yuzu-weetam-windows]
    timeout-minutes: 120
    env:
      # Belt-and-suspenders with Start-PinnedRunner.ps1: every Wee Tam job
      # explicitly carries the 16-thread width of its assigned CCD.
      YUZU_BUILD_JOBS: "16"
    defaults:
      run:
        # The default `bash` keyword on a self-hosted Windows runner
        # resolves to C:\Windows\system32\bash.EXE which is WSL bash.
        # WSL refuses to run as LOCAL SYSTEM (the runner's service
        # account) with WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED. Bypass by
        # explicitly pointing at MSYS2 bash, which is CLAUDE.md's
        # documented Windows development shell and is already installed
        # on the runner. Same pattern as codeql.yml's Windows leg.
        shell: 'C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
        exclude:
          - build_type: ${{ github.event_name == 'pull_request' && 'release' || 'NONE' }}

    steps:
      # PR-5 of the CI overhaul plan: normal CI keeps clean:false on the persistent
      # yuzu-local-windows runner. Branch-switch sentinel runs in the
      # MSYS2 bash configured by `defaults.run.shell` above (so $GITHUB_*
      # env vars and bash test syntax both work).
      #
      # Per-variant build dirs (build-windows-debug, build-windows-release)
      # mirror the Linux pattern at lines 265-274. Sharing one build-windows/
      # across debug+release on the same self-hosted runner triggers the same
      # meson --reconfigure variant-leak edge case observed on Linux: when
      # the release build runs first and debug runs second, ninja's link
      # response files retain release-buildtype state (release-CRT abseil
      # libs, stale obj-path entries) and produce LNK2038 RuntimeLibrary
      # mismatches plus LNK1181 truncated-input-path errors. Per-variant
      # dirs eliminate the reconfigure entirely; ccache absorbs the per-TU
      # work across matrix runs so the disk cost is the only added cost.
      # Also wipe the legacy non-variant dir if it lingers from before
      # this change.
      - name: Wipe build-windows/ on branch switch (pre-checkout)
        run: |
          incoming="${GITHUB_REF#refs/heads/}"
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            current=$(git -C "$GITHUB_WORKSPACE" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
            if [[ -n "$current" && "$current" != "HEAD" && "$current" != "$incoming" ]]; then
              echo "branch switch: $current -> $incoming — wiping build-windows*/"
              rm -rf "$GITHUB_WORKSPACE/build-windows" \
                     "$GITHUB_WORKSPACE/build-windows-debug" \
                     "$GITHUB_WORKSPACE/build-windows-release"
            fi
          fi
          # Always remove the legacy single-variant dir so a stale state
          # from before per-variant dirs landed cannot poison either leg.
          if [[ -d "$GITHUB_WORKSPACE/build-windows" ]]; then
            echo "removing legacy build-windows/ (per-variant dirs are now build-windows-{debug,release})"
            rm -rf "$GITHUB_WORKSPACE/build-windows"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.preflight.outputs.checkout_repository }}
          ref: ${{ needs.preflight.outputs.checkout_ref }}
          submodules: recursive
          # clean:false — persist build-windows-{debug,release}/ +
          # vcpkg_installed/ between runs. Manual recovery: scripts/ci/runner-reset.sh.
          clean: ${{ needs.preflight.outputs.trusted_execution == 'true' }}
          persist-credentials: false

      - name: Isolate trusted-fork build caches
        if: needs.preflight.outputs.trusted_execution == 'true'
        run: |
          cache_root="$RUNNER_TEMP/yuzu-trusted-fork-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          mkdir -p "$cache_root/ccache"
          echo "CCACHE_DIR=$cache_root/ccache" >> "$GITHUB_ENV"
          # Do not read or write runner.tool_cache. The trusted review is an
          # explicit code-execution decision, not permission to poison a
          # cache consumed by later normal CI jobs.
          echo "VCPKG_BINARY_SOURCES=clear" >> "$GITHUB_ENV"

      - name: Start persistent CI telemetry
        continue-on-error: true
        env:
          # Keep the workflow path identical to Start-PinnedRunner.ps1 even
          # before the next safe runner restart propagates its process env.
          YUZU_TEST_DB: ${{ needs.preflight.outputs.trusted_execution == 'true' && format('{0}/yuzu-trusted-fork-test-runs-{1}.db', runner.temp, github.run_id) || format('D:\\ci\\test-runs\\{0}\\test-runs.db', runner.name) }}
        run: >-
          python scripts/ci/ci-telemetry.py start
          --job-name "Windows MSVC ${{ matrix.build_type }}"
          --triplet x64-windows

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Assert toolchain available
        run: |
          set -e
          # Self-hosted runner must have these pre-baked. Fail fast with
          # a specific error rather than producing weird build failures.
          for tool in meson ninja cl ccache cmake python; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool not on PATH on the self-hosted Windows runner"
              exit 1
            fi
          done
          meson --version
          ccache --version | head -1
          # Governance UAT 2026-05-06 build-ci B-2: PyYAML must be
          # importable for `meson setup` to pass — embed_content.py
          # hard-fails without it. The runner image should provision
          # python-yaml via MSYS2 pacman, but ensure idempotently here
          # so a re-baked runner doesn't silently break release. Use
          # the hash-pinned requirements file so a compromised PyPI
          # cannot inject a malicious wheel (Gate 7 re-review LOW).
          python -c "import yaml" >/dev/null 2>&1 || \
            python -m pip install --user --require-hashes -r requirements-ci.txt

      - name: Assert toolchain manifest (self-hosted, optional)
        shell: pwsh
        run: |
          # Manifest-based self-test for boxes provisioned via
          # deploy/windows/Provision-Windows-Runner.ps1. SKIPS (does not fail) on
          # runners that predate the manifest — the PATH check above still covers
          # them. Catches path/version/env drift the bare PATH check misses.
          $m = 'C:\actions-runner\toolchain-manifest.json'
          if (Test-Path $m) {
            ./deploy/windows/Assert-Toolchain.ps1 -ManifestPath $m
          } else {
            Write-Host 'no toolchain-manifest.json on this runner — skipping manifest self-test'
          }

      - name: Assert runner disk (>= 45 GB free)
        run: |
          # Debug + release vcpkg trees + ccache + build artifacts can
          # easily exceed 30 GB. Fail fast rather than hitting "no space
          # left on device" 30 min into the build.
          free_gb=$(df -k "$GITHUB_WORKSPACE" | awk 'NR==2 {printf "%d", $4/1024/1024}')
          echo "runner disk free: ${free_gb}G on $GITHUB_WORKSPACE"
          if [[ -z "$free_gb" ]] || (( free_gb < 45 )); then
            echo "::error::runner disk ${free_gb}G < 45 GB required"
            exit 1
          fi

      - name: Reset ccache stats
        run: ccache -z

      # ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN export was previously
      # done here for the in-process GHA cache backend that lukka/run-vcpkg
      # used to support. We don't consume those vars anywhere on this
      # self-hosted runner (binary cache lives in runner.tool_cache, ccache
      # writes to the runner's HOME), so the export was dead wiring. Issue #569.

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-windows)
        # Universal cache-key contract — wipe vcpkg_installed/x64-windows
        # only when (vcpkg.json | vcpkg-configuration.json | triplet | baseline)
        # has actually changed. See scripts/ci/vcpkg-triplet-sentinel.sh.
        #
        # Explicit `/usr/bin/bash` (NOT `bash`) because $PATH on this
        # runner has C:\Windows\system32 ahead of C:\msys64\usr\bin, so
        # `bash` resolves to C:\Windows\System32\bash.exe (WSL bash)
        # which silently exits with WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED
        # when the runner is a LOCAL SYSTEM service. /usr/bin/bash
        # resolves through MSYS2's mount table (no $PATH lookup) →
        # MSYS2 bash. Same gotcha CLAUDE.md documents for `shell: bash`.
        run: /usr/bin/bash scripts/ci/vcpkg-triplet-sentinel.sh x64-windows

      - name: Install vcpkg packages
        env:
          # Persistent binary cache outside the workspace. Without this
          # lukka/run-vcpkg defaults to a per-run UUID temp dir under its
          # own state path → 0% hit rate every run → every port rebuilt
          # from source (~90 min for grpc + abseil + protobuf on this
          # runner). runner.tool_cache survives actions/checkout's
          # default `clean: true`. Mirrors the Linux pattern. Issue #569.
          # Single shared cache across debug+release. The x64-windows
          # triplet builds both variants in one port build (the
          # VCPKG_BUILD_TYPE override was removed in the LNK2038 fix), so
          # the zip filename is the same regardless of consumer build_type.
          VCPKG_DEFAULT_BINARY_CACHE: ${{ needs.preflight.outputs.trusted_execution == 'true' && format('{0}/yuzu-trusted-fork-vcpkg-{1}', runner.temp, github.run_id) || format('{0}/yuzu-vcpkg-binary-cache-windows', runner.tool_cache) }}
        run: |
          # Use $GITHUB_WORKSPACE (bash env var, runtime read) instead of
          # ${{ github.workspace }} (GHA source interpolation). On Windows
          # the workspace path contains backslashes and bash's escape
          # processing strips them when interpolated as source text.
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$GITHUB_WORKSPACE/vcpkg/vcpkg.exe" install \
            --triplet x64-windows \
            --x-manifest-root="$GITHUB_WORKSPACE"

      - name: Configure (Meson)
        env:
          CC: ccache cl
          CXX: ccache cl
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/vcpkg_installed/x64-windows
        run: |
          # Per-variant build dir under PR-5 clean:false — see the
          # pre-checkout wipe step above for the rationale. Branch on
          # existence to satisfy meson's "use --reconfigure" requirement.
          BUILDDIR=build-windows-${{ matrix.build_type }}
          reconfig=""
          [[ -d "$BUILDDIR/meson-info" ]] && reconfig="--reconfigure"
          meson setup $reconfig "$BUILDDIR" \
            --buildtype=${{ matrix.build_type }} \
            -Dcpp_std=vc++latest \
            -Dcmake_prefix_path="$GITHUB_WORKSPACE/vcpkg_installed/x64-windows" \
            -Dbuild_tests=true \
            ${{ matrix.build_type == 'release' && '-Db_lto=true' || '' }}

      - name: Build
        # Affinity controls placement, not Ninja's processor-count discovery;
        # pass the runner's 16-thread CCD width unconditionally.
        run: meson compile -C build-windows-${{ matrix.build_type }} -j "$YUZU_BUILD_JOBS"

      # Link-provenance assertion (#1331 review HIGH-2): on Windows libpq is
      # DELIBERATELY dynamic (triplet static override = grpc stack only; the
      # release zip's vcpkg-DLL sweep ships libpq.dll like sqlite3/openssl —
      # ADR-0008 "Correction (2026-06-10)"). Assert the import is present so a
      # silent posture flip in either direction is caught.
      - name: Assert canary libpq link provenance (DLL import on Windows)
        run: |
          bin="build-windows-${{ matrix.build_type }}/server/core/yuzu_pg_canary.exe"
          test -f "$bin" || { echo "::error::canary binary missing at $bin"; exit 1; }
          deps="$(dumpbin -dependents "$bin")"
          if ! echo "$deps" | grep -qi 'libpq.dll'; then
            echo "::error::canary does not import libpq.dll — Windows linkage posture changed (expected dynamic per ADR-0008 Correction; if flipping to static, update this assert + the triplet override together)"
            echo "$deps"
            exit 1
          fi
          echo "OK: libpq.dll import present — dynamic linkage as recorded in ADR-0008"

      # Postgres for server tests (ADR-0006 decision 8, #1318).
      # Precondition on yuzu-local-windows: a native PostgreSQL 16+ service
      # with role yuzu / password yuzu / db yuzu_test (one-time bootstrap,
      # see docs/ci-architecture.md "Postgres for server tests"), or a
      # runner-level YUZU_TEST_POSTGRES_DSN override. The script probes
      # 127.0.0.1:5432 and exports the DSN; required since #1320 PR 1
      # (SOFT_EXIT=1) — nothing listening fails the job at this step.
      #
      # `source`, NOT `bash scripts/...`: inside the step's MSYS2 bash,
      # PATH puts C:\Windows\system32 before C:\msys64\usr\bin, so a bare
      # `bash` resolves to the WSL stub, which refuses to run as the
      # LOCAL SYSTEM service account (Bash/WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED).
      # Same idiom as `source setup_msvc_env.sh` / `ensure-erlang.sh`.
      - name: Ensure Postgres (server tests)
        run: source scripts/ci/ensure-postgres.sh

      - name: Test
        run: |
          if [[ "${{ matrix.build_type }}" == "debug" ]]; then
            bin_dir="$GITHUB_WORKSPACE/vcpkg_installed/x64-windows/debug/bin"
          else
            bin_dir="$GITHUB_WORKSPACE/vcpkg_installed/x64-windows/bin"
          fi
          export PATH="$bin_dir:$GITHUB_WORKSPACE/vcpkg_installed/x64-windows/tools/protobuf:$GITHUB_WORKSPACE/vcpkg_installed/x64-windows/tools/grpc:$PATH"
          # Box-wide concurrency gate: Wee Tam runs 4 CCD-pinned runners on one
          # host; affinity partitions cores but NOT DRAM bandwidth / the disk /
          # the Defender minifilter, so >=3 concurrent Windows *test phases* drive
          # the server/tar suites into their timeouts (measured server ~[pg]:
          # c0 289s -> c4 603s). with-test-slot.sh caps concurrent heavy test
          # phases to 2 per box (crash-safe flock; build stays 4-wide), and
          # --num-processes 2 caps meson's own fan-out so the two ~400-600s server
          # shards don't pile onto one CCD+cluster. Windows-only (this step);
          # Linux scales flat and needs neither. See tests/meson.build server-shard
          # comment + docs/ci-architecture.md.
          bash scripts/ci/with-test-slot.sh 2 -- \
            python scripts/ci/flake-retry.py --builddir build-windows-${{ matrix.build_type }} -- --print-errorlogs --num-processes 2

      # meson+ninja truncate test stdout to the last 100 lines in the Actions
      # UI. testlog.txt in meson-logs/ contains the full Catch2 output for
      # every failed test — without this artifact, a multi-assertion failure
      # only exposes ONE expansion in the workflow log. Issue #501.
      #
      # `failure() || cancelled()` covers the rapid-dev-push concurrency-cancel
      # scenario that motivated #501: `cancel-in-progress: true` on the `dev`
      # concurrency group interrupts the Windows test mid-run, which makes
      # `if: failure()` evaluate false and drops the artifact — the exact case
      # that most needs the forensic log. `if-no-files-found: warn` handles
      # cancels that fire before meson writes testlog.txt.
      - name: Upload meson-logs on test failure or cancel
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-logs-windows-${{ matrix.build_type }}-${{ github.run_attempt }}
          path: build-windows-${{ matrix.build_type }}/meson-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: ccache stats + build observability
        if: always()
        run: |
          # Informational only — never fail the job from here (set +e).
          set +e
          ccache -s
          # Machine-readable parse for a job-summary: cache warmth + effective
          # parallelism + LTO. Surfaces cold/fragmented caches and -j
          # oversubscription automatically, instead of only by hand (P3).
          s="$(ccache --print-stats 2>/dev/null)"
          get(){ printf '%s\n' "$s" | awk -F'\t' -v k="$1" '$1==k{v=$2} END{print v+0}'; }
          hits=$(( $(get direct_cache_hit) + $(get preprocessed_cache_hit) ))
          miss=$(get cache_miss)
          total=$(( hits + miss ))
          rate="n/a"; [ "$total" -gt 0 ] && rate=$(( 100 * hits / total ))
          {
            echo "### Windows ${{ matrix.build_type }} — cache & parallelism"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| ccache hit rate | ${rate}% (${hits}/${total}) |"
            echo "| ccache misses | ${miss} |"
            echo "| effective -j | ${YUZU_BUILD_JOBS:-ninja default} |"
            echo "| LTO | ${{ matrix.build_type == 'release' && 'yes (link-time, ccache cannot accelerate)' || 'no' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Cold-cache alarm: a near-zero hit rate over a meaningful sample on a
          # self-hosted runner means the shared caches aren't warming (the
          # fragmentation signal we previously only caught manually).
          if [ "$total" -gt 100 ] && [ "$rate" != "n/a" ] && [ "$rate" -lt 40 ]; then
            echo "::warning::ccache hit rate ${rate}% over ${total} compiles is low on a self-hosted runner — caches may be cold/fragmented (see deploy/windows/README.md: shared RUNNER_TOOL_CACHE)"
          fi
          exit 0

      - name: Finish persistent CI telemetry
        if: always()
        continue-on-error: true
        env:
          YUZU_TEST_DB: ${{ needs.preflight.outputs.trusted_execution == 'true' && format('{0}/yuzu-trusted-fork-test-runs-{1}.db', runner.temp, github.run_id) || format('D:\\ci\\test-runs\\{0}\\test-runs.db', runner.name) }}
          YUZU_CI_CONCLUSION: ${{ job.status }}
        run: >-
          python scripts/ci/ci-telemetry.py finish
          --job-name "Windows MSVC ${{ matrix.build_type }}"
          --triplet x64-windows
          --builddir build-windows-${{ matrix.build_type }}
          --conclusion "$YUZU_CI_CONCLUSION"

      - name: Purge trusted-fork workspace
        if: ${{ always() && needs.preflight.outputs.trusted_execution == 'true' }}
        run: |
          # Keep this narrow to the Actions checkout. runner.tool_cache and
          # the runner-local telemetry DB are deliberately outside this path.
          git reset --hard
          git clean -ffdx

  # ── macOS (Apple Clang) ────────────────────────────────────────────────
  macos:
    name: "macOS ${{ matrix.build_type }}"
    needs: [preflight]
    # code_changed (issue #1978): docs-only PRs skip this required job
    # (skipped == satisfied). No self-hosted pool gate — GitHub-hosted — so
    # it otherwise runs on every code PR.
    if: needs.preflight.outputs.code_changed == 'true'
    runs-on: macos-15  # Apple Silicon, Xcode 16 / Apple Clang 16
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
        exclude:
          - build_type: ${{ github.event_name == 'pull_request' && 'release' || 'NONE' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.preflight.outputs.checkout_repository }}
          ref: ${{ needs.preflight.outputs.checkout_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          # autoconf/automake/libtool: vcpkg's libpq port (Postgres substrate,
          # ADR-0006) runs autoreconf during its build and the hosted macOS
          # image doesn't ship autotools.
          #
          # cmake deliberately excluded from this brew line, pinned via pipx
          # below instead (a single pin mechanism — the two 8-way-merged PRs
          # that each hit the 4.4.0 regression pinned it differently; the pipx
          # path is kept because it mirrors the repo's pip3 --user pattern and
          # carries the brew-unlink belt-and-suspenders below). 2026-07-16:
          # brew's floating `cmake` drifted to 4.4.0 underneath us with no code
          # change on our side, and that release crashes resolving httplib's
          # CMake package: FindThreads' try_compile() trips CMake's own internal
          # "This should not have happened" guard in
          # Internal/CheckSourceCompiles.cmake, which poisons every subsequent
          # cmake-method dependency lookup in the same configure. Broke macOS CI
          # fleet-wide across unrelated PRs simultaneously (e.g. #2224). Pin like
          # meson below so a future brew bump can't repeat this.
          brew install ninja ccache pipx autoconf automake libtool
          # Belt-and-suspenders: the macos-15 image pre-bakes its own cmake
          # (that's what the log line "cmake 4.4.0 is already installed and
          # up-to-date" was reporting) independent of this workflow's brew
          # line, so dropping cmake above doesn't remove it. Unlink it so it
          # can never win a PATH race against the pinned pipx cmake below.
          # `|| true`: fine if a future image doesn't pre-bake cmake at all;
          # stderr is left visible (not redirected) so a genuine unlink
          # failure still shows up in the step log for a future debugger.
          brew unlink cmake || true
          # 4.3.4 is the latest 4.x release before the 4.4.0 regression
          # above. Bump deliberately once a fixed release is confirmed clean
          # here. Query pipx's own shim dir and prepend it to GITHUB_PATH
          # (mirrors the pip3 --user pattern the Linux legs use, above) so
          # it's guaranteed to win on PATH rather than assumed to. Captured
          # into a variable first (not inlined into the `echo` argument):
          # under `set -e`, a failing/empty command substitution inlined
          # into `echo "$(...)"` would NOT abort the step (echo's own exit
          # status is what -e checks), silently writing a blank PATH entry.
          pipx install cmake==4.3.4
          pipx_bin_dir="$(pipx environment --value PIPX_BIN_DIR)"
          test -n "$pipx_bin_dir"
          echo "$pipx_bin_dir" >> "$GITHUB_PATH"
          # GITHUB_PATH only takes effect from the next step onward, not
          # within this script, so verify via the resolved dir directly
          # rather than a bare `cmake` (which may still hit an empty PATH
          # slot right here). Self-documents the fix in every future log:
          # today's incident was exactly this kind of silent version drift.
          "$pipx_bin_dir/cmake" --version
          # awk strips the trailing ` \` that pip-compile adds when the
          # requirement is continued by `--hash=...` lines.
          pipx install "$(awk '/^meson==/ {print $1}' requirements-ci.txt)"
          # Governance UAT 2026-05-06 build-ci B-1: PyYAML hard-required
          # at meson configure time for the content embed.
          pip3 install --break-system-packages --require-hashes -r requirements-ci.txt

      # Split restore + always-save: `save-always: true` is deprecated and
      # documented as "does not work as intended" by the actions/cache
      # maintainers (https://github.com/actions/cache/tree/main/save#always-save-cache).
      # Pattern: restore on the way in, then a paired `actions/cache/save`
      # at the job tail gated on `if: always() && cache-hit != 'true'`. The
      # `always()` lets the save run even if the build step failed (which
      # is the only behaviour `save-always` was meant to deliver); the
      # `cache-hit != 'true'` gate skips the upload when the primary key
      # already exists, matching the default `actions/cache` semantics.
      - name: Restore ccache
        id: cache-ccache-macos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.build_type }}-${{ hashFiles('**/*.cpp', '**/*.hpp', '**/*.h') }}
          restore-keys: |
            ccache-macos-${{ matrix.build_type }}-
            ccache-macos-

      - name: Reset ccache stats
        run: ccache -z

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Restore vcpkg installed packages
        # Cache-key contract: vcpkg.json (ports/features) + vcpkg-configuration.json
        # (registry/baseline) + the pinned VCPKG_COMMIT baseline (in the key
        # prefix) catch the D3 staleness cases — a port edit or baseline bump.
        # This leg installs the BUILTIN `arm64-osx` triplet (no
        # `triplets/arm64-osx.cmake` overlay exists), so the repo's custom
        # triplet descriptors (x64-linux-asan/tsan/static, x64-windows) cannot
        # change its vcpkg output — hashing `triplets/*.cmake` only cold-starts
        # this cache on unrelated sanitizer-triplet edits. We hash the specific
        # `triplets/arm64-osx.cmake` instead: empty today (stable key), and
        # auto-tracked the moment an arm64-osx overlay is ever added.
        # Save side is the paired `actions/cache/save` step at the job tail
        # — see comment on `Restore ccache` above for the save-always
        # deprecation rationale.
        id: cache-vcpkg-macos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-arm64-osx-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/arm64-osx.cmake') }}
          restore-keys: |
            vcpkg-arm64-osx-${{ env.VCPKG_COMMIT }}-
            vcpkg-arm64-osx-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: Install vcpkg packages
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet arm64-osx \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson)
        env:
          CC: ccache cc
          CXX: ccache c++
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/arm64-osx/lib/pkgconfig
        run: |
          meson setup build-macos \
            --native-file meson/native/macos-appleclang.ini \
            --buildtype=${{ matrix.build_type }} \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/arm64-osx \
            -Dbuild_tests=true \
            ${{ matrix.build_type == 'release' && '-Db_lto=true' || '' }}

      - name: Build
        run: meson compile -C build-macos

      # Link-provenance assertion (#1331 review HIGH-2): hosted macOS images can
      # carry a system PostgreSQL, so prove the canary linked vcpkg's static
      # archive rather than a system dylib resolved by cmake's FindPostgreSQL.
      - name: Assert canary libpq link provenance (static on macOS)
        run: |
          bin="build-macos/server/core/yuzu_pg_canary"
          test -x "$bin" || { echo "::error::canary binary missing at $bin"; exit 1; }
          if otool -L "$bin" | grep -qi 'libpq'; then
            echo "::error::canary dynamically links libpq — expected vcpkg static archive (ADR-0008)"
            otool -L "$bin" | grep -i 'libpq'
            exit 1
          fi
          echo "OK: no dynamic libpq dependency — static archive linked"

      # The server Postgres suite is DELIBERATELY NOT run on macOS (ADR-0035:
      # the Yuzu server is a Linux-only component; macOS/Windows are agent-only
      # platforms). macos-15 GHA runners have a SINGLE brew Postgres cluster,
      # and the auth->Postgres migration (ADR-0006) ~doubled the [pg] test
      # population to ~660 clone-bound cases (each does CREATE DATABASE ...
      # TEMPLATE + DROP ... FORCE). One slow cluster cannot service that within
      # the per-suite meson budget, and sharding does NOT help — parallel shards
      # contend on the one cluster (both shards hit their 600s timeout, #2394).
      # So we intentionally do NOT provision Postgres / export
      # YUZU_TEST_POSTGRES_DSN here: every [pg] server test then SKIPS
      # (env-unset -> skip, the same contract the Catch2 PG fixtures and
      # tests/shell/test_mfa_reset.sh use), while the non-PG server suite
      # (~[pg]), the agent suite, and the Apple-Clang compile all still run.
      # Linux + Windows keep FULL [pg] coverage (multi-cluster, faster I/O).
      # Do NOT re-add ensure-postgres here without first solving the
      # single-cluster capacity problem — see the shard comment in
      # tests/meson.build and docs/ci-architecture.md.
      - name: Server Postgres suite skipped on macOS (ADR-0035; no DSN exported)
        run: |
          echo "macOS: server [pg] tests SKIP (YUZU_TEST_POSTGRES_DSN intentionally unset)."
          echo "The Yuzu server is Linux-only (ADR-0035); Linux + Windows CI legs run the full [pg] suite."

      - name: Test
        run: python3 scripts/ci/flake-retry.py --builddir build-macos -- --print-errorlogs

      # Same rationale as the linux + windows upload steps: keep test
      # failures diagnosable when meson's `--print-errorlogs` truncation
      # drops the test name (notably: gateway eunit summaries).
      - name: Upload meson-logs on test failure or cancel
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-logs-macos-${{ matrix.build_type }}-${{ github.run_attempt }}
          path: build-macos/meson-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: ccache stats + build observability
        if: always()
        run: |
          # Informational only — never fail the job from here (set +e).
          set +e
          ccache -s
          # Mirror the Linux/Windows job-summary (P3 observability). macOS is a
          # GHA-hosted ephemeral runner with an actions/cache-backed ccache, so
          # a cold restore is expected on a cache-key miss — no cold-cache
          # ::warning:: here (that signal is self-hosted-only).
          s="$(ccache --print-stats 2>/dev/null)"
          get(){ printf '%s\n' "$s" | awk -F'\t' -v k="$1" '$1==k{v=$2} END{print v+0}'; }
          hits=$(( $(get direct_cache_hit) + $(get preprocessed_cache_hit) ))
          miss=$(get cache_miss)
          total=$(( hits + miss ))
          rate="n/a"; [ "$total" -gt 0 ] && rate=$(( 100 * hits / total ))
          {
            echo "### macOS ${{ matrix.build_type }} — cache & parallelism"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| ccache hit rate | ${rate}% (${hits}/${total}) |"
            echo "| ccache misses | ${miss} |"
            echo "| effective -j | ${YUZU_BUILD_JOBS:-ninja default} |"
            echo "| LTO | ${{ matrix.build_type == 'release' && 'yes (link-time, ccache cannot accelerate)' || 'no' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Paired saves for the two restore-only steps above. `if: always()`
      # is the documented replacement for `save-always: true` and lets
      # the cache populate even when Build/Test failed. The
      # `cache-hit != 'true'` gate skips the upload when the primary key
      # already matched on restore (no new content to save).
      - name: Save ccache
        if: always() && steps.cache-ccache-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ${{ steps.cache-ccache-macos.outputs.cache-primary-key }}

      - name: Save vcpkg installed packages
        if: always() && steps.cache-vcpkg-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: ${{ steps.cache-vcpkg-macos.outputs.cache-primary-key }}

  # ── Docs-only required-check stubs (issue #1978) ──────────────────────
  # The linux/windows/macos required contexts are MATRIX-expanded names
  # ("Linux gcc-15 debug", "Windows MSVC debug", "macOS debug"). A matrix job
  # skipped at the job level is skipped BEFORE the matrix expands, so it emits
  # none of its inner check-run names (actions/runner#952). Gating the real
  # jobs on code_changed therefore leaves those required contexts "Expected —
  # waiting" forever on a docs-only PR — the exact hang #1978 must avoid.
  #
  # This job emits those exact names as `success` when, and only when, the real
  # matrix jobs are skipped for a docs-only PR. It is itself a matrix job, so
  # the SAME runner#952 behaviour makes it collision-free: on a code PR it is
  # skipped before expansion and emits nothing, leaving the real job as the
  # sole producer of each name. Exactly one producer per required name per run
  # (real job on code PRs, this stub on docs-only PRs) — no duplicate/masking.
  #
  # proto-compat is a NON-matrix job: its skipped run reports "Proto
  # backward-compat: skipped", which already satisfies the required check, so
  # it needs no stub. preflight always runs; "CHANGELOG order" (docs-lint.yml)
  # runs on every PR. Together that satisfies all six required contexts on a
  # docs-only PR without a build.
  docs-required-checks:
    name: ${{ matrix.check }}
    needs: [preflight]
    if: needs.preflight.outputs.code_changed == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # MUST stay byte-identical to the matrix-expanded names the real jobs
        # produce on a PR and that the dev ruleset requires. If a real job's
        # name template or its PR matrix leg changes, update these in lockstep.
        check:
          - "Linux gcc-15 debug"
          - "Windows MSVC debug"
          - "macOS debug"
    steps:
      - name: Satisfy required check (docs-only PR — no build)
        run: |
          echo "Docs-only PR (#1978): '${{ matrix.check }}' is not built."
          echo "This stub emits the required check name as success so the PR is"
          echo "not blocked on an absent matrix context. Any PR that touches"
          echo "code runs the real '${{ matrix.check }}' build instead."

  # ── CI canary (PR-8 of overhaul plan) ─────────────────────────────────
  # Detects whether a PR (or a push to main) touches CI infrastructure
  # (workflows / actions / CI helper scripts). If it does, the canary leg
  # runs the linux build on GHA-hosted ubuntu-24.04 — a fresh-disk runner
  # with no warm caches and no self-hosted assumptions — so workflow
  # regressions are caught against a vanilla environment BEFORE the
  # change lands on main and becomes the next CI run for everyone.
  #
  # Cache-warming rationale for the push-to-main trigger: GHA cache scope
  # is branch-isolated. PR runs save to `refs/pull/<N>/merge`, which
  # sibling PRs cannot read, so without a push-to-main run the canary's
  # vcpkg + ccache caches never land on `refs/heads/main` and every PR
  # cold-starts (~25 min from-source vcpkg). Running on push to main
  # populates the default-branch cache scope, which every subsequent PR
  # inherits as its restore fallback (~10 s warm restore). Limited to
  # main only — dev pushes are pre-merge churn, the warm canonical state
  # we want operators to inherit is what landed on main.
  detect-ci-changes:
    name: "Detect CI infrastructure changes"
    needs: [trusted_inputs]
    if: github.event_name == 'pull_request' || inputs.head_sha != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      workflows_changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.trusted_inputs.outputs.checkout_repository }}
          ref: ${{ needs.trusted_inputs.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          TRUSTED_BASE_SHA: ${{ needs.trusted_inputs.outputs.base_sha }}
          TRUSTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          # PRs diff against the base ref; pushes diff against the SHA
          # before the push (`github.event.before`). For push-to-main
          # that's the previous main tip, which is exactly the boundary
          # we want — anything in this push that touched CI infra needs
          # to (re)warm the canary cache scope.
          if [[ -n "$TRUSTED_HEAD_SHA" ]]; then
            base_sha="$TRUSTED_BASE_SHA"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          # Defensive: a brand-new branch push has before = 40 zeros.
          # main is protected and never created from scratch in normal
          # flow, but if it happens fall back to HEAD~1 so we don't
          # diff against the empty tree (which would mark every file
          # changed and run the canary unconditionally).
          if [[ "$base_sha" =~ ^0{40}$ ]]; then
            base_sha="HEAD~1"
          fi
          # The shared classifier owns both diff establishment and the named
          # CI-infrastructure path class. It reports true on a bad/missing base
          # so uncertainty runs the clean-host canary instead of skipping it.
          if ! changed=$(bash scripts/ci/detect-code-change.sh \
                --class ci-infrastructure --git-diff "$base_sha" HEAD); then
            changed=true
            echo "Classifier errored — canary will run (fail-closed)."
          fi
          if [[ "$changed" != "true" && "$changed" != "false" ]]; then
            echo "Unexpected classifier result '$changed' — canary will run (fail-closed)."
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$changed" == "true" ]]; then
            echo "CI infrastructure changes detected or diff uncertain — canary will run."
          else
            echo "No CI infrastructure changes — canary skipped."
          fi

  canary:
    name: "Workflow canary (GHA-hosted ubuntu-24.04)"
    needs: [detect-ci-changes, trusted_inputs]
    if: needs.detect-ci-changes.outputs.workflows_changed == 'true'
    runs-on: ubuntu-24.04
    # A genuinely cold cache builds the whole vcpkg closure from source on a
    # 2-vCPU GHA-hosted runner — ~65-70 min for grpc/protobuf/abseil/openssl
    # plus libpq, which compiles PostgreSQL from source (ADR-0006/0008) —
    # before a single TU of ours is built. The old 75-min ceiling left no
    # headroom, so a cold run timed out mid-build and only the `if: always()`
    # cache saves rescued the next run. 120 min covers a cold build with
    # margin; warm runs still finish in ~6 min.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.trusted_inputs.outputs.checkout_repository }}
          ref: ${{ needs.trusted_inputs.outputs.checkout_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gcc-13 g++-13 \
            pkg-config curl zip unzip tar python3-pip ccache \
            bison flex libsystemd-dev autoconf automake libtool
          pip3 install --user --break-system-packages --require-hashes -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore vcpkg installed packages (canary)
        # Key tracks only what changes the canary's vcpkg output: the
        # manifest (vcpkg.json), the registry/baseline config
        # (vcpkg-configuration.json), and the pinned VCPKG_COMMIT (in the key
        # prefix). The canary installs the BUILTIN `x64-linux` triplet — no
        # `triplets/x64-linux.cmake` overlay exists today — so the repo's
        # custom triplet descriptors (asan/tsan/static/windows) do NOT affect
        # this build. Hashing the whole `triplets/*.cmake` glob cold-started
        # the canary on unrelated sanitizer-triplet edits and blew the job
        # timeout; we hash the specific `triplets/x64-linux.cmake` instead —
        # empty today (stable key), auto-tracked if an x64-linux overlay is
        # ever added (mirrors the macOS `arm64-osx` leg). Cold from-source
        # build is ~65-70 min (libpq builds PostgreSQL from source,
        # ADR-0006/0008); warm restore ~10 s.
        # Save side is the paired `actions/cache/save` step at the job tail
        # — see comment on the macOS `Restore ccache` step (line ~564) for
        # the save-always deprecation rationale and the documented split
        # restore + always-save pattern.
        id: cache-vcpkg-canary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-canary-x64-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/x64-linux.cmake') }}
          restore-keys: |
            vcpkg-canary-x64-linux-${{ env.VCPKG_COMMIT }}-
            vcpkg-canary-x64-linux-

      - name: Restore ccache (canary)
        # ccache is `apt-get install`-ed and used as the compiler wrapper
        # below, but the GHA-hosted runner is fresh-disk per job — without
        # this cache step every TU compiles cold every run. Mirrors the
        # macOS pattern. Source-hash key triggers a fresh save on any
        # source change but cascading restore-keys keep most of the cache
        # warm. Closes the canary's biggest unforced-loss perf hole (#743).
        id: cache-ccache-canary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-canary-x64-linux-${{ hashFiles('**/*.cpp', '**/*.hpp', '**/*.h') }}
          restore-keys: |
            ccache-canary-x64-linux-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: Sentinel unit tests
        # Pin the sentinel's drift / no-op / first-run / missing-manifest
        # behaviour before running it for real. Closes #741.
        run: bash scripts/ci/test-vcpkg-sentinel.sh

      - name: vcpkg sentinel (x64-linux)
        run: bash scripts/ci/vcpkg-triplet-sentinel.sh x64-linux

      - name: Install vcpkg packages
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet x64-linux \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson, gcc-13 debug)
        env:
          CC: ccache gcc-13
          CXX: ccache g++-13
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux/lib/pkgconfig
        run: |
          meson setup build-linux \
            --native-file meson/native/linux-gcc13.ini \
            --buildtype=debug \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-linux \
            -Dbuild_tests=true

      - name: Build
        run: meson compile -C build-linux

      # Link-provenance assertion (#1331 review HIGH-2) — same check as the
      # self-hosted Linux leg; the GHA-hosted image ships PostgreSQL client
      # libs, making this the leg most at risk of a system-libpq resolution.
      - name: Assert canary libpq link provenance (static on Linux)
        run: |
          bin="build-linux/server/core/yuzu_pg_canary"
          test -x "$bin" || { echo "::error::canary binary missing at $bin"; exit 1; }
          if ldd "$bin" | grep -qi 'libpq'; then
            echo "::error::canary dynamically links libpq — expected vcpkg static archive (ADR-0008)"
            ldd "$bin" | grep -i 'libpq'
            exit 1
          fi
          echo "OK: no dynamic libpq dependency — static archive linked"

      # Test step intentionally absent — the canary's purpose is
      # workflow-regression detection on a fresh-disk runner, not test
      # regression. `meson test` runs on every other linux leg
      # (linux_matrix, nightly asan/tsan/coverage). Skipping it here saves
      # ~10 min per canary run without reducing coverage. #743.

      # Paired saves for the two restore-only steps above. `if: always()`
      # is the documented replacement for `save-always: true` and lets
      # the cache populate even when Build failed. The
      # `cache-hit != 'true'` gate skips the upload when the primary key
      # already matched on restore (no new content to save).
      - name: Save vcpkg installed packages (canary)
        if: always() && steps.cache-vcpkg-canary.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: ${{ steps.cache-vcpkg-canary.outputs.cache-primary-key }}

      - name: Save ccache (canary)
        if: always() && steps.cache-ccache-canary.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cache-ccache-canary.outputs.cache-primary-key }}
