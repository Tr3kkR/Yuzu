name: Cache prune

# Weekly maintenance for self-hosted runner-local caches (PR-9 of the CI
# overhaul plan). Deletes vcpkg binary-cache zips older than 30 days from
# ${runner.tool_cache}/yuzu-vcpkg-binary-cache-*/ on each self-hosted
# runner. Caps unbounded growth at the cost of one warm-rebuild per stale
# port — acceptable, since stale-by-mtime ports are by definition not in
# the active build's working set.
#
# Also sweeps leaked yuzu_test_* databases off the persistent self-hosted
# Postgres instances (#1367, scripts/ci/sweep-test-databases.sh) — the
# out-of-band counterpart to the suite-start sweeper from PR #2091, so
# leaks reclaim even on a box that stops running [pg] legs.
#
# Does NOT touch:
#   - ccache (~/.cache/ccache, %LOCALAPPDATA%\ccache) — its own LRU at
#     CCACHE_MAXSIZE=30G already handles eviction without our help.
#   - the Yuzu workspace (build-*/, vcpkg/, vcpkg_installed/) — those
#     have per-job sentinels that handle invalidation.
#   - GHA-hosted actions/cache entries — managed by GitHub's own LRU.
#
# Schedule: Sundays 04:00 UTC (low CI load). Manual trigger via
# workflow_dispatch for ad-hoc cleanup. The runner-inventory-sentinel
# also runs every 30 min and would surface a wedged runner separately.

on:
  schedule:
    - cron: '0 4 * * 0'  # Sundays 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune-linux:
    name: "Prune Linux runner cache"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Prune vcpkg binary cache zips older than 30 days
        run: |
          set -eu
          base="${RUNNER_TOOL_CACHE:-/opt/actions-runner/_work/_tool}"
          if [[ ! -d "$base" ]]; then
            echo "::warning::RUNNER_TOOL_CACHE not found at $base — skipping"
            exit 0
          fi
          echo "Pruning vcpkg binary-cache zips older than 30 days under: $base"
          # `-type f` because the cache subdirs are kept; only the zip
          # contents age out. -mtime +30 = strictly older than 30 days.
          # Print before delete so the workflow log shows what went.
          before_total=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f 2>/dev/null | wc -l || echo 0)
          deleted=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f -mtime +30 -print -delete 2>/dev/null | wc -l || echo 0)
          after_total=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f 2>/dev/null | wc -l || echo 0)
          echo "before=${before_total} deleted=${deleted} after=${after_total}"

      - name: Prune buildx chisel local cache older than 30 days
        run: |
          set -eu
          # docker-publish-chisel writes a type=local,mode=max buildx cache per
          # image under $RUNNER_TOOL_CACHE/yuzu-docker-buildcache/<image>-chisel —
          # several GB per arch with no built-in eviction. buildx rewrites the dir
          # each run, so an untouched *-chisel dir is genuinely stale. Linux-only
          # (the chisel C++ builds run on the self-hosted Big Tam Linux runner).
          bc="${RUNNER_TOOL_CACHE:-/opt/actions-runner/_work/_tool}/yuzu-docker-buildcache"
          if [[ ! -d "$bc" ]]; then
            echo "::notice::buildx cache dir $bc not present — skipping"
            exit 0
          fi
          before=$(du -sh "$bc" 2>/dev/null | awk '{print $1}' || echo '?')
          find "$bc" -maxdepth 1 -type d -name '*-chisel' -mtime +30 -exec rm -rf {} + 2>/dev/null || true
          after=$(du -sh "$bc" 2>/dev/null | awk '{print $1}' || echo '?')
          echo "buildx chisel cache: before=${before} after=${after}"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # clean: false is load-bearing on the self-hosted agents: they share
          # one per-repo workspace with ci.yml's build jobs (which also set it),
          # and the default git clean -ffdx would wipe the warm build-*/ and
          # vcpkg_installed/ trees this workflow's own header promises not to
          # touch.
          clean: false

      - name: Sweep leaked yuzu_test_* databases (#1367)
        run: bash scripts/ci/sweep-test-databases.sh

  prune-windows:
    name: "Prune Windows runner cache"
    runs-on: [self-hosted, Windows, X64, yuzu-weetam-windows]
    timeout-minutes: 10
    defaults:
      run:
        # MSYS2 bash for the same `find -mtime` semantics. Same shell
        # convention as the windows job in ci.yml.
        shell: 'C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - name: Prune vcpkg binary cache zips older than 30 days
        run: |
          set -eu
          # System32 precedes /usr/bin on these runners' PATH (the same fact
          # that forces the `source`-not-`bash` idiom below), so a bare `find`
          # is Windows find.exe — its errors were swallowed by 2>/dev/null and
          # this step pruned nothing while printing before=0 deleted=0.
          # Prepend /usr/bin so coreutils win.
          export PATH="/usr/bin:$PATH"
          # RUNNER_TOOL_CACHE on Windows is typically C:\actions-runner\_work\_tool
          # which msys2 bash sees as /c/actions-runner/_work/_tool. Use the
          # native env var directly; bash treats forward+back slashes equivalently
          # for path operations.
          base="${RUNNER_TOOL_CACHE:-}"
          if [[ -z "$base" || ! -d "$base" ]]; then
            echo "::warning::RUNNER_TOOL_CACHE not found at '$base' — skipping"
            exit 0
          fi
          echo "Pruning vcpkg binary-cache zips older than 30 days under: $base"
          before_total=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f 2>/dev/null | wc -l || echo 0)
          deleted=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f -mtime +30 -print -delete 2>/dev/null | wc -l || echo 0)
          after_total=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f 2>/dev/null | wc -l || echo 0)
          echo "before=${before_total} deleted=${deleted} after=${after_total}"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # clean: false is load-bearing on the self-hosted agents: they share
          # one per-repo workspace with ci.yml's build jobs (which also set it),
          # and the default git clean -ffdx would wipe the warm build-*/ and
          # vcpkg_installed/ trees this workflow's own header promises not to
          # touch.
          clean: false

      - name: Sweep leaked yuzu_test_* databases (#1367)
        # `source`, not `bash`: same idiom as ci.yml's ensure-postgres step —
        # the bare `bash` resolves to the System32 WSL stub under LOCAL
        # SYSTEM, while this step already runs inside MSYS2 bash (job
        # default shell). The script ends in an explicit exit, so sourcing
        # is safe.
        run: source scripts/ci/sweep-test-databases.sh
