# ClusterFuzzLite — PR-scoped fuzzing of the in-tree libFuzzer harnesses
# (tests/fuzz/, built by .clusterfuzzlite/build.sh inside the OSS-Fuzz
# base-builder container; see .clusterfuzzlite/README.md for the target
# inventory and how to add one).
#
# mode: code-change — fuzzes only what the PR touches, short budget
# (fuzz-seconds below), so this is a fast regression net, not a soak.
# Deep exploration is cflite-batch.yml's job (batch + coverage + prune;
# it also feeds this job's corpus and pruning data). NOT a required
# status check.
#
# This also satisfies the OpenSSF Scorecard Fuzzing check (0/10 before
# this workflow existed — the check detects the .clusterfuzzlite/ config).

name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [dev, main]
    # Only fuzz PRs that can change fuzzed behavior. The harnesses compile
    # first-party C++ directly (no meson/vcpkg), and their entire compile
    # closure is the six parser families below plus tests/fuzz/ itself -
    # nothing in agents/, sdk/, proto/, or the rest of server/ reaches
    # them. Family globs (not exact files) so a sibling header/impl added
    # to a family stays covered. KEEP IN SYNC with BOTH
    # .clusterfuzzlite/build.sh's inputs AND cflite-batch.yml's identical
    # paths list - the batch leg uses the SAME filter, so a PR this list
    # misses is missed by both legs; when a fuzzed file grows an
    # out-of-family include, add the new family glob to both workflows in
    # the same change. Narrowing matters because affected-target pruning
    # fails OPEN (an empty affected set keeps ALL targets), so this filter
    # is the only mechanism that makes an unrelated PR free. KNOWN
    # EXCEPTION (#1978 class): GitHub evaluates event-level paths: against
    # a bounded diff window, so a very large PR touching a fuzzed file
    # can skip BOTH legs entirely - the same limitation that moved ci.yml
    # onto detect-code-change.sh. Accepted for now (documented in
    # docs/ci-architecture.md; adopting the detect-code-change pattern is
    # tracked on #3771).
    paths:
      - 'server/core/src/preflight_parse*'
      - 'server/core/src/deployment_parse*'
      - 'server/core/src/yaml_scan*'
      - 'server/core/src/guardian_rule_spec*'
      - 'server/core/src/guardian_resilience_schema*'
      - 'server/core/src/guardian_schema_registry*'
      - 'tests/fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job blocks below declare their own scopes; keep the workflow default
# minimal so a future job cannot silently inherit a broad grant.
permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (address sanitizer, code-change)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read            # cifuzz filestore reads cross-workflow artifacts
                               # (cifuzz-corpus-<target>, cifuzz-coverage-latest)
                               # via the REST artifact API; unspecified scopes
                               # in this block are none, which silently breaks
                               # both corpus download and target pruning
      security-events: write   # SARIF upload of crash findings
    steps:
      # #3770: a non-empty-but-STALE cifuzz-coverage-latest actively prunes a
      # target that IS affected by this PR (upstream's own fail-open only
      # protects the EMPTY-match case - see cflite-batch.yml's header). This
      # step re-runs the SAME name-scoped artifact lookup build_fuzzers itself
      # uses (`actions: read`, already granted above) and, if the newest match
      # is older than MAX_AGE_DAYS, forces build_fuzzers into keep-all instead
      # of letting it prune off a possibly-stale map. No new permission scope:
      # keep-all only means NOT passing keep-unaffected-fuzz-targets=false, it
      # never deletes or writes anything.
      - name: Check coverage-artifact age
        id: coverage_age
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Max age (days) before cifuzz-coverage-latest is trusted to drive
          # affected-target pruning. Chosen against the ~10-day measured
          # cadence of cflite-batch.yml's only trigger (closure-touching dev
          # pushes; no cron, see that workflow's header) - 30 days is 3x that
          # cadence, so a healthy refresh cycle never trips this, while a
          # stalled batch leg (an unfixed cflite-batch-broken issue, or a
          # long quiet period on the fuzzed closure) does.
          MAX_AGE_DAYS: 30
        run: |
          set -euo pipefail
          created_at=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=cifuzz-coverage-latest&per_page=1" \
            --jq '.artifacts[0].created_at // empty')
          if [ -z "$created_at" ]; then
            echo "::notice title=cflite coverage age::no cifuzz-coverage-latest artifact found - build_fuzzers will fail open to keep-all on its own (nothing to prune against)."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          created_epoch=$(date -u -d "$created_at" +%s)
          now_epoch=$(date -u +%s)
          age_days=$(( (now_epoch - created_epoch) / 86400 ))
          if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
            echo "::notice title=cflite coverage age::cifuzz-coverage-latest is ${age_days}d old (max ${MAX_AGE_DAYS}d) - STALE, falling back to keep-all (no affected-target pruning this run)."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=cflite coverage age::cifuzz-coverage-latest is ${age_days}d old (max ${MAX_AGE_DAYS}d) - within range, affected-target pruning proceeds normally."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: address
          # Pruning of unaffected targets happens in THIS step and needs the
          # coverage report artifact; the input has no default, so omitting
          # it leaves the build container with an empty token and pruning
          # silently keeps all targets. The age check above forces keep-all
          # when the coverage report is too stale to trust for pruning
          # (#3770) - a fresh-TIMESTAMP stale-CONTENT artifact (e.g. from a
          # main-ref dispatch) would still slip this check, but cflite-
          # batch.yml's dev ref-guards close the known producer of that case.
          keep-unaffected-fuzz-targets: ${{ steps.coverage_age.outputs.stale }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Total wall budget split across the retained targets (sequential).
          # 180s keeps the whole job under ~5.5 min (measured fixed costs:
          # ~35s image pull + ~68s build + ~37s run-step overhead) - the
          # operator ceiling is 6 min. parallel-fuzzing runs libFuzzer with
          # one worker per vCPU inside each target's slice, so total
          # executions EXCEED the old 300s single-worker budget (~720
          # core-seconds vs 300 on the 4-vCPU public runners).
          fuzz-seconds: 180
          parallel-fuzzing: true
          mode: code-change
          sanitizer: address
          output-sarif: true
