name: Pre-release QA

# Runs after a release workflow completes, or manually for any tag.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v0.7.0-rc1)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

# NO workflow-level `env: REGISTRY`. It used to be
# `ghcr.io/${{ github.repository_owner }}`, which renders as `ghcr.io/Tr3kkR` —
# Docker rejects uppercase in a repository name outright ("repository name must
# be lowercase"), so nothing could be pulled. GitHub expressions have no
# lowercase function, so the owner must be folded in a shell step: the `resolve`
# job does it once and publishes `needs.resolve.outputs.registry`. Every job that
# touches an image sets `env: REGISTRY: ${{ needs.resolve.outputs.registry }}`,
# and steps that cannot read env (action `with:` inputs, e.g. trivy's image-ref)
# reference the output directly. Defining a mixed-case default here again would
# just re-arm the trap for the next job that forgets to override it.

jobs:
  # ── Resolve version and download release artifacts ──────────────────
  resolve:
    name: "Resolve version"
    runs-on: ubuntu-24.04
    # `github.event.workflow_run.head_branch` is the TRIGGERING Release run's
    # head_branch, which for a `v*` tag push IS the tag (`v0.13.0`) — do not
    # confuse it with this workflow's own `head_branch`, which is always `main`
    # because a `workflow_run` workflow always executes on the default branch.
    # Reading the latter is what makes this gate look permanently dead when it
    # is not: QA has run on every SUCCESSFUL Release (e.g. run 24937379958 for
    # v0.11.0, where `resolve` succeeded and `integration` then failed on the
    # uppercase-registry pull fixed below). It skips on the other runs only
    # because `conclusion == 'success'` is false — 94 of the last 100 Release
    # runs failed or were cancelled.
    #
    # `startsWith(..., 'v')` is also the condition that keeps the DISPATCH
    # release path covered: release.yml can be run via workflow_dispatch on a
    # tag ref (the documented fallback for when GitHub drops a tag-push webhook,
    # used for v0.11.0-rc1), and such a run still reports head_branch=v0.11.0-rc1.
    # Narrowing this to `workflow_run.event == 'push'` would silently skip QA on
    # every manually-cut release — and report green while doing it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      registry: ${{ steps.reg.outputs.registry }}
      has_prev: ${{ steps.prev.outputs.has_prev }}
      prev_tag: ${{ steps.prev.outputs.prev_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `github.repository_owner` is `Tr3kkR` — mixed case. Docker rejects
      # uppercase in a repository name outright ("repository name must be
      # lowercase"), so `ghcr.io/${{ github.repository_owner }}/yuzu-server`
      # cannot be pulled at all. This is not theoretical: the v0.11.0 QA run
      # (24937379958) died with exactly `invalid reference format: repository
      # name (Tr3kkR/yuzu-server) must be lowercase`. release.yml lowercases the
      # owner for this reason; this workflow never did. Every job below that
      # touches an image overrides REGISTRY with this value, and steps that
      # cannot read env (action `with:` inputs, e.g. trivy's image-ref) use the
      # output directly.
      - name: Lowercase registry owner
        id: reg
        env:
          # Bound to env rather than interpolated into the run body — the next
          # step documents why, and this step must not be the counter-example.
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "registry=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bind externally-influenced values to env vars rather than
          # interpolating them into bash source — a branch name or
          # workflow_dispatch input can carry shell metacharacters, and
          # direct `${{ ... }}` expansion into a `run:` block is a code-
          # injection sink (CodeQL actions/code-injection/critical).
          #
          # EVENT_BRANCH is the TRIGGERING Release run's head_branch, which for a
          # tag build is the tag itself (`v0.13.0`). See the `if:` above.
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$EVENT_BRANCH"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing: $TAG (version $VERSION)"

      - name: Find previous stable release
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bind tag to env so a tag with shell metacharacters can't be
          # interpolated into the script body (CodeQL
          # actions/code-injection/critical).
          CURRENT: ${{ steps.ver.outputs.tag }}
        run: |
          PREV=$(gh release list --limit 20 --json tagName,isPrerelease \
            -q "[.[] | select(.tagName != \"$CURRENT\" and .isPrerelease == false)] | .[0].tagName // empty")
          if [[ -n "$PREV" ]]; then
            echo "has_prev=true" >> "$GITHUB_OUTPUT"
            echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
            echo "Previous stable release: $PREV"
          else
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            echo "No previous stable release found"
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bind tag to env to avoid code-injection via crafted ref name.
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts/ || {
            echo "Release $TAG not found yet, waiting 60s..."
            sleep 60
            gh release download "$TAG" --dir artifacts/
          }
          ls -la artifacts/

      - name: Verify checksums
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS
          echo "All checksums verified"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 3

  # ── Full-stack integration test (Docker) ────────────────────────────
  integration:
    name: "Integration test (Docker)"
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Override the workflow-level REGISTRY, which carries the mixed-case owner
    # (`ghcr.io/Tr3kkR`) that Docker refuses to pull. See resolve's "Lowercase
    # registry owner".
    env:
      REGISTRY: ${{ needs.resolve.outputs.registry }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          # GHCR_PAT (write:packages-only PAT owned by Tr3kkR) instead
          # of GITHUB_TOKEN so we can push to GHCR packages whose
          # Actions-access policy isn't pinned to this repo. Falls
          # back to GITHUB_TOKEN for fork PRs without secret access.
          username: Tr3kkR
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Pull release images
        env:
          # Bind tag to env to avoid code-injection via crafted ref name.
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          for img in yuzu-server yuzu-agent yuzu-gateway; do
            docker pull "$REGISTRY/$img:${TAG#v}"
          done

      - name: Generate server config
        run: |
          mkdir -p /tmp/yuzu-qa
          python3 -c "
          import hashlib, os
          salt = os.urandom(16)
          dk = hashlib.pbkdf2_hmac('sha256', b'qapassword1', salt, 100000, dklen=32)
          print(f'qaadmin:admin:{salt.hex()}:{dk.hex()}')
          " > /tmp/yuzu-qa/yuzu-server.cfg

      - name: Create Docker Compose for QA
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cat > /tmp/yuzu-qa/docker-compose.yml <<COMPOSE
          services:
            server:
              image: $REGISTRY/yuzu-server:$VERSION
              command:
                - "--listen"
                - "0.0.0.0:50051"
                - "--no-tls"
                - "--no-https"
                - "--gateway-upstream"
                - "0.0.0.0:50055"
                - "--gateway-mode"
                - "--gateway-command-addr"
                - "gateway:50063"
                - "--web-address"
                - "0.0.0.0"
                - "--web-port"
                - "8080"
                - "--metrics-no-auth"
                - "--config"
                - "/var/lib/yuzu/yuzu-server.cfg"
              ports:
                - "8080:8080"
                - "50055:50055"
              volumes:
                - /tmp/yuzu-qa/yuzu-server.cfg:/var/lib/yuzu/yuzu-server.cfg:ro
              # \`curl\` is NOT in the server runtime image (it installs only
              # libssl3, libpq5, ca-certificates and bash), so this healthcheck
              # could never pass: the container would sit \`unhealthy\` forever and
              # \`gateway\`, which waits on \`condition: service_healthy\`, would
              # never start. Use bash's /dev/tcp pseudo-device — the same probe
              # deploy/docker/docker-compose.reference.yml uses. The gate added
              # in #751 verifies bash + /dev/tcp survive in the image.
              healthcheck:
                test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3>&-"]
                interval: 5s
                timeout: 3s
                retries: 10

            gateway:
              image: $REGISTRY/yuzu-gateway:$VERSION
              environment:
                - YUZU_GW_UPSTREAM_ADDR=server
              ports:
                - "50051:50051"
                - "50063:50063"
                - "8081:8081"
                - "9568:9568"
              depends_on:
                server:
                  condition: service_healthy

            agent:
              image: $REGISTRY/yuzu-agent:$VERSION
              command:
                - "--server"
                - "gateway:50051"
                - "--no-tls"
                - "--log-level"
                - "info"
              depends_on:
                - gateway
          COMPOSE

      - name: Start stack
        working-directory: /tmp/yuzu-qa
        run: |
          docker compose up -d
          echo "Waiting for stack to be healthy..."
          # Wait for server
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/livez &>/dev/null; then break; fi
            sleep 2
          done
          # Wait for gateway
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/readyz &>/dev/null; then break; fi
            sleep 2
          done
          # Wait for agent registration
          for i in $(seq 1 30); do
            COUNT=$(curl -s http://localhost:8080/metrics 2>/dev/null | \
              grep -oP 'yuzu_agents_registered_total \K[0-9]+' || echo "0")
            if [ "$COUNT" -ge 1 ]; then break; fi
            sleep 2
          done
          echo "Stack ready"

      - name: Test — Dashboard reachable
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login)
          [ "$CODE" = "200" ] && echo "PASS: Dashboard HTTP $CODE" || { echo "FAIL: HTTP $CODE"; exit 1; }

      - name: Test — Gateway health
        run: |
          HEALTH=$(curl -sf http://localhost:8081/readyz)
          echo "$HEALTH" | grep -q '"ready"' && echo "PASS: Gateway healthy" || { echo "FAIL: $HEALTH"; exit 1; }

      - name: Test — Agent registered
        run: |
          COUNT=$(curl -s http://localhost:8080/metrics | grep -oP 'yuzu_agents_registered_total \K[0-9]+' || echo "0")
          [ "$COUNT" -ge 1 ] && echo "PASS: $COUNT agent(s) registered" || { echo "FAIL: 0 agents"; exit 1; }

      - name: Test — Gateway sees agent
        run: |
          COUNT=$(curl -s http://localhost:9568/metrics | \
            grep -oP 'yuzu_gw_agents_connected_total\{[^}]*\} \K[0-9]+' || echo "0")
          [ "$COUNT" -ge 1 ] && echo "PASS: Gateway shows $COUNT agent(s)" || { echo "FAIL: 0 agents"; exit 1; }

      - name: Test — Command round-trip (os_info)
        run: |
          # Login
          curl -s -c /tmp/cookies.txt http://localhost:8080/login \
            -d "username=qaadmin&password=qapassword1" -o /dev/null

          # Dispatch command
          RESP=$(curl -s -b /tmp/cookies.txt -X POST http://localhost:8080/api/command \
            -H "Content-Type: application/json" \
            -d '{"plugin":"os_info","action":"os_name"}')
          CMD_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('command_id',''))" 2>/dev/null)

          if [ -z "$CMD_ID" ]; then
            echo "FAIL: Command dispatch failed: $RESP"
            exit 1
          fi

          echo "Command dispatched: $CMD_ID"

          # Poll for response
          for i in $(seq 1 20); do
            sleep 2
            RESULT=$(curl -s -b /tmp/cookies.txt "http://localhost:8080/api/responses/$CMD_ID" | \
              python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for r in d.get('responses',[]):
              o=r.get('output','')
              if 'os_name|' in o:
                  print(o.split('|',1)[1])
                  break
          " 2>/dev/null)
            [ -n "$RESULT" ] && break
          done

          if [ -n "$RESULT" ]; then
            echo "PASS: os_info returned '$RESULT' (${i}s)"
          else
            echo "FAIL: No response after polling"
            exit 1
          fi

      - name: Collect logs
        if: always()
        working-directory: /tmp/yuzu-qa
        run: |
          docker compose logs > /tmp/yuzu-qa/integration-logs.txt 2>&1
          docker compose ps

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-logs
          path: /tmp/yuzu-qa/integration-logs.txt
          retention-days: 3

      - name: Teardown
        if: always()
        working-directory: /tmp/yuzu-qa
        run: docker compose down -v

  # ── Installer smoke tests: .deb on multiple distros ─────────────────
  install-deb:
    name: "Install .deb (${{ matrix.distro }})"
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        distro: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12"]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Test .deb install and removal
        run: |
          for PKG in server agent gateway; do
            DEB=$(ls artifacts/yuzu-${PKG}*.deb 2>/dev/null | head -1)
            [ -z "$DEB" ] && { echo "SKIP: no yuzu-$PKG .deb found"; continue; }

            echo "=== Testing $DEB on ${{ matrix.distro }} ==="

            docker run --rm -v "$PWD/artifacts:/debs:ro" "${{ matrix.distro }}" bash -c "
              set -e
              apt-get update -qq
              dpkg -i /debs/$(basename $DEB) 2>&1 || apt-get install -f -y -qq
              echo 'PASS: installed'

              # Verify service file
              test -f /usr/lib/systemd/system/yuzu-${PKG}.service || \
                test -f /usr/lib/systemd/system/yuzu-gateway.service
              echo 'PASS: systemd service file exists'

              # Remove
              dpkg -r yuzu-$PKG
              echo 'PASS: removed cleanly'
            "
          done

  # ── Installer smoke tests: .rpm on Fedora/Rocky ─────────────────────
  install-rpm:
    name: "Install .rpm (${{ matrix.distro }})"
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        distro: ["fedora:40", "rockylinux:9"]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Test .rpm install and removal
        run: |
          for PKG in server agent gateway; do
            RPM=$(ls artifacts/yuzu-${PKG}*.rpm 2>/dev/null | head -1)
            [ -z "$RPM" ] && { echo "SKIP: no yuzu-$PKG .rpm found"; continue; }

            echo "=== Testing $RPM on ${{ matrix.distro }} ==="

            docker run --rm -v "$PWD/artifacts:/rpms:ro" "${{ matrix.distro }}" bash -c "
              set -e
              rpm -i /rpms/$(basename $RPM)
              echo 'PASS: installed'

              test -f /usr/lib/systemd/system/yuzu-${PKG}.service || \
                test -f /usr/lib/systemd/system/yuzu-gateway.service
              echo 'PASS: systemd service file exists'

              rpm -e yuzu-$PKG
              echo 'PASS: removed cleanly'
            "
          done

  # ── Windows installer smoke test ────────────────────────────────────
  #
  # Two install/uninstall cycles:
  #   Pass 1 (/NOTLS)  — the service must START and STAY Running. This is the regression
  #                      guard for #1822 (the agent registered a service but never
  #                      implemented the SCM control protocol, so `sc start` failed 1053 on
  #                      every real install) and for #1468 (the installer's `sc config`
  #                      dropped every service argument). Both shipped because this job used
  #                      to install with /NOSTART and only check the service was *registered*
  #                      — it never once pressed the button.
  #   Pass 2 (default) — TLS on with no CA to pin: the agent must FAIL CLOSED (#1303), i.e.
  #                      refuse to fall back to the system trust store.
  install-windows:
    name: "Install Windows .exe"
    needs: resolve
    runs-on: windows-2022
    # Two install/uninstall cycles plus the bounded service polls. The uninstaller alone now
    # spends up to 15s polling for STOPPED against a service that is genuinely running.
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      # ── Pass 1: /NOTLS ────────────────────────────────────────────────
      - name: Silent install (--no-tls)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "artifacts/YuzuAgentSetup-*.exe" | Select-Object -First 1
          Write-Host "Installing: $($installer.Name)"
          # -PassThru: the installer's exit code was previously discarded, so a failed install
          # was only ever caught indirectly by the Test-Path below.
          $p = Start-Process $installer.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOSTART','/NOTLS','/LOG=install-notls.log' `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "FAIL: installer exited $($p.ExitCode)"; exit 1 }
          if (Test-Path install-notls.log) { Get-Content install-notls.log | Select-Object -Last 20 }

      - name: Verify installation
        shell: pwsh
        run: |
          # Binary exists and runs
          $agent = "${env:ProgramFiles}\Yuzu\bin\yuzu-agent.exe"
          if (!(Test-Path $agent)) { Write-Error "FAIL: binary not found"; exit 1 }
          & $agent --version
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: --version exited $LASTEXITCODE"; exit 1 }
          Write-Host "PASS: binary runs"

          # Plugins installed
          $plugins = (Get-ChildItem "${env:ProgramFiles}\Yuzu\plugins\*.dll" -ErrorAction SilentlyContinue).Count
          if ($plugins -lt 5) { Write-Error "FAIL: only $plugins plugins"; exit 1 }
          Write-Host "PASS: $plugins plugins installed"

          # Service registered
          $svc = Get-Service "YuzuAgent" -ErrorAction SilentlyContinue
          if (!$svc) { Write-Error "FAIL: service not registered"; exit 1 }
          Write-Host "PASS: service registered (Status: $($svc.Status))"

      - name: Verify service binPath carries its arguments
        shell: pwsh
        run: |
          # #1468: `sc config binPath=` takes a SINGLE value. The installer used to leave the
          # arguments outside the quoted value, so sc.exe parsed --service/--server/... as
          # unknown OPTIONS, printed its usage block and exited 1639 without touching the
          # service — and because Inno ignores [Run] exit codes, the install still reported
          # success. The service kept the argument-less binPath CreateServiceW wrote, so the
          # agent ran with no --server/--data-dir and fail-closed on TLS moments after
          # reporting RUNNING. Assert every argument actually reached the SCM.
          $path = (Get-CimInstance Win32_Service -Filter "Name='YuzuAgent'").PathName
          Write-Host "binPath: $path"
          foreach ($arg in '--service', '--server', '--data-dir', '--plugin-dir', '--log-file', '--no-tls') {
            if ($path -notlike "*$arg*") { Write-Error "FAIL: binPath is missing $arg"; exit 1 }
          }
          Write-Host "PASS: binPath carries all service arguments"

      - name: Start service and assert RUNNING
        shell: pwsh
        run: |
          # Start-Service throws on the #1822 failure mode (1053, "the service did not respond
          # to the start request in a timely fashion"), which fails the step. WaitForStatus
          # throws on timeout.
          Start-Service YuzuAgent
          $svc = Get-Service YuzuAgent
          $svc.WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
          Write-Host "PASS: service reached Running"

          # RUNNING is reported BEFORE Agent::run() (agents/core/src/service_win.cpp), because
          # the reconnect loop is unbounded and waiting for it would time out the SCM start.
          # So a single sample proves nothing — the agent can fail-close and stop a moment
          # later and this job would flake green. Hold, then re-assert it is STILL Running and
          # was never restarted underneath us (an error-exit trips the SCM's recovery actions).
          $before = (Get-CimInstance Win32_Service -Filter "Name='YuzuAgent'").ProcessId
          Start-Sleep -Seconds 20
          $svc.Refresh()
          $after = (Get-CimInstance Win32_Service -Filter "Name='YuzuAgent'").ProcessId
          if ($svc.Status -ne 'Running') { Write-Error "FAIL: service left Running (now $($svc.Status))"; exit 1 }
          if ($before -ne $after) { Write-Error "FAIL: service restarted (pid $before -> $after)"; exit 1 }
          Write-Host "PASS: service held Running for 20s (pid $after)"

      - name: Stop service and assert STOPPED
        shell: pwsh
        run: |
          # Exercises SERVICE_CONTROL_STOP and the control handler — the other half of the
          # #1822 fix (STOP_PENDING → STOPPED via SetServiceStatus).
          Stop-Service YuzuAgent
          (Get-Service YuzuAgent).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))
          Write-Host "PASS: service reached Stopped"

      - name: Collect agent log (--no-tls pass)
        if: always()
        shell: pwsh
        run: |
          # --service suppresses the stderr sink, so this file is the ONLY diagnostic for a
          # failed start — and the uninstaller deletes {app}\logs. Copy it out first.
          $log = "${env:ProgramFiles}\Yuzu\logs\yuzu-agent.log"
          if (Test-Path $log) { Copy-Item $log agent-notls.log -Force; Get-Content $log -Tail 40 }
          else { Write-Host "no agent log at $log" }

      - name: Silent uninstall (--no-tls pass)
        shell: pwsh
        run: |
          $uninstaller = "${env:ProgramFiles}\Yuzu\unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
            Start-Sleep -Seconds 3
          }
          if (Test-Path "${env:ProgramFiles}\Yuzu\bin\yuzu-agent.exe") {
            Write-Error "FAIL: binary still present after uninstall"
            exit 1
          }
          Write-Host "PASS: uninstalled cleanly"

      # ── Pass 2: default TLS posture — must fail closed ────────────────
      - name: Silent install (default TLS posture)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "artifacts/YuzuAgentSetup-*.exe" | Select-Object -First 1
          $p = Start-Process $installer.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOSTART','/LOG=install-tls.log' `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "FAIL: installer exited $($p.ExitCode)"; exit 1 }

      - name: Assert secure-by-default fail-closed (no pinnable CA)
        shell: pwsh
        run: |
          # With TLS on and no CA pinned, the agent must REFUSE to connect (#1303) rather than
          # silently verifying against the system trust store, which does not trust a Yuzu
          # self-signed install CA — that would be a fail-open MITM posture.
          #
          # Guard the precondition: the agent auto-discovers a CA at this path, and if one were
          # present the pass would go green while testing nothing at all.
          if (Test-Path "C:\ProgramData\Yuzu\certs\default-ca.pem") {
            Write-Error "FAIL: a CA is present — this pass cannot exercise the fail-closed path"
            exit 1
          }
          $path = (Get-CimInstance Win32_Service -Filter "Name='YuzuAgent'").PathName
          if ($path -like "*--no-tls*") { Write-Error "FAIL: --no-tls leaked into the default install"; exit 1 }

          # Disable the SCM recovery actions --install-service configures (3x restart @60s), so
          # the fail-closed exit cannot be masked by an auto-restart. Via cmd.exe: sc.exe wants
          # a literal empty `actions= ""`, which pwsh mangles when passing native arguments.
          & cmd.exe /c 'sc.exe failure YuzuAgent reset= 0 actions= ""'
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: sc failure exited $LASTEXITCODE"; exit 1 }

          # The SCM start itself SUCCEEDS — RUNNING is reported before Agent::run() — and the
          # agent only then refuses and stops. Tolerate whatever Start-Service makes of that
          # race; the terminal state and the log are the actual assertions.
          try { Start-Service YuzuAgent -ErrorAction Stop; Write-Host "service start accepted" }
          catch { Write-Host "note: Start-Service reported: $($_.Exception.Message)" }

          (Get-Service YuzuAgent).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(90))
          Write-Host "PASS: service stopped instead of connecting without a pinned CA"

          # ...and stopped for the RIGHT reason. This also keeps the pass honest against a
          # regressed SCM protocol: a service that never starts is Stopped too, but leaves no
          # log line, because the agent never ran.
          $log = "${env:ProgramFiles}\Yuzu\logs\yuzu-agent.log"
          if (!(Test-Path $log)) { Write-Error "FAIL: no agent log — did the agent run at all?"; exit 1 }
          Copy-Item $log agent-tls.log -Force
          if (!(Select-String -Path $log -SimpleMatch 'no CA could be pinned' -Quiet)) {
            Write-Error "FAIL: agent stopped, but not for the fail-closed TLS reason"
            Get-Content $log -Tail 40
            exit 1
          }
          Write-Host "PASS: fail-closed for the expected reason (no pinnable CA)"

      - name: Silent uninstall (TLS pass)
        if: always()
        shell: pwsh
        run: |
          $uninstaller = "${env:ProgramFiles}\Yuzu\unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
            Start-Sleep -Seconds 3
          }
          if (Test-Path "${env:ProgramFiles}\Yuzu\bin\yuzu-agent.exe") {
            Write-Error "FAIL: binary still present after uninstall"
            exit 1
          }
          Write-Host "PASS: uninstalled cleanly"

      - name: Collect failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          & sc.exe qc YuzuAgent
          & sc.exe queryex YuzuAgent
          # Those native calls set $LASTEXITCODE, and GitHub's pwsh wrapper exits with it —
          # which would fail this step and mask the real failure. Reset it.
          $global:LASTEXITCODE = 0
          Get-WinEvent -LogName System -MaxEvents 300 -ErrorAction SilentlyContinue |
            Where-Object { $_.Id -in 7000, 7009, 7011, 7023, 7024, 7031, 7034 -or $_.Message -like '*YuzuAgent*' } |
            Format-List TimeCreated, Id, LevelDisplayName, Message |
            Out-File system-events.log -Encoding utf8
          if (Test-Path system-events.log) { Get-Content system-events.log -Tail 60 }

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-install-log
          path: |
            install-notls.log
            install-tls.log
            agent-notls.log
            agent-tls.log
            system-events.log
          if-no-files-found: ignore
          retention-days: 3

  # ── macOS installer smoke test ──────────────────────────────────────
  install-macos:
    name: "Install macOS .pkg"
    needs: resolve
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Install .pkg
        run: |
          PKG=$(ls artifacts/YuzuAgent-*.pkg 2>/dev/null | head -1)
          [ -z "$PKG" ] && { echo "SKIP: no .pkg found"; exit 0; }
          echo "Installing: $PKG"
          sudo installer -pkg "$PKG" -target / -verboseR

      - name: Verify installation
        run: |
          test -x /usr/local/bin/yuzu-agent && echo "PASS: binary installed" || { echo "FAIL: binary missing"; exit 1; }
          /usr/local/bin/yuzu-agent --version
          test -f /Library/LaunchDaemons/com.yuzu.agent.plist && echo "PASS: launchd plist installed" || { echo "FAIL: plist missing"; exit 1; }
          PLUGINS=$(ls /usr/local/lib/yuzu/plugins/*.dylib 2>/dev/null | wc -l | tr -d ' ')
          echo "PASS: $PLUGINS plugins installed"

  # ── Artifact deep inspection ────────────────────────────────────────
  artifact-verify:
    name: "Artifact verification"
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REGISTRY: ${{ needs.resolve.outputs.registry }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Verify archive contents
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cd artifacts

          echo "=== Linux x64 archive ==="
          tar tzf yuzu-linux-x64.tar.gz | grep -q 'bin/yuzu-server' && echo "PASS: server binary"
          tar tzf yuzu-linux-x64.tar.gz | grep -q 'bin/yuzu-agent' && echo "PASS: agent binary"
          PLUGINS=$(tar tzf yuzu-linux-x64.tar.gz | grep -c '\.so$' || true)
          echo "Plugins: $PLUGINS"
          [ "$PLUGINS" -ge 30 ] && echo "PASS: plugin count" || { echo "FAIL: only $PLUGINS plugins"; exit 1; }

          echo "=== Gateway archive ==="
          tar tzf yuzu-gateway-linux-x64.tar.gz | grep -q 'bin/yuzu_gw' && echo "PASS: gateway binary"
          tar tzf yuzu-gateway-linux-x64.tar.gz | grep -q 'releases/' && echo "PASS: Erlang release structure"

          echo "=== ARM64 archive ==="
          tar tzf yuzu-linux-arm64.tar.gz | grep -q 'bin/yuzu-server' && echo "PASS: ARM64 server"
          tar tzf yuzu-linux-arm64.tar.gz | grep -q 'bin/yuzu-agent' && echo "PASS: ARM64 agent"

      - name: Inspect Linux binaries
        run: |
          cd artifacts
          tar xzf yuzu-linux-x64.tar.gz
          DIR=$(ls -d yuzu-*-linux-x64 | head -1)

          echo "=== Binary format ==="
          file "$DIR/bin/yuzu-server" | grep -q 'ELF 64-bit.*x86-64' && echo "PASS: ELF x86-64" || { echo "FAIL"; exit 1; }

          echo "=== Hardening checks ==="
          # PIE
          readelf -h "$DIR/bin/yuzu-server" | grep 'Type:' | grep -q 'DYN' && echo "PASS: PIE enabled" || echo "WARN: not PIE"
          # RELRO
          readelf -l "$DIR/bin/yuzu-server" | grep -q 'GNU_RELRO' && echo "PASS: RELRO" || echo "WARN: no RELRO"
          # Stack canary
          readelf -s "$DIR/bin/yuzu-server" | grep -q '__stack_chk_fail' && echo "PASS: stack canary" || echo "WARN: no canary"
          # NX (no executable stack)
          if readelf -l "$DIR/bin/yuzu-server" | grep 'GNU_STACK' | grep -q 'RWE'; then
            echo "FAIL: executable stack (NX disabled)"
            exit 1
          else
            echo "PASS: NX enabled"
          fi

      - name: Inspect DEB metadata
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cd artifacts
          for deb in *.deb; do
            echo "=== $deb ==="
            dpkg-deb --field "$deb" Package Version
            DEB_VER=$(dpkg-deb --field "$deb" Version)
            [ "$DEB_VER" = "$VERSION" ] && echo "PASS: version matches" || echo "WARN: version $DEB_VER != $VERSION"
          done

      - name: Inspect RPM metadata
        run: |
          cd artifacts
          docker run --rm -v "$PWD:/pkg:ro" fedora:40 bash -c '
            for rpm in /pkg/*.rpm; do
              echo "=== $(basename $rpm) ==="
              rpm -qip "$rpm" 2>/dev/null | grep -E "^(Name|Version|Architecture)"
            done
          '

      - name: Inspect Docker images
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for img in yuzu-server yuzu-agent yuzu-gateway; do
            echo "=== $img ==="
            docker pull "$REGISTRY/$img:$VERSION" 2>/dev/null || { echo "SKIP: image not found"; continue; }
            # Non-root user
            USER=$(docker inspect "$REGISTRY/$img:$VERSION" --format='{{.Config.User}}')
            [ -n "$USER" ] && [ "$USER" != "root" ] && echo "PASS: non-root user ($USER)" || echo "WARN: running as root"
            # Image size
            SIZE=$(docker image inspect "$REGISTRY/$img:$VERSION" --format='{{.Size}}' | awk '{printf "%.0f", $1/1024/1024}')
            echo "Size: ${SIZE}MB"
          done

  # ── Security scanning ───────────────────────────────────────────────
  security-scan:
    name: "Security scan (Trivy)"
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REGISTRY: ${{ needs.resolve.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          # GHCR_PAT (write:packages-only PAT owned by Tr3kkR) instead
          # of GITHUB_TOKEN so we can push to GHCR packages whose
          # Actions-access policy isn't pinned to this repo. Falls
          # back to GITHUB_TOKEN for fork PRs without secret access.
          username: Tr3kkR
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # Scope: Trivy is used here ONLY for vulnerability scanning of
      # published container images. SBOM generation is NOT done here —
      # the authoritative SBOMs ship from release.yml via
      # `anchore/sbom-action` (Syft). Two generators would produce two
      # SBOMs that disagree on component enumeration for the same image.
      # Agents are installed natively on managed endpoints and not
      # published as a container image; only server + gateway are
      # scanned here.
      - name: Pull images for scanning
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for img in yuzu-server yuzu-gateway; do
            docker pull "$REGISTRY/$img:$VERSION" 2>/dev/null \
              || echo "SKIP: $img:$VERSION not found"
          done

      - name: Scan yuzu-server
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.resolve.outputs.registry }}/yuzu-server:${{ needs.resolve.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-yuzu-server.txt

      - name: Scan yuzu-gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.resolve.outputs.registry }}/yuzu-gateway:${{ needs.resolve.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-yuzu-gateway.txt

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan
          path: |
            trivy-*.txt
          retention-days: 7

  # ── Soak test (10 min stability) ────────────────────────────────────
  soak-test:
    name: "Soak test (10 min)"
    needs: [resolve, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REGISTRY: ${{ needs.resolve.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          # GHCR_PAT (write:packages-only PAT owned by Tr3kkR) instead
          # of GITHUB_TOKEN so we can push to GHCR packages whose
          # Actions-access policy isn't pinned to this repo. Falls
          # back to GITHUB_TOKEN for fork PRs without secret access.
          username: Tr3kkR
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Start stack
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir -p /tmp/yuzu-soak

          python3 -c "
          import hashlib, os
          salt = os.urandom(16)
          dk = hashlib.pbkdf2_hmac('sha256', b'soakpass1', salt, 100000, dklen=32)
          print(f'soak:admin:{salt.hex()}:{dk.hex()}')
          " > /tmp/yuzu-soak/yuzu-server.cfg

          cat > /tmp/yuzu-soak/docker-compose.yml <<COMPOSE
          services:
            server:
              image: $REGISTRY/yuzu-server:$VERSION
              command: ["--listen","0.0.0.0:50051","--no-tls","--no-https","--gateway-upstream","0.0.0.0:50055","--gateway-mode","--gateway-command-addr","gateway:50063","--web-address","0.0.0.0","--web-port","8080","--metrics-no-auth","--config","/var/lib/yuzu/yuzu-server.cfg"]
              ports: ["8080:8080","50055:50055"]
              volumes: ["/tmp/yuzu-soak/yuzu-server.cfg:/var/lib/yuzu/yuzu-server.cfg:ro"]
              # curl is NOT in the server runtime image — see the integration
              # job's compose above. bash + /dev/tcp is the supported probe.
              healthcheck:
                test: ["CMD","bash","-c","exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3>&-"]
                interval: 5s
                timeout: 3s
                retries: 10
            gateway:
              image: $REGISTRY/yuzu-gateway:$VERSION
              environment: ["YUZU_GW_UPSTREAM_ADDR=server"]
              ports: ["50051:50051","50063:50063","8081:8081","9568:9568"]
              depends_on:
                server:
                  condition: service_healthy
            agent:
              image: $REGISTRY/yuzu-agent:$VERSION
              command: ["--server","gateway:50051","--no-tls"]
              depends_on: [gateway]
          COMPOSE

          cd /tmp/yuzu-soak
          docker compose up -d

          # Wait for full stack
          for i in $(seq 1 40); do
            COUNT=$(curl -s http://localhost:8080/metrics 2>/dev/null | \
              grep -oP 'yuzu_agents_registered_total \K[0-9]+' || echo "0")
            [ "$COUNT" -ge 1 ] && break
            sleep 3
          done
          echo "Stack ready, agent registered"

      - name: Run soak (10 minutes)
        run: |
          echo "Starting 10-minute soak test..."
          echo "timestamp,server,gateway,agent,agents_registered" > /tmp/yuzu-soak/soak.csv

          # Login for commands
          curl -s -c /tmp/cookies.txt http://localhost:8080/login \
            -d "username=soak&password=soakpass1" -o /dev/null

          FAILURES=0
          for i in $(seq 1 20); do
            TS=$(date +%H:%M:%S)

            # Check all containers running
            RUNNING=$(cd /tmp/yuzu-soak && docker compose ps --format json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          states = [c.get('State','') for c in (data if isinstance(data, list) else [data])]
          print(len([s for s in states if s == 'running']))
          " 2>/dev/null || echo "0")

            # Check agent count
            AGENTS=$(curl -s http://localhost:8080/metrics 2>/dev/null | \
              grep -oP 'yuzu_agents_registered_total \K[0-9]+' || echo "0")

            # Check gateway health
            GW_OK="yes"
            curl -sf http://localhost:8081/readyz &>/dev/null || GW_OK="no"

            # Memory (container RSS)
            SERVER_MEM=$(docker stats --no-stream --format "{{.MemUsage}}" yuzu-soak-server-1 2>/dev/null | cut -d/ -f1 || echo "?")
            GW_MEM=$(docker stats --no-stream --format "{{.MemUsage}}" yuzu-soak-gateway-1 2>/dev/null | cut -d/ -f1 || echo "?")
            AGENT_MEM=$(docker stats --no-stream --format "{{.MemUsage}}" yuzu-soak-agent-1 2>/dev/null | cut -d/ -f1 || echo "?")

            echo "$TS  containers=$RUNNING  agents=$AGENTS  gw=$GW_OK  mem=[S:$SERVER_MEM G:$GW_MEM A:$AGENT_MEM]"
            echo "$TS,$SERVER_MEM,$GW_MEM,$AGENT_MEM,$AGENTS" >> /tmp/yuzu-soak/soak.csv

            if [ "$RUNNING" -lt 3 ] || [ "$AGENTS" -lt 1 ] || [ "$GW_OK" = "no" ]; then
              FAILURES=$((FAILURES + 1))
              echo "WARNING: degraded state at $TS"
            fi

            # Send a command every 30s to exercise the data path
            if [ $((i % 2)) -eq 0 ]; then
              curl -s -b /tmp/cookies.txt -X POST http://localhost:8080/api/command \
                -H "Content-Type: application/json" \
                -d '{"plugin":"status","action":"ping"}' > /dev/null 2>&1
            fi

            sleep 30
          done

          echo ""
          if [ "$FAILURES" -eq 0 ]; then
            echo "PASS: Soak test completed — 10 minutes, 0 failures"
          else
            echo "FAIL: $FAILURES degraded samples during soak"
            exit 1
          fi

      - name: Check for crashes in logs
        if: always()
        run: |
          cd /tmp/yuzu-soak
          docker compose logs > soak-logs.txt 2>&1
          if grep -iE 'segfault|ASAN|UBSAN|panic|SIGABRT|core dump' soak-logs.txt; then
            echo "FAIL: crash detected in logs"
            exit 1
          else
            echo "PASS: no crashes in logs"
          fi

      - name: Upload soak data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-test
          path: |
            /tmp/yuzu-soak/soak.csv
            /tmp/yuzu-soak/soak-logs.txt
          retention-days: 3

      - name: Teardown
        if: always()
        run: cd /tmp/yuzu-soak && docker compose down -v

  # ── Upgrade test ────────────────────────────────────────────────────
  upgrade-test:
    name: "Upgrade test"
    needs: [resolve, integration]
    if: needs.resolve.outputs.has_prev == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REGISTRY: ${{ needs.resolve.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          # GHCR_PAT (write:packages-only PAT owned by Tr3kkR) instead
          # of GITHUB_TOKEN so we can push to GHCR packages whose
          # Actions-access policy isn't pinned to this repo. Falls
          # back to GITHUB_TOKEN for fork PRs without secret access.
          username: Tr3kkR
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Start previous release
        env:
          PREV_TAG: ${{ needs.resolve.outputs.prev_tag }}
          NEW_VER: ${{ needs.resolve.outputs.version }}
        run: |
          PREV_VER="${PREV_TAG#v}"
          mkdir -p /tmp/yuzu-upgrade

          python3 -c "
          import hashlib, os
          salt = os.urandom(16)
          dk = hashlib.pbkdf2_hmac('sha256', b'upgradepass1', salt, 100000, dklen=32)
          print(f'upgrade:admin:{salt.hex()}:{dk.hex()}')
          " > /tmp/yuzu-upgrade/yuzu-server.cfg

          # Compose file with variable image tags
          cat > /tmp/yuzu-upgrade/docker-compose.yml <<COMPOSE
          services:
            server:
              image: $REGISTRY/yuzu-server:\${YUZU_VER}
              command: ["--listen","0.0.0.0:50051","--no-tls","--no-https","--gateway-upstream","0.0.0.0:50055","--gateway-mode","--gateway-command-addr","gateway:50063","--web-address","0.0.0.0","--web-port","8080","--metrics-no-auth","--config","/var/lib/yuzu/yuzu-server.cfg"]
              ports: ["8080:8080","50055:50055"]
              volumes: ["/tmp/yuzu-upgrade/yuzu-server.cfg:/var/lib/yuzu/yuzu-server.cfg:ro"]
              # curl is NOT in the server runtime image — see the integration
              # job's compose above. bash + /dev/tcp is the supported probe.
              healthcheck:
                test: ["CMD","bash","-c","exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3>&-"]
                interval: 5s
                timeout: 3s
                retries: 10
            gateway:
              image: $REGISTRY/yuzu-gateway:\${YUZU_VER}
              environment: ["YUZU_GW_UPSTREAM_ADDR=server"]
              ports: ["50051:50051","50063:50063","8081:8081"]
              depends_on:
                server:
                  condition: service_healthy
            agent:
              image: $REGISTRY/yuzu-agent:\${YUZU_VER}
              command: ["--server","gateway:50051","--no-tls"]
              depends_on: [gateway]
          COMPOSE

          cd /tmp/yuzu-upgrade
          echo "Starting previous release: $PREV_VER"
          YUZU_VER="$PREV_VER" docker compose up -d

          # Wait for stack
          for i in $(seq 1 40); do
            COUNT=$(curl -s http://localhost:8080/metrics 2>/dev/null | \
              grep -oP 'yuzu_agents_registered_total \K[0-9]+' || echo "0")
            [ "$COUNT" -ge 1 ] && break
            sleep 3
          done
          echo "Previous release stack ready ($PREV_VER)"

      - name: Upgrade to new release
        env:
          NEW_VER: ${{ needs.resolve.outputs.version }}
        run: |
          cd /tmp/yuzu-upgrade

          echo "Upgrading to: $NEW_VER"
          YUZU_VER="$NEW_VER" docker compose up -d

          # Wait for stack to recover
          for i in $(seq 1 40); do
            COUNT=$(curl -s http://localhost:8080/metrics 2>/dev/null | \
              grep -oP 'yuzu_agents_registered_total \K[0-9]+' || echo "0")
            [ "$COUNT" -ge 1 ] && break
            sleep 3
          done

      - name: Verify post-upgrade
        env:
          PREV_TAG: ${{ needs.resolve.outputs.prev_tag }}
          NEW_VER: ${{ needs.resolve.outputs.version }}
        run: |
          # Dashboard reachable
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login)
          [ "$CODE" = "200" ] && echo "PASS: Dashboard HTTP $CODE" || { echo "FAIL: HTTP $CODE"; exit 1; }

          # Agent reconnected
          COUNT=$(curl -s http://localhost:8080/metrics | \
            grep -oP 'yuzu_agents_registered_total \K[0-9]+' || echo "0")
          [ "$COUNT" -ge 1 ] && echo "PASS: Agent reconnected ($COUNT)" || { echo "FAIL: Agent not reconnected"; exit 1; }

          # Gateway healthy
          curl -sf http://localhost:8081/readyz | grep -q '"ready"' && echo "PASS: Gateway healthy" || { echo "FAIL: Gateway unhealthy"; exit 1; }

          echo "PASS: Upgrade from $PREV_TAG to v$NEW_VER succeeded"

      - name: Collect logs
        if: always()
        run: cd /tmp/yuzu-upgrade && docker compose logs > upgrade-logs.txt 2>&1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-logs
          path: /tmp/yuzu-upgrade/upgrade-logs.txt
          retention-days: 3

      - name: Teardown
        if: always()
        run: cd /tmp/yuzu-upgrade && docker compose down -v

  # ── QA summary ──────────────────────────────────────────────────────
  report:
    name: "QA Report"
    needs: [resolve, integration, install-deb, install-rpm, install-windows, install-macos, artifact-verify, security-scan, soak-test, upgrade-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Generate report
        env:
          R_RESOLVE: ${{ needs.resolve.result }}
          R_INTEGRATION: ${{ needs.integration.result }}
          R_DEB: ${{ needs.install-deb.result }}
          R_RPM: ${{ needs.install-rpm.result }}
          R_WINDOWS: ${{ needs.install-windows.result }}
          R_MACOS: ${{ needs.install-macos.result }}
          R_ARTIFACT: ${{ needs.artifact-verify.result }}
          R_SECURITY: ${{ needs.security-scan.result }}
          R_SOAK: ${{ needs.soak-test.result }}
          R_UPGRADE: ${{ needs.upgrade-test.result }}
          # Bind tag/version to env to avoid code-injection via crafted ref name.
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |

          status_icon() {
            case "$1" in
              success)  echo "PASS" ;;
              failure)  echo "FAIL" ;;
              skipped)  echo "SKIP" ;;
              *)        echo "????" ;;
            esac
          }

          cat >> "$GITHUB_STEP_SUMMARY" <<REPORT
          ## Pre-release QA Report: ${TAG}

          | Test Suite | Result |
          |---|---|
          | Integration (full stack round-trip) | $(status_icon "$R_INTEGRATION") |
          | .deb install (Ubuntu 22/24, Debian 12) | $(status_icon "$R_DEB") |
          | .rpm install (Fedora 40, Rocky 9) | $(status_icon "$R_RPM") |
          | Windows installer (silent) | $(status_icon "$R_WINDOWS") |
          | macOS .pkg install | $(status_icon "$R_MACOS") |
          | Artifact verification | $(status_icon "$R_ARTIFACT") |
          | Security scan (Trivy) | $(status_icon "$R_SECURITY") |
          | Soak test (10 min) | $(status_icon "$R_SOAK") |
          | Upgrade test | $(status_icon "$R_UPGRADE") |

          REPORT

          # `resolve` is deliberately NOT in ALL_RESULTS below, because a skipped
          # resolve must not be reported as a pass. This job is `if: always()`,
          # so when `resolve` skips (the triggering Release failed or was
          # cancelled — 94 of the last 100 Release runs) every one of the nine
          # test jobs is `skipped`, nothing matches "failure", and this step used
          # to print `### Result: PASSED` and exit 0. THAT is why Pre-release QA
          # has looked permanently green while testing nothing: not a dead
          # trigger, but a report that treats "never ran" as "passed".
          if [ "$R_RESOLVE" = "skipped" ]; then
            echo "### Result: NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No successful \`v*\` Release to test, so no QA was performed." >> "$GITHUB_STEP_SUMMARY"
            echo "This is NOT a pass — nothing was verified." >> "$GITHUB_STEP_SUMMARY"
            echo "Pre-release QA did not run: no successful release to test."
            exit 0
          fi

          if [ "$R_RESOLVE" != "success" ]; then
            echo "### Result: FAILED (could not resolve the release under test)" >> "$GITHUB_STEP_SUMMARY"
            echo "Pre-release QA could not resolve the release under test (resolve=$R_RESOLVE)."
            exit 1
          fi

          # Determine overall result. `cancelled` counts as a failure: a cancelled
          # suite has verified nothing, and must never read as a pass either.
          ALL_RESULTS="$R_INTEGRATION $R_DEB $R_RPM $R_WINDOWS $R_MACOS $R_ARTIFACT $R_SECURITY $R_SOAK $R_UPGRADE"
          if echo "$ALL_RESULTS" | grep -qE "failure|cancelled"; then
            echo "### Result: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "QA FAILED for $TAG"
            exit 1
          else
            echo "### Result: PASSED" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "QA PASSED for $TAG"
          fi
