## Disk Encryption Status Definitions
## Reports BitLocker, LUKS, and FileVault encryption state per volume.
## Plugin: bitlocker | Actions: state
##
## Sources by platform:
##   Windows: Win32_EncryptableVolume WMI, in-process (BitLocker)
##   Linux:   libblkid + /sys/class/block/dm-* (LUKS)
##   macOS:   fdesetup status + diskutil apfs list, bounded subprocess (FileVault)

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.encryption.state
  displayName: Disk Encryption Status
  version: 1.0.0
  description: >
    Query disk encryption status on the endpoint. On Windows, queries
    Win32_EncryptableVolume in-process via WMI to report BitLocker
    status per volume including conversion status, percentage
    encrypted, encryption method, and protection state. On Linux,
    enumerates LUKS volumes in-process via libblkid and reads
    open/mapped state from /sys/class/block/dm-*. On macOS, queries
    FileVault status via fdesetup and diskutil. Essential for
    compliance verification that endpoint storage is encrypted at rest.
  tags: [security, encryption, bitlocker, luks, filevault, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: bitlocker
    action: state
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: volume
        type: string
        description: >-
          Per-OS volume identifier: drive letter on Windows, block-device basename on Linux, or the APFS volume's display label on macOS. Values: free text.
        example: "C:"
        platforms: [windows, linux, darwin]
      - name: conversion_status
        type: string
        description: >
          BitLocker's live conversion/encryption state for the volume,
          decoded from Win32_EncryptableVolume::GetConversionStatus().
          Populated only on Windows; Linux and macOS rows do not carry
          this field.
        values: [Fully Decrypted, Fully Encrypted, Encryption In Progress, Decryption In Progress, Encryption Paused, Decryption Paused, Unknown]
        example: "Fully Decrypted"
        platforms: [windows]
      - name: percentage_encrypted
        type: string
        description: >-
          Percentage of the volume currently encrypted, from BitLocker's EncryptionPercentage out-parameter. Populated only on Windows. Values: `<integer>%` or `unknown`.
        example: "0%"
        platforms: [windows]
      - name: encryption_method
        type: string
        description: >
          The disk-encryption cipher/mode BitLocker is using for the
          volume, from GetEncryptionMethod(). Populated only on Windows.
        values: [None, AES 128 with Diffuser, AES 256 with Diffuser, AES 128, AES 256, Hardware Encryption, XTS-AES 128, XTS-AES 256, Unknown]
        example: "None"
        platforms: [windows]
      - name: protection_status
        type: string
        description: >
          Whether BitLocker protection is currently on or off for the
          volume, from Win32_EncryptableVolume::ProtectionStatus.
          Populated only on Windows.
        values: [Protection On, Protection Off, Protection Unknown]
        example: "Protection Off"
        platforms: [windows]
    aggregation:
      groupBy: [protection_status]
      operations: [count]

  visualization:
    # bitlocker is a key|value-schema plugin — `result_parsing.hpp` splits
    # every output line into exactly two fields: a key (always "volume"
    # on this action) and the whole pipe-delimited descriptor as a
    # single value string. This means `labelField: 1` gives us one
    # bucket per distinct volume descriptor rather than per protection
    # status. Acceptable as a fleet-overview chart ("which BitLocker
    # volume descriptors do we see, and how many devices share each
    # one"), but a finer chart that pies just the protection_status
    # column would need either a plugin output change to emit one row
    # per (volume, status_field) pair, or a value-substring extractor on
    # the engine. Both are tracked under issue #626.
    type: pie
    processor: single_series
    title: BitLocker volumes seen across the fleet
    whereField: 0
    whereEquals: volume
    labelField: 1
    maxCategories: 8
    valueLabel: Volumes

  readablePayload: "Query disk encryption status"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [bitlocker]

status:
  phase: active
