## Host Vulnerability Scanning Definitions
## Collects a rich installed-software identity record for SERVER-SIDE
## vulnerability correlation (ADR-0018: the agent collects, never decides).
## Agent-side CVE matching + config-hardening checks were retired / split out.
## Plugin: vuln_scan | Actions: inventory

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.vuln_scan.inventory
  displayName: Software Identity Inventory
  version: 2.0.0
  description: >
    Collect the rich installed-software identity of the endpoint for
    server-side vulnerability correlation against NVD / OVAL / vendor VEX.
    Emits one record per package or application: on Linux the full package
    identity (ecosystem, name, epoch, version, release, arch, packager, and the
    stored signature status) plus the host distro from /etc/os-release; on
    Windows/macOS the application identity (name, publisher, version). Fields an
    ecosystem does not store are left empty. The agent performs no CVE matching
    itself — matching is server-authoritative (ADR-0018).
  tags: [security, vulnerability, inventory, software, nvd]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: vuln_scan
    action: inventory
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: kind
        type: string
      - name: ecosystem
        type: string
      - name: name
        type: string
      - name: epoch
        type: string
      - name: version
        type: string
      - name: release
        type: string
      - name: arch
        type: string
      - name: packager
        type: string
      - name: signature_status
        type: string
      - name: distro_id
        type: string
      - name: distro_version
        type: string
    aggregation:
      groupBy: [ecosystem]
      operations: [count]

  readablePayload: "Collect installed-software identity for vulnerability matching"

  gather:
    ttlSeconds: 600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.13.0
    requiredPlugins: [vuln_scan]

status:
  phase: active
