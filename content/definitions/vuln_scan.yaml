## Host Vulnerability Scanning Definitions
## Matches installed software against known CVEs and runs configuration
## compliance checks. Reports findings by severity.
## Plugin: vuln_scan | Actions: scan, cve_scan, config_scan, summary, inventory

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.vuln_scan.scan
  displayName: Full Vulnerability Scan
  version: 1.0.0
  description: >
    Run a full host vulnerability scan combining CVE matching and
    configuration compliance checks. CVE matching compares installed
    software versions against a built-in rule database. Configuration
    checks verify security hardening settings (firewall state, password
    policy, remote desktop config, etc.). Each finding is classified by
    severity (CRITICAL, HIGH, MEDIUM, LOW, INFO). Reports progress at
    0%, 50%, 90%, 100%.
  tags: [security, vulnerability, cve, compliance, audit]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: vuln_scan
    action: scan
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: severity
        type: string
        description: Finding severity assigned by the check that produced this row.
        values: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
        example: CRITICAL
        platforms: [windows, linux, darwin]
      - name: category
        type: string
        description: Which half of the scan produced this row.
        values: [cve, config, scan]
        example: cve
        platforms: [windows, linux, darwin]
      - name: title
        type: string
        description: >
          For a cve row, "<CVE-ID>: <description>" from the matched rule; for a config row,
          the name of the compliance check; "No vulnerabilities" on the single placeholder row
          emitted when a run finds nothing.
        values: free text
        example: "CVE-2021-34527: PrintNightmare: RCE via Windows Print Spooler"
        platforms: [windows, linux, darwin]
      - name: detail
        type: string
        description: >
          For a cve row, "<installed product> <version> (fixed in <fixed_ver>)"; for a config
          row, the check's human-readable result text.
        values: free text
        example: "Microsoft Windows Desktop Runtime - 6.0.11 (x64) 6.0.11.31823 (fixed in KB5004945)"
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy: [severity, category]
      operations: [count]

  visualization:
    # vuln_scan emits one row per finding on `scan`, format
    # `severity|category|title|detail`. labelField=0 picks severity so
    # CRITICAL / HIGH / MEDIUM / LOW / INFO each become a pie slice and
    # findings are counted into them. Preferred over the summary action's
    # pie because summary also emits a TOTAL row that would dominate the
    # chart.
    type: pie
    processor: single_series
    title: Vulnerabilities by severity
    labelField: 0
    valueLabel: Findings

  readablePayload: "Run full vulnerability scan (CVE + configuration)"

  gather:
    ttlSeconds: 600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [vuln_scan]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.vuln_scan.cve_scan
  displayName: CVE Vulnerability Scan
  version: 1.0.0
  description: >
    Scan installed software against known CVE rules. Enumerates installed
    applications (registry on Windows, dpkg/rpm/pacman on Linux,
    system_profiler/brew on macOS) and compares versions against the
    built-in CVE database. Returns only CVE findings, not configuration
    checks. Use the full "scan" action for combined results.
  tags: [security, vulnerability, cve, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: vuln_scan
    action: cve_scan
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: severity
        type: string
        description: Finding severity assigned by the CVE rule that matched.
        values: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
        example: HIGH
        platforms: [windows, linux, darwin]
      - name: category
        type: string
        description: Always "cve" for a match; "scan" on the single placeholder row emitted when nothing matches.
        values: [cve, scan]
        example: cve
        platforms: [windows, linux, darwin]
      - name: title
        type: string
        description: >
          "<CVE-ID>: <description>" from the matched rule, or "No vulnerabilities" on the
          placeholder row.
        values: free text
        example: "CVE-2023-24329: urllib.parse URL parsing bypass via leading whitespace"
        platforms: [windows, linux, darwin]
      - name: detail
        type: string
        description: "<installed product> <version> (fixed in <fixed_ver>)."
        values: free text
        example: "Python 3.9.6 (fixed in 3.11.4)"
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy: [severity]
      operations: [count]

  readablePayload: "Run CVE vulnerability scan"

  gather:
    ttlSeconds: 600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [vuln_scan]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.vuln_scan.config_scan
  displayName: Configuration Compliance Scan
  version: 1.0.0
  description: >
    Run security configuration compliance checks on the endpoint.
    Verifies settings such as firewall state, password policy,
    remote desktop configuration, and other hardening baselines.
    Returns findings classified by severity. Does not include CVE
    matching; use the full "scan" action for combined results.
  tags: [security, compliance, configuration, hardening]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: vuln_scan
    action: config_scan
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: severity
        type: string
        description: Finding severity assigned by the compliance check that produced this row.
        values: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
        example: HIGH
        platforms: [windows, linux, darwin]
      - name: category
        type: string
        description: Always "config" for this action; "scan" only on the placeholder row emitted when there is nothing to report.
        values: [config, scan]
        example: config
        platforms: [windows, linux, darwin]
      - name: title
        type: string
        description: The name of the compliance check, e.g. the setting it inspects.
        values: free text
        example: "SMBv1 Protocol"
        platforms: [windows, linux, darwin]
      - name: detail
        type: string
        description: The check's human-readable result text, including why a failing check failed.
        values: free text
        example: "Enabled - vulnerable to EternalBlue/WannaCry (MS17-010)"
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy: [severity]
      operations: [count]

  readablePayload: "Run configuration compliance scan"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [vuln_scan]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.vuln_scan.summary
  displayName: Vulnerability Scan Summary
  version: 1.0.0
  description: >
    Run a full vulnerability scan (CVE + configuration) and return
    only the severity summary counts. Provides a quick overview of
    the endpoint's security posture without the full finding details.
    Returns total findings, total issues, and per-severity counts
    (CRITICAL, HIGH, MEDIUM, LOW, INFO).
  tags: [security, vulnerability, compliance, dashboard]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: vuln_scan
    action: summary
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: severity
        type: string
        description: >
          The severity this row counts, or the literal "TOTAL" for the first row emitted by
          every run.
        values: [TOTAL, CRITICAL, HIGH, MEDIUM, LOW, INFO]
        example: CRITICAL
        platforms: [windows, linux, darwin]
      - name: count
        type: int32
        description: >
          The number of findings at this severity. The TOTAL row is an exception: despite the
          declared int32 type, that row's cell holds the formatted string
          "<n> findings (<n> issues)", not an integer.
        values: integer, except a formatted string on the TOTAL row
        example: "17"
        platforms: [windows, linux, darwin]

  readablePayload: "Get vulnerability scan summary"

  gather:
    ttlSeconds: 600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [vuln_scan]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.vuln_scan.inventory
  displayName: Software Inventory for NVD Matching
  version: 1.0.0
  description: >
    Return the raw installed software inventory (name and version pairs)
    for server-side NVD matching. This is a lightweight alternative to
    client-side CVE scanning that enables the server to perform
    centralized vulnerability correlation against the full NVD database.
  tags: [security, vulnerability, inventory, software]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: vuln_scan
    action: inventory
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: name
        type: string
        description: Installed application or package name, as reported by the OS's own inventory source.
        values: free text
        example: curl
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: >
          Installed version string, or empty when the source reports none (e.g. a Windows
          uninstall entry with no DisplayVersion).
        values: free text, or empty
        example: "8.14.1-2+deb13u4"
        platforms: [windows, linux, darwin]

  readablePayload: "Collect software inventory for NVD matching"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [vuln_scan]

status:
  phase: active
