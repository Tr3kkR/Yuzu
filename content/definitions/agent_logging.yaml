## Agent Logging Plugin Definitions
## Provides remote access to agent log files and lists key agent files
## with their sizes and modification timestamps.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.agent_logging.get_log
  displayName: Agent Log Tail
  version: 1.0.0
  description: >
    Returns the last N lines of the agent's log file. The log file
    path is discovered from agent config (agent.log_file or
    agent.data_dir), falling back to platform default paths
    (/var/log/yuzu or /opt/yuzu on Linux, /Library/Application
    Support/Yuzu or /var/log/yuzu on macOS, ProgramData/Yuzu on
    Windows). Returns status|empty with zero lines when no log file
    resolves on this host. The number of lines is configurable
    (default 50, max 500).
  tags: [diagnostics, logging, agent]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: agent_logging
    action: get_log
    concurrency: per-device

  parameters:
    type: object
    properties:
      lines:
        type: int32
        description: >
          Number of trailing log lines to return, 1-500 (e.g. 100).
          Defaults to 50; values above 500 are clamped, values below
          1 are rejected with a status|error result.
        default: 50
        minimum: 1
        maximum: 500

  result:
    columns:
      - name: log_file
        type: string
        description: >
          Absolute path to the log file that was read; the field is
          omitted from the output entirely when no log file resolves
          on this host.
        values: absolute path, or field absent
        example: field omitted in every captured sample — no capture has resolved a log file (see status|empty)
        platforms: [windows, linux, darwin]
      - name: line_count
        type: int32
        description: Count of line entries returned; 0 when no log file resolves.
        values: non-negative integer
        example: "0"
        platforms: [windows, linux, darwin]
      - name: line
        type: string
        description: >
          One raw line from the tailed log file, unescaped and in
          file order; omitted entirely when no log file resolves.
        values: free text, or field absent
        example: field omitted in every captured sample — no capture has resolved a log file
        platforms: [windows, linux, darwin]

  readablePayload: "Get last {{lines}} lines of agent log"

  gather:
    ttlSeconds: 30

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [agent_logging]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.agent_logging.get_key_files
  displayName: Agent Key Files
  version: 1.0.0
  description: >
    Lists important agent files — the agent executable, log files,
    config files, data stores, plugins, and TLS certificates — with
    their absolute paths, sizes in bytes, and last-modified timestamps
    (as Unix epoch seconds). Useful for remote diagnostics and
    inventory of agent deployment state.
  tags: [diagnostics, inventory, agent]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: agent_logging
    action: get_key_files
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: path
        type: string
        description: >
          Absolute path of a discovered agent file (executable, log
          file, config file, data store, plugin file, or TLS
          certificate/key).
        values: absolute path
        example: "/private/tmp/claude-501/-Users-alex-yuzu-dev/8d89cd79-001b-4ea8-8930-0c9affb3265e/scratchpad/d2/plugin_capture"
        platforms: [windows, linux, darwin]
      - name: size
        type: int64
        description: File size in bytes; 0 if the size read failed.
        values: non-negative integer (bytes)
        example: "142208"
        platforms: [windows, linux, darwin]
      - name: modified
        type: int64
        description: Last-write time as Unix epoch seconds; 0 if the mtime read failed.
        values: non-negative integer (unix epoch seconds)
        example: "1788774907"
        platforms: [windows, linux, darwin]

  readablePayload: "List agent key files"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [agent_logging]

status:
  phase: active
