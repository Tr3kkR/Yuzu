apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.key_exists
  displayName: Check Registry Key Exists
  version: 1.0.0
  description: >
    Check whether a registry key exists, without reading any of its values.
    Windows-only.
  tags: [registry, windows, configuration]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: key_exists
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key]
    properties:
      hive:
        type: string
        displayName: Registry Hive
        description: >
          Registry hive to check, e.g. "HKLM".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path relative to the hive root.
  result:
    columns:
      - name: exists
        type: bool
        description: 'Whether the key could be opened for read. Values: true, false.'
        example: "true"
        platforms: [windows]
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.enumerate_values
  displayName: Enumerate Registry Values
  version: 1.0.0
  description: >
    List all value names and types under a Windows registry key, one row
    per value. Value data itself is not returned — use get_value to read a
    specific value. Windows-only.
  tags: [registry, windows]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: enumerate_values
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key]
    properties:
      hive:
        type: string
        displayName: Registry Hive
        description: >
          Registry hive to enumerate, e.g. "HKLM".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path relative to the hive root.
  result:
    columns:
      - name: name
        type: string
        description: >-
          The value's name; zero rows means the key has no values. Values: free text.
        example: "ProductName"
        platforms: [windows]
      - name: type
        type: string
        description: >-
          The value's registry type, named via the shared type table shared with get_value and get_user_value. Values: REG_SZ, REG_EXPAND_SZ, REG_DWORD, REG_QWORD, REG_BINARY, REG_MULTI_SZ, REG_NONE, REG_LINK, REG_DWORD_BIG_ENDIAN, REG_UNKNOWN.
        example: "REG_SZ"
        platforms: [windows]
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [registry]
status:
  phase: active
