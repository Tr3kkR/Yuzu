## Windows Registry Plugin Definitions

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.get_value
  displayName: Get Registry Value
  version: 1.0.0
  description: >
    Read a value from the Windows registry.
  tags: [registry, windows, configuration]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: get_value
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key, name]
    properties:
      hive:
        type: string
        displayName: Registry Hive
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
      name:
        type: string
        displayName: Value Name
  result:
    columns:
      - name: value
        type: string
      - name: type
        type: string
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.get_user_value
  displayName: Get Per-User Registry Value
  version: 1.2.0
  description: >
    Read a registry value from a specific user's registry hive. Resolves
    the target profile via ProfileList (by username or an explicit SID),
    then reads the live HKEY_USERS\<SID> hive if the user is logged in,
    or loads that profile's NTUSER.DAT via RegLoadKey as a fallback.
    SeBackupPrivilege and SeRestorePrivilege are required only for the
    offline fallback when the target user is not logged in; reading an
    already-loaded live hive needs no elevated privilege. Windows-only.
  tags: [registry, windows, per-user, configuration]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: get_user_value
    concurrency: per-device
  parameters:
    type: object
    required: [key]
    properties:
      username:
        type: string
        displayName: Username
        description: >
          Windows profile folder name to resolve via ProfileList (see
          list_profiles), matched case-insensitively. This is not always
          the same as the account name (renamed accounts, domain profiles).
          Either username or sid is required; sid takes precedence if both
          are given.
        validation:
          maxLength: 256
      sid:
        type: string
        displayName: User SID
        description: >
          Windows security identifier (e.g.,
          "S-1-5-21-...-1001") of the target profile, as an alternative to
          username. Must match one of the profiles list_profiles would
          report; a sid not found there is rejected. Either username or sid
          is required.
        validation:
          maxLength: 256
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path relative to the resolved user's hive root
          (e.g., "Software\\Microsoft\\Windows\\CurrentVersion\\Explorer").
        validation:
          maxLength: 1024
      name:
        type: string
        displayName: Value Name
        description: The registry value name to read.
        validation:
          maxLength: 256
  result:
    columns:
      - name: username
        type: string
      - name: value
        type: string
      - name: type
        type: string
  readablePayload: "Read registry value '${name}' from user '${username}' key '${key}'"
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.13.1
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.list_profiles
  displayName: List User Profiles
  version: 1.0.0
  description: >
    Enumerate local Windows user profiles from
    HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList: SID,
    resolved profile name, profile path, and whether the profile's
    registry hive is currently loaded under HKEY_USERS. System profiles
    (LocalSystem, LocalService, NetworkService) are excluded. Windows-only.
  tags: [registry, windows, users, per-user]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: list_profiles
    concurrency: per-device
  parameters:
    type: object
    required: []
    properties: {}
  result:
    columns:
      - name: sid
        type: string
      - name: profile_name
        type: string
      - name: profile_path
        type: string
      - name: hive_state
        type: string
  readablePayload: "List local user profiles"
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.13.1
    requiredPlugins: [registry]
status:
  phase: active

