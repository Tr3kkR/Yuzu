## Remote Desktop (RDP) Control Plugin Definitions
#
# Built for change-gated remote access: an ITSM system (e.g. ServiceNow)
# enables RDP on two devices at the start of an approved change window and
# disables it again at the end. The agent service account must be a member of
# the local Administrators group. Intended least-privilege model:
# NT SERVICE\YuzuAgent, not in Administrators, needs an out-of-band grant.
# Current actual state: the service registers as LocalSystem (#1442), so this
# succeeds with no extra grant. A non-elevated agent returns reg_status|error:5
# on every set_state.
#
# ENFORCEMENT REALITY (read before relying on the gate below, #1398): two
# independent controls now cover EVERY dispatch path -- the governed
# POST /api/instructions/{id}/execute path AND raw dispatch
# (POST /api/command, MCP execute_instruction, dashboard, workflow, schedule).
# (1) RBAC: rdp_control.set_state classifies as `Security:Write` in the
# compiled capability catalogue (capability_decls/plugin_action_catalogue_c.hpp)
# -- NOT the generic `Execution:Execute` -- so a caller needs the narrower
# `Security:Write` grant, checked at the one dispatch chokepoint
# (classify_and_authorize_dispatch) every surface funnels through.
# (2) Approval: this pair's compiled ExecuteGate is `AdminOrApproval`, derived
# strictest-wins from this definition's `approval.mode: role-gated` -- a
# non-admin caller without a proven approval decision (a consumed ticket, or
# an equivalent governed pipeline) is denied `ApprovalRequired` at that same
# chokepoint, on raw dispatch exactly as on the governed path.
# `executeRoles` below remains advisory only -- it is not consumed by the
# server (embed_content.py drops the whole `permissions` block at build time)
# and `endpoint-admin` is a content-convention label, not a server RBAC role
# (those are Administrator/PlatformEngineer/Operator/ApiTokenManager/
# ITServiceOwner/Viewer/Reviewer). Actual enforcement is entirely the two
# controls above. Keep the Guardian fDenyTSConnections backstop deployed
# regardless -- defense in depth, not a substitute for either control.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.rdp.set_state
  displayName: Enable/Disable Remote Desktop
  version: 1.0.0
  description: >
    Enable or disable Remote Desktop (RDP) on a Windows endpoint. Enable sets
    HKLM fDenyTSConnections=0, enables the built-in Remote Desktop firewall
    rule group, and starts TermService. Disable sets fDenyTSConnections=1 and
    disables the firewall rule group (the service is left running; the
    registry and firewall gates block new connections). Per-step status is
    reported; overall=ok only when every step succeeded — callers must retry
    until confirmed, especially on disable. NOTE: disable blocks NEW
    connections only; it does not terminate an already-established RDP session.
  tags: [rdp, remote-desktop, windows, configuration, change-window]
spec:
  type: action
  platforms: [windows]
  execution:
    plugin: rdp_control
    action: set_state
    concurrency: per-device
  parameters:
    type: object
    required: [state]
    properties:
      state:
        type: string
        displayName: RDP State
        description: >
          enable allows Remote Desktop connections; disable blocks them
          (e.g. state: enable).
        validation:
          enum: ["enable", "disable"]
  result:
    columns:
      - name: reg_status
        type: string
        description: 'Outcome of writing HKLM fDenyTSConnections; ok or a Win32 error code. Values: ok, error:<win32 code> (e.g. error:5 = ERROR_ACCESS_DENIED).'
        example: "not observed in any capture" # only the rejection path was run
        platforms: [windows]
      - name: firewall_status
        type: string
        description: 'Outcome of toggling the Remote Desktop firewall rule group via INetFwPolicy2. Values: ok, error:com_init, error:group_not_found, error:0x<hresult>.'
        example: "not observed in any capture"
        platforms: [windows]
      - name: service_status
        type: string
        description: 'TermService outcome — running once start is confirmed by polling (enable), untouched (disable), or a Win32 error. Values: running, untouched, error:<win32 code>.'
        example: "not observed in any capture"
        platforms: [windows]
      - name: overall
        type: string
        description: 'Terminal verdict for the whole set_state call; ok only when every step above succeeded. Values: ok, error.'
        example: "not observed in any capture"
        platforms: [windows]
  readablePayload: "Set Remote Desktop state to ${state}"
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [rdp_control]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.rdp.status
  displayName: Remote Desktop Status
  version: 1.0.0
  description: >
    Report the current Remote Desktop posture of a Windows endpoint:
    fDenyTSConnections registry value, Remote Desktop firewall rule group
    state, TermService state, and the derived rdp verdict. rdp=on only when
    all three gates are readable and open; rdp=unknown when any gate could not
    be read (e.g. a non-elevated agent); rdp=off when all gates are readable
    but at least one is closed. A non-zero command exit code also signals an
    unreadable gate — callers verifying a state change should check the exit
    code and the per-gate rows, not the rdp summary alone. SCOPE: the firewall
    check covers only the built-in Remote Desktop rule group; a custom inbound
    3389 allow-rule is out of scope, so rdp=off means "at least one MANAGED gate
    is closed", not "3389 is unreachable by every possible rule".
  tags: [rdp, remote-desktop, windows, posture]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: rdp_control
    action: status
    concurrency: per-device
  result:
    columns:
      - name: deny_ts_connections
        type: string
        description: 'Raw fDenyTSConnections registry value (0 = RDP allowed, 1 = RDP denied), or a Win32 error if the read failed. Values: 0, 1, error:<win32 code>.'
        example: "0"
        platforms: [windows]
      - name: firewall_group
        type: string
        description: 'Whether the Remote Desktop firewall rule group is enabled, or why it could not be read. Values: enabled, disabled, group_not_found, error:com_init, error:0x<hresult>.'
        example: "enabled"
        platforms: [windows]
      - name: term_service
        type: string
        description: 'Current SCM state name for TermService, or a Win32 error if the query failed. Values: running, start_pending, stopped, stop_pending, paused, pause_pending, continue_pending, unknown, error:<win32 code>.'
        example: "not observed in any capture"
        platforms: [windows]
      - name: rdp
        type: string
        description: 'Derived RDP posture — on only when all three gates are readable and open, unknown when any gate could not be read, off otherwise. Values: on, off, unknown.'
        example: "on"
        platforms: [windows]
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [rdp_control]
status:
  phase: active
