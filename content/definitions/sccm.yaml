## SCCM / ConfigMgr Client Info Definitions (Windows-only)
## Reports SCCM client installation status, version, service state,
## and site assignment details.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.sccm.client_version
  displayName: SCCM Client Version
  version: 1.0.0
  description: >
    Check whether the SCCM/ConfigMgr client is installed, report its
    version from the registry, and check the CcmExec service status.
    Returns installed flag, version string, and service state. Useful
    for compliance verification that endpoints have the configuration
    management agent deployed.
  tags: [security, sccm, compliance, inventory]

spec:
  type: question
  platforms: [windows]

  execution:
    plugin: sccm
    action: client_version
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: installed
        type: bool
        description: 'Whether the registry reports a ProductVersion for the SCCM client (Windows only; always false off-Windows). Values: true, false.'
        example: "false"
        platforms: [windows, linux]
      - name: version
        type: string
        description: 'The installed SCCM client version from HKLM\SOFTWARE\Microsoft\SMS\Mobile Client\ProductVersion, or "-" if not present. Values: free text or "-".'
        example: "-"
        platforms: [windows]
      - name: service_status
        type: string
        description: 'The ccmexec Windows service state from a live SCM query (OpenSCManagerW/OpenServiceW/QueryServiceStatusEx). Values: running, stopped, exists, not_found, unavailable.'
        example: not_found
        platforms: [windows]

  readablePayload: "Query SCCM client version and status"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [sccm]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.sccm.site
  displayName: SCCM Site Assignment
  version: 1.0.0
  description: >
    Retrieve the SCCM site assignment details including the assigned site
    code and current management point. Reads from the registry first,
    falling back to the COM object via PowerShell if registry values are
    not present.
  tags: [security, sccm, compliance, inventory]

spec:
  type: question
  platforms: [windows]

  execution:
    plugin: sccm
    action: site
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: site_code
        type: string
        description: 'The assigned SCCM site code, from the registry, the enumerated CCM\Authority subkey, or the Microsoft.SMS.Client COM fallback; "not_configured" if none resolve. Values: free text or not_configured.'
        example: not_configured
        platforms: [windows]
      - name: management_point
        type: string
        description: 'The current SCCM management point hostname, from the registry, the enumerated CCM\Authority subkey, or the Microsoft.SMS.Client COM fallback; "unknown" if none resolve. Values: free text or unknown.'
        example: unknown
        platforms: [windows]

  readablePayload: "Query SCCM site assignment"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [sccm]

status:
  phase: active
