## Agent Diagnostics Plugin Definitions
## Provides log-level inspection, TLS certificate status, and detailed
## gRPC connection diagnostics from the agent.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.diagnostics.log_level
  displayName: Current Log Level
  version: 1.0.0
  description: >
    Reads the agent's current log level from the config context. Returns
    the spdlog level string (trace, debug, info, warn, error, critical,
    off). Defaults to "info" if not explicitly configured.
  tags: [diagnostics, logging]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: diagnostics
    action: log_level
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: log_level
        type: string
        description: The agent's current spdlog log level, read verbatim from agent.log_level.
        values: [trace, debug, info, warn, error, critical, 'off']
        example: "info"
        platforms: [windows, linux, darwin]

  readablePayload: "Get current log level"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [diagnostics]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.diagnostics.certificates
  displayName: TLS Certificate Status
  version: 1.0.0
  description: >
    Lists the configured TLS certificate paths (CA cert, client cert,
    client key) and whether each file exists on the endpoint's
    filesystem. Useful for diagnosing mTLS connectivity issues.
  tags: [diagnostics, tls, security]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: diagnostics
    action: certificates
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: cert_type
        type: string
        description: Which certificate/key slot this row reports.
        values: [ca_cert, client_cert, client_key]
        example: "ca_cert"
        platforms: [windows, linux, darwin]
      - name: path
        type: string
        description: "Filesystem path configured for this slot's config key, or the literal \"(not configured)\" when unset. Values: free text (path) or \"(not configured)\"."
        example: "(not configured)"
        platforms: [windows, linux, darwin]
      - name: exists
        type: bool
        description: Whether std::filesystem::exists() found a file at path; always false when path is unconfigured.
        example: "false"
        platforms: [windows, linux, darwin]

  readablePayload: "Check TLS certificate status"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [diagnostics]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.diagnostics.connection_info
  displayName: Connection Diagnostics
  version: 1.0.0
  description: >
    Returns detailed gRPC connection diagnostics: server address, TLS
    status, session ID, gRPC channel state, reconnect count, round-trip
    latency in milliseconds, agent uptime in seconds, and the
    connected_since timestamp.
  tags: [diagnostics, connection, health]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: diagnostics
    action: connection_info
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: server_address
        type: string
        description: 'gRPC server endpoint the agent is configured to connect to, or the literal "(not configured)" when unset. Values: free text (host:port) or "(not configured)".'
        example: "(not configured)"
        platforms: [windows, linux, darwin]
      - name: tls_enabled
        type: bool
        description: Whether mTLS is enabled for the agent's server connection, read from tls.enabled; false when unset.
        example: "false"
        platforms: [windows, linux, darwin]
      - name: session_id
        type: string
        description: 'Current gRPC session identifier (the live agent session credential), or the literal "(none)" when there is no active session. Values: free text or "(none)".'
        example: "(none)"
        platforms: [windows, linux, darwin]
      - name: grpc_channel_state
        type: string
        description: 'Current gRPC channel connectivity state, read verbatim from agent.grpc_channel_state, or "unknown" when unset. Values: free text (e.g. READY, CONNECTING, TRANSIENT_FAILURE) or "unknown".'
        example: "unknown"
        platforms: [windows, linux, darwin]
      - name: reconnect_count
        type: int32
        description: 'Number of times the agent has reconnected to the server since startup; 0 when unset. Values: integer >= 0.'
        example: "0"
        platforms: [windows, linux, darwin]
      - name: latency_ms
        type: int32
        description: 'Last measured round-trip latency to the server in milliseconds; 0 when unset. Values: integer >= 0.'
        example: "0"
        platforms: [windows, linux, darwin]
      - name: uptime_seconds
        type: int64
        description: 'Seconds since agent.start_time_epoch, computed at read time; 0 when start_time_epoch is unset or unparsable. Values: integer >= 0.'
        example: "0"
        platforms: [windows, linux, darwin]
      - name: connected_since
        type: string
        description: 'Unix epoch timestamp (as a string) of when the current connection was established, or "0" when unset. Values: free text (epoch seconds) or "0".'
        example: "0"
        platforms: [windows, linux, darwin]

  readablePayload: "Get connection diagnostics"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [diagnostics]

status:
  phase: active
