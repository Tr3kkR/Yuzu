## Runtimes Definitions
## Reports installed .NET (Core/5+), JVM and Python runtimes. Read-only, zero subprocess.
## Plugin: runtimes | Actions: dotnet, jvm, python
##
## SHIPPED LEG: Linux only, rung 1 (directory names and metadata-file reads;
## no `java`, `dotnet` or `python3` process is ever started).
##   Linux:   /usr/share/dotnet, /usr/lib/dotnet, /usr/lib64/dotnet shared/<framework>/<version>
##            and sdk/<version> directory walk (dotnet);
##            /usr/lib/jvm/*/release + /opt/java/*/release file reads (jvm);
##            /usr/bin/python3* names + /usr/lib/python3*, /usr/local/lib/python3* directory
##            walk (python).
##
## macOS AND WINDOWS: planned — follows as its own PR (peripherals PR9.1a2 precedent).
## Until then every action on those hosts answers a single
## `status|<action>|unsupported|<macos|windows>:planned` row. The planned mechanisms
## are declared in the plugin descriptor (runtimes_plugin.cpp):
##   macOS:   /usr/local/share/dotnet/shared walk (dotnet);
##            /Library/Java/JavaVirtualMachines/*/Contents/Info.plist JavaVM dict +
##            Contents/Home/release (jvm);
##            /Library/Frameworks + CommandLineTools Python3.framework Versions +
##            Cellar/python@3.* (python).
##   Windows: NDP release-key table + dotnet InstalledVersions + Program Files walk (dotnet);
##            JavaSoft keys + Program Files\Java walk (jvm);
##            PEP 514 PythonCore keys (python).
##
## Every action's output is: one `status|<action>|<level>|<reason>` row FIRST, then zero or
## more `<action>|<flavour>|<version>|<install_path>|<vendor>` rows. A `supported` status
## with zero data rows means the runtime family is genuinely absent from the host; a
## `constrained` status means a read failed and the rows may be incomplete — failure never
## reads as absent.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.runtimes.dotnet
  displayName: .NET Runtime Inventory
  version: 1.0.0
  description: >
    Reports installed .NET (Core/5+) shared frameworks and SDKs on Linux: one
    row per framework version or SDK version found under the standard install
    roots (flavour, version, install path), from directory names only — no
    `dotnet` process is started. A `supported` status with no rows means none
    is installed; a `constrained` status means a read failed and the list may
    be incomplete. macOS and Windows: planned — follows as its own PR
    (peripherals PR9.1a2 precedent); those hosts answer a single
    `status|dotnet|unsupported|<macos|windows>:planned` row.
  tags: [runtimes, dotnet, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: runtimes
    action: dotnet
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # status|dotnet|<level>|<reason>   (always first)
    # dotnet|<flavour>|<version>|<install_path>|<vendor or ->
    columns:
      - name: flavour
        type: string
        description: 'Runtime kind. Values: core (a Microsoft.NETCore.App, Microsoft.AspNetCore.App or Microsoft.WindowsDesktop.App shared framework), sdk (an SDK install), unmodelled (any other shared-framework name — reported, never dropped).'
        values: [core, sdk, unmodelled]
        example: core
        platforms: [linux]
      - name: version
        type: string
        description: 'Version taken from the install directory name (e.g. 8.0.31, or a preview build such as 9.0.100-preview.1.24101.2).'
        example: 8.0.31
        platforms: [linux]
      - name: install_path
        type: string
        description: 'Absolute path of the framework or SDK version directory the version was read from.'
        example: /usr/share/dotnet/shared/Microsoft.NETCore.App/8.0.31
        platforms: [linux]
      - name: vendor
        type: string
        description: 'Always "-" for dotnet: the install tree carries no vendor field.'
        example: "-"
        platforms: [linux]

  readablePayload: "List installed .NET runtimes"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [runtimes]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.runtimes.jvm
  displayName: JVM Inventory
  version: 1.0.0
  description: >
    Reports installed Java runtimes on Linux: one row per JDK/JRE home that
    carries a `release` metadata file (under /usr/lib/jvm/* and /opt/java/*) —
    flavour (jdk, jre, unmodelled), version, install path and vendor (the
    `IMPLEMENTOR` value, e.g. Eclipse Adoptium vs Debian vs Oracle, which is what
    tells an OpenJDK build from an Oracle JDK). No `java` process is started.
    A `supported` status with no rows means none is installed; a `constrained`
    status means a read failed and the list may be incomplete. macOS and Windows:
    planned — follows as its own PR (peripherals PR9.1a2 precedent); those hosts
    answer a single `status|jvm|unsupported|<macos|windows>:planned` row.
  tags: [runtimes, jvm, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: runtimes
    action: jvm
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # status|jvm|<level>|<reason>   (always first)
    # jvm|<flavour>|<version>|<install_path>|<vendor or ->
    columns:
      - name: flavour
        type: string
        description: 'Image kind from the IMAGE_TYPE key of the release file. Values: jdk, jre, unmodelled (the file does not say — the Debian OpenJDK release file has no IMAGE_TYPE — and the path gives no hint; never guessed).'
        values: [jdk, jre, unmodelled]
        example: jdk
        platforms: [linux]
      - name: version
        type: string
        description: 'JAVA_VERSION from the release file, falling back to JAVA_RUNTIME_VERSION; "-" when neither is present.'
        example: 17.0.20
        platforms: [linux]
      - name: install_path
        type: string
        description: 'Absolute path of the JVM home directory (the directory holding the release file).'
        example: /opt/java/openjdk
        platforms: [linux]
      - name: vendor
        type: string
        description: 'IMPLEMENTOR from the release file (e.g. Eclipse Adoptium, Debian), or "-" when the key is absent.'
        example: Eclipse Adoptium
        platforms: [linux]

  readablePayload: "List installed JVMs"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [runtimes]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.runtimes.python
  displayName: Python Interpreter Inventory
  version: 1.0.0
  description: >
    Reports installed CPython interpreters on Linux: one row per python3 /
    python3.<minor> name in /usr/bin (a symlink is reported as the path it
    points at) and one per python3.<minor> library directory under /usr/lib and
    /usr/local/lib — flavour (cpython, unmodelled), version, install path. One
    interpreter can therefore appear as more than one row (binary and library
    directory), each with its own install path. No `python3` process is
    started. A `supported` status with no rows means none is installed; a
    `constrained` status means a read failed and the list may be incomplete.
    macOS and Windows: planned — follows as its own PR (peripherals PR9.1a2
    precedent); those hosts answer a single
    `status|python|unsupported|<macos|windows>:planned` row.
  tags: [runtimes, python, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: runtimes
    action: python
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # status|python|<level>|<reason>   (always first)
    # python|<flavour>|<version>|<install_path>|<vendor or ->
    columns:
      - name: flavour
        type: string
        description: 'Interpreter kind. Values: cpython (the name parses as python3 or python3.<minor>), unmodelled (a link to any other interpreter name, e.g. pypy3 — reported with version "-", never guessed to be CPython).'
        values: [cpython, unmodelled]
        example: cpython
        platforms: [linux]
      - name: version
        type: string
        description: 'Version parsed from the interpreter name (3, 3.11 or 3.11.4 shapes); "-" for an unmodelled interpreter.'
        example: "3.11"
        platforms: [linux]
      - name: install_path
        type: string
        description: 'Interpreter path (a symlink is reported as its link target, lexically joined and never resolved) or the python3.<minor> library directory path.'
        example: /usr/bin/python3.11
        platforms: [linux]
      - name: vendor
        type: string
        description: 'Always "-" for python: the interpreter name carries no vendor.'
        example: "-"
        platforms: [linux]

  readablePayload: "List installed Python interpreters"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [runtimes]

status:
  phase: active
