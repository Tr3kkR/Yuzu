## Antivirus Product Detection Definitions
## Detects installed antivirus products and queries Windows Defender status.
## Plugin: antivirus | Actions: products, status, av_exclusions
##
## Sources by platform:
##   Windows: WMI SecurityCenter2 (products), Get-MpComputerStatus (Defender),
##            registry (av_exclusions — Defender exclusion lists)
##   Linux:   Process detection for ClamAV, CrowdStrike Falcon, Sophos
##   macOS:   products: XProtect.bundle version probe + endpoint-security
##            system extensions (systemextensionsctl), process fallback;
##            status: XProtect definition version/freshness + Remediator/MRT

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.antivirus.products
  displayName: List Antivirus Products
  version: 1.2.0
  description: >
    Enumerate installed antivirus products on the endpoint. On Windows,
    queries WMI SecurityCenter2 for registered AV products and decodes
    each productState into a protection state (enabled, snoozed, or
    disabled) plus a definitions-freshness field (current or stale) —
    the Windows-only third column below; older agents passed the raw
    productState code through as the state. On Linux, checks for
    running ClamAV (clamd), CrowdStrike Falcon (falcon-sensor), and
    Sophos processes or installation directories. On macOS, probes the
    XProtect definition bundle (an xprotect_version row rides alongside;
    state reads unknown when the bundle is unreadable, never assumed
    active) and enumerates endpoint-security system extensions for
    third-party EDR/AV (an edr row carries bundle id and version), with
    process detection as a fallback. Older agents report XProtect as
    unconditionally active and detect third parties by process only, so
    a mixed fleet shows both shapes until fully upgraded.
  tags: [security, antivirus, compliance, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: antivirus
    action: products
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: name
        type: string
      - name: state
        type: string # Windows: enabled | snoozed | disabled (decoded
                      # productState). Linux/macOS: presence/liveness tokens
                      # (running, installed, active, unknown), as before.
      - name: definitions
        type: string # Windows-only: current | stale (productState low
                      # byte). Linux/macOS rows carry only name+state — a
                      # 3-field `av|<name>|<state>` line — so this column is
                      # absent (not blank) off Windows.
    aggregation:
      groupBy: [name]
      operations: [count]

  readablePayload: "List installed antivirus products"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [antivirus]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.antivirus.defender_status
  displayName: Windows Defender Status
  version: 1.1.0
  description: >
    Query the detailed status of Windows Defender on a Windows endpoint.
    Reports real-time protection state, antivirus signature version,
    last signature update time, and last quick scan completion time.
    Returns "not_available" on Linux; macOS reports XProtect data via
    security.antivirus.xprotect_status instead.
  tags: [security, antivirus, defender, compliance, windows]

spec:
  type: question
  platforms: [windows]

  execution:
    plugin: antivirus
    action: status
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: realtime_protection
        type: string
      - name: definition_version
        type: string
      - name: last_update
        type: string
      - name: last_quick_scan
        type: string

  visualization:
    # The Defender plugin emits one row per status field as
    # `<key>|<value>` (e.g. `realtime_protection|enabled`,
    # `definition_version|1.449.353.0`, …). Filter to just the
    # real-time-protection rows, then label by their value.
    type: pie
    processor: single_series
    title: Defender real-time protection across the fleet
    whereField: 0
    whereEquals: realtime_protection
    labelField: 1
    valueLabel: Devices

  readablePayload: "Query Windows Defender status"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [antivirus]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.antivirus.xprotect_status
  displayName: XProtect Status
  version: 1.0.0
  description: >
    Query the built-in macOS malware-protection status. Reports the
    XProtect definition version (from the XProtect.bundle), the
    definition freshness (bundle modification time), and the XProtect
    Remediator and MRT engine versions. Emits status "unknown" when the
    definition bundle is unreadable — never an assumed-healthy value. No
    real-time-protection row is reported: macOS exposes no queryable
    equivalent, and antivirus plugin versions older than 0.2.0 answer
    "not_available".
  tags: [security, antivirus, xprotect, compliance, macos]

spec:
  type: question
  platforms: [darwin]

  execution:
    plugin: antivirus
    action: status
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: definition_version
        type: string
      - name: last_update
        type: string # ISO-8601 (bundle mtime, local time); the Windows defender_status
                      # last_update is a locale-dependent PowerShell render —
                      # do not treat the two as interchangeably formatted
      - name: remediator_version
        type: string
      - name: mrt_version
        type: string

  readablePayload: "Query macOS XProtect status"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    # Gates the agent daemon version, NOT the antivirus plugin's own version
    # (0.2.0, AntivirusPlugin::version()) — no minPluginVersion mechanism
    # exists today. An agent running plugin <0.2.0 degrades to
    # status|not_available rather than being gated out here.
    minAgentVersion: 0.1.0
    requiredPlugins: [antivirus]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.antivirus.av_exclusions
  displayName: Windows Defender Exclusions
  version: 1.0.0
  description: >
    List Windows Defender's configured exclusions (paths, processes, and
    file extensions) on a Windows endpoint. Reads both the operator-editable
    local hive and the GPO/MDM-managed policy hive, merged with provenance
    so an operator can tell which plane an exclusion came from. This list
    is itself a map of where AV coverage has gaps on an endpoint, which is
    more sensitive than presence/status alone. A row's key is always
    "exclusion"; the value carries kind (path/process/extension), source
    (local/policy/both), and the excluded value itself, pipe-delimited. A
    "partial" row means the enumeration could not be confirmed complete
    (a registry read was truncated or transiently failed) — the exclusions
    returned are real, but there may be more that weren't collected.
    Windows-only; other platforms report "unsupported".
  tags: [security, antivirus, defender, exclusions, compliance, windows]

spec:
  type: question
  platforms: [windows]

  execution:
    plugin: antivirus
    action: av_exclusions
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: kind
        type: string
      - name: source
        type: string
      - name: value
        type: string

  readablePayload: "List Windows Defender exclusions"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [antivirus]

status:
  phase: active
