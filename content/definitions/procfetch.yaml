## Process Fetch (Deep Enumeration) Definitions
## Enumerates running processes with executable path and SHA-1 hash.
## Plugin: procfetch | Actions: procfetch_fetch

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.process.fetch
  displayName: Fetch Processes with Hashes
  version: 1.0.0
  description: >
    Deep process enumeration that returns PID, process name, full
    executable path, and SHA-1 hash of each executable binary.
    Hashes are cached per path to avoid re-hashing duplicate
    executables (e.g. svchost.exe). Useful for security auditing,
    IOC matching, and software inventory validation.
    Supported on Windows (CreateToolhelp32Snapshot + BCrypt),
    Linux (/proc + OpenSSL EVP), and macOS (libproc + OpenSSL EVP).
  tags: [processes, security, hashing, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: procfetch
    action: procfetch_fetch
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: pid
        type: int64
        description: >-
          The process ID assigned by the OS. Values: integer.
        example: "1052"
        platforms: [windows, linux, darwin]
      - name: name
        type: string
        description: >-
          The process's short or executable name, as reported by the OS. Values: free text.
        example: "svchost.exe"
        platforms: [windows, linux, darwin]
      - name: path
        type: string
        description: >-
          Absolute path to the process's executable image on disk; empty when the OS refuses or fails to resolve it (a protected process, a permission-denied read, or a pseudo-process with no backing binary). Values: absolute path or empty.
        example: "/usr/bin/dash"
        platforms: [windows, linux, darwin]
      - name: sha1
        type: string
        description: >-
          Lowercase hex SHA-1 of the executable file's contents, cached per path so a binary shared by several processes is hashed once; empty when the file could not be opened or its path could not be resolved. Values: 40-char lowercase hex or empty.
        example: "e5355187cbd952a5bc9dfca430d10383f0f8750c"
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy:
        - name
      operations:
        - count

  readablePayload: "Fetch running processes with SHA-1 hashes"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [procfetch]

status:
  phase: active
