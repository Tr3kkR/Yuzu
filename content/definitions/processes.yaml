## Process Listing Definitions
## Enumerates and queries running processes on any platform.
## Plugin: processes | Actions: list, query

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.process.list
  displayName: List Running Processes
  version: 1.0.0
  description: >
    Enumerates all running processes on the endpoint, returning each
    process's PID and executable name. Uses native in-process APIs on
    each platform: CreateToolhelp32Snapshot (Windows), the /proc
    filesystem (Linux), sysctl(KERN_PROC_ALL) (macOS) — no subprocess
    is spawned on any platform.
  tags: [processes, inventory, diagnostics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: processes
    action: list
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: pid
        type: int64
        description: >-
          The process's numeric identifier, as assigned by the OS kernel at process creation. Values: integer.
        example: "1936"
        platforms: [windows, linux, darwin]
      - name: name
        type: string
        description: >-
          The process's short name (Windows: PROCESSENTRY32W.szExeFile, the image filename only, no path; Linux: /proc/<pid>/status Name:, kernel-truncated to 15 bytes; macOS: the resolved on-disk executable path when it starts with '/', else the 16-byte-truncated p_comm). '|', CR and LF are replaced with a space before the row is emitted. Values: free text.
        example: "svchost.exe"
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy:
        - name
      operations:
        - count

  readablePayload: "List all running processes"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [processes]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.process.query
  displayName: Query Processes by Name
  version: 1.0.0
  description: >
    Searches running processes by case-insensitive partial name match.
    Returns a found/not-found indicator followed by matching process
    records (PID and name). Useful for checking whether a specific
    application or daemon is running on an endpoint.
  tags: [processes, diagnostics, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: processes
    action: query
    concurrency: per-device

  parameters:
    type: object
    required: [name]
    properties:
      name:
        type: string
        displayName: Process Name Filter
        description: >
          Case-insensitive substring to match against process names,
          1-256 characters, e.g. "svchost" or "launchd". All processes
          whose name contains this string are returned; an empty
          string is rejected by the plugin as a missing parameter.
        validation:
          minLength: 1
          maxLength: 256

  result:
    columns:
      - name: found
        type: bool
        description: >-
          One leading row: true if at least one process name contains the filter (case-insensitive substring), false otherwise. Values: true, false.
        example: "true"
        platforms: [windows, linux, darwin]
      - name: pid
        type: int64
        description: >-
          The matching process's numeric identifier. Absent (no row) when found=false. Values: integer.
        example: "1936"
        platforms: [windows, linux, darwin]
      - name: name
        type: string
        description: >-
          The matching process's short name, same format and truncation rules as processes.list's name column. Absent (no row) when found=false. Values: free text.
        example: "svchost.exe"
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy:
        - found
      operations:
        - count

  readablePayload: "Query processes matching '${name}'"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [processes]

status:
  phase: active
