## Device Quarantine (Network Isolation) Definitions
## Manages network isolation of endpoints via firewall rules.
## Windows: netsh advfirewall, Linux: iptables, macOS: pf main ruleset (atomic pfctl -f load).
## All quarantine rules are prefixed with "YuzuQuarantine_" for identification.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.quarantine.isolate
  displayName: Quarantine Device
  version: 1.0.0
  description: >
    Isolate the device from the network by blocking all inbound and
    outbound traffic except loopback and the whitelisted IP addresses
    (server_ip plus whitelist_ips, merged with the agent's own known
    server address). On Windows this blocks via the all-profiles firewall
    policy (not a rule) plus explicit per-IP and loopback Allow rules,
    covering both IPv4 and IPv6; on Linux it builds a yuzu-quarantine
    iptables chain, mirrored to ip6tables when the host has a live IPv6
    stack; on macOS it atomically loads a full pf main ruleset via
    `pfctl -f` (never a named anchor). Waits up to 2s for any other
    in-flight quarantine/unquarantine/whitelist mutation on this device to
    finish before running.
  tags: [security, quarantine, incident-response, network]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: quarantine
    action: quarantine
    concurrency: per-device

  parameters:
    type: object
    properties:
      server_ip:
        type: string
        displayName: Management Server IP
        description: >
          IP address of the Yuzu management server. This IP is always
          whitelisted to maintain the agent connection during quarantine.
      whitelist_ips:
        type: string
        displayName: Additional Whitelisted IPs
        description: >
          Comma-separated list of additional IP addresses to allow through
          the quarantine firewall (e.g. DNS server, SIEM collector).

  result:
    columns:
      - name: status
        type: string
        description: >
          The quarantine action's outcome: quarantined (full containment
          applied), quarantined_partial (containment applied but at least
          one loopback/whitelist exception or v6 mirror failed), failed (no
          containment applied), or busy (another mutating quarantine
          action was already in flight). An aborted run before any
          mutation instead emits an error field with no status field.
        values: [quarantined, quarantined_partial, failed, busy]
        example: "not observed — quarantine was never executed for these samples"
        platforms: [windows, linux, darwin]
      - name: rules_applied
        type: int32
        description: >-
          Count of firewall rules the action attempted-and-applied this call (Windows/Linux: the mutation tally's succeeded count; macOS: the pf ruleset line count), reported alongside status. Values: integer >= 0.
        example: "4"
        platforms: [windows, linux, darwin]

  readablePayload: >
    Quarantine device (server=${server_ip}, whitelist=${whitelist_ips})

  gather:
    ttlSeconds: 120

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [quarantine]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.quarantine.release
  displayName: Release Device from Quarantine
  version: 1.0.0
  description: >
    Remove this plugin's quarantine containment and restore network
    access. On Windows this deletes the named YuzuQuarantine_* Allow rules
    and replays the firewall profile policy captured at quarantine time
    (or Microsoft's default policy if nothing was captured); on Linux it
    flushes and deletes the yuzu-quarantine iptables chain and its
    ip6tables mirror if one was applied; on macOS it reloads the system
    default `/etc/pf.conf`, falling back to disabling pf entirely if that
    reload fails. Reports release_uncertain rather than released when the
    teardown could not be confirmed complete, and on Windows/macOS this is
    not guaranteed to restore the device's exact pre-quarantine state (see
    the plugin README's Caveats).
  tags: [security, quarantine, incident-response, network]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: quarantine
    action: unquarantine
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: status
        type: string
        description: >
          The unquarantine action's outcome: released (teardown/policy
          restore confirmed) or release_uncertain (a genuine runner
          failure, or a clean rule-delete/policy-restore failure, means
          the device may still be firewalled). A Windows released result
          additionally appends a note field when no captured
          pre-quarantine policy existed to replay; a macOS failure before
          either restore path succeeds emits an error field instead.
        values: [released, release_uncertain]
        example: "not observed — unquarantine was never executed for these samples"
        platforms: [windows, linux, darwin]

  readablePayload: "Release device from quarantine"

  gather:
    ttlSeconds: 120

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [quarantine]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.quarantine.status
  displayName: Quarantine Status
  version: 1.0.0
  description: >
    Re-read the live OS firewall state and report the containment verdict
    (active/partial/degraded/uncertain/inactive) plus the current
    whitelist of allowed IP addresses when the device is not inactive.
    Always runs immediately, even while a quarantine/unquarantine/
    whitelist mutation is in flight on the same device.
  tags: [security, quarantine, diagnostics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: quarantine
    action: status
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: state
        type: string
        description: >
          Current containment verdict from a live re-read of the OS
          firewall state: active (fully contained), partial (some but not
          all expected rules/policy present), degraded (macOS only - the
          pf ruleset is loaded but pf itself is disabled, so nothing is
          actually blocked), uncertain (the read itself failed or
          returned nothing recognisable), or inactive (no containment
          present).
        values: [active, partial, degraded, uncertain, inactive]
        example: "uncertain"
        platforms: [windows, linux, darwin]
      - name: whitelist
        type: string
        description: >-
          Comma-separated whitelist of currently-allowed IPs, read fresh from the firewall. Reported only when state is not inactive, and empty when the device is contained with no additional whitelist entries. Values: free text - comma-separated IP list, or empty.
        example: ""
        platforms: [windows, linux, darwin]

  readablePayload: "Query quarantine status"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [quarantine]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.quarantine.whitelist
  displayName: Modify Quarantine Whitelist
  version: 1.0.0
  description: >
    Add or remove IP addresses from an active quarantine's whitelist
    without fully releasing or re-applying the quarantine, reporting the
    resulting whitelist after the modification. On macOS there is no
    per-rule granularity: this action rebuilds and reloads the entire pf
    main ruleset (including the block-all default-deny) and enables pf,
    so running it against a device that is not already quarantined will
    isolate it.
  tags: [security, quarantine, incident-response, network]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: quarantine
    action: whitelist
    concurrency: per-device

  parameters:
    type: object
    required: [action, ips]
    properties:
      action:
        type: string
        displayName: Whitelist Action
        description: Whether to add or remove the specified IPs from the quarantine whitelist.
        validation:
          enum: ["add", "remove"]
      ips:
        type: string
        displayName: IP Addresses
        description: >
          Comma-separated list of IP addresses to add to or remove from
          the quarantine whitelist.

  result:
    columns:
      - name: status
        type: string
        description: >
          The whitelist action's outcome: updated (every add/remove
          mutation succeeded) or update_uncertain (a genuine runner
          failure, or a clean per-IP mutation failure, means the
          whitelist may be partially applied). Missing/invalid parameters
          instead return an error field before any mutation is attempted.
        values: [updated, update_uncertain]
        example: "updated"
        platforms: [windows, linux, darwin]
      - name: whitelist
        type: string
        description: >-
          Comma-separated whitelist after the add/remove, read fresh from the firewall (on macOS this is the full pf ruleset whitelist, since add/remove rebuilds the entire main ruleset there). Values: free text - comma-separated IP list, or empty.
        example: ""
        platforms: [windows, linux, darwin]

  readablePayload: "Quarantine whitelist: ${action} IPs ${ips}"

  gather:
    ttlSeconds: 120

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [quarantine]

status:
  phase: active
