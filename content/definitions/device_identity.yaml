## Device Identity Plugin Definitions
## Queries device hostname, DNS/AD domain membership, and Active
## Directory organizational unit from each endpoint.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.device_identity.device_name
  displayName: Device Hostname
  version: 1.0.0
  description: >
    Returns the machine hostname. Uses gethostname() on Linux/macOS and
    GetComputerNameExA(ComputerNamePhysicalDnsHostname) on Windows.
  tags: [identity, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: device_identity
    action: device_name
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: device_name
        type: string
        description: "The device's hostname as reported by the OS. Values: free text."
        example: "DESKTOP-04DNSIG"
        platforms: [windows, linux, darwin]

  readablePayload: "Get device hostname"

  gather:
    ttlSeconds: 3600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [device_identity]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.device_identity.domain
  displayName: Domain Membership
  version: 1.0.0
  description: >
    Returns the DNS or Active Directory domain name and whether the
    device is domain-joined. On Windows, uses NetGetJoinInformation. On
    Linux, reads /etc/resolv.conf for the DNS domain and checks AD-join
    status via sssd's D-Bus InfoPipe, falling back to `realm list` and
    then /etc/sssd/sssd.conf. On macOS, runs `dsconfigad -show`, falling
    back to a native gethostname()+getaddrinfo(AI_CANONNAME) lookup if
    the device is not AD-bound.
  tags: [identity, inventory, directory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: device_identity
    action: domain
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: domain
        type: string
        description: 'The DNS or Active Directory domain name the device reports, or "N/A" if none was found. Values: free text (or the literal "N/A").'
        example: "WORKGROUP"
        platforms: [windows, linux, darwin]
      - name: joined
        type: bool
        description: Whether the device is currently joined to a domain or realm.
        example: false
        platforms: [windows, linux, darwin]

  readablePayload: "Get domain membership"

  gather:
    ttlSeconds: 3600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [device_identity]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.device_identity.ou
  displayName: Active Directory OU
  version: 1.0.0
  description: >
    Returns the Active Directory organizational unit (OU) path for the
    device. On Windows, uses GetComputerObjectNameA with
    NameFullyQualifiedDN and extracts the OU= components. On Linux,
    checks realm list and sssd.conf. On macOS, parses dsconfigad -show.
    Returns "N/A" if the device is not domain-joined.
  tags: [identity, inventory, directory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: device_identity
    action: ou
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: ou
        type: string
        description: 'The Active Directory organizational unit distinguished-name path, or "N/A" if the device is not domain-joined or the OU could not be read. Values: free text (AD DN fragment) or the literal "N/A".'
        example: "N/A"
        platforms: [windows, linux, darwin]

  readablePayload: "Get Active Directory organizational unit"

  gather:
    ttlSeconds: 3600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [device_identity]

status:
  phase: active
