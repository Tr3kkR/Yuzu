## OS Information Plugin Definitions
## Queries operating system name, version, build identifier, CPU
## architecture, and system uptime from each endpoint.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.os_info.os_name
  displayName: Operating System Name
  version: 1.0.0
  description: >
    Returns the full OS product name (e.g. "Windows 11 Pro",
    "Ubuntu 24.04.1 LTS", "macOS 26.6.2"). On Windows, reads the registry
    ProductName and corrects the Windows 10/11 naming for builds >= 22000.
    On Linux, reads PRETTY_NAME from /etc/os-release. On macOS, reads
    ProductName and ProductVersion from SystemVersion.plist, falling back
    to the kern.osproductversion sysctl and then a literal if the plist
    is unreadable -- no subprocess is spawned.
  tags: [os, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: os_info
    action: os_name
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: os_name
        type: string
        description: >-
          The OS product name as read by the platform-specific leg (registry ProductName on Windows, corrected for the Windows 11 naming quirk; PRETTY_NAME from /etc/os-release on Linux; ProductName + ProductVersion from SystemVersion.plist on macOS). Values: free text.
        example: "Windows 11 Pro"
        platforms: [windows, linux, darwin]

  visualization:
    # The os_info plugin emits rows of the form `os_name|<value>` — the
    # `result.columns` declaration is dashboard metadata, not an engine
    # parser hint. The actual value lives at field index 1.
    type: pie
    processor: single_series
    title: OS distribution across the fleet
    labelField: 1       # actual OS string e.g. "Windows 11 Pro", "Ubuntu 24.04.1 LTS"
    maxCategories: 8
    valueLabel: Devices

  readablePayload: "Get operating system name"

  gather:
    ttlSeconds: 3600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [os_info]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.os_info.os_version
  displayName: OS Kernel / Version String
  version: 1.0.0
  description: >
    Returns the OS version string. On Windows, reports Major.Minor.Build
    from RtlGetVersion (avoids manifest-dependent version lies). On Linux
    and macOS, reports the kernel release from uname. On macOS, also
    returns the user-facing product version (os_product_version) read
    from SystemVersion.plist's ProductVersion key, falling back to the
    kern.osproductversion sysctl -- no subprocess is spawned.
  tags: [os, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: os_info
    action: os_version
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: os_version
        type: string
        description: >-
          The kernel/version string: Major.Minor.Build from RtlGetVersion on Windows; the uname(2) kernel release on Linux and macOS. Values: free text.
        example: "10.0.26200"
        platforms: [windows, linux, darwin]
      - name: os_product_version
        type: string
        description: >-
          macOS-only: the user-facing product version read from SystemVersion.plist's ProductVersion key (sysctl kern.osproductversion fallback); not emitted on Windows or Linux. Values: free text.
        example: "26.6.2"
        platforms: [darwin]

  readablePayload: "Get OS version string"

  gather:
    ttlSeconds: 3600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [os_info]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.os_info.os_build
  displayName: OS Build Identifier
  version: 1.0.0
  description: >
    Returns the OS build identifier. On Windows, reports
    CurrentBuildNumber.UBR from the registry (e.g. "22631.4890"). On
    Linux, extracts the kernel build version from /proc/version. On
    macOS, reads ProductBuildVersion from SystemVersion.plist, falling
    back to the kern.osversion sysctl -- no subprocess is spawned.
  tags: [os, inventory, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: os_info
    action: os_build
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: os_build
        type: string
        description: >-
          The OS build identifier: registry CurrentBuildNumber.UBR on Windows; the third whitespace field of /proc/version on Linux; SystemVersion.plist's ProductBuildVersion (sysctl kern.osversion fallback) on macOS. Values: free text.
        example: "26200.9278"
        platforms: [windows, linux, darwin]

  readablePayload: "Get OS build identifier"

  gather:
    ttlSeconds: 3600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [os_info]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.os_info.os_arch
  displayName: CPU Architecture
  version: 1.0.0
  description: >
    Returns the CPU architecture of the endpoint (e.g. "x86_64",
    "aarch64", "arm"). On Windows, uses GetNativeSystemInfo. On Linux
    and macOS, uses uname().machine.
  tags: [os, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: os_info
    action: os_arch
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: os_arch
        type: string
        description: >-
          CPU architecture. Linux and macOS report the raw uname(2) machine string unnormalized (e.g. "aarch64", "arm64" -- not the same token); Windows maps GetNativeSystemInfo to a fixed set: x86_64, aarch64, x86, arm, or unknown. Values: free text (Linux/macOS); "x86_64", "aarch64", "x86", "arm", "unknown" (Windows).
        example: "x86_64"
        platforms: [windows, linux, darwin]

  readablePayload: "Get CPU architecture"

  gather:
    ttlSeconds: 86400

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [os_info]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.os_info.uptime
  displayName: System Uptime
  version: 1.0.0
  description: >
    Returns the system uptime in seconds and a human-readable display
    string (e.g. "12d 5h 23m"). Uses /proc/uptime on Linux,
    kern.boottime sysctl on macOS, GetTickCount64 on Windows.
  tags: [os, health, monitoring]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: os_info
    action: uptime
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: uptime_seconds
        type: int64
        description: >-
          Seconds since boot. Emitted as the literal string "unknown" instead of an integer if the platform read fails (/proc/uptime unreadable on Linux, the KERN_BOOTTIME sysctl failing on macOS) -- never observed in this capture set. Values: integer, or the literal "unknown".
        example: "69193"
        platforms: [windows, linux, darwin]
      - name: uptime_display
        type: string
        description: >-
          Human-readable uptime formatted "<days>d <hours>h <minutes>m"; "unknown" if the platform read failed. Values: free text ("<n>d <n>h <n>m"), or the literal "unknown".
        example: "0d 19h 13m"
        platforms: [windows, linux, darwin]

  readablePayload: "Get system uptime"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [os_info]

status:
  phase: active
