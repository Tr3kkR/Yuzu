## User Accounts Definitions
## Provides discovery and enumeration of local user accounts,
## logged-on users, interactive sessions, local admin group members,
## arbitrary group membership, primary user identification, and session history.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.users.logged_on
  displayName: List Logged-On Users
  version: 1.0.0
  description: >
    Enumerates currently logged-on users on the endpoint. Reports each
    user's name, domain/host, logon type (console, RDP, remote), and
    session identifier. Uses WTS APIs on Windows, utmp on Linux, and
    the 'who' command on macOS.
  tags: [users, sessions, security, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: users
    action: logged_on
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: username
        type: string
        description: The account name of a currently logged-on user.
        values: free text
        example: alex
        platforms: [windows, linux, darwin]
      - name: domain
        type: string
        description: The host or domain the session belongs to, or the literal "local" when it has none.
        values: hostname/domain or the literal "local"
        example: local
        platforms: [windows, linux, darwin]
      - name: logon_type
        type: string
        description: How the session was established.
        values: "console, remote, RDP (Windows only)"
        example: console
        platforms: [windows, linux, darwin]
      - name: session_id
        type: string
        description: The session's terminal identifier — a utmp line name (Linux), a tty (macOS), or a numeric WTS session ID (Windows).
        values: free text
        example: console
        platforms: [windows, linux, darwin]

  readablePayload: "List currently logged-on users"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [users]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.users.sessions
  displayName: List Active Sessions
  version: 1.0.0
  description: >
    Lists active interactive sessions on the endpoint, including session
    state (Active, Connected, Disconnected, Idle), the connected user,
    remote client name or host, and idle time. Uses WTS session APIs on
    Windows and the 'w' command on Linux/macOS. The idle field is always
    "0" on Windows — idle-time decoding is not implemented there.
  tags: [users, sessions, security, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: users
    action: sessions
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: session_id
        type: string
        description: The session's controlling tty (Linux/macOS) or numeric WTS session ID (Windows).
        values: free text
        example: console
        platforms: [windows, linux, darwin]
      - name: username
        type: string
        description: The account that owns this session.
        values: free text
        example: alex
        platforms: [windows, linux, darwin]
      - name: state
        type: string
        description: The session's connection state.
        values: "Active (Linux/macOS, always); Windows: Active, Connected, Disconnected, Idle, Listen, Other"
        example: Active
        platforms: [windows, linux, darwin]
      - name: client
        type: string
        description: The remote host the session connects from ('w' FROM column) or the RDP client name on Windows; "-" when none.
        values: free text or "-"
        example: "-"
        platforms: [windows, linux, darwin]
      - name: idle
        type: string
        description: Idle time as reported by 'w' on Linux/macOS; always the literal "0" on Windows, where idle-time decoding is unimplemented.
        values: free text (Linux/macOS) or the literal "0" (Windows)
        example: "13:35"
        platforms: [windows, linux, darwin]

  readablePayload: "List active interactive sessions"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [users]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.users.local_users
  displayName: Enumerate Local User Accounts
  version: 1.0.0
  description: >
    Enumerates local user accounts on the endpoint. Reports the username,
    enabled/disabled status, last logon timestamp, and account description.
    On Linux reads /etc/passwd (skipping system accounts with UID < 1000),
    on macOS uses dscl, on Windows uses NetUserEnum. On macOS, also reports
    console_state — a tri-state ("true"/"false"/"unknown") signal for
    whether the account is the current GUI/console-login user; Linux and
    Windows omit this field entirely rather than leaving it empty. On
    Linux, a username containing characters outside [A-Za-z0-9._-] skips
    the lastlog lookup and reports last_logon as "unknown".
  tags: [users, accounts, security, compliance, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: users
    action: local_users
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: username
        type: string
        description: The local account's username.
        values: free text
        example: Alex
        platforms: [windows, linux, darwin]
      - name: enabled
        type: bool
        description: Whether the account is enabled.
        values: "true, false"
        example: "true"
        platforms: [windows, linux, darwin]
      - name: last_logon
        type: string
        description: The account's most recent login timestamp, or a sentinel when unknown or never logged in.
        values: "\"YYYY-MM-DD HH:MM:SS\", \"Never\", \"unknown\""
        example: "2026-09-07 11:08:37"
        platforms: [windows, linux, darwin]
      - name: description
        type: string
        description: The account's comment/description text (Windows comment, macOS RealName, Linux GECOS field), or "-" when empty.
        values: free text or "-"
        example: Built-in account for administering the computer/domain
        platforms: [windows, linux, darwin]
      - name: console_state
        type: string
        description: Tri-state flag for whether this account is the current GUI/console-login user; the field is entirely absent (not empty) on Linux and Windows.
        values: "true, false, unknown"
        example: "true"
        platforms: [darwin]

  readablePayload: "Enumerate local user accounts"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [users]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.users.local_admins
  displayName: List Local Administrators
  version: 1.0.0
  description: >
    Lists members of the local Administrators group. On Windows this
    queries the Administrators group via NetLocalGroupGetMembers and
    reports member type (user, group, well_known_group, alias) and domain.
    On Linux checks sudo/wheel groups plus root. On macOS reads the
    admin group via dscl.
  tags: [users, admins, security, compliance, privilege-audit]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: users
    action: local_admins
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: member_name
        type: string
        description: The name of an account or group belonging to the local admin membership.
        values: free text
        example: Alex
        platforms: [windows, linux, darwin]
      - name: member_type
        type: string
        description: The kind of member.
        values: "user (always on Linux/macOS); Windows: user, group, well_known_group, alias, unknown"
        example: user
        platforms: [windows, linux, darwin]
      - name: domain_or_group
        type: string
        description: The domain owning the member (Windows), or the source group/account name (Linux "sudo"/"wheel"/"root", macOS literal "admin").
        values: free text
        example: DESKTOP-04DNSIG
        platforms: [windows, linux, darwin]

  readablePayload: "List local administrator group members"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [users]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.users.group_members
  displayName: List Group Members
  version: 1.0.0
  description: >
    Lists members of a specified local group. On Windows queries
    NetLocalGroupGetMembers and reports member type (user, group,
    well_known_group, alias). On Linux reads /etc/group and checks
    primary GID assignments in /etc/passwd. On macOS reads the group
    via dscl. The group name is a required parameter.
  tags: [users, groups, security, compliance, privilege-audit]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: users
    action: group_members
    concurrency: per-device

  parameters:
    type: object
    required: [group]
    properties:
      group:
        type: string
        displayName: Group Name
        description: >
          Name of the local group to enumerate members for
          (e.g., "Administrators", "Remote Desktop Users", "sudo").
        validation:
          minLength: 1
          maxLength: 256

  result:
    columns:
      - name: member_name
        type: string
        description: The account (or nested group, on Windows) belonging to the queried group.
        values: free text
        example: Alex
        platforms: [windows, linux, darwin]
      - name: group_name
        type: string
        description: The group name from the "group" parameter, echoed back on every row.
        values: free text
        example: Administrators
        platforms: [windows, linux, darwin]
      - name: member_type
        type: string
        description: The kind of membership.
        values: "user, primary_group (Linux only); Windows: user, group, well_known_group, alias"
        example: user
        platforms: [windows, linux, darwin]

  readablePayload: "List members of group '${group}'"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [users]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.users.primary_user
  displayName: Identify Primary User
  version: 1.0.0
  description: >
    Identifies the primary user of the endpoint by analyzing login
    frequency. On Windows queries Security Event Log for Event ID
    4624 (logon) events and counts occurrences per user, falling back
    to the registry profile list when the Security channel is
    unreadable. On Linux and macOS parses the output of the 'last'
    command instead, capped at the 200 most recent lines. Returns the
    user with the most login events and the count. On Windows, machine
    accounts (ending with $) and SYSTEM are excluded from the Security
    Event Log count; on Linux/macOS, 'last' boilerplate lines (reboot,
    shutdown, wtmp) are excluded instead.
  tags: [users, inventory, compliance, primary-user]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: users
    action: primary_user
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: username
        type: string
        description: The account with the most login events in the examined history, or "unknown" when none could be determined.
        values: free text or "unknown"
        example: Alex
        platforms: [windows, linux, darwin]
      - name: login_count
        type: int32
        description: The number of login events counted for this user; "0" for the Windows ProfileList fallback, which carries no count.
        values: integer
        example: "118"
        platforms: [windows, linux, darwin]
      - name: source
        type: string
        description: How the answer was derived.
        values: "last (Linux/macOS); event_log_4624, profile_list (Windows); free text on a query failure"
        example: event_log_4624
        platforms: [windows, linux, darwin]

  readablePayload: "Identify primary user of this endpoint"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [users]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.users.session_history
  displayName: Session History
  version: 1.0.0
  description: >
    Shows historical login and logout session records. On Windows
    queries the Security Event Log for Event IDs 4624 (logon) and
    4634 (logoff), parsing logon type, source address, and timestamps.
    On Linux and macOS parses the 'last' command output instead — the
    six output fields are populated positionally from 'last', not from
    the same event-log semantics as Windows: the "event_type" field
    carries the tty, "logon_type" carries last's host/source token,
    "source" carries the derived console/remote/system classification,
    "timestamp" carries the completed/active/crash status, and the real
    date/time lives in "detail" as free text. The count parameter
    controls how many records to return (clamped to 1-500). Requires
    elevated privileges on Windows to read the Security event log.
  tags: [users, sessions, security, audit, compliance, history]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: users
    action: session_history
    concurrency: per-device

  parameters:
    type: object
    properties:
      count:
        type: string
        displayName: Record Count
        description: >
          Maximum number of session records to return, as a digit string
          (e.g. "100"); values outside 1-500 are clamped back to the
          default of 50.
        default: "50"
        validation:
          pattern: "^[0-9]+$"

  result:
    columns:
      - name: username
        type: string
        description: The account named in the record.
        values: free text
        example: Alex
        platforms: [windows, linux, darwin]
      - name: event_type
        type: string
        description: "Windows: \"logon\" or \"logoff\". Linux/macOS: actually the session's tty, not an event-type label — see the plugin README's Caveats."
        values: "logon, logoff (Windows); a tty name (Linux/macOS)"
        example: logoff
        platforms: [windows, linux, darwin]
      - name: logon_type
        type: string
        description: "Windows: the mapped LogonType name or raw numeric code, empty when absent. Linux/macOS: actually last's host/source token, usually empty for a local session."
        values: "interactive, network, batch, service, unlock, network_cleartext, new_credentials, remote_interactive, cached_interactive, or a raw numeric code (Windows); free text, often empty (Linux/macOS)"
        example: network
        platforms: [windows, linux, darwin]
      - name: source
        type: string
        description: "Windows: the event's IpAddress, or \"-\". Linux/macOS: actually the derived console/remote/system classification, not a network source."
        values: "an IP address or \"-\" (Windows); console, remote, system (Linux/macOS)"
        example: "-"
        platforms: [windows, linux, darwin]
      - name: timestamp
        type: string
        description: "Windows: the event's TimeCreated, full-precision UTC. Linux/macOS: actually the completed/active/crash status word, not a timestamp — the real date/time is embedded in \"detail\"."
        values: "ISO-8601 UTC (Windows); completed, active, crash (Linux/macOS)"
        example: "2026-09-07T10:08:37.8345208Z"
        platforms: [windows, linux, darwin]
      - name: detail
        type: string
        description: "Windows: the raw EventID text. Linux/macOS: the remainder of the 'last' line verbatim (weekday, date, time, and logout/duration or \"still logged in\")."
        values: free text
        example: "4634"
        platforms: [windows, linux, darwin]

  readablePayload: "Show session history (last ${count} records)"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [users]

status:
  phase: active
