## Agent Actions Plugin Definitions
## Provides runtime agent management actions: changing the log level
## and querying agent runtime info.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.agent_actions.set_log_level
  displayName: Set Agent Log Level
  version: 1.0.0
  description: >
    Changes the agent's spdlog log level at runtime. Accepts any valid
    spdlog level: trace, debug, info, warn, error, critical, off. The
    change takes effect immediately and persists until the agent
    restarts or the level is changed again.
  tags: [agent, logging, management]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: agent_actions
    action: set_log_level
    concurrency: per-device

  parameters:
    type: object
    required: [level]
    properties:
      level:
        type: string
        displayName: Log Level
        description: >
          The desired spdlog log level, case-insensitive: trace, debug, info,
          warn, error, critical, or off (e.g. "info").
        validation:
          enum: ["trace", "debug", "info", "warn", "error", "critical", "off"]

  result:
    columns:
      - name: status
        type: string
        description: Literal "ok" once the level was applied. A missing or unrecognized level instead produces a single "error|<message>" line that carries neither this column nor level.
        values: [ok]
        example: "ok"
        platforms: [windows, linux, darwin]
      - name: level
        type: string
        description: The log level the agent applied — a lowercased echo of the level parameter.
        values: [trace, debug, info, warn, error, critical, 'off']
        example: "info"
        platforms: [windows, linux, darwin]

  readablePayload: "Set agent log level to ${level}"

  gather:
    ttlSeconds: 0

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [agent_actions]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.agent_actions.info
  displayName: Agent Runtime Info
  version: 1.0.0
  description: >
    Returns agent runtime information from the config context: agent ID,
    version, server address, heartbeat interval, and loaded plugin
    count.
  tags: [agent, inventory, diagnostics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: agent_actions
    action: info
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: agent_id
        type: string
        description: The agent's agent.id config value, or the literal "(not set)" when the config context has not populated it.
        values: "free text, or literal \"(not set)\""
        example: "(not set)"
        platforms: [windows, linux, darwin]
      - name: agent_version
        type: string
        description: The agent's agent.version config value, or the literal "(not set)" when unpopulated.
        values: "free text, or literal \"(not set)\""
        example: "(not set)"
        platforms: [windows, linux, darwin]
      - name: server_address
        type: string
        description: The agent's agent.server_address config value, or the literal "(not set)" when unpopulated.
        values: "free text, or literal \"(not set)\""
        example: "(not set)"
        platforms: [windows, linux, darwin]
      - name: heartbeat_interval
        type: string
        description: The agent's agent.heartbeat_interval config value, or the literal "(not set)" when unpopulated.
        values: "free text, or literal \"(not set)\""
        example: "(not set)"
        platforms: [windows, linux, darwin]
      - name: plugins_count
        type: int32
        description: The agent's agent.plugins.count config value. Always emitted as text, never a JSON number — the raw config string or the literal "(not set)".
        values: "free text, or literal \"(not set)\""
        example: "(not set)"
        platforms: [windows, linux, darwin]

  readablePayload: "Get agent runtime info"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [agent_actions]

status:
  phase: active
