## HTTP Client Plugin Definitions

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: agent.http_client.download
  displayName: Download File
  version: 1.0.0
  description: >
    Download a file from a URL to a local path with optional SHA256 hash verification.
  tags: [http, download, content]
spec:
  type: action
  platforms: [windows, linux, darwin]
  execution:
    plugin: http_client
    action: download
    concurrency: per-device
  parameters:
    type: object
    required: [url, path]
    properties:
      url:
        type: string
        displayName: URL
        description: HTTP or HTTPS URL to download.
      path:
        type: string
        displayName: Destination Path
        description: Local file path to save the download.
      expected_hash:
        type: string
        displayName: Expected SHA256 Hash
        description: Optional SHA256 hash for verification.
  result:
    columns:
      - name: status
        type: string
        description: Literal "ok" on success; a failed download emits a separate error output instead of a non-ok status row.
        values: "ok"
        example: "ok"
        platforms: [windows, linux, darwin]
      - name: path
        type: string
        description: Absolute path the file was written to, after canonicalizing the parent directory and rejecting any ".." component.
        values: absolute filesystem path
        example: /tmp/yuzu_capture/yuzu_capture_download.html
        platforms: [windows, linux, darwin]
      - name: size
        type: int64
        description: Size in bytes of the downloaded file on disk, read back with std::filesystem::file_size after the write completes.
        values: non-negative integer, bytes
        example: 559
        platforms: [windows, linux, darwin]
      - name: hash
        type: string
        description: Lowercase hex SHA-256 digest of the downloaded file, computed via BCrypt on Windows and OpenSSL EVP on Linux/macOS.
        values: 64-character lowercase hex string
        example: ff67a9d764d6a2367a187734e697f6a53217db9a21c101d410a113ca871a299d
        platforms: [windows, linux, darwin]
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [http_client]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: agent.http_client.get
  displayName: HTTP GET
  version: 1.0.0
  description: >
    Perform an HTTP GET request and return the response status and body.
  tags: [http, network]
spec:
  type: question
  platforms: [windows, linux, darwin]
  execution:
    plugin: http_client
    action: get
    concurrency: per-device
  parameters:
    type: object
    required: [url]
    properties:
      url:
        type: string
        displayName: URL
        description: HTTP or HTTPS URL to request.
  result:
    columns:
      - name: status
        type: int32
        description: HTTP status code returned by the GET request, or 0 if the request could not be made (invalid URL, SSRF block, or connection failure).
        values: HTTP status code, or 0 on request failure
        example: 200
        platforms: [windows, linux, darwin]
      - name: body
        type: string
        description: Response body text; a body over the 100 MiB cap is replaced with an error string, though the full response is already received over the wire before that check runs.
        values: free text, or an error string on failure
        example: '<!doctype html><html lang="en"><head><title>Example Domain</title>...'
        platforms: [windows, linux, darwin]
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [http_client]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: agent.http_client.head
  displayName: HTTP HEAD
  version: 1.0.0
  description: >
    Perform an HTTP HEAD request and return the response status code and headers.
    Useful for checking file availability or size before downloading.
  tags: [http, network]
spec:
  type: question
  platforms: [windows, linux, darwin]
  execution:
    plugin: http_client
    action: head
    concurrency: per-device
  parameters:
    type: object
    required: [url]
    properties:
      url:
        type: string
        displayName: URL
        description: HTTP or HTTPS URL to request.
  result:
    columns:
      - name: status
        type: int32
        description: HTTP status code returned by the HEAD request, or 0 if the request could not be made (invalid URL, SSRF block, or connection failure).
        values: HTTP status code, or 0 on request failure
        example: 200
        platforms: [windows, linux, darwin]
      - name: content_length
        type: int64
        description: Declared here but not populated by the current head leg, which writes one combined "headers" field (the full raw response header block) instead of parsed content_length/content_type fields — see the plugin README's Caveats section.
        values: not emitted by current code
        example: "-"
        platforms: []
      - name: content_type
        type: string
        description: Declared here but not populated by the current head leg, which writes one combined "headers" field (the full raw response header block) instead of parsed content_length/content_type fields — see the plugin README's Caveats section.
        values: not emitted by current code
        example: "-"
        platforms: []
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [http_client]
status:
  phase: active
