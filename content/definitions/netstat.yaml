## Netstat Definitions
## Enumerates active network connections and listening sockets.
## Plugin: netstat | Actions: netstat_list
## (see also netstat_attribution.yaml for the `attribution` action, which
## additionally resolves the owning process -- folds the retired `sockwho`
## plugin into netstat, #3403)
##
## Sources by platform:
##   Windows: IP Helper API (GetExtendedTcpTable, GetExtendedUdpTable)
##   Linux:   /proc/net/{tcp,tcp6,udp,udp6} + /proc/[pid]/fd inode mapping
##   macOS:   libproc (proc_listallpids, proc_pidinfo, proc_pidfdinfo)

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.network.netstat_list
  displayName: Network Connections (netstat)
  version: 1.0.0
  description: >
    Enumerates all active TCP/UDP connections and listening sockets on
    the endpoint, returning protocol, local and remote addresses and
    ports, connection state, and owning PID. Covers TCP4, TCP6, UDP4,
    and UDP6. On Windows uses the Extended TCP/UDP Table APIs with
    per-row PID ownership. On Linux reads /proc/net/* and maps socket
    inodes to PIDs via /proc/[pid]/fd. On macOS uses libproc to
    iterate per-process file descriptors for socket types.
  tags: [network, security, connections, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: netstat
    action: netstat_list
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: proto
        type: string
        description: Transport protocol and IP version of the socket.
        values: [tcp, tcp6, udp, udp6]
        example: "tcp"
        platforms: [windows, linux, darwin]
      - name: local_addr
        type: string
        description: The connection's local IP address, in the address family matching proto.
        values: free text (IPv4 or IPv6 address)
        example: "100.109.177.77"
        platforms: [windows, linux, darwin]
      - name: local_port
        type: int32
        description: The connection's local TCP or UDP port number.
        values: integer, 0-65535
        example: 52882
        platforms: [windows, linux, darwin]
      - name: remote_addr
        type: string
        description: >
          The connection's remote IP address. UDP sockets report the literal
          '*' on macOS and Windows (no fixed peer); Linux instead parses the
          real value from /proc/net/udp* (normally 0.0.0.0).
        values: free text (IPv4 or IPv6 address) or "*"
        example: "100.123.53.121"
        platforms: [windows, linux, darwin]
      - name: remote_port
        type: int32
        description: The connection's remote port; always 0 for UDP (no fixed peer).
        values: integer, 0-65535
        example: 22
        platforms: [windows, linux, darwin]
      - name: state
        type: string
        description: >
          TCP connection state name; always empty for UDP rows (never a
          fabricated LISTEN). The exact name set differs slightly per OS.
        values: "ESTABLISHED, SYN_SENT, SYN_RECV, FIN_WAIT1, FIN_WAIT2, TIME_WAIT, CLOSE_WAIT, LAST_ACK, LISTEN, CLOSING, UNKNOWN, CLOSE (Linux only), CLOSED/DELETE_TCB (Windows only), or empty (UDP)"
        example: "ESTABLISHED"
        platforms: [windows, linux, darwin]
      - name: pid
        type: int32
        description: >
          PID of the process holding the socket, or -1 (Linux only) when no
          matching /proc/[pid]/fd inode was found.
        values: integer, or -1 on Linux
        example: 9653
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy:
        - proto
        - state
      operations:
        - count

  readablePayload: "List all network connections"

  gather:
    ttlSeconds: 30

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [netstat]

status:
  phase: active
