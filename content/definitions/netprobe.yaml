# Netprobe Plugin Definitions — active network measurement (BRD E1)
#
# Recurrence is the scheduler's job: run these on an interval against your
# key resources (gateway, DNS, the Yuzu server, a SaaS edge) and the response
# store keeps the RTT/jitter/loss history for trending.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition

metadata:
  id: network.probe.icmp
  displayName: ICMP RTT Probe
  version: 1.0.0
  description: >
    Measure ICMP echo round-trip time, jitter (population stddev), and packet
    loss to up to 4 comma-separated targets. Native (no shell-out):
    IcmpSendEcho on Windows (unprivileged, whole-millisecond granularity),
    unprivileged ICMP datagram sockets on macOS/Linux (on Linux gated by
    net.ipv4.ping_group_range — a refused socket reports status
    "not-permitted", never fake loss). IPv4 targets only. Worst case with
    maximum parameters is about 2 minutes; defaults finish in seconds.
  tags: [network, probe, latency, monitoring]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: netprobe
    action: icmp
    concurrency: per-device

  parameters:
    type: object
    required: [targets]
    properties:
      targets:
        type: string
        displayName: Targets
        description: >
          Comma-separated hostnames or IPv4 literals (max 4), e.g.
          "10.0.0.1,gateway.corp.example.com".
      count:
        type: int32
        displayName: Samples
        description: Echo samples per target (1-10, default 5), e.g. 5.
        default: 5
      timeout_ms:
        type: int32
        displayName: Timeout (ms)
        description: >
          Per-sample timeout in milliseconds (100-3000, default 1000), e.g.
          1000.
        default: 1000

  result:
    columns:
      - name: target
        type: string
        description: >-
          The probe target as supplied in targets, or the sanitized value when it failed validation. Values: free text (hostname or IPv4 literal).
        example: "127.0.0.1"
        platforms: [windows, linux, darwin]
      - name: proto
        type: string
        description: Literal protocol tag for this row; always "icmp".
        example: "icmp"
        platforms: [windows, linux, darwin]
      - name: sent
        type: int32
        description: >-
          Number of echo samples attempted (the clamped count parameter), or 0 when the target was invalid or no ICMP session could be opened. Values: integer 0-10.
        example: "5"
        platforms: [windows, linux, darwin]
      - name: ok
        type: int32
        description: 'Number of echo samples that received a reply within timeout_ms. Values: integer 0-sent.'
        example: "5"
        platforms: [windows, linux, darwin]
      - name: min_ms
        type: string
        description: >-
          Fastest successful sample's round-trip time, one decimal place; 0.0 when no sample succeeded. Values: 1-decimal milliseconds.
        example: "0.1"
        platforms: [windows, linux, darwin]
      - name: avg_ms
        type: string
        description: 'Mean round-trip time of the successful samples, one decimal place. Values: 1-decimal milliseconds.'
        example: "0.1"
        platforms: [windows, linux, darwin]
      - name: max_ms
        type: string
        description: >-
          Slowest successful sample's round-trip time, one decimal place; 0.0 when no sample succeeded. Values: 1-decimal milliseconds.
        example: "0.2"
        platforms: [windows, linux, darwin]
      - name: jitter_ms
        type: string
        description: >-
          Population standard deviation of the successful samples' RTT in milliseconds; 0.0 with fewer than two successful samples. Values: 1-decimal milliseconds.
        example: "0.0"
        platforms: [windows, linux, darwin]
      - name: loss_pct
        type: string
        description: >-
          Percentage of samples that did not receive a reply within timeout, one decimal place; 100.0 when the session could not be opened or the target failed validation. Values: 1-decimal percentage, 0.0-100.0.
        example: "0.0"
        platforms: [windows, linux, darwin]
      - name: status
        type: string
        description: "Outcome of this target's probe. Values: ok, invalid-target, resolve-failed, error, not-permitted (Linux only, ping socket refused)."
        example: "ok"
        platforms: [windows, linux, darwin]

  readablePayload: "Probe ICMP round-trip time to {{targets}}"

  approval:
    mode: auto

  permissions:
    # Network-reconnaissance primitive (RTT/reachability to arbitrary internal
    # hosts) - admin-only, matching the discovery plugin precedent (gov sec).
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [netprobe]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition

metadata:
  id: network.probe.tcp
  displayName: TCP Connect RTT Probe
  version: 1.0.0
  description: >
    Measure TCP connect-time round-trip latency, jitter, and connection
    failure rate to up to 4 comma-separated targets on a chosen port
    (default 443). Sub-millisecond timing, unprivileged on every platform —
    the pragmatic probe for resources that drop ICMP (VPN gateways, SaaS
    edges, internal services).
  tags: [network, probe, latency, monitoring]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: netprobe
    action: tcp
    concurrency: per-device

  parameters:
    type: object
    required: [targets]
    properties:
      targets:
        type: string
        displayName: Targets
        description: >
          Comma-separated hostnames or IP literals (max 4), e.g.
          "10.0.0.1,vpn-gw.corp.example.com". The port is a separate
          parameter — do not embed it in a target.
      port:
        type: int32
        displayName: Port
        description: TCP port to connect to (default 443; clamped 1-65535).
        default: 443
      count:
        type: int32
        displayName: Samples
        description: Connect samples per target (1-10, default 5), e.g. 5.
        default: 5
      timeout_ms:
        type: int32
        displayName: Timeout (ms)
        description: >
          Per-sample timeout in milliseconds (100-3000, default 1000), e.g.
          1000.
        default: 1000

  result:
    columns:
      - name: target
        type: string
        description: >-
          The probe target as supplied in targets, or the sanitized value when it failed validation. Values: free text (hostname or IP literal).
        example: "127.0.0.1"
        platforms: [windows, linux, darwin]
      - name: proto
        type: string
        description: 'Literal protocol tag including the connect port. Values: tcp:<port>.'
        example: "tcp:22"
        platforms: [windows, linux, darwin]
      - name: sent
        type: int32
        description: >-
          Number of connect samples attempted (the clamped count parameter), or 0 when the target was invalid or resolution failed. Values: integer 0-10.
        example: "5"
        platforms: [windows, linux, darwin]
      - name: ok
        type: int32
        description: 'Number of connect samples that succeeded within timeout_ms. Values: integer 0-sent.'
        example: "5"
        platforms: [windows, linux, darwin]
      - name: min_ms
        type: string
        description: >-
          Fastest successful connect time, one decimal place; 0.0 when no sample succeeded. Values: 1-decimal milliseconds.
        example: "0.3"
        platforms: [windows, linux, darwin]
      - name: avg_ms
        type: string
        description: 'Mean connect time of the successful samples, one decimal place. Values: 1-decimal milliseconds.'
        example: "0.3"
        platforms: [windows, linux, darwin]
      - name: max_ms
        type: string
        description: >-
          Slowest successful connect time, one decimal place; 0.0 when no sample succeeded. Values: 1-decimal milliseconds.
        example: "0.4"
        platforms: [windows, linux, darwin]
      - name: jitter_ms
        type: string
        description: >-
          Population standard deviation of the successful samples' connect time in milliseconds; 0.0 with fewer than two successful samples. Values: 1-decimal milliseconds.
        example: "0.0"
        platforms: [windows, linux, darwin]
      - name: loss_pct
        type: string
        description: >-
          Percentage of samples that did not connect within timeout, one decimal place; 100.0 when resolution failed or the target failed validation. Values: 1-decimal percentage, 0.0-100.0.
        example: "0.0"
        platforms: [windows, linux, darwin]
      - name: status
        type: string
        description: >-
          Outcome of this target's probe. "ok" means the probe ran to completion, not that every sample connected — check loss_pct too. Values: ok, invalid-target, resolve-failed.
        example: "ok"
        platforms: [windows, linux, darwin]

  readablePayload: "Probe TCP connect time to {{targets}}"

  approval:
    mode: auto

  permissions:
    # Network-reconnaissance primitive (RTT/reachability to arbitrary internal
    # hosts) - admin-only, matching the discovery plugin precedent (gov sec).
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [netprobe]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition

metadata:
  id: network.probe.dns
  displayName: DNS Resolution Timing
  version: 1.0.0
  description: >
    Measure name-resolution wall time (getaddrinfo) for up to 4
    comma-separated names, reporting milliseconds, status, and the number of
    addresses returned. Failing or slow resolution is one of the
    highest-impact "everything is broken" employee experiences.
  tags: [network, probe, dns, monitoring]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: netprobe
    action: dns
    concurrency: per-device

  parameters:
    type: object
    required: [targets]
    properties:
      targets:
        type: string
        displayName: Names
        description: >
          Comma-separated DNS names to resolve (max 4), e.g.
          "example.com,internal.corp.local".

  result:
    columns:
      - name: name
        type: string
        description: >-
          The DNS name as supplied in targets, or the sanitized value when it failed validation. Values: free text DNS name.
        example: "localhost"
        platforms: [windows, linux, darwin]
      - name: resolve_ms
        type: string
        description: 'Wall-clock time for the getaddrinfo call, one decimal place. Values: 1-decimal milliseconds.'
        example: "2.9"
        platforms: [windows, linux, darwin]
      - name: status
        type: string
        description: 'Outcome of the resolution. Values: ok, invalid-target, error:<getaddrinfo return code>.'
        example: "ok"
        platforms: [windows, linux, darwin]
      - name: addresses
        type: int32
        description: >-
          Number of addresses getaddrinfo returned; 0 on failure or invalid target. Values: integer, 0 or more.
        example: "2"
        platforms: [windows, linux, darwin]

  readablePayload: "Time DNS resolution of {{targets}}"

  approval:
    mode: auto

  permissions:
    # Network-reconnaissance primitive (RTT/reachability to arbitrary internal
    # hosts) - admin-only, matching the discovery plugin precedent (gov sec).
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [netprobe]

status:
  phase: active
