## Certificate Inventory and Management Definitions
## Enumerates and manages certificates in system stores.
## Windows: CryptoAPI (MY, ROOT, CA, Trust stores)
## Linux: PEM files in /etc/ssl/certs/ via openssl
## macOS: System.keychain and SystemRootCertificates.keychain via security CLI,
##        plus the current console user's login keychain (store=login/all) via
##        `launchctl asuser <uid> sudo -u <user> security` -- the LaunchDaemon
##        has no login keychain of its own, so this reaches into that user's
##        per-user session to read it.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.certificates.list
  displayName: List Certificates
  version: 1.1.0
  description: >
    Enumerate certificates in system certificate stores. On Windows this
    queries the CryptoAPI stores (MY, ROOT, CA, Trust). On Linux it parses
    PEM files in /etc/ssl/certs/. On macOS it reads System.keychain and
    SystemRootCertificates.keychain, plus the current console user's login
    keychain when one is logged in. Results can be filtered by store name
    and by expiration window.
  tags: [security, certificates, compliance, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: certificates
    action: list
    concurrency: per-device

  parameters:
    type: object
    properties:
      store:
        type: string
        displayName: Certificate Store
        description: >
          Filter by store name. On Windows: MY, ROOT, CA, Trust, or "all"
          for all stores. On macOS: "login" (the current console user's
          login keychain -- returns not_available|no console session
          when nobody is logged in at the console, or
          not_available|<reason> when the console user could not be
          determined, e.g. the directory lookup timed out; the two are
          deliberately distinct, a degraded lookup is never reported as
          an empty console), "System"
          (/Library/Keychains/System.keychain), "root"
          (SystemRootCertificates.keychain), or "all" (System and root,
          plus login when a console user is present). Ignored on Linux,
          which always enumerates every available certificate. Defaults
          to "all".
        default: "all"
      expiring_within_days:
        type: int32
        displayName: Expiring Within Days
        description: >
          Only return certificates expiring within this many days. Set to
          0 to return all certificates regardless of expiry. Useful for
          compliance audits of soon-to-expire certificates.
        default: 0
        validation:
          minimum: 0

  result:
    columns:
      - name: subject
        type: string
        description: >
          The certificate's Subject distinguished name, rendered by the OS's
          own name printer (CryptoAPI simple display name on Windows,
          OpenSSL/libcrypto's default name rendering on Linux and macOS
          System/root reads, the `security find-certificate` subprocess's
          `subject=` line on the macOS login keychain).
        values: free text (distinguished name)
        example: "Logitech Inc"
        platforms: [windows, linux, darwin]
      - name: issuer
        type: string
        description: >
          The certificate's Issuer distinguished name, rendered the same way
          as subject.
        values: free text (distinguished name)
        example: "DigiCert Trusted G4 Code Signing RSA4096 SHA384 2021 CA1"
        platforms: [windows, linux, darwin]
      - name: thumbprint
        type: string
        description: >
          SHA-1 fingerprint of the certificate's DER encoding, uppercase hex
          with no separators -- the identifier `details`/`delete` match
          against (the request parameter is case-insensitive, this column is
          always uppercase). "(unknown)" when the row's identity could not be
          established (a failed/timed-out per-block parse) and "(skipped)" for
          a Linux file that could not be read at all.
        values: 40 uppercase hex characters, or "(unknown)"/"(skipped)"
        example: "FBD3B2C0991549EC5FB12FA1A994D2E0C32D8057"
        platforms: [windows, linux, darwin]
      - name: not_before
        type: string
        description: Validity-period start date, YYYY-MM-DD (no time-of-day).
        values: "date (YYYY-MM-DD), or \"(unknown)\" when the source date could not be parsed"
        example: "2025-01-09"
        platforms: [windows, linux, darwin]
      - name: not_after
        type: string
        description: >
          Validity-period end date, YYYY-MM-DD. Also the field
          `expiring_within_days` filters on.
        values: "date (YYYY-MM-DD), or \"(unknown)\" when the source date could not be parsed"
        example: "2026-01-09"
        platforms: [windows, linux, darwin]
      - name: serial
        type: string
        description: >
          Certificate serial number as hex text, via the OS's own serial
          renderer (Windows: little-endian byte reversal; Linux/macOS:
          `i2a_ASN1_INTEGER` or the openssl `-serial` line).
        values: free text (hex)
        example: "09CFB6DE3AB5124757FFEFDF3759BBF2"
        platforms: [windows, linux, darwin]
      - name: store
        type: string
        description: Which store/keychain/directory the row was read from.
        values: "Windows: MY, ROOT, CA, Trust. macOS: System.keychain, SystemRootCertificates.keychain, login.keychain-db. Linux: the literal path \"/etc/ssl/certs\" for every row."
        example: "ROOT"
        platforms: [windows, linux, darwin]
      - name: key_usage
        type: string
        description: >
          Comma-separated X.509 Key Usage extension names, or "(none)" when
          the extension is absent, empty, or could not be read.
        values: "comma-separated usage names, or \"(none)\""
        example: "Digital Signature"
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy: [store, issuer]
      operations: [count]

  visualization:
    # Best demoed with `expiring_within_days: 90` to focus the chart on
    # certs that need renewal attention. With the default expiry filter
    # of 0 the same chart shows top issuers across the entire estate.
    type: pie
    processor: single_series
    title: Certificates by issuer
    labelField: 1       # issuer — typically a CA distinguished name
    maxCategories: 8    # collapse the long tail into "Other"
    valueLabel: Certificates

  readablePayload: "List certificates (store=${store}, expiring within ${expiring_within_days} days)"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [certificates]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.certificates.details
  displayName: Certificate Details
  version: 1.1.0
  description: >
    Retrieve full details for a specific certificate identified by its
    SHA-1 thumbprint. Searches all available certificate stores on the
    device.
  tags: [security, certificates, diagnostics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: certificates
    action: details
    concurrency: per-device

  parameters:
    type: object
    required: [thumbprint]
    properties:
      thumbprint:
        type: string
        displayName: Certificate Thumbprint
        description: >
          SHA-1 thumbprint (hex string, no colons) of the certificate
          to retrieve. Case-insensitive.
      store:
        type: string
        displayName: Certificate Store
        description: >
          On macOS, restrict the search to one store: "login" (the
          current console user's login keychain -- returns
          not_available|no console session when nobody is logged in at
          the console, or not_available|<reason> when the console user
          could not be determined; in the latter case the search result
          is PARTIAL and never a definitive status|not_found, because
          the login keychain was not opened), "System" (/Library/Keychains/System.keychain),
          "root" (SystemRootCertificates.keychain), or "all" (System
          and root, plus login when a console user is present). Ignored
          on Windows and Linux, which always search every store.
          Defaults to "all".
        default: "all"

  result:
    columns:
      - name: subject
        type: string
        description: >
          The certificate's Subject distinguished name, rendered by the OS's
          own name printer (CryptoAPI simple display name on Windows,
          OpenSSL/libcrypto's default name rendering on Linux and macOS
          System/root reads, the `security find-certificate` subprocess's
          `subject=` line on the macOS login keychain).
        values: free text (distinguished name)
        example: "CN=com.apple.systemdefault, O=System Identity"
        platforms: [windows, linux, darwin]
      - name: issuer
        type: string
        description: >
          The certificate's Issuer distinguished name, rendered the same way
          as subject.
        values: free text (distinguished name)
        example: "CN=com.apple.systemdefault, O=System Identity"
        platforms: [windows, linux, darwin]
      - name: thumbprint
        type: string
        description: >
          SHA-1 fingerprint of the certificate's DER encoding, uppercase hex
          with no separators -- always equal to the request's `thumbprint`
          parameter (canonicalized to uppercase) on a matching row.
        values: 40 uppercase hex characters
        example: "0C24DA5DE02640D8924F5C7BCB7D5F734815228D"
        platforms: [windows, linux, darwin]
      - name: not_before
        type: string
        description: Validity-period start date, YYYY-MM-DD (no time-of-day).
        values: "date (YYYY-MM-DD), or \"(unknown)\" when the source date could not be parsed"
        example: "2026-07-18"
        platforms: [windows, linux, darwin]
      - name: not_after
        type: string
        description: Validity-period end date, YYYY-MM-DD.
        values: "date (YYYY-MM-DD), or \"(unknown)\" when the source date could not be parsed"
        example: "2046-07-13"
        platforms: [windows, linux, darwin]
      - name: serial
        type: string
        description: >
          Certificate serial number as hex text, via the OS's own serial
          renderer (Windows: little-endian byte reversal; Linux/macOS:
          `i2a_ASN1_INTEGER` or the openssl `-serial` line).
        values: free text (hex)
        example: "076C11D1"
        platforms: [windows, linux, darwin]
      - name: store
        type: string
        description: Which store/keychain/directory the matching row was found in.
        values: "Windows: MY, ROOT, CA, Trust. macOS: System.keychain, SystemRootCertificates.keychain, login.keychain-db. Linux: the literal path \"/etc/ssl/certs\"."
        example: "System.keychain"
        platforms: [windows, linux, darwin]
      - name: key_usage
        type: string
        description: >
          Comma-separated X.509 Key Usage extension names, or "(none)" when
          the extension is absent, empty, or could not be read.
        values: "comma-separated usage names, or \"(none)\""
        example: "Digital Signature, Key Encipherment, Data Encipherment"
        platforms: [windows, linux, darwin]

  readablePayload: "Get certificate details (thumbprint=${thumbprint})"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [certificates]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.certificates.delete
  displayName: Delete Certificate
  version: 1.1.0
  description: >
    Delete a certificate from a system store by SHA-1 thumbprint. On
    Windows this targets a specific named store (defaults to MY). On
    Linux it removes the matching PEM/CRT file from /etc/ssl/certs/.
    On macOS it uses the security CLI to delete from System.keychain by
    default; store=root is rejected as unsupported (returns a non-zero
    exit code) because SystemRootCertificates.keychain is sealed by
    System Integrity Protection on modern macOS and cannot actually be
    modified. A macOS delete verifies the certificate is actually absent
    from the target keychain afterward before reporting success.
    This is a destructive action and requires approval.
  tags: [security, certificates, remediation]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: certificates
    action: delete
    concurrency: per-device

  parameters:
    type: object
    required: [thumbprint]
    properties:
      thumbprint:
        type: string
        displayName: Certificate Thumbprint
        description: >
          SHA-1 thumbprint (hex string, no colons) of the certificate
          to delete. Case-insensitive.
      store:
        type: string
        displayName: Certificate Store
        description: >
          The certificate store to delete from. On Windows: MY, ROOT, CA,
          or Trust. Defaults to "MY". On macOS: "MY" (the default) or
          "System" deletes from /Library/Keychains/System.keychain,
          matching prior behaviour. "root" is REJECTED (non-zero exit,
          unsupported) -- SystemRootCertificates.keychain is sealed by
          System Integrity Protection on modern macOS and cannot actually
          be modified, so attempting it would report a change that never
          took effect. "login" and "all" are also not supported for
          delete and are rejected with an error rather than silently
          deleting from an unintended store, as is any other unrecognized
          value. Ignored on Linux.
        default: "MY"

  result:
    columns:
      - name: status
        type: string
        description: >
          A successful macOS delete emits status|deleted; a delete targeting
          a certificate already provably absent from the keychain emits
          status|not_found (rc 0), matching the Windows/Linux contract for an
          absent cert. store=root is rejected with error|MESSAGE
          (SystemRootCertificates.keychain is sealed by System Integrity
          Protection). Every other macOS rejection or failure -- an
          unsupported store, a failed delete command, or a post-delete
          verification that still finds the certificate or could not re-read
          the keychain -- also emits error|MESSAGE. Windows and Linux always
          emit status|deleted, status|delete_failed, or status|not_found.
        values: "status|deleted, status|not_found, status|delete_failed (Windows/Linux only), error|<message> (any OS: bad thumbprint, unsupported/rejected store, or a macOS delete that could not be verified), not_available|<reason> (macOS only, pre-validation)"
        example: "error|thumbprint parameter required"
        platforms: [windows, linux, darwin]

  readablePayload: "Delete certificate ${thumbprint} from store ${store}"

  gather:
    ttlSeconds: 60

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [certificates]

status:
  phase: active
