## Package Inventory Definitions
## Reports which package managers are present on an endpoint and, on macOS,
## the Homebrew formulae and casks installed. Read-only, zero subprocess.
## Plugin: pkg_inventory | Actions: managers, packages
##
## Sources by platform:
##   Linux:   managers -- package-manager identity and manager-level config
##            facts only (tool presence for dpkg/apt/rpm/dnf/pacman/apk, the
##            dpkg architecture list, apt/dnf source-file counts, pacman.conf
##            and mirrorlist line counts, apk repository counts).
##            packages -- UNSUPPORTED by design: installed_apps owns the Linux
##            package roster, and this plugin never enumerates an individual
##            Linux package in any form.
##   macOS:   managers/packages -- Homebrew Library/Taps, Cellar and Caskroom
##            directory names under BOTH /opt/homebrew (Apple silicon) and
##            /usr/local (Intel).
##   Windows: PLANNED this release -- both actions report
##            `status|<action>|unsupported|windows:planned`. The Chocolatey and
##            winget legs follow as their own PR.
##
## SCOPE: Machine scope only: per-user package stores are out of scope, deferred to the user-context bridge.
## No overlap claim with installed_apps on macOS: Homebrew casks install .app
## bundles that installed_apps' macOS `list` also reports via system_profiler;
## this plugin adds the manager identity and the cask version.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.software.package_managers
  displayName: Package Manager Inventory
  version: 1.0.0
  description: >
    Reports which package managers are present on the endpoint and their
    manager-level configuration facts, read from the filesystem with no
    subprocess. Linux reports dpkg, apt, rpm, dnf, pacman and apk identity
    and config facts (architecture list, source-file and repository counts)
    and never a package roster; macOS reports each Homebrew prefix found
    under /opt/homebrew and /usr/local with tap, formula and cask counts.
    Windows is planned this release and reports
    `status|managers|unsupported|windows:planned`. Machine scope only:
    per-user package stores are out of scope, deferred to the user-context
    bridge. A status row always comes first; a genuinely absent manager
    produces no manager row, while an unreadable location makes the status
    row `constrained` with a failure token.
  tags: [software, package-managers, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: pkg_inventory
    action: managers
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # status|managers|<supported|constrained|unsupported>|<failure tokens or ->
    # manager|<name>|<present|unavailable>|<version or ->|<root_path or ->|<facts k=v;... or ->|<reason or ->
    # Two row shapes on one stream, discriminated by field 0; a status row
    # populates only row_kind..version and leaves the remaining columns unset.
    columns:
      - name: row_kind
        type: string
        description: 'Row shape discriminator. Values: status (exactly one per result, always first), manager (one per package manager detected).'
        values: [status, manager]
        example: manager
        platforms: [windows, linux, darwin]
      - name: name
        type: string
        description: 'Manager rows: the package manager. Values: dpkg, apt, rpm, dnf, pacman, apk, homebrew. Status rows: the action name, always managers.'
        example: dpkg
        platforms: [windows, linux, darwin]
      - name: state
        type: string
        description: 'Manager rows: whether the manager was readable. Values: present, unavailable (detected but nothing could be read; see reason). Status rows: the completeness level. Values: supported, constrained (at least one read failed), unsupported (Windows planned leg).'
        values: [present, unavailable, supported, constrained, unsupported]
        example: present
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: 'Manager rows: the manager version, or "-" (versions are not read in this release, so always "-"). Status rows: the comma-joined failure tokens, or "-" when none. Tokens read <os>:<source>:<detail> (e.g. linux:apt_sources_d:permission_denied) or windows:planned.'
        example: "-"
        platforms: [windows, linux, darwin]
      - name: root_path
        type: string
        description: 'Manager rows only: the logical root the facts were read from (e.g. /etc/apt, /opt/homebrew), never an injected test root; "-" when the manager has no single root (rpm).'
        example: /etc/apt
        platforms: [linux, darwin]
      - name: facts
        type: string
        description: 'Manager rows only: semicolon-separated key=value manager-level facts, or "-". Keys by manager: dpkg architectures=<a,b>; apt sources_list_lines, sources_d_files; dnf repo_files, dnf_conf_lines; pacman pacman_conf_lines, mirrors; apk repositories, tagged, arch; homebrew taps, formulae, casks. A key is omitted when its source could not be read.'
        example: "sources_list_lines=0;sources_d_files=1"
        platforms: [linux, darwin]
      - name: reason
        type: string
        description: 'Manager rows only: failure tokens for an unavailable manager, or "-".'
        example: "-"
        platforms: [linux, darwin]
    aggregation:
      groupBy:
        - name
      operations:
        - count

  readablePayload: "List package managers"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [pkg_inventory]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.software.package_manager_packages
  displayName: Package Manager Packages
  version: 1.0.0
  description: >
    Reports the packages installed under a package manager, read from
    directory names with no subprocess. macOS reports Homebrew formulae
    (Cellar/<formula>/<version>) and casks (Caskroom/<cask>/<version>) over
    both /opt/homebrew and /usr/local. Linux is UNSUPPORTED by design:
    installed_apps owns the Linux package roster, so this action reports
    `status|packages|unsupported|linux:owned_by_installed_apps` and no
    package row. Windows is planned this release and reports
    `status|packages|unsupported|windows:planned`. Machine scope only:
    per-user package stores are out of scope, deferred to the user-context
    bridge. Homebrew casks install .app bundles that installed_apps' macOS
    `list` also reports via system_profiler, so this action does not claim
    to be disjoint from it; it adds the manager identity and the cask
    version.
  tags: [software, package-managers, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: pkg_inventory
    action: packages
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # status|packages|<supported|constrained|unsupported>|<failure tokens or ->
    # package|homebrew|<id>|<version>|<formula|cask>
    # Two row shapes on one stream, discriminated by field 0; a status row
    # populates only row_kind..version and leaves the kind column unset.
    columns:
      - name: row_kind
        type: string
        description: 'Row shape discriminator. Values: status (exactly one per result, always first), package (one per installed formula or cask version directory).'
        values: [status, package]
        example: package
        platforms: [windows, linux, darwin]
      - name: manager
        type: string
        description: 'Package rows: the owning package manager, always homebrew in this release. Status rows: the action name, always packages.'
        example: homebrew
        platforms: [windows, linux, darwin]
      - name: id
        type: string
        description: 'Package rows: the formula or cask directory name (e.g. openssl@3). Status rows: the completeness level. Values: supported, constrained (at least one read failed or the row cap was hit), unsupported (Linux by design, Windows planned).'
        example: openssl@3
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: 'Package rows: the version directory name under the formula or cask (cask versions may carry commas or colons). Status rows: the comma-joined failure tokens, or "-" when none. Tokens read <os>:<source>:<detail> (e.g. macos:homebrew_cellar:row_cap), linux:owned_by_installed_apps or windows:planned.'
        example: "3.4.1"
        platforms: [windows, linux, darwin]
      - name: kind
        type: string
        description: 'Package rows only: whether the directory came from the Cellar or the Caskroom. Values: formula, cask.'
        values: [formula, cask]
        example: formula
        platforms: [darwin]
    aggregation:
      groupBy:
        - kind
      operations:
        - count

  readablePayload: "List package manager packages"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [pkg_inventory]

status:
  phase: active
