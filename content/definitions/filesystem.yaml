## Filesystem Definitions
## Provides secure file and directory operations: existence checks,
## directory listing, file hashing, file reading, and temp file creation.
## All paths are canonicalized to prevent traversal attacks.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.exists
  displayName: Check Path Exists
  version: 0.3.0
  description: >
    Check whether a filesystem path exists on the endpoint. Reports
    the existence, type (file, directory, other), and size. Paths are
    canonicalized via std::filesystem::canonical() to resolve symlinks.
    An optional base_dir parameter restricts access to a subtree.
  tags: [filesystem, diagnostics, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: filesystem
    action: exists
    concurrency: per-device

  parameters:
    type: object
    required: [path]
    properties:
      path:
        type: string
        displayName: Path
        description: The filesystem path to check.
        validation:
          maxLength: 4096
      base_dir:
        type: string
        displayName: Base Directory
        description: >
          Optional. If set, the path must resolve within this directory.
          Prevents directory traversal outside the allowed subtree.
        validation:
          maxLength: 4096

  result:
    columns:
      - name: exists
        type: bool
        description: Whether the path exists on the endpoint.
        values: [true, false]
        example: "true"
        platforms: [windows, linux, darwin]
      - name: type
        type: string
        description: >
          The kind of filesystem entry found. Only emitted when exists is
          true.
        values: [file, directory, other]
        example: file
        platforms: [windows, linux, darwin]
      - name: size
        type: int64
        description: >
          Size in bytes for a file entry; 0 for a directory or an "other"
          entry. Only emitted when exists is true.
        values: integer (bytes)
        example: "1405"
        platforms: [windows, linux, darwin]

  readablePayload: "Check if path exists: ${path}"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.list_dir
  displayName: List Directory Contents
  version: 0.3.0
  description: >
    List the contents of a directory on the endpoint, up to 1000 entries.
    Reports each entry's filename, type (file, directory, symlink, other),
    and size. Paths are canonicalized; optional base_dir restricts access.
  tags: [filesystem, diagnostics, inventory]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: filesystem
    action: list_dir
    concurrency: per-device

  parameters:
    type: object
    required: [path]
    properties:
      path:
        type: string
        displayName: Directory Path
        description: The directory to list.
        validation:
          maxLength: 4096
      base_dir:
        type: string
        displayName: Base Directory
        description: >
          Optional. Restricts access to paths within this directory.
        validation:
          maxLength: 4096

  result:
    columns:
      - name: entry_name
        type: string
        description: Filename of one directory entry (not a full path).
        values: free text
        example: hosts
        platforms: [windows, linux, darwin]
      - name: entry_type
        type: string
        description: The entry's kind.
        values: [file, directory, symlink, other]
        example: file
        platforms: [windows, linux, darwin]
      - name: entry_size
        type: int64
        description: Size in bytes; 0 for directories and symlinks.
        values: integer (bytes)
        example: "1405"
        platforms: [windows, linux, darwin]

  readablePayload: "List directory: ${path}"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.file_hash
  displayName: Compute File Hash
  version: 0.3.0
  description: >
    Compute the SHA-256 (default) or SHA-1 hash of a file on the endpoint.
    Uses BCrypt on Windows and sha256sum/shasum on POSIX. Files larger
    than 10 GB are rejected. Returns the hex digest, algorithm used, and
    file size in bytes.
  tags: [filesystem, security, integrity, compliance, ioc]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: filesystem
    action: file_hash
    concurrency: per-device

  parameters:
    type: object
    required: [path]
    properties:
      path:
        type: string
        displayName: File Path
        description: The file to hash.
        validation:
          maxLength: 4096
      algorithm:
        type: string
        displayName: Hash Algorithm
        description: The hash algorithm to use.
        default: "sha256"
        validation:
          enum: ["sha256", "sha1"]
      base_dir:
        type: string
        displayName: Base Directory
        description: >
          Optional. Restricts access to files within this directory.
        validation:
          maxLength: 4096

  result:
    columns:
      - name: hash
        type: string
        description: Hex-encoded digest of the file's contents.
        values: free text (hex digest)
        example: "9321feab332edbba521c7ea3eb978d9844cb4f62a4730dab9cf60fb79649037d"
        platforms: [windows, linux, darwin]
      - name: algorithm
        type: string
        description: The hash algorithm actually used.
        values: [sha256, sha1]
        example: sha256
        platforms: [windows, linux, darwin]
      - name: size
        type: int64
        description: File size in bytes at the time of hashing.
        values: integer (bytes)
        example: "1405"
        platforms: [windows, linux, darwin]

  readablePayload: "Compute ${algorithm} hash of ${path}"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.read
  displayName: Read File Contents
  version: 0.3.0
  description: >
    Read lines from a text file on the endpoint with pagination support.
    Returns lines with 1-based line numbers, total line count, and file
    size. Binary files are detected and rejected. Maximum file size is
    100 MB, maximum lines per request is 10000. Paths are canonicalized;
    optional base_dir restricts access.
  tags: [filesystem, diagnostics, log-analysis]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: filesystem
    action: read
    concurrency: per-device

  parameters:
    type: object
    required: [path]
    properties:
      path:
        type: string
        displayName: File Path
        description: The text file to read.
        validation:
          maxLength: 4096
      offset:
        type: int32
        displayName: Start Line
        description: >
          1-based line number to start reading from. Default: 1.
        default: 1
        validation:
          minimum: 1
      limit:
        type: int32
        displayName: Line Limit
        description: >
          Maximum number of lines to return. Default: 100, max: 10000.
        default: 100
        validation:
          minimum: 1
          maximum: 10000
      base_dir:
        type: string
        displayName: Base Directory
        description: >
          Optional. Restricts access to files within this directory.
        validation:
          maxLength: 4096

  result:
    columns:
      - name: line_number
        type: int32
        description: 1-based line number of this returned line.
        values: integer
        example: "1"
        platforms: [windows, linux, darwin]
      - name: content
        type: string
        description: >
          The line's text, with a trailing CRLF's carriage return stripped.
        values: free text
        example: "# Copyright (c) 1993-2009 Microsoft Corp."
        platforms: [windows, linux, darwin]
      - name: total_lines
        type: int32
        description: >
          Total number of lines in the file, counted past the returned
          window.
        values: integer
        example: "37"
        platforms: [windows, linux, darwin]
      - name: file_size
        type: int64
        description: File size in bytes.
        values: integer (bytes)
        example: "1405"
        platforms: [windows, linux, darwin]

  readablePayload: "Read file ${path} (offset=${offset}, limit=${limit})"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.create_temp
  displayName: Create Temporary File
  version: 0.3.0
  description: >
    Create a secure temporary file on the endpoint with restrictive
    permissions (mode 0600 on POSIX, owner-only DACL on Windows).
    Uses mkstemps/CreateFile+CREATE_NEW to prevent TOCTOU races.
    Optionally deletes the file immediately (persist=false) for use
    as a unique path generator.
  tags: [filesystem, admin, staging]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: filesystem
    action: create_temp
    concurrency: per-device

  parameters:
    type: object
    properties:
      prefix:
        type: string
        displayName: Filename Prefix
        description: Prefix for the temp file name.
        default: "yuzu-"
        validation:
          maxLength: 64
      suffix:
        type: string
        displayName: Filename Suffix
        description: Suffix/extension for the temp file name.
        default: ".tmp"
        validation:
          maxLength: 32
      directory:
        type: string
        displayName: Target Directory
        description: >
          Optional. Create the temp file in this directory instead of
          the system default temp directory.
        validation:
          maxLength: 4096
      persist:
        type: string
        displayName: Persist
        description: >
          If "true" (default), the file is kept. If "false", the file
          is deleted after creation (useful for generating unique paths).
        default: "true"
        validation:
          enum: ["true", "false"]

  result:
    columns:
      - name: path
        type: string
        description: Full path to the created temporary file.
        values: free text (path)
        example: "D:\\yuzu-dev\\tmp\\yuzu-964a901bfe197402d93f51a7653b0697.tmp"
        platforms: [windows, linux, darwin]
      - name: persist
        type: bool
        description: Echoes the persist parameter — whether the file was kept.
        values: [true, false]
        example: "true"
        platforms: [windows, linux, darwin]

  readablePayload: "Create temporary file (prefix=${prefix}, suffix=${suffix})"

  gather:
    ttlSeconds: 60

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.create_temp_dir
  displayName: Create Temporary Directory
  version: 0.3.0
  description: >
    Create a secure temporary directory on the endpoint with restrictive
    permissions (mode 0700 on POSIX, owner-only DACL on Windows).
    Optionally deletes the directory immediately (persist=false) for
    use as a unique path generator.
  tags: [filesystem, admin, staging]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: filesystem
    action: create_temp_dir
    concurrency: per-device

  parameters:
    type: object
    properties:
      prefix:
        type: string
        displayName: Directory Prefix
        description: Prefix for the temp directory name.
        default: "yuzu-"
        validation:
          maxLength: 64
      directory:
        type: string
        displayName: Parent Directory
        description: >
          Optional. Create the temp directory inside this parent instead
          of the system default temp directory.
        validation:
          maxLength: 4096
      persist:
        type: string
        displayName: Persist
        description: >
          If "true" (default), the directory is kept. If "false", deleted
          after creation.
        default: "true"
        validation:
          enum: ["true", "false"]

  result:
    columns:
      - name: path
        type: string
        description: Full path to the created temporary directory.
        values: free text (path)
        example: "D:\\yuzu-dev\\tmp\\yuzu-3849a33da8fc555d407ac0f2c67356f9"
        platforms: [windows, linux, darwin]
      - name: persist
        type: bool
        description: >
          Echoes the persist parameter — whether the directory was kept.
        values: [true, false]
        example: "true"
        platforms: [windows, linux, darwin]

  readablePayload: "Create temporary directory (prefix=${prefix})"

  gather:
    ttlSeconds: 60

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.get_acl
  displayName: Get File ACL / Permissions
  version: 0.3.0
  description: >
    Retrieve access control list (ACL) or permissions for a file or
    directory. On Windows, returns the SDDL representation and individual
    ACE entries (allow/deny, account, access mask). On Linux/macOS,
    returns POSIX owner, group, and permission mode (rwxrwxrwx).
  tags: [filesystem, security, compliance, acl]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: filesystem
    action: get_acl
    concurrency: per-device

  parameters:
    type: object
    required: [path]
    properties:
      path:
        type: string
        displayName: Path
        description: The file or directory to inspect.
        validation:
          maxLength: 4096
      base_dir:
        type: string
        displayName: Base Directory
        description: >
          Optional. Restricts access to paths within this directory.
        validation:
          maxLength: 4096

  result:
    columns:
      - name: sddl
        type: string
        description: >
          Windows-only. SDDL string encoding the owner and DACL. Absent on
          POSIX.
        values: free text (SDDL)
        example: "O:BAD:AI(A;;FA;;;SY)(A;ID;FA;;;SY)(A;ID;FA;;;BA)"
        platforms: [windows]
      - name: ace_type
        type: string
        description: >
          Windows-only. One access-control-entry row's effect; the plugin
          emits one ace row per DACL entry.
        values: [allow, deny, other]
        example: allow
        platforms: [windows]
      - name: account
        type: string
        description: >
          Windows-only. The DOMAIN\account the ACE names, or the SID string
          when the account cannot be resolved.
        values: free text
        example: "NT AUTHORITY\\SYSTEM"
        platforms: [windows]
      - name: access_mask
        type: string
        description: Windows-only. The ACE's access mask, hex-formatted.
        values: hex integer
        example: "0x001f01ff"
        platforms: [windows]
      - name: owner
        type: string
        description: >
          POSIX-only. The file's owning user name, or the numeric uid when
          it cannot be resolved.
        values: free text
        example: root
        platforms: [linux, darwin]
      - name: group
        type: string
        description: >
          POSIX-only. The file's owning group name, or the numeric gid when
          it cannot be resolved.
        values: free text
        example: wheel
        platforms: [linux, darwin]
      - name: permissions
        type: string
        description: POSIX-only. rwx permission string for owner/group/other.
        values: 9-character rwx string
        example: "rw-r--r--"
        platforms: [linux, darwin]
      - name: mode
        type: string
        description: POSIX-only. Octal permission bits.
        values: 4-digit octal
        example: "0644"
        platforms: [linux, darwin]

  readablePayload: "Get ACL/permissions for ${path}"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.3.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.get_signature
  displayName: Check Code Signature
  version: 0.4.0
  description: >
    Verify the code signature of an executable, DLL, or app bundle.
    On Windows, uses WinVerifyTrust to check the Authenticode signature
    chain (valid, unsigned, distrusted, untrusted). On macOS, runs
    `codesign --verify --deep --strict` and reports an honest macOS
    signature status (valid, unsigned, invalid, unknown) — a different
    vocabulary from Authenticode, since codesign/Gatekeeper model trust
    differently than WinVerifyTrust. On macOS, `valid` means the code
    signature's seal is INTACT (integrity: the binary/bundle is unmodified
    since signing) — it does NOT mean the signer is trusted, notarized, or
    accepted by Gatekeeper; an ad-hoc or self-signed binary reports `valid`.
    This is a weaker assurance than the Windows `valid`, which also validates
    the certificate chain to a trusted root. Returns error on Linux.
  tags: [filesystem, security, compliance, authenticode, codesign]

spec:
  type: question
  platforms: [windows, darwin]

  execution:
    plugin: filesystem
    action: get_signature
    concurrency: per-device

  parameters:
    type: object
    required: [path]
    properties:
      path:
        type: string
        displayName: File Path
        description: The executable, DLL, or app bundle to verify.
        validation:
          maxLength: 4096
      base_dir:
        type: string
        displayName: Base Directory
        description: >
          Optional. Restricts access to files within this directory.
        validation:
          maxLength: 4096

  result:
    columns:
      - name: signature_status
        type: string
        description: >
          Signature verdict. On Windows: valid/unsigned/distrusted/untrusted
          (Authenticode chain trust). On macOS: valid/unsigned/invalid/unknown
          — here `valid` means the code signature's seal is intact
          (INTEGRITY only: unmodified since signing), NOT that the code is
          trusted or notarized; an ad-hoc/self-signed binary reports `valid`.
        values: >-
          windows: valid, unsigned, distrusted, untrusted,
          security_settings_blocked, error_0x<hex>; macos: valid, unsigned,
          invalid, unknown
        example: unsigned
        platforms: [windows, darwin]

  readablePayload: "Check code signature of ${path}"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.4.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.find_by_hash
  displayName: Find File By SHA256 Hash
  version: 0.3.0
  description: >
    Search a directory tree for files matching a specific SHA256 hash.
    Useful for IOC hunting, malware detection, and file integrity
    verification. Walks the directory recursively up to the specified
    depth limit. Returns matching file paths and sizes.
  tags: [filesystem, security, ioc, compliance, hash]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: filesystem
    action: find_by_hash
    concurrency: per-device

  parameters:
    type: object
    required: [directory, sha256]
    properties:
      directory:
        type: string
        displayName: Search Directory
        description: The root directory to search.
        validation:
          maxLength: 4096
      sha256:
        type: string
        displayName: SHA256 Hash
        description: >
          The SHA256 hex digest to search for (case-insensitive).
        validation:
          minLength: 64
          maxLength: 64
      max_depth:
        type: int32
        displayName: Maximum Depth
        description: >
          Maximum directory recursion depth. Default: 3, max: 10.
        default: 3
        validation:
          minimum: 1
          maximum: 10

  result:
    columns:
      - name: path
        type: string
        description: Full path of a file whose SHA-256 matches the target hash.
        values: free text (path)
        example: "C:\\Windows\\System32\\drivers\\etc\\hosts"
        platforms: [windows, linux, darwin]
      - name: size
        type: int64
        description: Matching file's size in bytes.
        values: integer (bytes)
        example: "1405"
        platforms: [windows, linux, darwin]
      - name: matches_found
        type: int32
        description: >
          Total number of matching files found, repeated on the trailing
          summary row.
        values: integer
        example: "1"
        platforms: [windows, linux, darwin]

  readablePayload: "Find files with SHA256 ${sha256} in ${directory}"

  gather:
    ttlSeconds: 600

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.3.0
    requiredPlugins: [filesystem]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.filesystem.get_version_info
  displayName: Get File Version Info
  version: 0.5.0
  description: >
    Extract version information from an executable or app bundle. On
    Windows, reads the PE version resource (FileVersion, ProductVersion,
    and descriptive fields such as CompanyName/FileDescription/ProductName)
    and returns an error if the file carries no version resource. On
    macOS, reads CFBundleVersion and CFBundleShortVersionString from the
    bundle's Info.plist via `plutil -extract ... raw` — plutil handles both
    binary and XML plists, so this works on any .app regardless of how its
    Info.plist is encoded — and reports an honest version_status|not_available
    when the target has no Info.plist or no version keys within it, rather
    than failing. Returns error on Linux.
  tags: [filesystem, inventory, compliance]

spec:
  type: question
  platforms: [windows, darwin]

  execution:
    plugin: filesystem
    action: get_version_info
    concurrency: per-device

  parameters:
    type: object
    required: [path]
    properties:
      path:
        type: string
        displayName: File Path
        description: >
          The executable, DLL, or app bundle to inspect. On macOS this may
          be a .app bundle directory or an Info.plist file directly.
        validation:
          maxLength: 4096
      base_dir:
        type: string
        displayName: Base Directory
        description: >
          Optional. Restricts access to files within this directory.
        validation:
          maxLength: 4096

  result:
    columns:
      - name: file_version
        type: string
        description: >
          Windows: PE FileVersion (four-part). macOS: CFBundleVersion, the
          build number. Absent when not carried by the target.
        values: free text (version string)
        example: "6.2.26100.9278"
        platforms: [windows, darwin]
      - name: product_version
        type: string
        description: >
          Windows: PE ProductVersion (four-part). macOS:
          CFBundleShortVersionString, the marketing version. Absent when not
          carried by the target.
        values: free text (version string)
        example: "10.0.26100.9278"
        platforms: [windows, darwin]
      - name: company_name
        type: string
        description: Windows-only. PE CompanyName string resource, when present.
        values: free text
        example: "Microsoft Corporation"
        platforms: [windows]
      - name: file_description
        type: string
        description: >
          Windows-only. PE FileDescription string resource, when present.
        values: free text
        example: Notepad
        platforms: [windows]
      - name: internal_name
        type: string
        description: Windows-only. PE InternalName string resource, when present.
        values: free text
        example: Notepad
        platforms: [windows]
      - name: original_filename
        type: string
        description: >
          Windows-only. PE OriginalFilename string resource, when present.
        values: free text
        example: "NOTEPAD.EXE.MUI"
        platforms: [windows]
      - name: product_name
        type: string
        description: Windows-only. PE ProductName string resource, when present.
        values: free text
        example: "Microsoft® Windows® Operating System"
        platforms: [windows]
      - name: legal_copyright
        type: string
        description: >
          Windows-only. PE LegalCopyright string resource, when present.
        values: free text
        example: "© Microsoft Corporation. All rights reserved."
        platforms: [windows]
      - name: version_status
        type: string
        description: >
          macOS-only honest-empty marker: emitted as not_available when the
          target has no Info.plist or no version keys within it; absent
          otherwise (Windows never emits this field).
        values: [not_available]
        example: not_available
        platforms: [darwin]

  readablePayload: "Get version info for ${path}"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
