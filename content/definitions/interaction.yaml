## Desktop User Interaction Plugin Definitions
## Provides desktop notifications, message box dialogs, text input
## dialogs, multi-question surveys, and Do Not Disturb mode on
## Windows, Linux, and macOS endpoints.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.interaction.notify
  displayName: Desktop Notification
  version: 1.0.0
  description: >
    Shows a desktop notification/toast on the endpoint. On Windows uses
    ShellNotifyIcon balloon notifications, on Linux uses notify-send,
    and on macOS uses osascript 'display notification'. Supports info,
    warning, and error severity levels.
  tags: [interaction, notification, user]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: interaction
    action: notify
    concurrency: per-device

  parameters:
    type: object
    required: [title, message]
    properties:
      title:
        type: string
        description: Notification title text
        maxLength: 128
      message:
        type: string
        description: Notification body text
        maxLength: 512
      type:
        type: string
        description: "Notification severity: info, warning, or error"
        enum: [info, warning, error]
        default: info

  result:
    columns:
      - name: status
        type: string
        description: >
          Outcome of the notification attempt: ok (shown, or handed to the
          OS successfully), suppressed|<reason> (Do Not Disturb was
          active), error|<reason> (missing/invalid parameter, or an
          unsupported platform), or unavailable|<reason> (macOS/Linux: no
          reachable GUI session).
        values: "ok, suppressed|<reason>, error|<reason>, unavailable|<reason> (reason is free text)"
        example: "error|missing required parameter: title"
        platforms: [windows, linux, darwin]

  readablePayload: "Show desktop notification: {{title}}"

  gather:
    ttlSeconds: 30

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [interaction]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.interaction.message_box
  displayName: Message Box Dialog
  version: 1.1.0
  description: >
    Shows a modal message box dialog on the endpoint desktop. On Windows
    uses MessageBoxW, on Linux uses zenity, and on macOS uses osascript
    'display dialog'. On success returns which button the user clicked in
    the `response` column (ok, cancel, yes, or no); the dialog blocks until
    the user responds. On macOS, when the agent cannot reach a desktop
    session (it runs as a GUI-less root LaunchDaemon, or the user is not
    logged in), it reports `status|not_reachable` instead of a fabricated
    button — earlier agents (interaction plugin < 0.3.0) wrongly reported
    `response|ok` for an undelivered dialog.
  tags: [interaction, dialog, user]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: interaction
    action: message_box
    concurrency: per-device

  parameters:
    type: object
    required: [title, message]
    properties:
      title:
        type: string
        description: Dialog title text
        maxLength: 128
      message:
        type: string
        description: Dialog body text
        maxLength: 1024
      buttons:
        type: string
        description: "Button configuration: ok, okcancel, or yesno"
        enum: [ok, okcancel, yesno]
        default: ok

  result:
    columns:
      - name: response
        type: string
        description: >
          The button the operator/user clicked on the dialog. Absent when
          the dialog could not be shown — see status.
        values: "ok, cancel, yes, no"
        example: "ok"
        platforms: [windows, linux, darwin]
      - name: status # set on a validation failure (every platform), the macOS
        type: string # not_reachable sentinel, or a Linux zenity delivery
                     # failure. Empty on a normal button-press response.
        description: >
          Set when no button could be returned: a validation failure
          (missing title/message or a bad buttons value — every platform),
          the macOS not_reachable sentinel (no GUI session), or a Linux
          zenity delivery failure. Empty on a normal button-press response.
        values: "not_reachable, error|<reason>, unavailable|<reason>"
        example: "error|missing required parameter: title"
        platforms: [windows, linux, darwin]

  readablePayload: "Show message box: {{title}} ({{buttons}})"

  gather:
    ttlSeconds: 300

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    # Gates the agent daemon version, NOT the interaction plugin's own version
    # (0.3.0, InteractionPlugin::version()) — no minPluginVersion mechanism
    # exists today. An agent running interaction plugin < 0.3.0 keeps the prior
    # macOS behavior (a false response|ok when undeliverable) rather than being
    # gated out here; the mixed-fleet blend is called out in the description.
    minAgentVersion: 0.1.0
    requiredPlugins: [interaction]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.interaction.input
  displayName: Text Input Dialog
  version: 1.0.0
  description: >
    Shows a text input dialog on the endpoint desktop. On Windows uses
    PowerShell with Microsoft.VisualBasic.Interaction.InputBox, on Linux
    uses zenity --entry, and on macOS uses osascript 'display dialog'
    with default answer. Returns the text entered by the user, or
    indicates cancellation.
  tags: [interaction, dialog, input, user]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: interaction
    action: input
    concurrency: per-device

  parameters:
    type: object
    required: [title, prompt]
    properties:
      title:
        type: string
        description: Dialog title text
        maxLength: 128
      prompt:
        type: string
        description: Prompt text shown above the input field
        maxLength: 512
      default_value:
        type: string
        description: Pre-filled default text in the input field
        maxLength: 256
        default: ""

  result:
    columns:
      - name: response
        type: string
        description: >
          The text the operator/user entered and confirmed. Absent when the
          dialog was cancelled or could not be shown.
        values: free text
        example: "-"
        platforms: [windows, linux, darwin]
      - name: cancelled
        type: bool
        description: >
          true when the user dismissed the dialog without entering text
          (Escape, Cancel, or AppleScript error -128); omitted otherwise.
        values: "true"
        example: "true"
        platforms: [windows, linux, darwin]
      - name: status
        type: string
        description: >
          Set instead of response/cancelled when the dialog never ran: a
          validation failure (every platform), or an unavailable/failed
          dialog on Windows, macOS, or Linux.
        values: "error|<reason>, unavailable|<reason>"
        example: "error|missing required parameter: title"
        platforms: [windows, linux, darwin]

  readablePayload: "Show input dialog: {{title}}"

  gather:
    ttlSeconds: 300

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [interaction]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.interaction.survey
  displayName: User Survey
  version: 1.0.0
  description: >
    Shows a multi-question survey form on the endpoint desktop. On Windows
    uses a PowerShell-generated Windows.Forms dialog with text inputs,
    checkboxes, and combo boxes. On Linux uses sequential zenity dialogs.
    On macOS uses sequential osascript dialogs (display dialog, choose
    from list). Supports three question types: text (free-form input),
    yesno (boolean checkbox/question), and choice (pick from a list).
    Returns numbered answer fields and a question_count. If the user
    cancels at any point, cancelled=true is returned. Respects Do Not
    Disturb mode — if DND is active, the survey is suppressed.
  tags: [interaction, survey, user, form]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: interaction
    action: survey
    concurrency: per-device

  parameters:
    type: object
    required: [title, questions]
    properties:
      title:
        type: string
        description: Survey window title
        maxLength: 128
      questions:
        type: string
        description: >
          JSON array of question objects. Each object has: prompt (string),
          type (text|yesno|choice), and choices (array of strings, required
          when type=choice). Example:
          [{"prompt":"Your name?","type":"text"},
           {"prompt":"Agree?","type":"yesno"},
           {"prompt":"Department","type":"choice","choices":["IT","HR","Eng"]}]
        maxLength: 8192

  result:
    columns:
      - name: cancelled
        type: bool
        description: >
          true when the user dismissed the survey (Cancel, Escape, or
          AppleScript error -128) before answering every question.
        values: "true"
        example: "true"
        platforms: [windows, linux, darwin]
      - name: question_count
        type: int32
        description: >
          The number of questions in the submitted survey. Only emitted
          when the survey completed without cancellation or failure.
        values: integer
        example: "-"
        platforms: [windows, linux, darwin]
      - name: answer_0
        type: string
        description: >
          The answer to question 0 (0-indexed): free text for a text
          question, yes/no for a yesno question, or the chosen item's text
          for a choice question. Omitted if the survey was cancelled or
          could not be shown.
        values: "free text, or yes/no for a yesno question"
        example: "-"
        platforms: [windows, linux, darwin]
      - name: answer_1
        type: string
        description: >
          The answer to question 1 (0-indexed), same convention as
          answer_0. Omitted past question_count-1.
        values: "free text, or yes/no for a yesno question"
        example: "-"
        platforms: [windows, linux, darwin]
      - name: answer_2
        type: string
        description: >
          The answer to question 2 (0-indexed), same convention as
          answer_0. Omitted past question_count-1.
        values: "free text, or yes/no for a yesno question"
        example: "-"
        platforms: [windows, linux, darwin]
      - name: answer_3
        type: string
        description: >
          The answer to question 3 (0-indexed), same convention as
          answer_0. Omitted past question_count-1.
        values: "free text, or yes/no for a yesno question"
        example: "-"
        platforms: [windows, linux, darwin]
      - name: answer_4
        type: string
        description: >
          The answer to question 4 (0-indexed), same convention as
          answer_0. Omitted past question_count-1.
        values: "free text, or yes/no for a yesno question"
        example: "-"
        platforms: [windows, linux, darwin]
      - name: status
        type: string
        description: >
          Set instead of cancelled/answers when the survey never completed:
          a validation failure (every platform, e.g. missing title or
          unparseable questions), a suppressed Do Not Disturb, or an
          undeliverable/unrecognized-response dialog.
        values: "suppressed|<reason>, error|<reason>, unavailable|<reason>"
        example: "error|missing required parameter: title"
        platforms: [windows, linux, darwin]

  readablePayload: "Show survey: {{title}}"

  gather:
    ttlSeconds: 600

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [interaction]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.interaction.set_dnd
  displayName: Set Do Not Disturb
  version: 1.0.0
  description: >
    Enables or disables Do Not Disturb (DND) mode on the endpoint.
    When DND is active, notifications and surveys are suppressed
    (the action returns status=suppressed instead of showing a dialog).
    An optional duration_minutes parameter sets a time-limited DND
    window; after expiry, DND is automatically cleared. DND state is
    persisted in the agent's KV store so it survives agent restarts.
  tags: [interaction, dnd, notification, control]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: interaction
    action: set_dnd
    concurrency: per-device

  parameters:
    type: object
    required: [enabled]
    properties:
      enabled:
        type: string
        description: "Set to 'true' to enable DND, 'false' to disable"
        enum: ["true", "false"]
      duration_minutes:
        type: int32
        description: >
          Optional duration in minutes. If set and enabled=true, DND
          will automatically expire after this many minutes. If 0 or
          omitted, DND remains active indefinitely until explicitly
          disabled.
        default: 0

  result:
    columns:
      - name: dnd_enabled
        type: bool
        description: >
          The DND state after this call — true when DND is now active,
          false when cleared.
        values: "true, false"
        example: "true"
        platforms: [windows, linux, darwin]
      - name: dnd_duration_minutes
        type: int32
        description: >
          The duration parameter echoed back, in minutes. Only emitted
          when DND was enabled with a positive duration_minutes.
        values: integer
        example: "-"
        platforms: [windows, linux, darwin]
      - name: dnd_expires_at
        type: int64
        description: >
          Unix epoch seconds when DND auto-clears. Only emitted alongside
          dnd_duration_minutes (enabled with a positive duration); 0 or
          omitted means indefinite.
        values: "epoch seconds, or omitted"
        example: "-"
        platforms: [windows, linux, darwin]
      - name: status
        type: string
        description: >
          Always ok — set_dnd is a local KV-store write with no external
          dependency and no failure path once dispatched.
        values: "ok"
        example: "ok"
        platforms: [windows, linux, darwin]

  readablePayload: "Set Do Not Disturb: {{enabled}}"

  gather:
    ttlSeconds: 30

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [interaction]

status:
  phase: active
