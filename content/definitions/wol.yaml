## Wake-on-LAN Definitions
## Sends WoL magic packets and checks host reachability after wake.
## Plugin: wol | Actions: wake, check
##
## Sources by platform:
##   Windows: Winsock2 UDP broadcast (ws2_32), ping -n
##   Linux:   POSIX UDP sockets, ping -c
##   macOS:   POSIX UDP sockets, ping -c

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.wol.wake
  displayName: Wake-on-LAN
  version: 1.0.0
  description: >
    Sends a Wake-on-LAN magic packet to the specified MAC address.
    The magic packet consists of 6 bytes of 0xFF followed by the
    target MAC address repeated 16 times, broadcast via UDP.
    The target machine must have WoL enabled in its BIOS/UEFI and
    NIC settings. This is a network action that may wake a powered-off
    device. An optional port parameter can override the default WoL
    port (9).
  tags: [wol, network, power, remote, action]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: wol
    action: wake
    concurrency: per-device

  parameters:
    type: object
    required: [mac]
    properties:
      mac:
        type: string
        displayName: MAC Address
        description: >
          Target MAC address in colon or hyphen-separated format
          (e.g., AA:BB:CC:DD:EE:FF or AA-BB-CC-DD-EE-FF).
        validation:
          minLength: 17
          maxLength: 17
          pattern: "^([0-9A-Fa-f]{2}[:\\-]){5}[0-9A-Fa-f]{2}$"
      port:
        type: string
        displayName: UDP Port
        description: >
          UDP port for the magic packet broadcast. Standard WoL
          port is 9. Some setups use port 7 or other values.
        default: "9"
        validation:
          pattern: "^[0-9]+$"

  result:
    columns:
      - name: status
        type: string
        description: 'Outcome of the magic-packet send attempt. Values: error, success.'
        example: "error"
        platforms: [windows, linux, darwin]
      - name: message
        type: string
        description: 'Failure reason on `error`, or a confirmation of the packet sent on `success`. Values: free text.'
        example: "Missing required parameter: mac"
        platforms: [windows, linux, darwin]
      - name: port
        type: string
        description: 'The UDP port the magic packet was sent to, formatted as `port <n>`; emitted only on `success`. Values: `port <n>` (formatted string, not a bare number).'
        example: "not observed in any capture (code: wol_plugin.cpp:249)"
        platforms: [windows, linux, darwin]
      - name: bytes_sent
        type: string
        description: 'Number of bytes sent, formatted as `<n> bytes`; emitted only on `success`. Values: `<n> bytes` (formatted string, not a bare number).'
        example: "not observed in any capture (code: wol_plugin.cpp:249)"
        platforms: [windows, linux, darwin]

  readablePayload: "Send Wake-on-LAN packet to ${mac}"

  gather:
    ttlSeconds: 0

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [wol]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.wol.check
  displayName: Check Host Reachability
  version: 1.0.0
  description: >
    Checks whether a host has become reachable, typically used after
    sending a Wake-on-LAN packet to confirm the target machine has
    booted. Probes over unprivileged ICMP echo, falling back to a TCP
    connect on port 443 when ICMP cannot be used or gets no reply
    (e.g. Linux net.ipv4.ping_group_range denying the process an ICMP
    socket) — no shell-out, no ping binary. Validates the host
    parameter to prevent command injection. Returns a reachability
    status plus a mechanism row naming which probe produced the
    verdict. The count parameter controls how many samples are
    attempted per mechanism.
  tags: [wol, network, diagnostics, connectivity, action]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: wol
    action: check
    concurrency: per-device

  parameters:
    type: object
    required: [host]
    properties:
      host:
        type: string
        displayName: Target Host
        description: >
          Hostname or IPv4/IPv6 address to check for reachability,
          e.g. 192.168.1.50 or desktop-01.example.com. Must contain
          only alphanumeric characters, dots, hyphens, and colons.
        validation:
          minLength: 1
          maxLength: 253
          pattern: "^[a-zA-Z0-9.:\\-]+$"
      count:
        type: string
        displayName: Ping Count
        description: >
          Number of probe samples attempted per mechanism (1-10);
          each mechanism stops early on a positive result. Defaults
          to 3 if not specified.
        default: "3"
        validation:
          pattern: "^[0-9]+$"

  result:
    columns:
      - name: host
        type: string
        description: 'The `host` parameter value, echoed back unmodified. Values: free text (hostname or IP literal).'
        example: "127.0.0.1"
        platforms: [windows, linux, darwin]
      - name: status
        type: string
        description: >-
          Reachability verdict: `reachable` if either mechanism produced a positive result, `unreachable` if both were genuinely attempted with no positive result, or `unavailable` if neither mechanism could even be attempted. Values: reachable, unreachable, unavailable.
        example: "reachable"
        platforms: [windows, linux, darwin]
      - name: count
        type: string
        description: 'The `count` parameter value, echoed back as a string. Values: integer 1-10, as a string.'
        example: "3"
        platforms: [windows, linux, darwin]

  readablePayload: "Ping ${host} (${count} packets)"

  gather:
    ttlSeconds: 0

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [wol]

status:
  phase: active
