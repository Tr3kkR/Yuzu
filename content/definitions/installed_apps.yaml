## Installed Applications Definitions
## Inventories and queries installed applications across all platforms.
## Plugin: installed_apps | Actions: list, query
##
## Sources by platform:
##   Windows: Registry Uninstall keys (64-bit, 32-bit WoW64, current user)
##   Linux:   dpkg-query, rpm, or pacman (auto-detected)
##   macOS:   system_profiler SPApplicationsDataType

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.software.inventory
  displayName: List Installed Applications
  version: 1.0.0
  description: >
    Enumerates all installed applications on the endpoint. On Windows,
    reads the registry Uninstall keys (64-bit HKLM, 32-bit WoW64, and
    HKCU), deduplicates by name+version, and skips system components.
    The HKCU read is the AGENT SERVICE ACCOUNT's own hive, not a
    logged-in user's: the agent runs as a system-context service
    (LocalSystem today, see #1442), so HKCU resolves to that account's
    profile and carries no end-user applications. This is deliberate
    machine scope, not a gap -- per-user applications are a separate
    action (list_per_user) that this one never invokes.
    On Linux, auto-detects the package manager (dpkg, rpm, or pacman).
    On macOS, queries system_profiler for GUI applications. Returns
    application name, version, publisher, and install date.
  tags: [software, inventory, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: installed_apps
    action: list
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: name
        type: string
        description: The application's display name as read from the OS-native registry or package database.
        values: free text
        example: "7-Zip 26.02 (x64)"
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: The installed version string, or "-" when the source reports none.
        values: free text or "-"
        example: "26.02"
        platforms: [windows, linux, darwin]
      - name: publisher
        type: string
        description: The vendor or maintainer name; always "-" on macOS, since system_profiler's mini detail carries no publisher field.
        values: free text or "-"
        example: "Igor Pavlov"
        platforms: [windows, linux]
      - name: install_date
        type: string
        description: Install date in the OS's native format (Windows registry InstallDate, rpm's formatted install time); "-" when the source reports none, which dpkg-based Linux hosts always do.
        values: free text or "-"
        example: "20260617"
        platforms: [windows, darwin]
    aggregation:
      groupBy:
        - name
      operations:
        - count

  readablePayload: "List all installed applications"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [installed_apps]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.software.query
  displayName: Query Installed Application
  version: 1.0.0
  description: >
    Searches for a specific installed application by case-insensitive
    partial name match. Returns a found/not-found indicator followed
    by matching application records. Useful for compliance checks
    (e.g. verifying a required security agent is installed) and
    license auditing.
  tags: [software, compliance, diagnostics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: installed_apps
    action: query
    concurrency: per-device

  parameters:
    type: object
    required: [name]
    properties:
      name:
        type: string
        displayName: Application Name
        description: >
          Case-insensitive substring to match against installed
          application names. All apps whose name contains this
          string are returned.
        validation:
          minLength: 1
          maxLength: 256

  result:
    columns:
      - name: found
        type: bool
        description: Whether at least one installed application matched the search string.
        values: "true, false"
        example: "true"
        platforms: [windows, linux, darwin]
      - name: name
        type: string
        description: The matching application's display name.
        values: free text
        example: "Microsoft Edge"
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: The matching application's installed version string, or "-" when the source reports none.
        values: free text or "-"
        example: "152.0.4191.66"
        platforms: [windows, linux, darwin]
      - name: publisher
        type: string
        description: The vendor or maintainer name; always "-" on macOS, since system_profiler's mini detail carries no publisher field.
        values: free text or "-"
        example: "Microsoft Corporation"
        platforms: [windows, linux]
    aggregation:
      groupBy:
        - found
      operations:
        - count

  readablePayload: "Query installed applications matching '${name}'"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [installed_apps]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.software.per_user_inventory
  displayName: Per-User Installed Applications
  version: 1.0.0
  description: >
    Enumerates installed applications on a per-user basis. On Windows,
    iterates user profiles and reads each user's
    Software\Microsoft\Windows\CurrentVersion\Uninstall -- from the LIVE
    HKEY_USERS\<SID> hive when that user is logged in, falling back to an
    offline mount of their NTUSER.DAT only when it is not loaded.
    On Linux, reports system-wide packages (dpkg/rpm). On macOS, reports
    system apps plus per-user Homebrew packages. Output includes the
    username (or "system") alongside each application record.
  tags: [software, inventory, per-user, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: installed_apps
    action: list_per_user
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: username
        type: string
        description: The resolved local profile name on Windows (never the SID), the literal "system" for the machine-scope Linux/macOS leg, or "brew" for macOS per-user Homebrew formulae.
        values: profile name, "system", "brew", or "-"
        example: "Alex"
        platforms: [windows, linux, darwin]
      - name: name
        type: string
        description: The application's display name.
        values: free text
        example: "Signal 8.18.0"
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: The installed version string, or "-" when the source reports none.
        values: free text or "-"
        example: "8.18.0"
        platforms: [windows, linux, darwin]
      - name: publisher
        type: string
        description: The vendor or maintainer name; always "-" on macOS and for Homebrew rows.
        values: free text or "-"
        example: "Signal Messenger, LLC"
        platforms: [windows, linux]
      - name: install_date
        type: string
        description: Install date in the OS's native format; "-" when the source reports none, which dpkg-based Linux hosts and Homebrew rows always do.
        values: free text or "-"
        example: "20260714"
        platforms: [windows, darwin]
    aggregation:
      groupBy:
        - username
        - name
      operations:
        - count

  readablePayload: "List installed applications per user"

  gather:
    ttlSeconds: 600

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [installed_apps]

status:
  phase: active
