## Firewall Status and Rules Definitions
## Queries firewall state and enumerates rules across platforms.
## Plugin: firewall | Actions: state, rules
##
## Sources by platform (see agents/plugins/firewall/README.md):
##   Windows: INetFwPolicy2 COM (Domain/Private/Public profiles; INetFwRules
##            enumeration for rules)
##   Linux:   firewalld (sd-bus), else nftables (netlink), else ufw, else
##            iptables (auto-detected in that order)
##   macOS:   state: Application Firewall (socketfilterfw) primary, pf (pfctl)
##            secondary; rules: pf (pfctl)

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.firewall.state
  displayName: Firewall State
  version: 1.1.0
  description: >
    Query the firewall state on the endpoint. On Windows, reports the
    enabled/disabled status of each Windows Firewall profile (Domain,
    Private, Public). On Linux, auto-detects the active firewall backend
    (firewalld, ufw, or iptables) and reports its state. On macOS, reports
    the Application Firewall global state (socketfilterfw --getglobalstate)
    as the primary signal — with a mode row when block-all is set — and the
    pf packet filter state as a secondary pf row; unreadable checks report
    unknown, never a false-safe value. Older agents report pf as the sole
    macOS state source (backend|pf), so a mixed fleet shows both shapes
    until fully upgraded.
  tags: [security, firewall, compliance, network]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: firewall
    action: state
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: profile_or_backend
        type: string
        description: >-
          Row key. Windows: "profile" rows carry the profile name in the next
          field (Domain, Private, Public). Linux and macOS: "backend", "state",
          "mode" and "pf" rows, one key each.
        values: [profile, backend, state, mode, pf, error]
        example: profile
      - name: state
        type: string
        description: >-
          Windows profile rows: enabled, disabled, unknown or error:<hresult>.
          Linux "state" rows: running (firewalld), active, inactive or unknown.
          macOS "state" rows: enabled, disabled or unknown; "pf" rows the same;
          "mode" row is block_all. "backend" rows name the backend (appfirewall,
          firewalld, nftables, ufw, iptables, none).
        example: enabled
    aggregation:
      groupBy: [state]
      operations: [count]

  visualization:
    # firewall is a key|value-schema plugin — `result_parsing.hpp` clamps
    # each row to two fields. The `state` action emits rows whose value
    # is itself pipe-delimited (`Domain|enabled`, `Private|enabled`, …)
    # but the engine sees it as one opaque string. Filtering to the
    # `profile` rows and labelling by the value string gives a fleet
    # pie of "which (profile, state) tuples do we have, by device
    # count". Splitting the value into its own (profile, state) axes
    # for a true multi-series column chart needs the value-substring
    # engine extension tracked under issue #626.
    type: pie
    processor: single_series
    title: Firewall profile state across the fleet
    whereField: 0
    whereEquals: profile
    labelField: 1
    valueLabel: Devices

  readablePayload: "Query firewall state"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [firewall]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.firewall.rules
  displayName: List Firewall Rules
  version: 1.0.0
  description: >
    List firewall rules on the endpoint. On Windows, enumerates the
    Windows Firewall rule set through the INetFwPolicy2 COM interface
    (capped at 100 rules, with a truncated marker row when the cap is hit)
    with rule name, enabled state, direction, action, and profile mask. On
    Linux, uses the detected backend: firewalld zones and services over
    D-Bus, nftables chains and rule handles over netlink, or the structured
    parse of ufw status numbered / iptables -S. On macOS, lists pf rules
    via pfctl -s rules (root required to read /dev/pf; unprivileged runs
    list nothing).
  tags: [security, firewall, compliance, network, audit]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: firewall
    action: rules
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: rule_name
        type: string
        description: >-
          Windows: the rule's display name. Linux ufw: the numbered index;
          firewalld: the zone; nftables: the chain or rule handle row; macOS:
          the raw pf rule line.
        example: Core Networking - DNS (UDP-Out)
      - name: enabled
        type: string
        description: Windows only; enabled or disabled.
        values: [enabled, disabled]
        example: enabled
        platforms: [windows]
      - name: direction
        type: string
        description: Windows only; in, out or unknown.
        values: [in, out, unknown]
        example: out
        platforms: [windows]
      - name: action
        type: string
        description: Windows only; allow, block or unknown.
        values: [allow, block, unknown]
        example: allow
        platforms: [windows]
      - name: profiles
        type: string
        description: Windows only; the NET_FW_PROFILE_TYPE2 bitmask as an integer (1 domain, 2 private, 4 public, 2147483647 all).
        example: "2147483647"
        platforms: [windows]

  readablePayload: "List firewall rules"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [firewall]

status:
  phase: active
