## Network Actions Definitions
## Active network operations: DNS flush and ping.
## Plugin: network_actions | Actions: flush_dns, ping
##
## Sources by platform:
##   Windows: ipconfig /flushdns, ping -n
##   Linux:   resolvectl flush-caches / systemd-resolve --flush-caches, ping -c
##   macOS:   dscacheutil -flushcache AND killall -HUP mDNSResponder, ping -c

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.network_actions.flush_dns
  displayName: Flush DNS Cache
  version: 0.1.0
  description: >
    Flushes the local DNS resolver cache on the endpoint. On Windows
    runs ipconfig /flushdns. On Linux attempts resolvectl flush-caches
    then falls back to systemd-resolve --flush-caches on any failure of
    the first attempt (absent, or found but failing at runtime). On
    macOS runs both dscacheutil -flushcache and killall -HUP
    mDNSResponder — the SIGHUP is the step that actually resets the
    resolver, so a flush without it is incomplete. On every platform the
    status indicator reflects the real exit code(s) of the underlying
    command(s) — ok only if all of them succeed — never a blind success.
    This is a mutating action that clears cached DNS records, forcing
    fresh resolution on subsequent lookups.
  tags: [network, dns, action, remediation]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: network_actions
    action: flush_dns
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: status
        type: string
        description: >
          Whether the flush succeeded ("ok") or failed ("error");
          reflects the real exit code(s) of the underlying command(s),
          never a blind success.
        values: "ok, error"
        example: "ok"
        platforms: [windows, linux, darwin]
      - name: output
        type: string
        description: >
          Captured stdout+stderr of the underlying flush command(s),
          merged. On macOS this is a fixed
          "dscacheutil rc={} mDNSResponder rc={}" summary; on Windows
          and Linux it is the raw captured command output.
        values: free text
        example: "dscacheutil rc={} mDNSResponder rc={}"
        platforms: [windows, linux, darwin]

  readablePayload: "Flush DNS cache"

  gather:
    ttlSeconds: 0

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [network_actions]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.network_actions.ping
  displayName: Ping Host
  version: 0.1.0
  description: >
    Pings a specified host from the endpoint and streams back the
    per-line output. Validates the host parameter to prevent command
    injection (alphanumeric, dots, hyphens, and colons only). The
    count parameter controls the number of ICMP echo requests. On
    Windows uses ping -n, on Linux/macOS uses ping -c. Returns the
    raw ping output line by line for diagnostics.
  tags: [network, diagnostics, action, connectivity]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: network_actions
    action: ping
    concurrency: per-device

  parameters:
    type: object
    required: [host]
    properties:
      host:
        type: string
        displayName: Target Host
        description: >
          Hostname or IP address to ping. Must contain only
          alphanumeric characters, dots, hyphens, and colons.
          Maximum length 253 characters.
        validation:
          minLength: 1
          maxLength: 253
          pattern: "^[a-zA-Z0-9.:\\-]+$"
      count:
        type: string
        displayName: Ping Count
        description: >
          Number of ICMP echo requests to send. Must be a positive
          integer. Defaults to 4 if not specified.
        default: "4"
        validation:
          pattern: "^[0-9]+$"

  result:
    columns:
      - name: output
        type: string
        description: >
          One raw line of the system ping tool's stdout, emitted per
          line of output. Not present when host/count validation fails
          — that path emits a single "error|<message>" line instead,
          outside this schema.
        values: free text (raw ping-tool output)
        example: "PING 127.0.0.1 (127.0.0.1): 56 data bytes"
        platforms: [windows, linux, darwin]

  readablePayload: "Ping ${host} (${count} packets)"

  gather:
    ttlSeconds: 0

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [network_actions]

status:
  phase: active
