groups:
  - name: yuzu-fleet
    rules:
      # Agents are not scraped individually, so there is no per-agent
      # last-heartbeat timestamp series. Detect stale agents at the fleet level
      # using the server-side gauges: connected agents minus those with a recent
      # heartbeat (yuzu_fleet_agents_healthy).
      - alert: YuzuAgentDisconnected
        expr: |
          (yuzu_agents_connected - yuzu_fleet_agents_healthy) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Connected agents are not heartbeating"
          description: >-
            One or more agents are connected but have not produced a recent
            heartbeat for more than 2 minutes (connected minus healthy > 0).
            The affected agents may be hung or network-partitioned. Per-agent
            detail is available in the dashboard device view.
          runbook_url: "https://docs.yuzu.io/runbooks/agent-disconnected"

      - alert: YuzuAgentFleetDrop
        expr: |
          yuzu_agents_connected < (yuzu_agents_connected offset 5m) * 0.8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fleet agent count dropped by more than 20%"
          description: >-
            The number of connected agents has dropped by more than 20% in the
            last 5 minutes. This may indicate a network outage, server issue,
            or mass agent failure.

  - name: yuzu-commands
    rules:
      - alert: YuzuHighCommandFailureRate
        expr: |
          (
            sum(rate(yuzu_commands_completed_total{status="error"}[5m]))
            /
            sum(rate(yuzu_commands_completed_total[5m]))
          ) > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Command failure rate exceeds 10%"
          description: >-
            More than 10% of commands have failed in the last 5 minutes.
            Current failure rate: {{ $value | humanizePercentage }}.
            Investigate plugin errors and agent connectivity.

      - alert: YuzuHighCommandLatency
        expr: |
          histogram_quantile(0.99, sum(rate(yuzu_command_duration_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Command p99 latency exceeds 10 seconds"
          description: >-
            The 99th percentile command duration has exceeded 10 seconds for
            the last 5 minutes. Current p99: {{ $value | humanizeDuration }}.
            This may indicate slow plugins, network congestion, or overloaded agents.

  - name: yuzu-gateway
    rules:
      - alert: YuzuGatewayConnectionDrops
        expr: |
          rate(yuzu_gw_agents_connected_total[5m]) > 0
          and
          yuzu_gw_agents_current < (yuzu_gw_agents_current offset 5m) * 0.7
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Gateway agent connections dropped significantly"
          description: >-
            The Erlang gateway has lost more than 30% of its active agent
            connections in the last 5 minutes. Check gateway logs and network
            connectivity between agents and the gateway node.

      - alert: YuzuGatewayBackpressure
        expr: |
          rate(yuzu_gw_commands_dropped_backpressure_total[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Gateway experiencing backpressure events"
          description: >-
            The gateway is generating backpressure events, indicating agent
            send buffers are full. This may cause command delivery delays.
            Consider scaling the gateway or reducing command dispatch rate.

  - name: yuzu-security
    rules:
      - alert: YuzuOnBehalfAssertionRejected
        expr: |
          increase(yuzu_onbehalf_rejected_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A client asserted on-behalf-of delegation ({{ $labels.surface }})"
          description: >-
            yuzu_onbehalf_rejected_total{surface="{{ $labels.surface }}"} moved —
            a client sent a reserved on-behalf-of header/metadata key (rejected
            per ADR-1005; HTTP gets 403, gRPC is cancelled). One-off events are
            usually an integration testing a delegation convention; identify the
            caller from the throttled [ADR-1005] warn lines (1 log per 100
            rejections carries method/path/source) and fix the client. See
            docs/auth-architecture.md "On-behalf-of assertions rejected".
          runbook_url: "https://docs.yuzu.io/runbooks/onbehalf-rejected"

      - alert: YuzuOnBehalfRejectionFlood
        expr: |
          rate(yuzu_onbehalf_rejected_total[5m]) > 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Sustained on-behalf-of rejections — likely a header-injecting proxy"
          description: >-
            Sustained rejection rate on surface="{{ $labels.surface }}" — the
            signature of a proxy/mesh/SSO gateway stamping a reserved
            on-behalf-of header on ALL traffic (every REST/MCP/dashboard request
            403s; health probes are exempt and stay green, so the service looks
            up while being unusable) or a deliberate flood. Strip the header at
            the proxy. Diagnose via the throttled [ADR-1005] warn lines.
          runbook_url: "https://docs.yuzu.io/runbooks/onbehalf-rejected"

  - name: yuzu-mcp
    rules:
      - alert: YuzuMcpProgressBridgeAtCapacity
        expr: |
          rate(yuzu_mcp_bridge_reject_total{reason="global_cap"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MCP progress bridge is rejecting at its record cap"
          description: >-
            yuzu_mcp_bridge_reject_total{reason="global_cap"} is moving - the
            256-record correlation table is full, so new execute_instruction
            progress requests are silently degrading to the plain (poll) path.
            Functional (clients that poll are unaffected) but live progress is
            unavailable. Check for a client holding many warm sessions with
            never-terminating executions, or raise capacity when 3b lands.
      - alert: YuzuMcpStreamTerminalPublishFailures
        expr: |
          rate(yuzu_mcp_stream_terminal_publish_failures_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "MCP terminal-frame delivery is failing (poison ladder engaged)"
          description: >-
            yuzu_mcp_stream_terminal_publish_failures_total is moving - a
            client-visible terminal result could not be published on the stream
            and the publish_final → fallback → poison ladder engaged (a double
            failure poisons that session's stream). Results remain durably
            fetchable by execution_id, but the streaming surface is degraded;
            this is an allocation-pressure or stream-state signal worth paging.

      - alert: YuzuMcpBodyTooLargeRejecting
        expr: |
          sum by (reason) (increase(yuzu_mcp_body_too_large_total[15m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "MCP requests are being rejected at the transport body cap"
          description: >-
            reason={{ $labels.reason }}. over_cap = a declared
            Content-Length above 4 MiB, rejected 413 in pre-routing.
            unmeasurable = a body this server cannot size in advance - any
            Transfer-Encoding, any non-identity Content-Encoding, or a
            Content-Length-less POST/PUT/PATCH - rejected 411. NOTE this fires for
            UNAUTHENTICATED callers too - the cap runs ahead of the auth check -
            so there is no principal to correlate. The throttled "[#2437]"
            warn in the server journal carries the sanitized method, path and
            source address (1 line per 100 rejections OF EACH REASON -
            the two throttles are independent so a noisy reason cannot hide a
            rare one; the counter records all). reason=unmeasurable means a body this server cannot size in
            advance (any Transfer-Encoding, any non-identity Content-Encoding,
            or a Content-Length-less POST/PUT/PATCH) is being refused 411, which is usually a client that needs
            reconfiguring rather than an attack. Rule out the legitimate cause
            first: an
            execute_bundle call with multi-MiB params, which the MCP transport
            clamps tighter than validate_bundle_steps accepts (see
            docs/mcp-server.md); the REST twin POST /api/v1/bundles is not
            capped this way.


      - alert: YuzuMcpInputBoundsRejecting
        expr: |
          sum by (tool, reason) (increase(yuzu_mcp_tool_args_too_large_total[15m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "MCP tool arguments are being rejected for exceeding input bounds"
          description: >-
            yuzu_mcp_tool_args_too_large_total is climbing on
            {{ $labels.tool }} (reason={{ $labels.reason }}). Either a client is
            sending arguments past the tool's published inputSchema bounds -
            check whether it read tools/list - or someone is probing the limits.
            Denials are audited as mcp.<tool>|denied with detail
            "input bound exceeded: <reason>"; correlate there for the principal.

  - name: yuzu-tls
    rules:
      - alert: YuzuCertificateExpiringSoon
        expr: |
          yuzu_server_cert_expiry_timestamp_seconds - time() < 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Yuzu server TLS certificate expires in less than 7 days"
          description: >-
            The {{ $labels.cert }} certificate expires in
            {{ $value | humanizeDuration }}. Renew it and place the new PEM files
            at the configured path (hot-reload picks up HTTPS automatically).
            Built-in default certs (cert="default-ca") do NOT auto-renew — replace
            them with operator-provided certs, or clear the cert directory to
            regenerate.

      - alert: YuzuCertificateExpiryCritical
        expr: |
          yuzu_server_cert_expiry_timestamp_seconds - time() < 86400
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Yuzu server TLS certificate expires in less than 24 hours"
          description: >-
            The {{ $labels.cert }} certificate expires in
            {{ $value | humanizeDuration }}. Immediate action required to prevent
            service disruption.

      # yuzu_server_cert_reload_failures_total is a gauge holding the running
      # count of failed hot-reloads, so use delta() (not rate()) to detect a
      # new failure within the window.
      - alert: YuzuCertReloadFailures
        expr: |
          delta(yuzu_server_cert_reload_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Certificate hot-reload is failing"
          description: >-
            Certificate hot-reload has failed at least once in the last 5
            minutes. The server is still using the previous valid certificate.
            Check that the new PEM files are valid, the cert and key match,
            and file permissions are correct (chmod 600 on Unix).

