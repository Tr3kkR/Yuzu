# SAMPLE RULES - NOT WIRED UP BY ANYTHING THIS REPO SHIPS.
#
# `deploy/prometheus/prometheus.yml` reads `/etc/prometheus/rules/*.yml`, but no
# compose file under `deploy/docker/` mounts this file there, and the repo ships
# no Alertmanager configuration at all. Until an operator does both, every
# `severity:` label below routes nowhere.
#
# That matters most for the audit-retention rules later in this file. The clock
# guard bounds how fast the SOC 2 evidence chain can drain; it does NOT prevent
# draining. The alert is the actual control and the guard is only the seatbelt,
# so counting these rules as a detective control before wiring them up would be
# self-deception. See docs/ops-runbooks/audit-store-clock-guard.md.
groups:
  - name: yuzu-fleet
    rules:
      # Agents are not scraped individually, so there is no per-agent
      # last-heartbeat timestamp series. Detect stale agents at the fleet level
      # using the server-side gauges: connected agents minus those with a recent
      # heartbeat (yuzu_fleet_agents_healthy).
      - alert: YuzuAgentDisconnected
        expr: |
          (yuzu_agents_connected - yuzu_fleet_agents_healthy) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Connected agents are not heartbeating"
          description: >-
            One or more agents are connected but have not produced a recent
            heartbeat for more than 2 minutes (connected minus healthy > 0).
            The affected agents may be hung or network-partitioned. Per-agent
            detail is available in the dashboard device view.
          runbook_url: "https://docs.yuzu.io/runbooks/agent-disconnected"

      - alert: YuzuAgentFleetDrop
        expr: |
          yuzu_agents_connected < (yuzu_agents_connected offset 5m) * 0.8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fleet agent count dropped by more than 20%"
          description: >-
            The number of connected agents has dropped by more than 20% in the
            last 5 minutes. This may indicate a network outage, server issue,
            or mass agent failure.

  - name: yuzu-commands
    rules:
      - alert: YuzuHighCommandFailureRate
        expr: |
          (
            sum(rate(yuzu_commands_completed_total{status="error"}[5m]))
            /
            sum(rate(yuzu_commands_completed_total[5m]))
          ) > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Command failure rate exceeds 10%"
          description: >-
            More than 10% of commands have failed in the last 5 minutes.
            Current failure rate: {{ $value | humanizePercentage }}.
            Investigate plugin errors and agent connectivity.

      - alert: YuzuHighCommandLatency
        expr: |
          histogram_quantile(0.99, sum(rate(yuzu_command_duration_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Command p99 latency exceeds 10 seconds"
          description: >-
            The 99th percentile command duration has exceeded 10 seconds for
            the last 5 minutes. Current p99: {{ $value | humanizeDuration }}.
            This may indicate slow plugins, network congestion, or overloaded agents.

  - name: yuzu-gateway
    rules:
      - alert: YuzuGatewayConnectionDrops
        expr: |
          rate(yuzu_gw_agents_connected_total[5m]) > 0
          and
          yuzu_gw_agents_current < (yuzu_gw_agents_current offset 5m) * 0.7
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Gateway agent connections dropped significantly"
          description: >-
            The Erlang gateway has lost more than 30% of its active agent
            connections in the last 5 minutes. Check gateway logs and network
            connectivity between agents and the gateway node.

      - alert: YuzuGatewayBackpressure
        expr: |
          rate(yuzu_gw_commands_dropped_backpressure_total[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Gateway experiencing backpressure events"
          description: >-
            The gateway is generating backpressure events, indicating agent
            send buffers are full. This may cause command delivery delays.
            Consider scaling the gateway or reducing command dispatch rate.

  - name: yuzu-security
    rules:
      - alert: YuzuOnBehalfAssertionRejected
        expr: |
          increase(yuzu_onbehalf_rejected_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A client asserted on-behalf-of delegation ({{ $labels.surface }})"
          description: >-
            yuzu_onbehalf_rejected_total{surface="{{ $labels.surface }}"} moved —
            a client sent a reserved on-behalf-of header/metadata key (rejected
            per ADR-1005; HTTP gets 403, gRPC is cancelled). One-off events are
            usually an integration testing a delegation convention; identify the
            caller from the throttled [ADR-1005] warn lines (1 log per 100
            rejections carries method/path/source) and fix the client. See
            docs/auth-architecture.md "On-behalf-of assertions rejected".
          runbook_url: "https://docs.yuzu.io/runbooks/onbehalf-rejected"

      - alert: YuzuOnBehalfRejectionFlood
        expr: |
          rate(yuzu_onbehalf_rejected_total[5m]) > 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Sustained on-behalf-of rejections — likely a header-injecting proxy"
          description: >-
            Sustained rejection rate on surface="{{ $labels.surface }}" — the
            signature of a proxy/mesh/SSO gateway stamping a reserved
            on-behalf-of header on ALL traffic (every REST/MCP/dashboard request
            403s; health probes are exempt and stay green, so the service looks
            up while being unusable) or a deliberate flood. Strip the header at
            the proxy. Diagnose via the throttled [ADR-1005] warn lines.
          runbook_url: "https://docs.yuzu.io/runbooks/onbehalf-rejected"

      - alert: YuzuRbacReadDegraded
        # An authorization read against the PostgreSQL rbac_store (ADR-0041)
        # could not resolve and therefore DENIED (reads fail closed —
        # deny-on-degrade). Because require_permission / authorize_list_read all
        # route through this store, a degrade denies authorization FLEET-WIDE —
        # it is an availability event, not a silent partial outage. /readyz stays
        # green under pure pool saturation (it trips only on connection failure,
        # to avoid false LB evictions), so this is otherwise dashboard-invisible.
        # reason = pool_acquire_timeout | query_error | generation_refresh_failed.
        #
        # DELIBERATELY excludes three other reason values on this same metric
        # (#2703 fjarvis F2/F3 fix + the 2026-08-11 bounded-stale-serve split):
        # rbac_enabled_non_canonical, stale_beyond_accepted_bound, and
        # generation_refresh_failed_within_bound are OBSERVE-ONLY — the read
        # still PROCEEDS (served from cache / the last-known-good enabled
        # value), nothing is denied. generation_refresh_failed_within_bound in
        # particular exists BECAUSE of this exclusion rule: once the bounded
        # ~5s stale-serve window (ADR-0041 Update) let a failed refresh keep
        # serving cached decisions instead of denying, the original single
        # generation_refresh_failed reason would have started firing on that
        # same non-denying condition — reproducing exactly the false alarm
        # this rule exists to prevent, just via a different reason value.
        # Splitting it keeps generation_refresh_failed denial-only. Folding
        # any of the three observe-only reasons into this alert's reason=~match
        # would page "callers being denied fleet-wide" for a condition that
        # denies nobody — a false alarm during exactly the kind of incident
        # this alert exists to page accurately for. If any ever needs its own
        # alert, it must NOT claim fleet-wide denial.
        expr: |
          sum(rate(yuzu_server_rbac_read_degrade_total{reason=~"pool_acquire_timeout|query_error|generation_refresh_failed"}[5m])) by (reason) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RBAC authorization reads degrading — callers being denied ({{ $labels.reason }})"
          description: >-
            yuzu_server_rbac_read_degrade_total{reason="{{ $labels.reason }}"} is
            non-zero: authorization reads against the PostgreSQL rbac_store are
            failing and therefore DENYING (fail-closed / deny-on-degrade,
            ADR-0041). Because require_permission / require_scoped_permission /
            authorize_list_read all resolve through this store, operators and
            agentic callers are being denied fleet-wide. pool_acquire_timeout /
            query_error correlate with yuzu_pg_* saturation or outage;
            generation_refresh_failed means the cross-replica cache-coherence
            token could not be re-read PAST the bounded ~5s stale-serve window
            — cached decisions were dropped and callers are genuinely denied
            (a refresh failure still inside that window counts separately, as
            the non-alerting generation_refresh_failed_within_bound reason,
            and denies nobody). Check Postgres availability and the
            server RbacStore warnings. See docs/auth-architecture.md
            "RbacStore — the authorization substrate".
          runbook_url: "https://docs.yuzu.io/runbooks/rbac-read-degraded"

      - alert: YuzuRbacBackfillFailing
        # The one-time legacy-rbac.db -> PostgreSQL backfill at boot could not
        # complete. The server fails the boot CLOSED and retries on next start,
        # so this pairs with a server that will not come up — surfaced here for
        # the case where a scrape catches the failed counter before exit.
        expr: |
          increase(yuzu_server_rbac_backfill_total{result="failed"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "RBAC store Postgres backfill failed — server refusing to boot"
          description: >-
            yuzu_server_rbac_backfill_total{result="failed"} moved: the
            RbacStore migration backfill (legacy rbac.db -> PostgreSQL rbac_store,
            ADR-0041) could not reconcile/commit, so the server fails the boot
            closed rather than running on a partial authorization config. It
            retries on the next start. Check Postgres availability, the
            rbac_store schema, and the presence/readability of the legacy
            rbac.db backfill source in the server log — including a
            HOLDER-SIDE VERIFICATION FAILED line, which means this replica's
            own legacy rbac.db does not match what the fleet already
            migrated (see the runbook).
          runbook_url: "docs/ops-runbooks/rbac-store-backfill-recovery.md"

  - name: yuzu-mcp
    rules:
      - alert: YuzuMcpProgressBridgeAtCapacity
        expr: |
          rate(yuzu_mcp_bridge_reject_total{reason="global_cap"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MCP progress bridge is rejecting at its record cap"
          description: >-
            yuzu_mcp_bridge_reject_total{reason="global_cap"} is moving - the
            256-record correlation table is full, so new execute_instruction
            progress requests are silently degrading to the plain (poll) path.
            Functional (clients that poll are unaffected) but live progress is
            unavailable. Check for a client holding many warm sessions with
            never-terminating executions, or raise capacity when 3b lands.
            Distinguish transient load from a PERMANENT strand via
            yuzu_mcp_bridge_teardown_incomplete_total: if that is non-zero the
            occupancy will not recede on its own and only a restart clears it.
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-bridge-teardown-recovery"
      - alert: YuzuMcpStreamTerminalPublishFailures
        expr: |
          rate(yuzu_mcp_stream_terminal_publish_failures_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "MCP terminal-frame delivery is failing (poison ladder engaged)"
          description: >-
            yuzu_mcp_stream_terminal_publish_failures_total is moving - a
            client-visible terminal result could not be published on the stream
            and the publish_final → fallback → poison ladder engaged (a double
            failure poisons that session's stream). Results remain durably
            fetchable by execution_id, but the streaming surface is degraded;
            this is an allocation-pressure or stream-state signal worth paging.
      - alert: YuzuMcpStreamPinDisplaced
        expr: |
          increase(yuzu_mcp_stream_pin_displaced_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP replay-ring pin slots exhausted (corroborate before treating as drift)"
          description: >-
            A session filled every replay-ring pin slot and the oldest pin was
            displaced. A SUCCESSFUL #2740 admission reclaim cannot cause this - it
            releases one pin and adds one charge, so the session stays AT cap and a
            slot is always free. Only two paths reach a full set: a release that lost
            a race (yuzu_mcp_bridge_pin_release_raced_total, #2795) and a contained
            release throw (yuzu_mcp_bridge_pin_release_failed_total, #2805). Rule
            those two out; what remains is genuine admission-accounting drift. The
            server degraded gracefully - the oldest pinned terminal yielded its
            eviction exemption to the newest, the displaced final stays committed, and
            results remain fetchable by execution_id. No restart; this is diagnostic,
            not an outage. Follow docs/ops-runbooks/mcp-stream-pin-displacement.md - it
            owns the procedure and this annotation only points at it.
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-stream-pin-displacement#what-to-do"
      - alert: YuzuMcpStreamFinalUnpinned
        expr: |
          rate(yuzu_mcp_stream_final_unpinned_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP terminal committed with no pin at all (defence-in-depth tripped)"
          description: >-
            yuzu_mcp_stream_final_unpinned_total is moving. This is structurally
            unreachable while the pin array is non-empty (a full slot set displaces
            its oldest pin instead), so a non-zero value means the pin array was
            resized to zero or the displacement path was bypassed. The affected
            terminal is evictable from the replay ring but remains fetchable by
            execution_id. File a bug; no restart needed.
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-stream-pin-displacement#what-to-do"
      - alert: YuzuMcpBridgeForcedExpireUnavailable
        expr: |
          rate(yuzu_mcp_bridge_forced_expire_total{disposition="synthesize_unavailable"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP progress bridge is deciding -32014 (bus says no terminal ever landed)"
          description: >-
            The ring-only pressure escape hatch is force-expiring parked records for
            which the bus verdict was that the execution never reached a terminal,
            so -32014 is the disposition it published. Counted at the decision, not
            on delivery - if you also see
            yuzu_mcp_stream_terminal_publish_failures_total or
            yuzu_mcp_bridge_teardown_incomplete_total moving, the frame may not have
            reached the ring either. The verdict is honest, but a sustained rate
            means records are parking faster than they settle: check
            yuzu_mcp_bridge_records_active against the record cap and whether
            executions are completing at all. The sibling
            disposition="fallback_final" is a different, milder signal (a terminal
            DID happen but its payload was gone) - rule out
            yuzu_mcp_bridge_projection_degraded_total before reading that one as a
            bus-buffer sizing question.
      - alert: YuzuMcpBridgeTeardownIncomplete
        expr: |
          sum by (reason) (yuzu_mcp_bridge_teardown_incomplete_total) > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP progress-bridge teardown could not complete (resource retained)"
          description: >-
            reason={{ $labels.reason }}. A claimed teardown could not finish on the
            maintenance thread. The sweep's claim is one-way, so the record is
            NEVER retried: whatever it still owns is held until the server
            restarts - unsubscribe = its event-bus subscription (which also
            blocks that execution's channel and replay buffer from being
            collected), release_charge = a per-session admission slot,
            erase = the correlation record and a global slot. A retained record
            also pins that session's whole stream state and any pinned finals.
            Client results stay durably fetchable by execution_id. NOTE this is a
            defence-in-depth counter: on current code only a mutex failure can
            reach these steps, so for allocation pressure watch
            yuzu_mcp_stream_terminal_publish_failures_total instead.
            DELIBERATELY a raw counter test, not increase() over a window: the
            retention lasts until the process restarts, so an alert that cleared
            after 15 minutes would contradict the contract it exists to report.
            Runbook: docs/ops-runbooks/mcp-bridge-teardown-recovery.md
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-bridge-teardown-recovery"
      - alert: YuzuMcpStreamedPinSlotsWedged
        expr: |
          increase(yuzu_mcp_bridge_pin_slots_reject_total{held="pins"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "MCP streamed admissions refused with every slot held by a committed final"
          description: >-
            A streamed request was refused for want of a session slot, and every
            slot was held by a final the bridge had already committed rather than by
            a call still in flight. After the rule-(a) unpin those pins are released
            when the final reaches the wire, and since #2740 admission RECLAIMS such a
            slot rather than refusing - including an orphan pin no record references.
            A SUSTAINED rate therefore no longer means the client is locked out; it
            means the reclaim kept finding nothing to take, which narrows the cause to
            a final still being written, a transient mid-projection decline, or a
            genuinely stuck slot. The 429 the client receives says so (it advises a
            retry, not a wait); "wait for one to finish" is now the charges branch
            only. The `for` is load-bearing, not tuning: the
            charge-to-pin handover happens at terminal projection but the unpin only
            once the final reaches the wire, so every HEALTHY session passes through
            pinned>0/unpinned==0 during that flush window, and a lone refusal landing
            inside it is not a wedge. Only persistence separates the two. Note also
            that held="charges" is NOT purely benign: it is emitted whenever ANY
            charge is outstanding, so a partial wedge (some pins stuck, one call
            genuinely in flight) is bucketed there and this alert cannot see it.
            Runbook: docs/ops-runbooks/mcp-stream-pin-displacement.md
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-stream-pin-displacement#yuzumcpstreamedpinslotswedged--a-session-is-being-refused-not-merely-degraded"
      - alert: YuzuMcpBridgePinReleaseFailed
        expr: |
          yuzu_mcp_bridge_pin_release_failed_total > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP streamed admission's pin release THREW and was contained"
          description: >-
            The streamed-admission reclaim (#2740) selected a pin to release and the
            release itself THREW. This counts ONLY that throw - it does not count a
            release that merely lost a race to another release route, which is the
            ordinary residual (#2795), counted separately as
            yuzu_mcp_bridge_pin_release_raced_total. So a zero HERE does not mean no
            session ever sat over its cap - check that counter too. It is contained deliberately: the new admission is
            already committed at that point, so letting the throw escape would leave a
            session slot nothing reclaims until the arming reaper fires. Like its
            sibling YuzuMcpBridgeChargeReleaseDeferred this needs a genuinely broken
            platform mutex, so any non-zero value is a signal about the host rather
            than a rate to tune. The admission itself stands; that session is one slot
            tighter than its nominal cap implies until the pin clears by another route
            (a GET resume acking past it, or session death). Distinct from
            yuzu_mcp_bridge_pin_displaced_for_admission_total, which counts the
            SUCCESSFUL reclaims and is expected traffic.
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-stream-pin-displacement#what-to-do"
      - alert: YuzuMcpBridgeChargeReleaseDeferred
        expr: |
          yuzu_mcp_bridge_charge_release_deferred_total > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP streamed admission charge could not be released at its natural point"
          description: >-
            A charge release could not take its locks and was deferred to the
            record's teardown (#2529). The record and the ledger still AGREE, so
            this is a deferral rather than a stranded slot - but it needs a
            genuinely broken platform mutex to happen at all, so any non-zero value
            is a signal about the host rather than a rate to tune. Read it together
            with yuzu_mcp_bridge_projection_degraded_total, which the same fault
            class also drives.
      - alert: YuzuMcpBridgeStreamingBackstop
        expr: |
          increase(yuzu_mcp_bridge_streaming_backstop_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP sweep had to park a stranded streamed-POST record"
          description: >-
            The backstop only fires when a streamed record was left in kStreaming
            past its cap - normally impossible, because the response releaser parks
            it. A sustained rate points at a releaser or connection-teardown bug;
            the records are parked rather than reaped, so nothing is lost, but the
            path should not be exercised in a healthy server.
      - alert: YuzuMcpStreamedPostDispatchThrewMidStream
        expr: |
          rate(yuzu_mcp_bridge_degrade_total{reason="post_dispatch_threw"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP streamed POST dispatched a command but could not stream its response"
          description: >-
            yuzu_mcp_bridge_degrade_total{reason="post_dispatch_threw"} is moving -
            the command WAS dispatched to the fleet and is still running, but the
            streamed-POST response that was meant to carry its progress/result could
            not be completed, so the caller got an error for work that is genuinely
            still in flight. Not data loss: the client's own tool description tells
            it to recover via query_responses/get_execution_status by execution_id,
            and streamed POST ships ON by default (docs/user-manual/mcp.md), so this
            family is now populated by every deployment unless an operator has
            opted out with --no-mcp-streamed-post. A sustained rate points at
            allocation pressure or a stream-teardown bug on the POST path
            specifically, distinct from the pre-existing GET-only degrade reasons
            in the same metric family.
      - alert: YuzuMcpBridgeProjectionDegraded
        expr: |
          yuzu_mcp_bridge_projection_degraded_total > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP progress-bridge projection released its claim without the record lock"
          description: >-
            A projection guard could not retake the record lock, so it released
            the projection claim WITHOUT running the settle bookkeeping (#2528).
            Releasing the claim is the correct trade - leaving it set would wedge
            that record out of every consumer (and, before #2489 made a deferred
            victim advance the pressure pass instead of ending it, would have
            stalled ring-only pressure relief bridge-wide) - but the
            settle is lossy: a terminal payload that was mid-retry cannot be put
            back, so that request is answered by the success-shaped fallback final
            ("fetch by execution_id") instead of its real result. Client results
            stay durably fetchable by execution_id. This needs a genuinely broken
            platform mutex, so ANY nonzero value is a signal about the host, not a
            rate to tune - the same mutex fault reaches
            yuzu_mcp_bridge_teardown_incomplete_total, so check that too.
            DELIBERATELY a raw counter test, not increase() over a window: the
            lost payload is permanent, so an alert that cleared after 15 minutes
            would contradict what it reports.
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-bridge-teardown-recovery"
      - alert: YuzuMcpMaintenanceTickFailing
        expr: |
          sum by (tick) (increase(yuzu_mcp_maintenance_tick_failures_total[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "MCP maintenance tick is throwing (work skipped every cycle)"
          description: >-
            tick={{ $labels.tick }}. bridge_sweep = pin-ack, session-death and
            memory-pressure teardown are all stalled, so bridge records and their
            pins accumulate. session_gc = expired sessions keep their streams and
            pinned finals. The two are guarded separately, so this names exactly
            which one is failing. Before this containment existed the same
            exception aborted the whole process, so a firing here is strictly
            better than the alternative - but a sustained rate means that class of
            maintenance is not running at all. Correlate with host memory pressure.
            DELIBERATELY increase() over a window, unlike the teardown-incomplete
            rule next to it: a skipped tick is retried on the next cycle, so this
            condition is self-healing and the alert must clear when it stops. The
            raw-counter form is correct ONLY where the retention it reports is
            permanent until restart, which is true of teardown_incomplete and not
            of this.
            Runbook: docs/ops-runbooks/mcp-bridge-teardown-recovery.md
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-bridge-teardown-recovery"
      - alert: YuzuMcpBridgeRecordsNearCap
        expr: |
          yuzu_mcp_bridge_records_active >= 205
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MCP progress bridge is near its correlation-record cap"
          description: >-
            yuzu_mcp_bridge_records_active has been at or above 80% of the 256
            record cap for 10 minutes. At the cap every execute_instruction call
            carrying a progressToken silently degrades to the plain (poll) path -
            functional, but live progress stops fleet-wide. This is the LEADING
            indicator for the teardown-strand failure mode: if
            yuzu_mcp_bridge_teardown_incomplete_total is also non-zero the
            occupancy is permanent and only a restart clears it, whereas ordinary
            load recedes on its own. Check both before restarting.
          runbook_url: "https://docs.yuzu.io/runbooks/mcp-bridge-teardown-recovery"
      - alert: YuzuMcpBodyTooLargeRejecting
        expr: |
          sum by (reason) (increase(yuzu_mcp_body_too_large_total[15m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "MCP requests are being rejected at the transport body cap"
          description: >-
            reason={{ $labels.reason }}. over_cap = a declared
            Content-Length above 4 MiB, rejected 413 in pre-routing.
            unmeasurable = a body this server cannot size in advance by FRAMING
            - any Transfer-Encoding, or a Content-Length-less POST/PUT/PATCH -
            rejected 411. unsupported_encoding = any non-identity
            Content-Encoding, rejected 415 by the general pre-routing gate
            (#2407 D4) on every route class, and counted here as well so this
            MCP alert does not silently lose that arm. NOTE this fires for
            UNAUTHENTICATED callers too - the cap runs ahead of the auth check -
            so there is no principal to correlate. The throttled "[#2407]"
            warn in the server journal carries the sanitized method, path and
            source address (1 line per 100 rejections OF EACH REASON -
            the three throttles - over_cap, unmeasurable, unsupported_encoding
            - are independent so a noisy reason cannot hide a rare one; the
            counter records all). reason=unmeasurable means a body this server cannot size in
            advance (any Transfer-Encoding, or a Content-Length-less
            POST/PUT/PATCH) is being refused 411; reason=unsupported_encoding
            means a compressed body is being refused 415. Either is usually a client that needs
            reconfiguring rather than an attack. Rule out the legitimate cause
            first: an
            execute_bundle call with multi-MiB params, which the MCP transport
            clamps tighter than validate_bundle_steps accepts (see
            docs/mcp-server.md); the REST twin POST /api/v1/bundles is not
            capped this way.


      - alert: YuzuMcpInputBoundsRejecting
        expr: |
          sum by (tool, reason) (increase(yuzu_mcp_tool_args_too_large_total[15m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "MCP tool arguments are being rejected for exceeding input bounds"
          description: >-
            yuzu_mcp_tool_args_too_large_total is climbing on
            {{ $labels.tool }} (reason={{ $labels.reason }}). Either a client is
            sending arguments past the tool's published inputSchema bounds -
            check whether it read tools/list - or someone is probing the limits.
            Denials are audited as mcp.<tool>|denied with detail
            "input bound exceeded: <reason>"; correlate there for the principal.

  - name: yuzu-dispatch
    rules:
      - alert: YuzuDispatchTargetRejected
        expr: |
          sum by (route, reason) (increase(yuzu_server_dispatch_target_rejected_total[15m])) > 3
        labels:
          severity: warning
        annotations:
          summary: "A REST caller named a device target that resolved to nothing"
          description: >-
            yuzu_server_dispatch_target_rejected_total is non-zero on
            {{ $labels.route }} (reason={{ $labels.reason }}). A client supplied
            agent_ids, scope or parent_id that names no device - it believes it is
            targeting specific machines and is not. Before #2500 these calls
            dispatched to the ENTIRE FLEET and returned success, so any non-zero
            rate here is a near-miss worth reading, not just a validation
            failure - hence >3/15m rather than the MCP twin's >20. It is
            deliberately NOT >0: a single malformed curl would page, the rule
            would be silenced within a week, and the genuine near-miss it exists
            for would be silenced with it. The AUDIT row is the durable
            per-event evidence; this alert is for a client looping. Most often a
            client emitting numeric device ids, or a device filter that matched
            nothing. Denials are audited as
            command.dispatch|denied, instruction.execute|denied or
            result_set.create|denied with detail "reason=<reason>"; correlate
            there for the principal.

  - name: yuzu-tls
    rules:
      - alert: YuzuCertificateExpiringSoon
        expr: |
          yuzu_server_cert_expiry_timestamp_seconds - time() < 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Yuzu server TLS certificate expires in less than 7 days"
          description: >-
            The {{ $labels.cert }} certificate expires in
            {{ $value | humanizeDuration }}. Renew it and place the new PEM files
            at the configured path (hot-reload picks up HTTPS automatically).
            Built-in default certs (cert="default-ca") do NOT auto-renew — replace
            them with operator-provided certs, or clear the cert directory to
            regenerate.

      - alert: YuzuCertificateExpiryCritical
        expr: |
          yuzu_server_cert_expiry_timestamp_seconds - time() < 86400
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Yuzu server TLS certificate expires in less than 24 hours"
          description: >-
            The {{ $labels.cert }} certificate expires in
            {{ $value | humanizeDuration }}. Immediate action required to prevent
            service disruption.

      # yuzu_server_cert_reload_failures_total is a gauge holding the running
      # count of failed hot-reloads, so use delta() (not rate()) to detect a
      # new failure within the window.
      - alert: YuzuCertReloadFailures
        expr: |
          delta(yuzu_server_cert_reload_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Certificate hot-reload is failing"
          description: >-
            Certificate hot-reload has failed at least once in the last 5
            minutes. The server is still using the previous valid certificate.
            Check that the new PEM files are valid, the cert and key match,
            and file permissions are correct (chmod 600 on Unix).

  # ── yuzu-response-store — LIVE as of the response store's Postgres migration
  # (ADR-0039) ──────────────────────────────────────────────────────────────
  # These replace the old (never-emitted) `yuzu_server_response_store_writes_total`
  # / `_write_failures_total` stub. The shipped metrics are the fail-soft ingest
  # drop counter, the degrade-distinguishable read counter, and the clock-guarded
  # reap-pass counter (all zero-seeded at boot, so absence-vs-zero is meaningful).
  - name: yuzu-response-store
    rules:
      # #2691 Gate 8 (security-guardian): malformed_identity_field (added
      # alongside the embedded-NUL reject guard) is a SECURITY CONTROL WORKING
      # AS INTENDED, not store unhealth -- a single hostile/misbehaving agent
      # sending malformed command_ids would otherwise page this "store
      # degraded"-flavored alert for its own bad input, exactly the false-page
      # class the inventory sibling's reason!="stale" exclusion exists to
      # avoid (yuzu_inventory_ingest_dropped_total, above). Excluded here the
      # same way; by (reason) so a genuine store_not_open/pool_acquire_timeout/
      # query_error drop stays distinguishable from a benign malformed-input
      # drop rather than being summed together.
      - alert: YuzuResponseIngestDrops
        expr: |
          sum(rate(yuzu_server_response_ingest_dropped_total{reason!="malformed_identity_field"}[5m])) by (reason) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Response results are being dropped at ingest"
          description: >-
            The response store fail-soft-dropped command results for 10m
            (reason label = store_not_open / pool_acquire_timeout / query_error
            — malformed_identity_field excluded, that's an agent sending a
            malformed identity field, not store unhealth; see
            YuzuResponseMalformedIdentityDrops for that case).
            The executions ladder still tracks the commands, but drawer/TAR
            result history is lossy — check PostgreSQL pool saturation / health.

      # Companion, informational: a NUL-byte-guard rejection is the security
      # control doing its job -- worth knowing about (a hostile/misbehaving
      # agent is actively sending malformed identity fields), but not a
      # store-health page. Separate, lower-severity rule rather than folding
      # into the alert above, matching the "two states want different
      # remediation" reasoning YuzuAuditRetentionMetricMissing's comment uses
      # for its own sibling split.
      - alert: YuzuResponseMalformedIdentityDrops
        expr: |
          increase(yuzu_server_response_ingest_dropped_total{reason="malformed_identity_field"}[1h]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "An agent sent a response with an embedded NUL in an identity field"
          description: >-
            ResponseStore rejected at least one response whose instruction_id/
            execution_id/plugin/agent_id contained an embedded NUL byte
            (#2691 UP-5) — the row was dropped, never stored truncated. This
            is the guard working correctly, not store unhealth; investigate
            the reporting agent if this recurs (a well-behaved agent never
            triggers it).

      - alert: YuzuResponseReadDegrade
        expr: |
          rate(yuzu_server_response_read_degrade_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Response reads are degrading (nullopt, not empty)"
          description: >-
            Response reads returned a degrade rather than a result for 10m —
            consumers render a degrade banner / 503 rather than a false-empty.
            Usually PostgreSQL pool saturation; correlate with pool metrics.

      - alert: YuzuResponseReapBacklog
        expr: |
          rate(yuzu_server_response_reap_passes_total{result="capped"}[1h]) > 0
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "Response TTL reap is hitting its per-pass cap (backlog growing)"
          description: >-
            The TTL reap has hit its 10,000-rows-per-pass cap on every pass for
            3h, so expiry is outrunning the drain and the responses table is
            growing. response_retention_days controls how many rows are LIVE,
            not the per-hour expiry rate a capped reap must drain, so shortening
            it does not relieve a cap-hitting backlog (the AuditStore sibling
            alert's framing, not this one, is the honest one to follow here).
            The cap is a compile-time constant today — this needs an
            engineering escalation (raise the cap, or shorten the reap cadence
            after a capped pass) rather than a config change.

      # #2691 Gate 5 (chaos-injector): a reap pass that repeatedly ERRORS
      # (statement failure / transaction rollback — result="failed") is a
      # DIFFERENT condition from YuzuResponseReapNotRunning ("hasn't run at
      # all") — the pass IS running, on schedule, and failing every time,
      # which is invisible to the liveness rule (a failed pass still
      # increments the labeled counter, so sum(rate(...)) stays nonzero).
      # Left uncaught, a wedge where the same backlog re-selects and re-fails
      # every pass (the exact self-sustaining-wedge risk the chunked-delete +
      # bounded-facet-drain fix above exists to prevent) pages nobody.
      - alert: YuzuResponseReapFailing
        expr: |
          increase(yuzu_server_response_reap_passes_total{result="failed"}[3h]) >= 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Response TTL reap is repeatedly failing (not merely idle)"
          description: >-
            The response store's TTL reap has failed (statement error or
            transaction rollback) at least twice in 3h — it is running on
            schedule and erroring, not simply not running (that's
            YuzuResponseReapNotRunning). Check the server log for
            "ResponseStore::reap_expired" error lines and PostgreSQL health
            (statement_timeout, lock contention, disk pressure).

      # #2691 Gate 6 (sre + enterprise-readiness, independently confirmed via a
      # live promtool simulation): yuzu_server_response_reap_passes_total is
      # LABELED by `result` (unlike AuditStore's unlabeled sibling counter), and
      # is boot-seeded to 0 for every result value (server.cpp) so a healthy
      # server running ONLY e.g. `noop` passes leaves the other result labels
      # flat at zero forever. Without `sum()` this expression evaluates PER
      # SERIES: every quiet-but-healthy result label independently satisfies
      # `==0`, so this alert fires permanently on every healthy install
      # (promtool-reproduced: 5 concurrent firing instances against 5h of a
      # perfectly healthy simulated reap). `sum()` collapses the labels back to
      # the single "did ANY pass of ANY result happen" question metrics.md
      # documents this metric for ("alert on the total NOT increasing").
      - alert: YuzuResponseReapNotRunning
        expr: |
          sum(rate(yuzu_server_response_reap_passes_total[2h])) == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Response TTL reap has not run in 2h"
          description: >-
            No response reap pass of any result has been recorded for 2h. A
            reaper that never runs looks identical to a quiet healthy store
            while the table grows unbounded (the audit-store retention lesson).
            Check the server's maintenance thread and PostgreSQL health.

      # THIS RULE CANNOT DETECT ITS OWN INPUT GOING MISSING — see
      # YuzuAuditRetentionMetricMissing's comment above (same reasoning, same
      # shape): absent(sum(...)) is still absent, so a server build predating
      # this metric, or a store that failed to open at boot, reports healthy
      # forever under YuzuResponseReapNotRunning alone.
      - alert: YuzuResponseReapMetricMissing
        expr: |
          absent(yuzu_server_response_reap_passes_total)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Response reap liveness metric is absent - the reaper is unmonitored"
          description: >-
            No yuzu_server_response_reap_passes_total series exists in this
            Prometheus, so YuzuResponseReapNotRunning cannot fire and the
            response TTL reap is unmonitored. Check `up` for the Yuzu target
            first — this rule cannot tell "server down" from "server build
            predates this metric" apart.

      # Mirrors YuzuGuardianReapAnchorNotSurviving (#2663) / the AuditStore
      # original (#2579): expect AT MOST one declined_no_anchor pass per
      # database, on the pass that first reaches a verdict — that pass also
      # settles gc_meta.bootstrap_settled, so a genuine repeat means the
      # anchor is not surviving between passes (restore from backup, a
      # replica rehydrated from a template, a disk-level rollback), not that
      # the clock moved. Nothing is deleted by a declined pass.
      - alert: YuzuResponseReapAnchorNotSurviving
        expr: |
          increase(yuzu_server_response_reap_passes_total{result="declined_no_anchor"}[24h]) > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Response reap keeps re-bootstrapping - the stored clock reading is not surviving"
          description: >-
            The response store's retention guard has declined more than once
            in a day for having NO stored clock reading. Expect this at most
            once per database. Repeating means the anchor is being lost
            between passes, not that the clock moved.

  # ── yuzu-secrets — LIVE as of the auth store's Postgres migration ──────
  # The SecretCodec (ADR-0010, #1320 PR 4) counts decrypt failures per store
  # + failure class. These rules were parked "uncomment when live"; the auth
  # store (`auth.users.mfa_totp_secret`) is the first secret-bearing store to
  # ship, and its migration PR wired both the audit hook and the metric
  # export, so they are now active. `store="auth"` is the only value today.
  - name: yuzu-secrets
    rules:
      - alert: YuzuSecretDecryptKekUnresolvable
        # Sustained kek_unresolvable = backup skew / wrong keys dir —
        # retries will NOT self-heal; restore the paired keys directory.
        expr: |
          rate(yuzu_server_secret_decrypt_failures_total{failure_class="kek_unresolvable"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Secret decrypts failing: KEK unresolvable (backup skew?)"

      - alert: YuzuSecretDecryptTamperSignal
        # A single tag_mismatch is the tamper signal — investigate via the
        # secret.decrypt_failure audit trail; never retry-and-ignore.
        expr: |
          increase(yuzu_server_secret_decrypt_failures_total{failure_class="tag_mismatch"}[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Secret blob failed GCM authentication (tamper signal)"

      # ── #2530 KEK rotation-runaway hardening ────────────────────────────
      # yuzu_server_kek_op_lock_held is sampled every 15s off
      # health_recompute_thread_ (server.cpp), filtered to THIS server's own
      # database (current_database()) -- not cluster-wide; a same-named
      # advisory lock held by an unrelated tenant database on the same
      # Postgres instance never sets this gauge. A healthy long re-wrap and a
      # genuinely wedged backend look IDENTICAL on this gauge alone — do NOT
      # page this as "kill the pid". Corroborate via lock_holder_pid
      # (GET /api/v1/secrets/kek/status) against pg_stat_activity before any
      # DBA action; see docs/user-manual/server-admin.md "Diagnosing a stuck
      # KEK op lock" for the full procedure. `for: 30m` is deliberately
      # conservative (~120 samples at the 15s sampling cadence) — this is the
      # only rotation-shaped condition worth paging on; the ceiling/cooldown/
      # clock-anomaly/query-canceled failures are all self-diagnosing from
      # the REST/MCP error body an operator already has in hand, not a
      # background condition to detect.
      - alert: YuzuKekOpLockHeldPersistently
        expr: |
          yuzu_server_kek_op_lock_held == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "secrets_kek_op advisory lock has been held for 30+ minutes"
          description: >-
            THIS MAY BE A HEALTHY YUZU SERVER MID-ROTATION, NOT A WEDGE -- a
            large re-wrap legitimately holds this lock for its whole
            duration, and 30+ minutes is expected on a big secrets table.
            Terminating the holder mid-rotate produces a HALF-COMMITTED
            rotation (new KEK version already active, re-wrap incomplete),
            whose only recovery is POST /api/v1/secrets/kek/rewrap -- a
            retried /rotate on top of that state mints a second, spurious,
            never-retirable version and does not fix anything. Read "Diagnosing
            a stuck KEK op lock" in docs/user-manual/server-admin.md in full
            before touching pg_terminate_backend. Scoped to this server's own
            database (current_database()), not cluster-wide. A healthy,
            long-running rewrap is indistinguishable from a wedged backend by
            this gauge alone -- corroborate via lock_holder_pid and
            lock_holder_captured_at (GET /api/v1/secrets/kek/status) against
            pg_stat_activity before concluding anything, and RE-CONFIRM the
            pid is still the granted holder in pg_locks at the moment of
            termination (Postgres pids are reused, and the /status reading
            you are looking at is already stale by the time you act on it).
            Only a DBA terminates a backend, deliberately, after that
            re-confirmation, and only after checking whether the backend
            belongs to a Yuzu server (pg_stat_activity.client_addr /
            application_name where set) -- prefer stopping that server
            cleanly over killing its backend. This gauge HOLDS its prior
            value rather than publishing a fabricated 0 on a database-read
            degrade, so a firing alert during a database outage may reflect
            stale last-known state rather than a currently-held lock -- check
            the yuzu-postgres alerts first.

      # #2530 G7-S6: sibling of YuzuInventoryStaleCountUnavailable above —
      # same freeze-detector shape, different gauge family. The KEK gauges
      # (yuzu_server_kek_{op_lock_held,live_versions,active_version}) HOLD
      # their prior published value on a database-read degrade rather than
      # publish a fabricated 0/false, so a healthy-looking reading during a
      # sustained increase here may just be stale, not genuine. Fleet-size-
      # independent, so it ships ACTIVE.
      - alert: YuzuKekMetricsUnavailable
        expr: |
          rate(yuzu_server_kek_metrics_unavailable_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "KEK cluster-state gauges may be frozen or absent"
          description: >-
            yuzu_server_kek_metrics_unavailable_total is rising. THREE
            distinct causes, all counted here: (1) the 15s KEK-metrics
            sampling sweep (health_recompute_thread_) failed to acquire a
            pooled connection, or (2) hit its bounded statement_timeout mid
            read -- in either case yuzu_server_kek_op_lock_held /
            yuzu_server_kek_live_versions are HELD at their last published
            value and may read healthy during an actual outage or a
            genuinely wedged secrets_kek_op lock; OR (3) the KEK substrate
            itself (the secrets codec / Postgres pool) is not wired up at
            all, in which case EVERY KEK gauge in this sweep -- including
            yuzu_server_kek_active_version, which needs no DB round trip --
            is never published and reads as ABSENT, not merely stale.
            Distinguish (1)/(2) from (3) via yuzu_pg_pool_waiters /
            yuzu_pg_acquire_wait_seconds and whether the KEK gauges exist in
            /metrics at all; investigate Postgres pool saturation for (1)/(2)
            before trusting the KEK gauges above, or server boot/config for
            (3) if they are missing entirely.
          # #2530 G8-S11: the heading is "Diagnosing a stuck KEK op lock
          # (#2530)" — GitHub-slug anchoring strips the `(`/`)`/`#` but keeps
          # the digits, so the real anchor carries a trailing `-2530` that a
          # bare "...-lock" URL silently drops.
          runbook_url: "https://docs.yuzu.io/user-manual/server-admin#diagnosing-a-stuck-kek-op-lock-2530"

      # #2530 G8-S12 — architect-requested: because #2525 makes retirement
      # impossible, --kek-max-live-versions is a LIFETIME cap, not a rolling
      # one, and without this alert the first signal an operator gets is a
      # 409 VersionCeiling at the exact moment a rotation is needed. Alerts
      # on the RATIO of live versions to the CONFIGURED ceiling (not a
      # hardcoded 32) so it keeps working for an operator who has already
      # exercised the #2530 B5 escape hatch and raised the flag. Both
      # gauges HOLD their prior published value on a sampling degrade
      # (see YuzuKekMetricsUnavailable above) — a stale ratio can under- or
      # over-report during an outage; corroborate against
      # yuzu_server_kek_metrics_unavailable_total before acting.
      - alert: YuzuKekCeilingApproaching
        expr: |
          yuzu_server_kek_live_versions / yuzu_server_kek_max_live_versions > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "KEK live-version count is approaching --kek-max-live-versions"
          description: >-
            yuzu_server_kek_live_versions has crossed 80% of
            yuzu_server_kek_max_live_versions. There is no retire route
            (#2525), so this trend does not self-correct: rotation will
            start returning 409 VersionCeiling once the ceiling is reached.
            Plan ahead of that point -- raising --kek-max-live-versions is a
            deliberate, logged and audited risk acceptance (see
            server.kek_ceiling_raised in the audit log), not something to do
            reactively at the moment rotation is blocked.
          runbook_url: "https://docs.yuzu.io/user-manual/server-admin#diagnosing-a-stuck-kek-op-lock-2530"

  # ── yuzu-auth-rotation — the rotation-sweep clock guard (#2964) ────────
  # ApiTokenStore::sweep_expired_rotations is the SOLE enforcement of
  # predecessor auto-revoke for both engine-credential and human API-token
  # overlap pairs (a caller who never calls confirm relies entirely on this
  # thread). It now carries the full clock-guarded-retention shape the
  # routed concern requires, reusing audit_store's audit_retention_rules.hpp
  # classifier rather than forking it. Runbook:
  # docs/ops-runbooks/rotation-sweep-clock-guard.md.
  - name: yuzu-auth-rotation
    rules:
      # `yuzu_rotation_sweep_last_pass_timestamp_seconds` (gauge, server.cpp)
      # — the durable `rotation_retention_meta.last_pass_now` reading every
      # replica's clock guard shares (mirrors
      # yuzu_server_audit_retention_last_pass_unixtime under this family's own
      # kind-neutral naming, matching yuzu_rotation_sweep_capped_total /
      # _declined_total / _lock_skipped_total).
      #
      # Built on gauge STALENESS rather than a passes-attempted counter
      # (audit_store's own YuzuAuditRetentionNotRunning shape) because this
      # sweep has no unconditional "a tick happened" counter — every counter
      # in this family (declined/lock_skipped/capped) is conditional on a
      # specific outcome, and an accepted, un-capped, un-declined tick — the
      # common healthy case — increments NONE of them.
      #
      # CORRECTED (#2964 fix round, chaos-injection finding): the gauge is
      # stamped on `Ok` and `Declined` ONLY — never on `Failed`. Every
      # `Failed` return in `sweep_expired_rotations` leaves the
      # classification transaction UNCOMMITTED (rolled back), including its
      # own attempted re-anchor of this same reading, so a permanently
      # failing tick (e.g. a missing `rotation_retention_meta` table from a
      # migration-numbering collision, #3013) never refreshes this gauge —
      # staleness correctly accumulates against it, which is exactly what
      # this alert relies on. 15m of staleness at a 60s tick cadence is 15
      # missed ticks — generous against pool contention or a slow Postgres
      # blip, tight enough that a genuinely dead sweep (or one stuck
      # permanently declining/failing classification) is caught well inside
      # the 24-hour successor-unused warning lead time
      # (kSuccessorUnusedWarnLeadSecs, server.cpp) it would otherwise erode.
      #
      # WHAT THIS ALERT DOES NOT COVER: a fresh gauge proves the
      # CLASSIFICATION transaction reached a verdict — it does NOT prove any
      # predecessor was actually revoked. An `Ok` tick that selects
      # candidates and then loses every one of its up-to-200 SEPARATE
      # per-pair revoke transactions to pool contention (each needs a SECOND
      # connection while this sweep's session lock pins the first) commits
      # the classification transaction — including this gauge's own
      # timestamp — and reaches `Ok` regardless: predecessor auto-revoke can
      # be silently failing every tick while this gauge stays perfectly
      # fresh. `yuzu_rotation_sweep_lost_revocations_total` is the signal for
      # THAT failure mode (per-pair revoke transactions that genuinely
      # failed, not the benign already-resolved no-op) — alert on it
      # alongside this one; this rule alone is a coarser "is the sweep alive
      # at all" liveness check, not an enforcement-is-working check.
      - alert: YuzuRotationSweepNotRunning
        expr: |
          (time() - yuzu_rotation_sweep_last_pass_timestamp_seconds) > 900
          and yuzu_rotation_sweep_last_pass_timestamp_seconds > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rotation sweep has not completed a tick in 15 minutes"
          description: >-
            No rotation-sweep tick has stamped its last-pass gauge for over 15
            minutes (15 missed 60-second ticks) — the sweep is not reaching a
            classification verdict at all, so predecessor auto-revoke cannot
            be running for either engine-credential or human API-token
            rotation pairs. A FRESH gauge does not by itself prove
            auto-revoke IS working — pair it with
            yuzu_rotation_sweep_lost_revocations_total, which catches an
            alive-but-losing-every-revoke tick this alert cannot see. The
            `> 0` guard excludes a database that has never completed a
            single tick (the durable anchor is seeded at 0 until then,
            mirroring the audit-retention gauge's own sentinel) — a young
            database legitimately has no reading yet, but so does one whose
            api_token_store construction was refused fail-closed (e.g. a
            missing rotation_retention_meta table, ADR-0012 §1) — check the
            boot log for "ApiTokenStore: opened" before assuming "no alert"
            means "healthy" on a database this young. Check the server log
            for "sweep_expired_rotations:" failure lines and confirm
            "Rotation sweep thread started" appears in the boot log. Runbook:
            docs/ops-runbooks/rotation-sweep-clock-guard.md.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/ops-runbooks/rotation-sweep-clock-guard.md"

      # SINGLE-REPLICA ONLY -- read this before enabling it. The sweep's
      # single caller is one dedicated thread on a sequential 60s loop, so it
      # cannot self-collide on the store-wide session advisory lock. On a
      # single-replica deployment (the default) that means a SkippedLock
      # outcome can ONLY mean a second writer holding the same lock -- a
      # leaked lock from a crashed process, a botched blue-green cutover
      # briefly overlapping two live instances, or an unauthorised second
      # server pointed at the same DSN -- never routine leader-election
      # contention (that framing is correct only for a genuinely
      # multi-replica deployment, where roughly (N-1)/N of a replica's ticks
      # legitimately land here).
      #
      # There is no replica-count signal in this rule set to gate this
      # automatically (the nearest precedent, an `up`-based per-target rule,
      # is a documented, unclosed gap elsewhere in this file -- see
      # YuzuAuditRetentionMetricMissing's comment). Rather than invent an
      # undesigned, unreviewed replica-detection mechanism here, this alert
      # is scoped by DOCUMENTATION, not by expression: it is written for a
      # single-replica deployment and pages on any small sustained rate. If
      # you run multi-replica, DO NOT enable this specific rule as written --
      # this counter moves routinely there and the expression below would
      # page permanently. A multi-replica-aware version needs a genuine
      # replica-count signal and is a follow-up, not shipped here.
      #
      # `> 1` rather than `> 0` tolerates exactly one blip (e.g. one
      # overlapping tick during a graceful single-replica restart/cutover);
      # `for: 5m` requires it to be more than a single-tick fluke. A wedged
      # holder produces a skip on EVERY subsequent 60s tick, so a genuine
      # fault clears both bars within minutes, not tolerantly forever.
      - alert: YuzuRotationSweepLockContentionUnexpected
        expr: |
          increase(yuzu_rotation_sweep_lock_skipped_total[15m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rotation sweep lock contention on what should be a single-replica deployment"
          description: >-
            yuzu_rotation_sweep_lock_skipped_total has risen more than once in
            15 minutes. On a single-replica deployment (the default, and the
            deployment shape this rule assumes) this metric must stay at 0 --
            one dedicated sweep thread cannot lose an election against
            itself, so this means a SECOND writer is holding the sweep's
            store-wide session advisory lock: a leaked lock from a crashed
            process, a botched blue-green cutover, or an unauthorised second
            server pointed at the same Postgres DSN. If you run
            multi-replica, disable this rule -- the counter moves routinely
            there and this expression is not multi-replica-aware. Runbook:
            docs/ops-runbooks/rotation-sweep-clock-guard.md.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/ops-runbooks/rotation-sweep-clock-guard.md"

      # yuzu_rotation_sweep_lost_revocations_total existed with a metric
      # describe() and TWO in-code cross-references ("the signal for THAT
      # failure mode", see YuzuRotationSweepNotRunning's own annotation
      # above) telling an operator to alert on it -- with no rule that
      # actually did. An `Ok`, un-declined tick that loses every one of its
      # per-pair revoke transactions to pool contention is invisible to
      # every OTHER rule in this file (the classification transaction still
      # commits, so the liveness gauge stays fresh and nothing declines --
      # see this metric's own describe() text in server.cpp).
      #
      # `> 0` over 15m, `for: 10m` -- NOT scoped to a persisting loss:
      # `increase(...[15m]) > 0` stays true for the WHOLE 15m window a
      # single, non-repeating bump remains inside it, so this rule DOES fire
      # on one lost revocation just as readily as on a run of them (verified
      # against a synthetic single-bump promtool case). That is the correct
      # shape here, not a gap to close: one lost revocation is itself a real
      # overdue-auto-revoke signal (the affected predecessor stays live past
      # its promised overlap window until the next tick retries it), and
      # `for:` sitting below the `increase()` window -- so the rule pages
      # once the window has had time to accumulate evidence, not only once a
      # loss has visibly repeated -- is this file's established convention,
      # not unique to this rule (see YuzuRotationSweepLockContentionUnexpected
      # above).
      - alert: YuzuRotationSweepLostRevocations
        expr: |
          increase(yuzu_rotation_sweep_lost_revocations_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rotation sweep is losing per-pair revoke transactions"
          description: >-
            yuzu_rotation_sweep_lost_revocations_total has been rising for at
            least 10 minutes -- an accepted (Ok) sweep tick is selecting
            eligible predecessors for auto-revoke and then losing some or all
            of their per-pair revoke transactions (pool/lock/query fault, not
            the benign already-resolved no-op). The classification
            transaction still commits on schedule, so
            yuzu_rotation_sweep_last_pass_timestamp_seconds stays fresh
            throughout -- YuzuRotationSweepNotRunning cannot see this failure
            mode. A likely cause is connection-pool exhaustion: this sweep
            pins one connection for its store-wide session lock for the
            WHOLE call, so every per-pair with_txn_for call needs a SECOND,
            concurrently-available connection (the POOL-SIZE FLOOR documented
            on ApiTokenStore::sweep_expired_rotations) -- check pool
            saturation (yuzu_pg_pool_in_use / yuzu_pg_pool_size) alongside
            this alert. Each affected predecessor remains eligible and is
            retried on the next tick, so a persisting alert means the
            underlying contention is ALSO persisting, not that credentials
            are piling up unrevoked forever. Runbook:
            docs/ops-runbooks/rotation-sweep-clock-guard.md.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/ops-runbooks/rotation-sweep-clock-guard.md"

      # #2964 round 3 review (finding 6): yuzu_rotation_sweep_declined_total
      # existed with no alert at all. A single decline is EXPECTED, routine
      # SLA behaviour (docs/user-manual/authentication.md "Rotating a
      # Token"; docs/user-manual/engine-principals.md) -- fact-set dedup
      # suppresses a REPEAT of the identical anomaly and drains on the very
      # next tick, so one decline is not itself actionable. What IS
      # actionable, and invisible to every other rule in this family, is a
      # clock fault that keeps changing SHAPE tick to tick (each distinct
      # fact set declines fresh, since dedup only suppresses an exact
      # repeat) -- see docs/user-manual/authentication.md's own correction
      # of the earlier, false "a sustained clock anomaly is held safe
      # forever" claim (#2964 round 3 review finding 5): it is NOT held safe
      # forever when the anomaly repeats identically, but a changing-shape
      # fault genuinely can decline indefinitely, one tick at a time. `> 1`
      # over 15m, `for: 10m`: tolerates the single ordinary decline (and its
      # one-tick "roughly 120 seconds total" SLA companion) while catching a
      # streak that keeps recurring past what dedup alone would explain.
      - alert: YuzuRotationSweepDeclinedSustained
        expr: |
          increase(yuzu_rotation_sweep_declined_total[15m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rotation sweep clock guard is declining repeatedly, not draining"
          description: >-
            yuzu_rotation_sweep_declined_total has risen more than once in 15
            minutes and stayed elevated for at least 10 -- more than the
            single decline the fact-set dedup rule's own "one extra tick,
            then drains" SLA predicts for an anomaly that settles on one
            shape (dedup only suppresses a repeat of the IDENTICAL fact set
            -- each distinct fact set declines fresh). A likely cause, given
            several DISTINCT declines inside a short window, is a clock
            fault whose SHAPE keeps changing tick to tick (a jittering
            clock rather than one clean step) -- but it is not the only
            one: a non-clock cause of BadState recurring with a different
            shape each time (e.g. a corrupted/hand-edited durable reading)
            produces the identical alert shape with a perfectly correct
            clock, so check both rather than assuming the clock moved.
            Check PostgreSQL's own clock on the server the same way
            YuzuAuditRetentionClockAnomaly's own first triage step does (this
            sweep reads the identical SELECT EXTRACT(EPOCH FROM now())), and
            check api_token_store.rotation_retention_meta directly for the
            recorded last_anomaly_facts value -- a single-row upsert holding
            the MOST RECENT declined fact set only, never a history of past
            declines. Both credentials in every affected pair stay active
            while this persists -- see the runbook for what that costs.
            Runbook:
            docs/ops-runbooks/rotation-sweep-clock-guard.md.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/ops-runbooks/rotation-sweep-clock-guard.md"

  # ── yuzu-postgres — server storage substrate (#1320 PR 3) ──────────────
  # The server fails closed without PostgreSQL, so substrate health is
  # service-affecting. NOTE ON TIMING: /readyz flips to 503 *immediately* on
  # breaker-open (off yuzu_pg_connect_failed_total), so the load balancer
  # drains the instance right away. These alerts carry `for:` windows and are
  # for paging/escalation — they fire AFTER the LB has already reacted, not
  # before. Metrics come from the pool's Observer feed.
  - name: yuzu-postgres
    rules:
      - alert: YuzuPgConnectFailing
        # The connect-failure circuit breaker has armed — the database is
        # unreachable. /readyz already reports not-ready off the same signal
        # (LB eviction is immediate); this alert fires after for:2m of
        # sustained failure to page/escalate, NOT to drive LB eviction.
        expr: |
          rate(yuzu_pg_connect_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Yuzu cannot connect to PostgreSQL (breaker armed; /readyz already 503)"

      - alert: YuzuPgPoolSaturated
        # >90% of the pool leased for 5m — acquire timeouts (and heartbeat
        # upsert skips) are imminent. Raise --postgres-pool-size or scale.
        expr: |
          yuzu_pg_pool_in_use / yuzu_pg_pool_size > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Yuzu PostgreSQL pool >90% saturated"

      - alert: YuzuPgAcquireWaitHigh
        # p99 acquire wait > 200ms — the leading saturation indicator; the
        # heartbeat upsert deadline is 250ms, so persistence starts to drop here.
        expr: |
          histogram_quantile(0.99, rate(yuzu_pg_acquire_wait_seconds_bucket[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Yuzu PostgreSQL pool acquire p99 > 200ms"

  - name: yuzu-guardian
    rules:
      # yuzu_server_guardian_events_dropped_total is a cumulative-but-published-
      # as-gauge counter that RESETS on server restart, so alert on increase()
      # over a window, never an absolute value. Since item-7 PR-Sv it counts ONLY
      # MISMATCHED-payload event_id collisions — a forged-id pre-claim (#1360) or an
      # agent event_seq_ reset / clock skew carrying a DIFFERENT event. Benign
      # redelivery (the durable agent journal re-sending on reconnect) is now on the
      # separate quiet yuzu_server_guardian_events_redelivered_total and does NOT
      # land here — so this is a security-relevant anomaly signal, not reconnect
      # churn, and the threshold is low. A sustained climb means either drift is
      # being silently discarded (#1414 CC7.3) or an agent is pre-claiming/forging
      # event_ids — investigate, don't just widen the threshold.
      - alert: YuzuGuardianEventsDropped
        expr: |
          increase(yuzu_server_guardian_events_dropped_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Guardian events dropped at ingest (mismatched event_id collision)"
          description: >-
            More than 5 Guardian events were dropped at ingest in the last hour on
            a MISMATCHED-payload event_id collision. These are not benign
            redeliveries (those are counted on
            yuzu_server_guardian_events_redelivered_total) — each is a forged-id
            pre-claim (#1360), an agent event_seq_ reset / clock skew carrying a
            different event, or drift being silently discarded (#1414 CC7.3).
            Check the server `warn` logs for the conflicting event_id + agent, and
            investigate a forged-id campaign or a misbehaving agent before tuning.
          runbook_url: "https://docs.yuzu.io/runbooks/guardian-events-dropped"

      # A sustained OPERATIONAL ingest-fault rate means the classify/insert machinery is
      # broken and event_id conflicts are going UNCLASSIFIED — a genuine collision can then
      # escape yuzu_server_guardian_events_dropped_total entirely (item-7 sec-M2). The
      # metric resets on restart, so alert on increase() over a window. A metric with no
      # alert would be the same blind spot #1414 exists to close, one layer down.
      - alert: YuzuGuardianIngestErrors
        expr: |
          increase(yuzu_server_guardian_events_ingest_errors_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Guardian event ingest is failing (conflicts going unclassified)"
          description: >-
            The Guardian event ingest path reported operational faults (a failed
            BEGIN/prepare/insert/commit, or a redelivery compare that could not run) over
            the last 15 minutes. While this persists, an event_id conflict cannot be
            classified redelivery-vs-collision, so a genuine forged-id collision can
            escape yuzu_server_guardian_events_dropped_total. Check the server logs and
            the guaranteed-state DB health (disk pressure, corruption, lock contention).
          runbook_url: "https://docs.yuzu.io/runbooks/guardian-ingest-errors"

      # #2663 review: the retention reaper's declined_no_anchor result value was
      # documented (guaranteed-state.md "Retention", metrics.md) with this exact
      # expression but shipped no rule — mirrors AuditStore's
      # YuzuAuditRetentionAnchorNotSurviving (#2579), same reasoning: expect AT
      # MOST one decline per database, on the pass that first reaches a verdict:
      # the decline itself SETTLES the bootstrap marker, so a genuine repeat means
      # the marker is not surviving between passes, not that the clock moved.
      - alert: YuzuGuardianReapAnchorNotSurviving
        expr: |
          increase(yuzu_server_guardian_reap_passes_total{result="declined_no_anchor"}[24h]) > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Guardian retention keeps re-bootstrapping - the stored clock reading is not surviving"
          description: >-
            The Guardian retention guard has declined more than once in a day for having
            NO stored clock reading (guaranteed_state_store.gc_meta.bootstrap_settled).
            Expect this AT MOST once per database, on the pass that first reaches a
            verdict - that pass also settles the marker, so the next one has an anchor.
            Repeating means the marker is being lost between passes (a restore from
            backup, a replica rehydrated from a template, a disk-level rollback), not
            that the clock moved. Nothing has been deleted by these passes - the guard
            declines rather than deletes on this trigger.
          runbook_url: "https://docs.yuzu.io/runbooks/guardian-reap-anchor-not-surviving"

  - name: yuzu-audit
    # Behavioural-data routes (guardian.device.view, dex.device.view, dex.signal.view)
    # audit-on-open then FAIL CLOSED: if the audit row cannot persist they return 503
    # and serve no PII (CC7.2). yuzu_server_audit_emit_failed_total is the only signal
    # this is happening — without this alert a fleet-polled CMDB (ServiceNow) integration
    # blackouts silently (sre-1, #1647).
    rules:
      - alert: YuzuAuditPersistFailures
        expr: |
          increase(yuzu_server_audit_emit_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Audit events failing to persist — behavioural-data routes are 503ing"
          description: >-
            yuzu_server_audit_emit_failed_total is rising. Every REST route that uses
            fail-closed audit-on-open (guardian.device.view, dex.device.view,
            dex.signal.view) is returning 503 and withholding PII, so a ServiceNow /
            CMDB poll blackouts fleet-wide. Check audit_store health (/healthz
            stores.audit) and free disk / connection saturation on the PostgreSQL
            server (ADR-0040 — audit is Postgres-backed, not a local file). Note: a bad_alloc-class
            throw in the audit pipeline fails closed the same way but does NOT bump this
            counter (it is catch-logged only) — correlate with a spike in 503s on the
            behavioural routes.
          runbook_url: "docs/ops-runbooks/audit-store-clock-guard.md"

      # #2360 retention clock guard. The guard declines a cleanup pass that would
      # expire every datable audit row, so the evidence table survives a forward
      # clock jump. A decline is not itself an outage, but it means this server's
      # clock moved in a way that WOULD have wiped audit evidence -- an
      # unattended host whose time sync is broken is one guard away from losing
      # its SOC 2 trail.
      # yuzu_server_audit_retention_bootstrap_declines_total (#2579) is NOT
      # folded into the rule below, and that is deliberate rather than an
      # oversight. It has its own rule further down
      # (YuzuAuditRetentionAnchorNotSurviving) keyed on the value CLIMBING; what
      # is deliberately unalerted is a SINGLE decline. That counter
      # marks a pass declined for having NO stored clock reading while rows were
      # already expired - it asserts only that nothing can yet RULE OUT a wrong
      # clock, never that the clock moved, so folding it into the rule below
      # would make this alert's own description untrue and fire it on every
      # server carrying a backlog through the schema-v3 upgrade. Expect 0 or 1
      # per database, so a SINGLE decline is not alerted: that is the ordinary
      # schema-v3 upgrade of a server carrying a backlog.
      #
      # A value that keeps CLIMBING is a different thing and IS alerted, below.
      # An earlier draft of this comment claimed the persist-failure counter
      # already covered it; that was false and is worth stating so nobody
      # restores it. The anchor can be destroyed OUT OF BAND - a restore from a
      # pre-v3 backup, a replica rehydrated from a template, a disk-level
      # rollback - and in every one of those `store_meta` SUCCEEDS each pass, so
      # `..._retention_persist_failed_total` stays flat at zero while the anchor
      # never survives.
      - alert: YuzuAuditRetentionClockAnomaly
        expr: |
          increase(yuzu_server_audit_clock_anomaly_skips_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention declined a pass - clock, outage, or a retention change"
          description: >-
            An audit retention pass declined and deleted NOTHING. This is the guard acting,
            not evidence lost. It is NOT exclusively a clock signal: a reduced
            audit_retention_days, or an outage longer than 7 days, both produce it by design.
            Work the runbook - it gives the expected-cause checklist first, then how to tell a
            normal one-off decline from a genuinely stalled drain. Do NOT use this alert's
            firing state as that test; it can resolve and re-fire on its own either way.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/audit-log.md#the-retention-clock-guard"

      # The counterpart signal. Both a declined pass and a broken pass leave rows
      # undeleted, so an audit table that never shrinks looks identical either
      # way - only the pair separates "the guard is working" from "cleanup is
      # broken". Without this alert an unbounded audit_store reads as a healthy guard.
      - alert: YuzuAuditRetentionFailing
        expr: |
          increase(yuzu_server_audit_cleanup_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention passes are failing on a database error"
          description: >-
            yuzu_server_audit_cleanup_failed_total is rising: a retention pass did not
            fully do its job. Seven sites feed it - an unreadable probe, a failed delete
            prepare or step, a refused implausible caller clock, a closed store, an
            exception caught at the thread boundary, and an unreadable POST-delete backlog
            probe. That last one fires AFTER a successful delete, so a rising counter does
            NOT prove nothing was deleted; read it as "retention is not fully healthy".
            This is NOT the clock guard (that is
            yuzu_server_audit_clock_anomaly_skips_total). Check the PostgreSQL
            server's free disk and the server log. The seven sites do NOT share one message - grep
            for any of: "retention probe failed", "cleanup error", "the post-delete backlog
            probe failed", "retention pass called with an implausible clock reading",
            "retention pass threw". Note a store closed by a failed migration runs ZERO
            passes (start_cleanup early-returns), so this rule cannot fire in that state -
            YuzuAuditRetentionNotRunning is the one that does. NOTE /healthz stores.audit will report healthy
            in this state - it reflects only whether the database is OPEN, and a pass
            failing on a PostgreSQL fault leaves it open. Surfacing retention health there
            is tracked in #2509.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/audit-log.md#the-retention-clock-guard"

      # The per-pass delete cap is what turns an allowed wipe into a paced drain,
      # but it introduces its own failure: if it binds on every pass, expiry is
      # outrunning the drain and audit_store grows without bound. Neither counter
      # above moves in that state, so this is the only signal for it.
      #
      # NOT a fixed-interval count. An earlier revision assumed every capped
      # pass is spaced by the full cleanup_interval_min (default 60m) and set
      # "6 passes in a 6h window" as the threshold -- but audit_next_wait_s
      # (audit_store.hpp) re-arms the NEXT pass after kAuditBacklogRearmSec
      # (5s), not the full interval, for as long as the cap keeps binding. A
      # genuinely stuck backlog therefore produces thousands of increments in
      # that same 6h window, and the count-based rule fired within about 30
      # seconds of the first cap hit, not after 6 real hours of sustained
      # overload -- PERFORMANCE measured this and it was wrong (governance
      # ROUND 3). This rule asks a threshold-free question instead: has a
      # cap-hit recurred within every 10-minute slice for the FULL `for:`
      # duration? 10 minutes is a wide margin over the 5s re-arm (absorbs
      # scheduling jitter and any non-cap pass interspersed), and `for: 30m`
      # is what makes this "sustained", not the count. A brief burst that
      # drains within a few minutes never satisfies `for:` and does not page.
      # Self-adjusting: if kAuditBacklogRearmSec ever changes, this rule does
      # not need re-deriving the way the old count-based one did.
      - alert: YuzuAuditRetentionCapBinding
        expr: |
          increase(yuzu_server_audit_retention_cap_reached_total[10m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention is not keeping up with expiry"
          description: >-
            Audit retention has hit the per-pass delete cap continuously for at least 30
            minutes, so a backlog is being carried forward and audit_store is growing. Note the
            counter is incremented on an OBSERVED backlog or, when the post-delete probe
            could not be read, a conservatively ASSUMED one - an "AuditStore: the post-delete
            backlog probe failed" warning in the log means the remainder was assumed, not
            measured. (Do NOT look for "retention probe failed": that is the PRE-delete
            probe, on which the pass skips entirely and this counter cannot have moved.) Check
            yuzu_server_audit_rows_deleted_total to see whether the backlog is moving at
            all. Sustained firing means the fixed drain rate (25,000 rows per cleanup
            pass, re-armed every 5s while capped) is below this fleet's audit volume, so
            audit_store grows without bound; the cap is a compile-time constant today, so this
            needs an engineering escalation rather than a config change.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/audit-log.md#capacity"

      # YuzuServerRestartLoop -- the crash-loop signal in its own right. Previously this
      # lived ONLY as the `resets(...) <= 1` grace-exclusion inside
      # YuzuAuditRetentionNotRunning below (#2854 hole 3: "no restart-frequency signal
      # exists in its own right, so the retention rule is carrying a job that is not
      # its own"). Standalone here is what let that rule's grace collapse to "has a
      # pass ever stamped this database" (#2854 rung D) without losing crash-loop
      # detection outright.
      #
      # THRESHOLD, a judgment call, stated: at a 30-minute restart cadence (the
      # family's flagship failure -- also YuzuAuditRetentionNotRunning's own motivating
      # case) a 3h window holds 6 resets, well past `> 3`, and FIRES. An install
      # followed by two config-fix restarts holds 2 resets and stays quiet. An hourly
      # restart cadence holds exactly 3 resets and ALSO stays quiet -- the boundary is
      # deliberately placed there, not at `>= 3`; both halves pinned in the test file.
      #
      # WHY `[3h] > 3`, NOT THE ISSUE TEXT'S `[1h] > N`. A 30-minute cadence produces
      # exactly 2 resets per hour, indistinguishable from an ordinary install-plus-fix
      # pair measured on an hourly window. Any threshold on `[1h]` that catches the
      # flagship cadence also pages the benign one; widening to a 3h window is what
      # separates them.
      #
      # SAMPLING BOUND, and it is not merely a delay. `yuzu_server_uptime_seconds` is
      # written once per periodic metrics-sweep tick (server.cpp), not on every
      # scrape, so `resets()` can undercount restarts faster than that tick interval.
      # `> 3` in a 3h window (one reset per 45 minutes) sits comfortably above an
      # ordinary crash loop's cadence; do not lower the threshold without
      # re-checking the sweep interval. But a loop faster than the tick itself --
      # `Restart=always` with no `RestartSec` crashing before the first tick fires,
      # every time -- writes the gauge AT MOST once per boot no matter how long the
      # loop runs, so `resets()` can never observe more than a handful of
      # transitions and this rule stays PERMANENTLY silent, not just delayed. No
      # rule in this file is a dead-man's-switch for the server process itself (an
      # `up == 0` / `absent_over_time()` companion would be); tracked as #2956, not
      # closed here.
      #
      # `resets()` FALSE-NEGATIVES ON A PARTIAL RANGE, the mirror of
      # YuzuAuditRetentionNotRunning's documented `increase()` false-POSITIVE below.
      # The same four causes -- a Prometheus restart, a fresh TSDB, a new HA
      # replica, or applying this file for the first time -- clip the trailing [3h]
      # window from the LEFT, so an actively ongoing crash loop that started before
      # the clip can show fewer than 4 resets in-window and stay quiet for up to
      # roughly `4 x cadence + 15m` after the clip (~2h15m at the flagship 30-minute
      # cadence) before enough fresh resets accumulate to fire. Where the sibling
      # rule's clipped `increase()` reads as "broken" when it is not, this rule's
      # clipped `resets()` reads as "healthy" when it may not be -- do not trust a
      # quiet YuzuServerRestartLoop in the ~3h after any of those four events.
      #
      # KNOWN LIMIT, and it bites hardest where crash loops live. `resets()` needs
      # ONE CONTINUOUS SERIES per server. If a restart changes the `instance`
      # label -- dynamic-port or IP-based service discovery, a rescheduled pod --
      # each restart starts a FRESH series with `resets == 0`, so this rule goes
      # silent exactly where a crash loop is most likely. (The retention rules
      # below no longer share this limit: their stamp-based grace reads a value,
      # not a series history, so an identity-changing restart does not silence
      # them.) Nothing in PromQL can recover from that; the fix is scrape config,
      # not this rule (target a stable identity). It is called out in the runbook.
      - alert: YuzuServerRestartLoop
        expr: |
          resets(yuzu_server_uptime_seconds[3h]) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Server is restarting in a loop"
          description: >-
            yuzu_server_uptime_seconds has reset more than 3 times in the last 3 hours --
            more often than an hourly restart cadence, which is not itself a fault. Check
            the server's process log / systemd journal / container restart history for a
            crash signature (unhandled exception, OOM-kill, failed boot precondition)
            around each reset. This is a process-health signal, not evidence of a specific
            subsystem fault -- YuzuAuditRetentionNotRunning and the rest of the yuzu-audit
            group cover what a dead reaper causes DURING a loop like this one. Note:
            those rules key on the audit database's own state, not on restart counts, so
            at 2 or 3 resets in the window this alert stays quiet while a stalled reaper
            still fires YuzuAuditRetentionNotRunning -- seeing that alert alone is not
            evidence this one should also be firing.
            Runbook: docs/ops-runbooks/audit-store-clock-guard.md.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/ops-runbooks/audit-store-clock-guard.md"

      # THE ABSENCE ALERTS. Every COUNTER-driven rule in this group fires on a
      # counter RISING, so none of those fires when the cleanup thread never
      # runs (never started because the store was closed at boot, died, or was
      # stopped and not restarted). In that state every counter sits flat at 0
      # while audit_store grows without bound and rows are retained past the
      # stated window. What makes the state DETECTABLE is the seventh series:
      # yuzu_server_audit_retention_last_pass_unixtime is seeded from the durable
      # audit_retention_meta anchor at startup (#2854), so it is NOT flat -- it
      # reads the last pass's stamp on a database that has ever had one, and
      # exactly 0 only on a database that never has. This rule catches the dead
      # reaper on an anchored database; YuzuAuditRetentionNeverRan below catches
      # the database no pass ever ran against.
      #
      # Threshold is tied to the 60-minute cleanup interval: no pass in 3h is
      # unambiguously broken. That interval is NOT operator-configurable today --
      # `server.cpp` constructs `AuditStore` with only `audit_retention_days`, so
      # the `cleanup_interval_min` ctor parameter declared in `audit_store.hpp`
      # keeps its 60-minute default. If it is ever exposed, this window -- and
      # YuzuAuditRetentionNeverRan's window and `for:` below -- must be
      # revisited; PromQL cannot read the server's own interval.
      #
      # THE SEED IS WHAT CLOSED THE BAND (#2854). This rule's grace used to be a
      # young-server test on yuzu_server_uptime_seconds (`unless (uptime < 10800
      # and resets(uptime[3h]) <= 1)`), and the family's measured holes all
      # lived in it: blind for a genuinely dead reaper at restart cadences the
      # sweep measured (164-195 minutes in the final revision), able to resolve
      # mid-fault from ~90-minute cadences up, and silent about restart
      # frequency as a signal in its own right (#2854's three holes;
      # YuzuServerRestartLoop above took the third). The grace is now a single
      # fact about the DATABASE: the stamp gauge is seeded from the durable
      # audit_retention_meta anchor at startup, so `stamp == 0` means "no
      # retention pass has EVER run against this database" -- the only state in
      # which zero passes is legitimate (run_cleanup sleeps a full interval
      # before its first pass; YuzuAuditRetentionNeverRan below owns that
      # state). A crash-looping process on an anchored database keeps a NON-ZERO
      # stamp across every restart, so no restart cadence re-enters the grace:
      # increase() over the passes counter stays 0 continuously and the unless
      # operand stays false continuously -- no blind band, and no oscillation
      # for Alertmanager to read as RESOLVED mid-fault. Deliberately NO
      # keep_firing_for on this rule or the next: with the grace restart-proof
      # there is no single-evaluation flake to paper over, and it would extend
      # the documented Prometheus-restart false page below and delay every
      # genuine RESOLVED.
      #
      # THE GRACE IS A RANGE, NOT AN INSTANT SAMPLE, and that is load-bearing
      # twice over (governance sec-F1/UP-1, both measured against the instant
      # form this replaced). An instant `stamp == 0` operand re-excuses the
      # rule at EVERY 0-valued sample, so any series that mixes 0 with
      # something else faster than `for: 15m` -- a per-boot alternation between
      # a 0 seed and the INT64_MIN unreadable-anchor sentinel, or an
      # anchor-loss flap mixing 0 with a real stamp -- reset the `for:` clock
      # forever and NEITHER liveness rule fired on a genuinely dead reaper.
      # THE GRACE IS EXACTLY THE NEXT RULE'S FIRING CONDITION -- the same
      # max/min expression, verbatim -- so the pair partitions the dead-reaper
      # states STRUCTURALLY: at every instant, every window shape is either
      # excused here and owned below, or unexcused here and paged here.
      # Instantaneous ownership is not TEMPORAL coverage: a regime that
      # phase-locks OSCILLATION between the two owners faster than either
      # rule's `for:` can accumulate still starves both (measured: sentinel
      # filler with single-scrape 0 excursions at a 180-195m period; requires
      # a never-anchored database, a dead reaper, and a scrape phase-locked
      # to the short boot). Closing that is a `for:`/window retune tracked as
      # #2997 -- do not narrow either `for:` here without re-timing
      # every case in the test file and re-running the sweep. Excused means "the
      # window carries no evidence a pass ever happened": every sample is 0
      # or the unreadable-anchor sentinel, with at least one 0. ANY evidence
      # of a pass -- a genuine positive stamp, or a dead-CMOS NEGATIVE stamp
      # (a pass is a pass, whatever the clock said; governance CA-G8-1
      # measured a 0/negative anchor-flap silencing the max-only form of this
      # grace) -- lifts it for a full window and fires HERE, as does a window
      # of only sentinels (nothing rules a dead reaper out). A negative dead-CMOS stamp keeps max_over_time negative,
      # never 0, so it does not earn the grace either -- a pass happened, and a
      # subsequently dead reaper still pages here. Pinned in the test file.
      # `unless` rather than `and` so an absent stamp series cannot silence the
      # rule either -- also pinned.
      #
      # THE MANIFEST IS THE GATE, NOT THIS COMMENT. Do not validate a change to
      # this expression (or the next rule's) against any band or bound quoted
      # in prose -- bands are RESULTS, and three earlier reviews each reported a
      # different one from sparse sampling. Re-run
      # `tests/prometheus/blind_band_sweep.py --emit` and compare against the
      # committed `tests/prometheus/blind_band_manifest.json` (empty uncovered
      # sets, enforced by `--check` on every PR); method, resolution and the
      # ways the measurement goes wrong are in
      # docs/prometheus/blind-band-measurement.md.
      #
      # MATCHING IS DELIBERATELY BARE, and that is load-bearing. Both operands
      # -- the passes counter and the stamp gauge -- are scraped from the SAME
      # server target, so their label sets are already identical and an explicit
      # `on(...)` can only narrow them. An earlier revision of this rule used
      # `on(instance)` on its then-uptime operands, which let any other series
      # that merely SHARED an `instance` value -- a canary, an HA pair, a
      # federated series -- stand in for a broken server's and suppress its
      # alert. `on(instance, job)` is not the fix: it moves the same hole to the
      # next distinguishing label (`namespace`, `pod`, `cluster`). Default
      # matching is what every other cross-metric rule in this file uses; a rule
      # that opts out of it needs a stated reason, and this one has none. Pinned
      # by the two-target case in `tests/prometheus/yuzu-alerts.test.yml`.
      #
      # WHAT WOULD BREAK THE ASSUMPTION, since it is an operator-side change this
      # file cannot guard: both metrics ship UNLABELLED -- `server.cpp` emits
      # them in the SAME `if (audit_store_)` block through the same no-label
      # `gauge(name)` overload, so they are co-present or co-absent with
      # identical label sets, which is what makes the bare `unless` join sound.
      # A `metric_relabel_configs` that adds or drops a label on ONE of the two
      # makes the sets differ, the join then matches nothing, the never-ran
      # grace silently stops applying, and every fresh database pages after 15
      # minutes. That is the inverse of the `on(instance)` bug above.
      #
      # KNOWN LIMIT: THIS FALSE-PAGES AFTER A PROMETHEUS RESTART. MEASURED under
      # promtool with the next pass landing at the 60-minute cadence: it fires
      # from ~15m (the `for:`) and clears the moment that pass lands, so about 45
      # MINUTES of firing - bounded by the cleanup interval, not by anything this
      # rule controls. (An earlier revision said ~75 minutes, adding `for:` to the
      # interval. `for:` delays the START; it does not extend the end.)
      # It predates this rule's current form - MEASURED identically against both
      # previous expressions (#2553, Gate 5 chaos analysis). `increase()` over a
      # PARTIAL range returns 0, and the grace watches the DATABASE's history,
      # not Prometheus's, so it does not apply: a healthy long-lived server
      # whose last hourly pass predates the first scrape is indistinguishable
      # from a dead reaper until a pass lands inside the new window. A fresh
      # TSDB, a new HA replica, or applying this file for the first time all
      # produce it. Documented rather than fixed here because the fix is a
      # behaviour change (a `count_over_time(...) >= n` conjunct) that wants
      # deciding on its own evidence rather than folding into this branch.
      # YuzuAuditRetentionNeverRan below is IMMUNE: its operands are the stamp
      # itself, non-zero from the first scraped sample on any anchored database,
      # and its 3-hour `for:` outlasts this false page's whole lifetime anyway.
      #
      # CANARY ANCHOR (tests/prometheus/run_promtool_tests.py, CANARY_FROM): the
      # indented `unless (` line in the expr below is the suite's mutation
      # target -- the canary build flips it to `and (`, which inverts the grace
      # so the rule can fire ONLY on a never-anchored database, and the suite
      # must redden. Rewriting this expr means updating CANARY_FROM in the same
      # change, or the canary hard-fails the suite.
      - alert: YuzuAuditRetentionNotRunning
        expr: |
          increase(yuzu_server_audit_retention_passes_total[3h]) == 0
          unless (
            max_over_time(yuzu_server_audit_retention_last_pass_unixtime[3h]) == 0
            and (
              min_over_time(yuzu_server_audit_retention_last_pass_unixtime[3h]) == 0
              or min_over_time(yuzu_server_audit_retention_last_pass_unixtime[3h]) == -9223372036854775808
            )
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention has not run for 3 hours"
          description: >-
            No audit retention pass has been attempted in 3 hours, so audit_store is not
            being drained and rows are being retained past the configured window. Note the
            other retention COUNTERS cannot move in this state - they all key on a
            counter rising, and nothing is running to raise one. The only excused state
            is a 3-hour window carrying no evidence of any pass - every stamp sample 0
            or the INT64_MIN unreadable-anchor sentinel, with at least one 0 - which is
            exactly the state YuzuAuditRetentionNeverRan fires on. Any evidence of a
            pass - a genuine stamp, or a dead-CMOS negative one - or a window of only
            sentinels does not excuse, so a
            crash-looping server on an anchored database fires here at every restart
            cadence, and this rule STAYS firing while the reaper stays dead: treat
            RESOLVED as recovery only alongside yuzu_server_audit_retention_passes_total
            rising. Check the server log for "AuditStore: retention pass threw", confirm
            the store opened at boot (a failed migration closes it and start_cleanup()
            then early-returns), and check
            yuzu_server_audit_retention_last_pass_unixtime for when it last ran.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/audit-log.md#the-retention-clock-guard"

      # YuzuAuditRetentionNeverRan -- the collapsed grace, standalone. The rule
      # above excuses exactly one state (no genuine stamp in the window: a
      # database no retention pass has ever run against, seen through reads
      # that may intermittently fail to the sentinel); this rule OWNS that
      # state, because "the
      # first pass never landed" is as broken as a reaper that died -- a failed
      # migration closing the store at boot produces exactly this -- it just
      # deserves a first-pass grace (run_cleanup sleeps one full interval, 60
      # minutes today, before its first pass) rather than 15 minutes.
      #
      # WHY THE GRACE IS NOT `for:` ON AN INSTANT VECTOR. The naive form --
      # `stamp == 0` with a long `for:` -- never latches on the fresh-install
      # crash loop this rule exists for: a crash-looper whose downtime exceeds
      # Prometheus's 5-minute staleness horizon EMPTIES an instant selector
      # during each gap, and `for:` restarts from zero every time the vector
      # goes empty. min_over_time/max_over_time hold the samples that DID land
      # across those gaps, so the range form latches on exactly the series an
      # instant vector keeps dropping. (The same argument, plus the mixed-seed
      # regimes, is why the rule ABOVE reads its grace through max_over_time
      # rather than an instant sample -- see THE GRACE IS A RANGE up there.)
      #
      # BOTH ARMS ARE LOAD-BEARING, and they clear DIFFERENT states -- an
      # earlier revision credited the min arm with clearing everything, which
      # was false (governance CA-F2) and is exactly the mis-read this
      # paragraph exists to prevent. The MAX arm is what clears on a genuine
      # pass: a positive stamp anywhere in the window makes max non-zero
      # (min may still read 0 from older samples). The MIN arm distinguishes
      # what a window WITHOUT a genuine stamp means: a negative dead-CMOS
      # stamp (min < 0, matching neither branch) is a PASS -- the rule clears,
      # because "never ran" is disproven even though the clock was garbage --
      # while exactly-0 and the INT64_MIN unreadable-anchor sentinel both keep
      # the never-ran hypothesis alive. THE SENTINEL BRANCH IS DELIBERATE
      # (governance sec-F1, measured): a failed anchor READ on a fresh
      # database is not evidence a pass happened, and without it a crash loop
      # alternating 0 seeds with sentinel seeds satisfied neither this rule
      # (min read the sentinel, not 0) nor the one above (each 0 sample
      # re-excused it) -- a dead reaper paged NOTHING. Pinned in the test
      # file: the negative-stamp case reddens if the min arm is dropped, and
      # the mixed 0/sentinel case reddens if the sentinel branch is dropped.
      #
      # SEPARATE RULE, NOT `or`-JOINED INTO THE ONE ABOVE. Different graces (15m
      # vs 3h), different remediations (dead reaper vs store-never-opened /
      # first-boot failure), and burying a second condition inside one
      # expression is the exact mistake this redesign fixed. Mutual exclusivity
      # is STRUCTURAL while the target is scraped (the grace above IS this
      # rule's condition) and pinned in the test file; after total scrape
      # loss, see the case-13/case-42 double-page notes there.
      - alert: YuzuAuditRetentionNeverRan
        expr: |
          max_over_time(yuzu_server_audit_retention_last_pass_unixtime[3h]) == 0
          and (
            min_over_time(yuzu_server_audit_retention_last_pass_unixtime[3h]) == 0
            or min_over_time(yuzu_server_audit_retention_last_pass_unixtime[3h]) == -9223372036854775808
          )
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "No audit retention pass has ever run against this database"
          description: >-
            yuzu_server_audit_retention_last_pass_unixtime has recorded no genuine
            pass for at least the 3 hours of `for:` - every sample read 0 (never ran)
            or the INT64_MIN unreadable-anchor sentinel, with at least one 0 (a
            dead-CMOS negative hiding BESIDE both of those still lands here - an
            unreadable anchor keeps never-ran unprovable - so expect an imprecise
            story in that corruption-grade triple mix) - this
            database has never had a retention pass land. Not "not recently": NEVER -
            the gauge is seeded from the durable audit_retention_meta anchor at
            startup (#2854), so 0 is a fact about the DATABASE, not about a young
            process, and a fresh install's one legitimate cleanup interval of silence
            is over long before this fires. Restarts do not reset the clock: the [3h]
            window holds the samples across crash-loop gaps - including a boot whose
            anchor read failed and seeded the sentinel - so a fresh install stuck in
            a boot loop still pages (one measured, filed exception: a mixed-seed
            oscillation phase-locked at a 180-195 minute period can starve both
            rules' for: clocks - #2997).
            Check that the store opened at boot (a failed migration closes it and
            start_cleanup() then early-returns) and the server log for
            "AuditStore: retention pass threw".
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/ops-runbooks/audit-store-clock-guard.md#yuzuauditretentionneverran"

      # THE RULE ABOVE CANNOT DETECT ITS OWN INPUT GOING MISSING, which is why
      # this exists. `increase()` over a metric with NO series returns an empty
      # vector, `== 0` on an empty vector is empty, and an alert that selects
      # nothing never fires -- so a Prometheus carrying these rules against a
      # server that does not export `yuzu_server_audit_retention_passes_total`
      # reports healthy forever, while the reaper is entirely unmonitored. That
      # is the shape an operator lands in by following upgrading.md's own advice:
      # the rules file is a copy you apply yourself, so it routinely runs ahead
      # of the servers it points at.
      #
      # `absent()` is deliberately a SEPARATE rule rather than an `or` folded
      # into the liveness pair above: no grace may apply to it (a missing
      # metric is not excused by anything), and the states want different
      # remediation -- theirs are "the reaper stopped" / "it never started",
      # this one is "you are not watching the reaper at all".
      #
      # NOTE it is fleet-wide, not per-server: `absent()` fires only when NO
      # series exists anywhere in this Prometheus. A single server that stops
      # exporting while others still do is invisible here (nothing in PromQL
      # expresses "absent for a target I can no longer see"). Scoped this way on
      # purpose -- the alternative fires on every Prometheus that scrapes
      # anything other than Yuzu.
      #
      # AND AN `up`-BASED TARGET-DOWN ALERT DOES NOT COVER THAT GAP EITHER, which
      # this comment claimed until #2553 pass 13. The uncovered server is ALIVE
      # and scraped -- an older build that does not export this counter yet -- so
      # its `up` is 1. Measured: with one server exporting the counter and one
      # not, NEITHER retention rule fires, for EITHER server, indefinitely.
      # Closing it needs a per-target rule
      # (`up{job=<yuzu>} == 1 unless on(instance, job) <counter>`), which would
      # need to be a DOCUMENTED EXCEPTION to this file's bare-matching contract:
      # `up` is Prometheus-synthesised, so metric_relabel_configs never touches
      # it and its label set genuinely can diverge from an exported metric's.
      # Note that exception does NOT escape the objection recorded above against
      # `on(instance)` and `on(instance, job)` -- an HA pair or a federated copy
      # agreeing on the narrowed labels can still stand in for the target you
      # meant. It is a different trade, not a refutation, and whoever implements
      # it owes that argument. Tracked separately. Until then, confirm coverage
      # directly: `count(<counter>)` against your expected server count.
      - alert: YuzuAuditRetentionMetricMissing
        expr: |
          absent(yuzu_server_audit_retention_passes_total)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention liveness metric is absent - the reaper is unmonitored"
          description: >-
            No yuzu_server_audit_retention_passes_total series exists in this Prometheus, so
            YuzuAuditRetentionNotRunning cannot fire and the audit retention window is
            unmonitored. CHECK `up` FOR THE YUZU TARGET FIRST - this rule cannot tell the
            cases apart. If `up` is 0 the SERVER OR ITS SCRAPE IS DOWN, which is an outage,
            not a monitoring gap, and on a single-server Prometheus this rule may be the only
            one firing (nothing here alerts on `up` directly). If `up` returns NO SERIES AT
            ALL, do not assume that is benign: it means either this Prometheus was never
            configured to scrape a Yuzu server (expected and ignorable before the first one
            is stood up - check the targets page), OR the target has LEFT service discovery,
            which under dynamic-port, IP-based or scheduler-managed SD is exactly what a dead
            or deleted server looks like. An empty target list for a fleet you believe is
            running is an outage. If `up` is 1 the
            metric itself is missing: a server build predating it (the rules file is a copy
            you apply yourself and the server never upgrades it), or a scrape config dropping
            it - confirm with `curl -s <server>/metrics | grep audit_retention_passes`, then
            check metric_relabel_configs. THAT STATE IS NOT BENIGN: the server is alive and
            scraped and its reaper is unmonitored. Fleet-wide only - a single quiet server
            among many is not detected this way, and an `up`-based target-down alert does not
            cover it either, because that server's `up` is 1.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/audit-log.md#the-retention-clock-guard"

      # The durable clock reading is what makes anomaly detection survive a
      # restart. If it cannot be written, that half of the guard silently
      # degrades to nothing on the next boot.
      # The climbing case the comment above describes. Threshold follows the
      # contract, not a guess: the bootstrap decline is expected AT MOST ONCE per
      # database, so more than one inside a day means the stored reading is not
      # surviving between passes and the guard is re-bootstrapping instead of
      # comparing. Deliberately NOT keyed on > 0, which would fire on every
      # legitimate schema-v3 upgrade.
      - alert: YuzuAuditRetentionAnchorNotSurviving
        expr: |
          increase(yuzu_server_audit_retention_bootstrap_declines_total[24h]) > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention keeps re-bootstrapping - the stored clock reading is not surviving"
          description: >-
            The retention guard has declined more than once in a day for having NO stored
            clock reading. Expect this AT MOST once per database, on the upgrade that adds
            the reading. Repeating means the anchor is being lost between passes, so the
            restart-surviving half of the clock guard is not working and each pass starts
            blind. Nothing has been deleted by these passes. Check
            yuzu_server_audit_retention_persist_failed_total first - if it is FLAT, the row
            is being destroyed outside the server (a restore from a pre-v3 backup, a replica
            rehydrated from a template, a disk-level rollback), which that counter cannot
            see. Runbook: docs/ops-runbooks/audit-store-clock-guard.md.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/ops-runbooks/audit-store-clock-guard.md"

      - alert: YuzuAuditRetentionStateNotPersisting
        expr: |
          increase(yuzu_server_audit_retention_persist_failed_total[1h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention cannot persist its clock reading"
          description: >-
            The retention pass could not write its clock reading to audit_retention_meta.
            Detection still works within this process, but will not survive a restart --
            a server that reboots with a wrong clock would then see no elapsed-time step.
            Usually a disk or permissions problem on the audit database.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/audit-log.md#the-retention-clock-guard"

      # ADR-0040 PostgreSQL cutover. The audit trail migrated from SQLite
      # audit.db to the PostgreSQL schema audit_store via a MANDATORY one-time
      # streamed backfill that PRESERVES history. A failed/partial backfill
      # fails the boot CLOSED (the server refuses to serve a knowingly-incomplete
      # evidence chain) and retries on the next start -- so a replica stuck
      # failing backfill sits in a restart loop with no audit evidence chain
      # available.
      #
      # WHY THIS DOES NOT KEY ON result="failed". The backfill runs during server
      # CONSTRUCTION and a failure sets startup_failed_, so run() returns before
      # the HTTP listener starts (server.cpp): /metrics is never served and that
      # sample is never scraped. An expression over the failed series can
      # therefore never fire, however the counter behaves. What IS observable
      # from outside is the absence of a SUCCESS outcome -- a server that refused
      # to boot publishes no audit-backfill series at all -- so that is what this
      # alerts on.
      #
      # THIS RULE DEPENDS ON THE PRE-SEED. `AuditStore::set_metrics` initialises
      # the whole `result` set to 0 when a registry is wired, which is what makes
      # "series absent" mean "no server is serving". Without it the ordinary
      # restart of an already-migrated server exports nothing (it returns at the
      # backfill marker check without reaching an outcome) and this rule pages on
      # every routine restart. Do not drop the seed and keep this expression.
      #
      # LIMITS, stated because the alert reads stronger than it is: it fires only
      # when NO scraped server reports a completed/fresh backfill, so in a
      # multi-replica deployment one wedged replica among healthy ones will not
      # trip it (that one shows up as a down instance, `up == 0`). It ALSO fires
      # during a legitimately long first-boot backfill on a large legacy
      # audit.db, because the server does not serve /metrics until the backfill
      # finishes — expected during that upgrade window; silence it for the
      # window (upgrading.md says so too). The BOOT LOG is the primary signal in
      # every case; this is the outside-in backstop.
      - alert: YuzuAuditBackfillFailing
        expr: |
          absent_over_time(yuzu_server_audit_backfill_total{result=~"completed|fresh"}[15m])
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No server is reporting a completed audit-store backfill (possible boot refusal)"
          description: >-
            No scraped Yuzu server has reported a successful one-time legacy audit.db ->
            PostgreSQL audit_store backfill (ADR-0040) in the last 15 minutes. After an
            upgrade the usual cause is a server that FAILED the backfill: it fails CLOSED,
            refuses to serve with a knowingly-incomplete SOC 2 evidence chain, never starts
            its /metrics listener, and retries on the next start -- a restart loop with the
            audit trail unavailable. Read the server BOOT log for the loud backfill
            diagnostic (row-count reconciliation / prefix mismatch / stream error): it is
            the primary signal and carries the remediation. Confirm the legacy audit.db is
            readable and the PostgreSQL substrate is reachable and writable, then let the
            resumable backfill re-run. In a multi-replica deployment bring up ONE replica
            and let it finish the backfill (the backfill_complete marker is stamped in
            audit_store) BEFORE starting the rest. Rule out the benign causes of an absent
            series too: no server scraped at all, or a changed job/label set.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/upgrading.md"

      # Read-path evidence-availability. On the PostgreSQL substrate an audit
      # QUERY that cannot be served degrades to DENY (503), never a false-empty
      # 200 -- so a reviewer or SIEM can never mistake an infrastructure blip for
      # "no audit activity". A sustained non-zero increase means audit reads are
      # 503ing (store not open / pool acquire timeout / query error), i.e. the
      # evidence trail is unreadable to a wired integration.
      - alert: YuzuAuditReadDegraded
        expr: |
          increase(yuzu_server_audit_read_degrade_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit-store reads are degrading to 503 — evidence trail unreadable"
          description: >-
            yuzu_server_audit_read_degrade_total is rising: audit-log queries are
            returning 503 rather than serving results (deny-on-degrade, never a
            false-empty 200). Break down by the {reason} label -- store_not_open
            (the store failed construction / is closed), pool_acquire_timeout (the
            shared PgPool is saturated or Postgres is slow), or query_error (the
            SELECT itself failed). A CMDB / SIEM / auditor pulling the trail gets
            503s while this persists. Check PostgreSQL health and pool saturation
            (see the substrate metrics) and free disk on the database host.
            Escalate toward critical if it does not clear, since evidence reads are
            a SOC 2 CC7.2 availability obligation.
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/audit-log.md#storage"

  - name: yuzu-bundles
    # Live-query bundle surface (ADR-0011). The manifest map is in-memory + bounded
    # (TTL + cap), so cap-eviction silently discards another operator's in-flight
    # bundle — these alerts make that (and dispatch health) observable until the
    # manifest moves to Postgres.
    rules:
      - alert: YuzuBundleCapEviction
        expr: |
          rate(yuzu_bundle_evictions_total{reason="cap"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Live-query bundle manifest cap is forcing evictions"
          description: >-
            The in-memory bundle manifest map has hit its cap and is evicting
            non-expired bundles to admit new ones — an in-flight bundle may 404 on
            collate for an operator who did not cause the load. Likely a runaway
            agentic dispatch loop. Investigate the dispatching principal; the
            durable Postgres manifest (ADR-0011) removes the cap.
      - alert: YuzuBundleManifestSaturation
        expr: |
          max(yuzu_bundle_manifests) > 3500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Live-query bundle manifest count approaching the 4096 cap"
          description: >-
            In-flight bundle manifests are within ~15% of the cap; sustained growth
            will force cross-operator cap-eviction (see YuzuBundleCapEviction).
      - alert: YuzuBundleDispatchLatencyHigh
        # UP-15: the bundle fan-out is synchronous — a POST holds an HTTP worker
        # across N gRPC writes. This pages before that hold (×concurrency) starves
        # the worker pool; observe-only is not enough while the async-dispatch fix
        # is deferred. 500ms is well above the ms-scale normal case.
        expr: |
          histogram_quantile(0.99,
            sum(rate(yuzu_bundle_dispatch_duration_seconds_bucket[5m])) by (le, surface)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Bundle dispatch fan-out p99 > 500ms (HTTP worker hold risk)"
          description: >-
            The synchronous bundle dispatch fan-out is holding HTTP workers for
            >500ms p99 on surface={{ $labels.surface }}. Under load this risks
            HTTP thread-pool starvation affecting unrelated routes. Reduce
            concurrent bundle dispatches, reduce steps-per-bundle, or prioritise
            the deferred async-dispatch fix (UP-15).

  # Agent daily-sync / installed-software inventory (ADR-0016). The
  # yuzu_inventory_ingest_total{source,outcome} counter is otherwise measured but
  # unoperationalised (gov sre). need_full + error are the degradation signals.
  - name: yuzu-inventory
    rules:
      - alert: YuzuInventorySustainedIngestErrors
        # outcome=error = a store/pool failure on ingest. Correlated with yuzu_pg_*
        # = a transient PG outage (self-heals); uncorrelated + low/persistent = a
        # device stuck on a payload the store keeps rejecting — grep the warn-level
        # SoftwareInventoryStore log for the agent_id.
        expr: |
          sum(rate(yuzu_inventory_ingest_total{outcome="error"}[15m])) > 0.001
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software ingest sustaining errors"
          description: >-
            yuzu_inventory_ingest_total{outcome="error"} has been non-zero for 15m.
            If correlated with yuzu_pg_connect_failed_total it is a transient
            Postgres outage (self-heals via the next sync + weekly full-floor); if
            uncorrelated it is likely one or more devices whose payload the store
            keeps rejecting — grep the warn-level SoftwareInventoryStore logs for
            the agent_id.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryHighNeedFullRatio
        expr: |
          sum(rate(yuzu_inventory_ingest_total{outcome="need_full"}[15m]))
          / clamp_min(sum(rate(yuzu_inventory_ingest_total[15m])), 0.0001) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software need_full ratio > 20%"
          description: >-
            Over 20% of inventory ingest outcomes are need_full for 15m. Expected
            transiently after a server DB restore (cold cache — agents re-send full,
            then settle), or for up to ~24h fleet-wide immediately after a sync
            source's wire-blob-contract version bump (e.g. installed_software's
            blob contract v2, 2026-07) — every agent's first post-upgrade sync is a
            one-time need_full by design, phase-spread across the daily sync window,
            self-healing; check release notes for a recent contract change before
            treating this as an incident. A sustained ratio with no such change
            suggests hash drift or agents stuck in a resend cycle.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryDroppedBlobs
        # outcome=dropped = a blob over the 3 MiB cap was rejected + nacked. UNLIKE
        # outcome=error this NEVER self-heals: the agent resends the same over-cap
        # payload and backs off forever (the agent's own cap should prevent reaching
        # here, so a non-zero rate signals agent/server cap drift after a version
        # skew, or a non-conforming agent). Deliberately a SEPARATE alert — folding
        # it into YuzuInventorySustainedIngestErrors would mislabel a permanent
        # condition as the self-healing transient-PG-outage case (gov sre).
        expr: |
          sum(rate(yuzu_inventory_ingest_total{outcome="dropped"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software ingest dropping over-cap blobs"
          description: >-
            yuzu_inventory_ingest_total{outcome="dropped"} is non-zero: one or more
            agents are sending an installed-software blob over the 3 MiB cap, which
            is dropped + nacked and will NOT self-heal (the agent resends the same
            payload). Likely an agent/server cap-constant drift after a version skew,
            or a non-conforming agent — check the agent version and the warn-level
            "oversized ... blob" server logs for the agent_id.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryReportRejected
        # outcome=rejected = a whole report carrying too many sources (content_hashes /
        # plugin_data map > 64) was rejected at the ingest entry. DISTINCT from
        # outcome=dropped (over-cap blob): this path does NOT nack, so the agent advances
        # to the weekly floor rather than resending forever — different runbook. The
        # framework wires ~1 source, so a non-zero rate signals a malformed / abusive /
        # corrupted agent, not cap drift (gov consistency).
        expr: |
          sum(rate(yuzu_inventory_ingest_total{outcome="rejected"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software ingest rejecting over-cap reports"
          description: >-
            yuzu_inventory_ingest_total{outcome="rejected"} is non-zero: one or more
            agents are sending an inventory report whose source map exceeds the
            kMaxSources cap (64) — the whole report is rejected (NOT nacked; the agent
            advances to its weekly full-floor). The framework wires ~1 source, so this
            signals a malformed/abusive/corrupted agent — check the agent version and the
            warn-level "carries too many sources" server logs for the agent_id.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuGenericInventoryPersistenceDropped
        # Generic InventoryStore ingest is intentionally fail-soft. Alert on a
        # sustained rate, not a single event: transient pool pressure can
        # self-heal on a later changed/full report. reason="stale" is excluded
        # because clock-step suppression is expected to self-clear. The reason
        # dimension is pre-seeded, so absent() remains a scrape/config signal.
        expr: |
          sum(rate(yuzu_inventory_ingest_dropped_total{reason!="stale"}[15m])) by (reason) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Generic inventory writes are not persisting ({{ $labels.reason }})"
          description: >-
            Generic inventory writes have been dropped for 15 minutes. Check
            yuzu_pg_pool_* for saturation or connection failures and the server
            InventoryStore warnings. The alert excludes reason="stale"; firing
            reasons indicate unavailable storage, bad keys, or query failures.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryReadDegraded
        # An AUTHORITATIVE inventory read (query_software / get_agent_software)
        # returned a degrade (no data), NOT a silent empty. /readyz deliberately
        # stays green under pure pool saturation (it trips only on connection
        # failure, to avoid false LB evictions), so this is otherwise
        # dashboard-invisible: the store-agnostic yuzu_pg_acquire_timeout_total
        # moves but nothing inventory-specific does (#1675).
        # reason = store_not_open | pool_acquire_timeout | query_error.
        expr: |
          sum(rate(yuzu_inventory_read_degrade_total[5m])) by (reason, source) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inventory reads degrading (source={{ $labels.source }}, {{ $labels.reason }})"
          description: >-
            yuzu_inventory_read_degrade_total{source="{{ $labels.source }}",
            reason="{{ $labels.reason }}"} is non-zero: an authoritative inventory
            read for the labelled authoritative inventory source returned a
            degrade (no data) rather than a result. pool_acquire_timeout/query_error correlate
            with yuzu_pg_* saturation or outage; store_not_open means the store
            failed to open at boot. A fleet vulnerability query ("which devices run
            <CVE>") reads as degraded, NOT "installed nowhere" — do not trust a
            zero-result inventory answer while this fires.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuMgmtGroupReadDegraded
        # A CONFINEMENT-feeding management-group hierarchy read (ancestors /
        # descendants / agent-groups, ADR-0042) degraded, so the caller failed
        # closed to DenyAll. This is the confinement substrate itself faulting,
        # not the fleet shrinking: a fired alert means SCOPED operators see
        # reduced/empty lists, NOT that groups were deleted. Same dashboard-
        # invisibility as YuzuInventoryReadDegraded — /readyz stays green under
        # pure pool saturation, so only the store-specific counter moves.
        # reason = store_not_open | pool_acquire_timeout | query_error.
        expr: |
          sum(rate(yuzu_server_mgmt_group_read_degrade_total[5m])) by (reason) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Management-group confinement reads degrading ({{ $labels.reason }})"
          description: >-
            yuzu_server_mgmt_group_read_degrade_total{reason="{{ $labels.reason }}"}
            is non-zero: a confinement-feeding hierarchy read degraded and the
            caller failed closed to DenyAll. This is a confinement-substrate
            degrade — scoped operators now see REDUCED or EMPTY lists, it does
            NOT mean management groups shrank or devices left the fleet.
            pool_acquire_timeout/query_error correlate with yuzu_pg_* saturation
            or outage; store_not_open means the store failed to open at boot. Do
            not read a scoped operator's short/empty list as authoritative while
            this fires.
          runbook_url: "https://docs.yuzu.io/runbooks/management-groups"
      - alert: YuzuMgmtGroupBackfillFailing
        # The one-time SQLite->Postgres confinement backfill (ADR-0042) reported
        # a failed outcome. The server fails closed at boot on a backfill failure
        # (write error, or an over-deep/cyclic legacy tree) and retries next
        # start, so a failed sample means the server refused to come up with a
        # partial/empty confinement hierarchy — an operator must repair or move
        # aside the legacy management-groups.db before it will boot.
        expr: |
          sum(rate(yuzu_server_mgmt_group_backfill_total{result="failed"}[15m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Management-group confinement backfill failed (server refused to boot)"
          description: >-
            yuzu_server_mgmt_group_backfill_total{result="failed"} advanced: the
            one-time confinement backfill could not complete (Postgres write
            error, or an over-deep/cyclic legacy management-groups.db). The server
            fails closed at boot rather than come up with partial confinement and
            retries on the next start — repair the legacy tree (flatten below 10
            levels / break the cycle) or move management-groups.db aside, then
            restart.
          runbook_url: "https://docs.yuzu.io/runbooks/management-groups"
      - alert: YuzuCustomPropertiesReadDegraded
        # A props.<key> scope-DSL-feeding read against custom_properties_store
        # (ADR-0045) degraded. AgentRegistry::evaluate_scope's bulk preload
        # (get_values_for_keys) ABORTS the whole scope evaluation on this
        # degrade (nullopt), which every caller collapses via .value_or({}) to
        # "zero targets matched" — a fired alert means props.<key>-scoped
        # dispatch/policy/push rules are silently resolving to nobody, not
        # that operators removed the properties. Same dashboard-invisibility
        # as YuzuMgmtGroupReadDegraded — /readyz stays green under pure pool
        # saturation, so only this counter moves.
        # reason = store_not_open | pool_acquire_timeout | query_error.
        expr: |
          sum(rate(yuzu_server_custom_properties_read_degrade_total[5m])) by (reason) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Custom-properties scope reads degrading ({{ $labels.reason }})"
          description: >-
            yuzu_server_custom_properties_read_degrade_total{reason="{{ $labels.reason }}"}
            is non-zero: a props.<key> scope-feeding read degraded and
            evaluate_scope aborted the whole scope evaluation, which callers
            collapse to "zero targets" — a scoped dispatch/policy/push rule
            referencing props.<key> silently matches nobody while this fires.
            pool_acquire_timeout/query_error correlate with yuzu_pg_*
            saturation or outage; store_not_open means the store failed to
            open at boot. Do not read a props.<key>-scoped rule's empty match
            as authoritative while this fires.
          runbook_url: "https://docs.yuzu.io/runbooks/custom-properties-read-degraded"
      - alert: YuzuCustomPropertiesBackfillFailing
        # The one-time SQLite->Postgres backfill (ADR-0045) reported a failed
        # outcome. The server fails closed at boot on a backfill failure
        # (write error, or a holder-side fingerprint-verification refusal on
        # a multi-replica boot with divergent legacy content — see
        # docs/ops-runbooks/custom-properties-store-backfill-recovery.md) and
        # retries next start, so a failed sample means the server refused to
        # come up.
        expr: |
          sum(rate(yuzu_server_custom_properties_backfill_total{result="failed"}[15m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Custom-properties backfill failed (server refused to boot)"
          description: >-
            yuzu_server_custom_properties_backfill_total{result="failed"}
            advanced: the one-time custom-properties backfill could not
            complete. The server fails closed at boot rather than come up
            with partial data and retries on the next start — see
            docs/ops-runbooks/custom-properties-store-backfill-recovery.md
            for the holder-side-verification recovery procedure.
          runbook_url: "docs/ops-runbooks/custom-properties-store-backfill-recovery.md"
      - alert: YuzuInventoryIngestSlow
        # Leading indicator for ingest transaction-hold saturation: full-payload
        # ingests taking >10s. Distinct from the yuzu_pg_acquire_* family, which
        # measures time-to-GET a connection — this measures total txn hold
        # (incl. statement execution), so it fires even when the pool hands out
        # connections quickly but transactions run slow. The histogram buckets now
        # extend into the 10-60s range (#1686), so the saturation tail is resolved
        # into le=15/20/30/45/60 rather than collapsing into +Inf — the
        # +Inf-minus-le=10 complement below is an honest count of full ingests over
        # 10s, and histogram_quantile over the tail now yields a real p99. Fires
        # ahead of YuzuInventoryReadDegraded (sre).
        expr: |
          sum(rate(yuzu_inventory_ingest_duration_seconds_bucket{phase="full",le="+Inf"}[10m]))
          - sum(rate(yuzu_inventory_ingest_duration_seconds_bucket{phase="full",le="10"}[10m]))
          > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software full-payload ingests exceeding 10s"
          description: >-
            More than ~6/min full-payload inventory ingests are holding a Postgres
            connection >10s — a leading indicator of pool saturation under a
            need_full herd, ahead of read-path degradation. Correlate with
            yuzu_pg_pool_waiters and yuzu_pg_acquire_wait_seconds.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      # Recording rule (#1686): now that yuzu_inventory_ingest_duration_seconds
      # carries 10-60s buckets, histogram_quantile over the tail yields a REAL p99
      # (previously everything >10s collapsed into +Inf, so a quantile pinned at
      # +Inf). Precompute it per (source, phase) so dashboards — and any future
      # tighter ">30s critical" alert — read a cheap series instead of a fan-out
      # quantile at query time. `le` is kept in the by() set (required by
      # histogram_quantile). The [10m] window matches the sibling
      # YuzuInventoryIngestSlow over the same _bucket series: this metric is
      # daily-cadence (ADR-0016 per-agent phase spread), so a shorter window would
      # often see zero ingests on a quiet fleet → NaN gaps.
      - record: yuzu:inventory_ingest_duration_seconds:p99
        expr: |
          histogram_quantile(
            0.99,
            sum by (source, phase, le) (
              rate(yuzu_inventory_ingest_duration_seconds_bucket[10m])
            )
          )
      - alert: YuzuInventoryStaleCountUnavailable
        # The stale-agents freshness count could not be computed (pool saturation
        # or query timeout) on the metrics sweep, so yuzu_inventory_stale_agents is
        # FROZEN at its prior value — a low reading may be stale, not genuine. This
        # is the freeze-detector that travels with the gauge: the 250ms count
        # acquire can expire under moderate contention while the 3000ms read budget
        # still clears, so YuzuInventoryReadDegraded may stay dormant (sre UP-3).
        # Fleet-size-independent, so it ships ACTIVE (unlike YuzuInventoryStaleAgents).
        expr: |
          rate(yuzu_inventory_stale_count_unavailable_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software freshness gauge may be frozen"
          description: >-
            yuzu_inventory_stale_count_unavailable_total is rising: the freshness
            count keeps timing out, so yuzu_inventory_stale_agents is held at its
            last value and may read healthy during an actual outage. Investigate
            Postgres pool saturation (yuzu_pg_pool_waiters, yuzu_pg_acquire_wait_seconds).
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryCatalogRollupStale
        # The /inventory Software-tab catalogue is a precomputed rollup refreshed hourly
        # by the SoftwareCatalogRollup thread. If recomputes stop succeeding (PG outage /
        # the 60s recompute budget exceeded at fleet scale), keep-last-good keeps serving
        # the PRIOR rollup — the page's "updated N ago" stamp ages but there is no
        # automated signal otherwise, and a stale catalogue under-reports a title that
        # hasn't rolled up yet. `> 0` GUARD IS LOAD-BEARING: last_success_timestamp is
        # seeded to 0 (epoch 1970, the "building" sentinel) at thread start, so a naive
        # `now - ts` fires immediately on every cold boot; the guard skips the building
        # window. The never-succeeded / ongoing-failure case is covered by the error-rate
        # alert below, NOT this rule.
        expr: |
          (time() - yuzu_inventory_catalog_rollup_last_success_timestamp) > 7200
          and yuzu_inventory_catalog_rollup_last_success_timestamp > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software catalogue rollup is stale"
          description: >-
            The /inventory catalogue rollup has not refreshed in over 2h (cadence is 1h).
            Keep-last-good is serving an aging catalogue; counts may under-report recent
            installs. Check yuzu_inventory_catalog_rollup_total{outcome="error"} and the
            SoftwareCatalogRollup thread log (Postgres outage or the 60s recompute budget
            exceeded at scale — raise kRollupStatementTimeout or shard the rollup).
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryCatalogRollupFailing
        # Catches the case the staleness alert's `> 0` guard deliberately skips: a server
        # whose recomputes keep FAILING (incl. one that has never succeeded, last_success
        # still 0). A sustained error rate means the catalogue is building/stale with no
        # success to age off.
        expr: |
          sum(rate(yuzu_inventory_catalog_rollup_total{outcome="error"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software catalogue rollup recomputes are failing"
          description: >-
            yuzu_inventory_catalog_rollup_total{outcome="error"} is rising: the catalogue
            rollup thread cannot complete a recompute. If last_success_timestamp is still 0
            the catalogue has never populated ("building"); otherwise it is frozen at the
            last good rollup. Investigate Postgres availability / the recompute duration
            (yuzu_inventory_catalog_rollup_duration_seconds vs the 60s budget).
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      # YuzuInventoryStaleAgents — SHIPPED DISABLED. The freshness gauge
      # (yuzu_inventory_stale_agents{source}) is exported and graphable, but there
      # is no fleet-size-independent absolute threshold: >50 is day-one noise on a
      # 100-device pilot (a weekend of offline laptops) and 0.1% ambient churn on a
      # 50k fleet (desensitising). A fleet-relative ratio against
      # yuzu_fleet_agents_healthy needs explicit on()/group_left() vector matching
      # (the label sets differ) and a denominator caveat (offline agents drop
      # "healthy"), so there is no clean self-calibrating form. ENABLE this rule
      # once you have observed your fleet's normal stale-count baseline and set the
      # threshold to ~5-10% of your expected active fleet. Correlate with
      # yuzu_fleet_agents_healthy to separate "agents offline" from "sync source broken".
      # - alert: YuzuInventoryStaleAgents
      #   expr: |
      #     max(yuzu_inventory_stale_agents) by (source) > 50
      #   for: 1h
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "{{ $value }} agents have stale {{ $labels.source }} inventory"
      #     description: >-
      #       yuzu_inventory_stale_agents{source="{{ $labels.source }}"} has exceeded
      #       the freshness threshold for 1h — that many agents have not synced this
      #       inventory source in over two daily cycles. Check for a fleet-wide agent
      #       outage, a broken/disabled sync source, or a network partition.
      #     runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"

  # ── yuzu-fleet-spark — DISABLED at rung 1 (reviewed template; enable at rung 2) ──
  # SparkEngine (ADR-0021 Stage-2) is instantiated OBSERVE-ONLY at rung 1: no consumer
  # arms rules, so every yuzu_fleet_spark_* counter is provably 0 in production. These
  # rules are DELIBERATELY COMMENTED OUT until rung 2, for two reasons governance surfaced:
  #   1. They can only fire on a FORGED heartbeat until rung 2 (an enrolled agent
  #      spoofing e.g. yuzu.spark_quarantined=1) — an enabled critical would let ONE
  #      agent page on-call with zero real signal (gov UP-2).
  #   2. The counters are fleet SUMs of monotonic per-agent counters surfaced as gauges,
  #      so a bare `> 0` LATCHES: once any agent reports non-zero it never returns to 0
  #      for that process's lifetime — a transient watch-cap/slow-op blip pages forever
  #      (gov arch-S2 / sre-F1). The correct form is increase()/rate() over a
  #      counter-TYPED metric, a rung-2 change (see the exprs below).
  #
  # ⚠ THE RUNG-2 FIX IS *NOT* "counter-type the fleet sum" — that does not work, and an
  # earlier draft of this comment said it did (governance Gate-4 consistency). A fleet SUM
  # over a CHURNING agent population is not a valid counter: it DECREASES whenever an agent
  # ages out of the staleness window or restarts (its cumulative counters reset to 0), and
  # Prometheus reads any decrease in a counter as a RESET — so increase() would manufacture
  # a false spike out of an agent simply going away. clear_gauge_family() makes it worse:
  # series go absent and reappear.
  #
  # The real fix is a PER-AGENT DELTA: the agent ships the interval delta and the server
  # .inc()s a true monotonic counter it owns. That is the same change that fixes the
  # `absent == 0` reader contract (Gate-3 performance) — today an absent counter is read as
  # 0 rather than "unchanged", which is what forecloses change-gated emit and forces every
  # agent to re-ship unchanged counters on every heartbeat (~68B → ~556B at rung 2, an 8×
  # step, ~16GB/day fleet-wide at 10k agents). Both ends, one change. Tracked by #2083.
  #
  # ENABLE at rung 2 with: (a) the per-agent delta-emit + server-side counter above,
  # (b) uncomment this group, (c) confirm each runbook notes "restart the agent to clear
  # a latched signal". armed_faulted is a live/self-healing gauge and is `> 0`-safe; the
  # cumulative counters use increase(...[15m]) > 0 below. PRESERVE the {os[,mechanism]}
  # labels — File/Registry are Windows-only, Service is Windows+Linux, so NEVER
  # sum without(os) these (a cross-OS aggregate is meaningless).
  #
  # - name: yuzu-fleet-spark
  #   rules:
  #     - alert: YuzuSparkMechanismQuarantined
  #       expr: |
  #         increase(yuzu_fleet_spark_quarantined[15m]) > 0
  #       labels:
  #         severity: critical
  #       annotations:
  #         summary: "Spark {{ $labels.mechanism }} mechanism quarantined on {{ $labels.os }}"
  #         description: >-
  #           A SparkEngine mechanism reported a quarantine — a structural leak that should
  #           stay 0. Detection for that mechanism type is compromised on the affected OS.
  #           Inspect the agent `warn` logs; restart the agent to clear a latched signal.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-mechanism-quarantined"
  #     - alert: YuzuSparkWatchRejected
  #       expr: |
  #         increase(yuzu_fleet_spark_watch_rejected[15m]) > 0
  #       for: 5m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Spark {{ $labels.mechanism }} watch rejections on {{ $labels.os }}"
  #         description: >-
  #           A SparkEngine mechanism is rejecting watch arms (watch-cap reached) — a
  #           denial-of-detection: rules that should be enforced could not arm. Check the
  #           per-type watch cap and the volume of rules of that mechanism type on the OS.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-watch-rejected"
  #     - alert: YuzuSparkArmedFaulted
  #       expr: |
  #         yuzu_fleet_spark_armed_faulted > 0
  #       for: 5m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Spark armed watches went deaf on {{ $labels.os }}"
  #         description: >-
  #           One or more armed spark watches reported FAULTED (armed but no longer
  #           watching) — detection is silently down for those watches. This is a live
  #           gauge (self-heals when the watch recovers) — no latch. Correlate with agent
  #           restarts / OS event-source ACL changes.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-armed-faulted"
  #     - alert: YuzuSparkSlowOp
  #       expr: |
  #         increase(yuzu_fleet_spark_slow_op[15m]) > 0
  #       for: 10m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Spark {{ $labels.mechanism }} slow watch/unwatch ops on {{ $labels.os }}"
  #         description: >-
  #           A SparkEngine mechanism is recording slow watch/unwatch operations — a stalled
  #           or contended watcher. Sustained slow ops can delay detection. Inspect the
  #           mechanism's OS facility (IOCP / TP_WAIT pool / sd-bus / SCM) on the OS.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-slow-op"
  #     - alert: YuzuSparkQueuedDropped
  #       expr: |
  #         increase(yuzu_fleet_spark_queued_dropped[15m]) > 0
  #       for: 5m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Spark queued events dropped on {{ $labels.os }}"
  #         description: >-
  #           The SparkEngine bounded consumer queue dropped events (overflow or shutdown).
  #           On the observe lane this loses detections; once the enforce lane lands (rung 3)
  #           a drop is a silent compliance failure. Check consumer throughput + queue cap.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-queued-dropped"

  # ── yuzu-fleet-spark-rung1 — ACTIVE (the one live-actionable spark signal today) ──
  # yuzu_fleet_spark_failed is NOT one of the latching counter-sums above: it is a STATE
  # gauge recomputed and cleared on every 15s sweep (an agent that recovers or restarts
  # leaves it within one sweep), and it carries real signal at rung 1 — boot-time
  # instantiation failure, e.g. thread/pid exhaustion, which is exactly the degraded
  # posture rung 1 exists to make visible (gov UP-11 / sre Gate-6). severity=warning,
  # deliberately NOT critical: the value is agent-self-reported inside the heartbeat
  # trust boundary, so ONE forged or buggy agent can set it to 1 — a warning routes to a
  # ticket, not a page (gov Gate-2 security). Escalate per-fleet policy if failed
  # exceeds a meaningful fraction of yuzu_fleet_spark_reporting + yuzu_fleet_spark_failed.
  - name: yuzu-fleet-spark-rung1
    rules:
      - alert: YuzuSparkBootFailed
        expr: |
          yuzu_fleet_spark_failed > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} agent(s) on {{ $labels.os }} report SparkEngine FAILED"
          description: >-
            Agents reported spark_running=0 without spark_disabled=1 for 30+ minutes:
            SparkEngine failed to instantiate at boot (commonly thread/handle exhaustion —
            the agent deliberately degrades to no-spark instead of crash-looping) or the
            posture was forged. Legacy Guardian detection is unaffected. Check the
            affected agents' warn logs for "SparkEngine: instantiation failed"; a restart
            after resolving host pressure clears the posture within one sweep.
          runbook_url: "https://docs.yuzu.io/runbooks/spark-boot-failed"
  # MASS-ABSENT META-ALERT — COMMENTED until the fleet is past staged rollout (gov UP-12).
  # absent() on yuzu_fleet_spark_reporting would catch "every spark-reporting agent went
  # dark at once" (fleet-wide agent outage / gateway partition) — real alert blindness,
  # because every `> 0` rule above no-matches on absent series. But during a STAGED
  # ROLLOUT (or a fleet with zero rung-1 agents) the series is legitimately absent, so
  # enabling this before the fleet floor is upgraded guarantees a false page. Enable
  # once yuzu_fleet_spark_reporting has a stable baseline:
  #     - alert: YuzuSparkFleetSignalGone
  #       expr: |
  #         absent(yuzu_fleet_spark_reporting)
  #       for: 15m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "All spark fleet telemetry vanished"
  #         description: >-
  #           No agent reported any spark posture for 15m. Either the upgraded-agent
  #           population is gone (mass agent outage, gateway partition) or the server
  #           sweep stopped. Correlate with yuzu_fleet_net_*/agent-online gauges before
  #           reading this as a spark problem.

  # ── yuzu-guardian-journal - DISABLED, and not only because the journal is inert ──
  #
  # #2298 gate 3. Two independent reasons this group is commented out; BOTH must clear
  # before any rule here is enabled.
  #
  # REASON 1 - inert. The durable lifecycle-audit journal does not run until the
  # prefer_spark cutover, so every yuzu_fleet_guardian_journal_* counter is provably 0
  # in production today and an enabled rule could only fire on a FORGED heartbeat.
  # (Same reason the spark group above is commented out at rung 1.)
  #
  # REASON 2 - NO CHURN-ROBUST NEW-INCREMENT ALERT EXISTS OVER THIS SHAPE. This one does
  # not clear at the cutover. It clears only when a per-agent axis exists for the
  # JOURNAL: #2083 is spark-scoped, and the journal equivalent is tracked at #2336
  # (filed 2026-07-21; see below).
  # These are UNLABELLED fleet SUMS of per-agent CUMULATIVE counters over a CHURNING
  # population, and all three candidate forms fail (governance Gate-4 unhappy-path +
  # Gate-6 sre):
  #
  #   increase()/rate() - an agent ageing out or restarting reads as a counter reset
  #     and manufactures a phantom increment; and a series that first APPEARS at a
  #     non-zero value contributes no increase at all, so it misses the first-and-only
  #     loss these counters exist to catch. (The spark preamble above records the same
  #     analysis for the same reason.)
  #
  #   delta() - needs two samples inside the window. An absent -> non-zero series has
  #     no earlier 0 to diff against: identical first-loss blind spot, different cause.
  #
  #   bare `> 0` - correct for ONE agent (a should-stay-0 monotonic that self-clears on
  #     that agent's restart), WRONG for the fleet sum. The set "some agent, ever,
  #     tripped this since its last restart" only grows as fleet-days accumulate and
  #     only shrinks when that SPECIFIC agent restarts or leaves the 90s staleness
  #     window. At 10k agents with weeks-long uptimes P(sum > 0) -> 1 for any counter
  #     with a non-zero per-agent-week trip rate - and several here have known benign
  #     trip modes - so the rule fires within hours of cutover, never clears,
  #     and the operator silences the group - losing the signal entirely. An earlier
  #     draft of this file shipped bare `> 0` here; that was wrong and is why the rules
  #     below use the rising-edge form instead.
  #
  # THE RULES BELOW USE A RISING EDGE: `(X > 0) unless (X offset 15m > 0)`. That
  # notifies once per absent->present transition rather than continuously, which is the
  # closest to correct available today. One documented refinement to evaluate at enable
  # time, not adopted here because nothing ships enabled: OR-ing in a rise detector,
  # `((X - X offset 15m) > 0)`, would additionally catch a rise in an ALREADY-PRESENT
  # series (a second agent breaking, or the same agent losing more), which the form
  # below cannot see. It is NOT churn-immune, and an earlier draft of this note wrongly
  # claimed it was: an agent RE-ENTERING the staleness window after a >15m absence
  # (reconnect, partition heal, laptop wake) raises the sum by its whole latched value
  # with no new loss, so it fires on reconnection churn - increase()'s disease, just
  # narrower. It is also blind to first appearance on its own (the offset side is
  # absent), so it complements rather than replaces the form below.
  #
  # NEITHER FORM CAN ATTRIBUTE A RISE. "A second agent also broke", "the same agent lost
  # more" and "an agent reconnected" are indistinguishable, because there is no
  # per-agent axis to separate on. That is REASON 2 in concrete form: it is why the loss
  # rules stay disabled even once the cutover clears REASON 1, and it is separate again
  # from prerequisites (a)-(d) below. Closing it needs the per-agent delta plus a
  # server-owned monotonic counter - #2083 is the spark-scoped tracker, and the journal
  # side is tracked at #2336 (filed 2026-07-21; referenced from #2298's gate list).
  #
  # UNTIL BOTH REASONS CLEAR THESE ARE MONITOR-ONLY: graph them, review them in
  # post-incident analysis, do not page on them.
  #
  # ENABLE-TIME PREREQUISITES, all currently unmet:
  #   (a) an operator surface exposing per-agent yuzu.guardian_journal_* tags - the
  #       series are unlabelled by design, so a firing alert cannot name the affected
  #       endpoints and the runbook advice to "identify the reporting agents" is
  #       unactionable without it;
  #   (b) the per-agent axis above (#2083-class work);
  #   (c) a soak at fleet scale with all 30 families live concurrently with the
  #       revocation sweep - the heartbeat tag-map grows by up to 30 entries per agent
  #       the instant prefer_spark flips, which no pre-cutover soak can observe;
  #   (d) runbooks at the docs.yuzu.io URLs below, which do not exist yet.
  #
  # SEVERITY: warning throughout. Values are agent-self-reported inside the heartbeat
  # trust boundary - one forged or buggy agent can set any of these, and suppression
  # (an agent that simply stops emitting) is indistinguishable from health - so a
  # warning routes to a ticket, never a page. An agent leaving the 90s staleness window
  # RESOLVES these without the underlying loss having healed, and a server outage longer
  # than the 15m offset window re-notifies an already-known incident on recovery (a
  # short restart is suppressed by the offset, not re-notified). The
  # alert is the signal; the audit trail is the evidence.
  #
  # PIPELINE HEALTH: yuzu_fleet_guardian_journal_reporting and ..._tag_rejected are
  # published on EVERY sweep including at 0, unlike the 30 counters. They are the only
  # rules here that CAN be sound, because they are server-owned counts rather than fleet
  # sums of agent monotonics. They differ from each other: TagRejected is
  # unconditionally sound, while TelemetryDark is sound only once Guardian is actually
  # deployed fleet-wide, because its 0 also means "nothing journalled yet" (see its
  # description below).
