  # ── yuzu-postgres — server storage substrate (#1320 PR 3) ──────────────
  # The server fails closed without PostgreSQL, so substrate health is
  # service-affecting. NOTE ON TIMING: /readyz flips to 503 *immediately* on
  # breaker-open (off yuzu_pg_connect_failed_total), so the load balancer
  # drains the instance right away. These alerts carry `for:` windows and are
  # for paging/escalation — they fire AFTER the LB has already reacted, not
  # before. Metrics come from the pool's Observer feed.
  - name: yuzu-postgres
    rules:
      - alert: YuzuPgConnectFailing
        # The connect-failure circuit breaker has armed — the database is
        # unreachable. /readyz already reports not-ready off the same signal
        # (LB eviction is immediate); this alert fires after for:2m of
        # sustained failure to page/escalate, NOT to drive LB eviction.
        expr: |
          rate(yuzu_pg_connect_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Yuzu cannot connect to PostgreSQL (breaker armed; /readyz already 503)"

      - alert: YuzuPgPoolSaturated
        # >90% of the pool leased for 5m — acquire timeouts (and heartbeat
        # upsert skips) are imminent. Raise --postgres-pool-size or scale.
        expr: |
          yuzu_pg_pool_in_use / yuzu_pg_pool_size > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Yuzu PostgreSQL pool >90% saturated"

      - alert: YuzuPgAcquireWaitHigh
        # p99 acquire wait > 200ms — the leading saturation indicator; the
        # heartbeat upsert deadline is 250ms, so persistence starts to drop here.
        expr: |
          histogram_quantile(0.99, rate(yuzu_pg_acquire_wait_seconds_bucket[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Yuzu PostgreSQL pool acquire p99 > 200ms"

  - name: yuzu-guardian
    rules:
      # yuzu_server_guardian_events_dropped_total is a cumulative-but-published-
      # as-gauge counter that RESETS on server restart, so alert on increase()
      # over a window, never an absolute value. Since item-7 PR-Sv it counts ONLY
      # MISMATCHED-payload event_id collisions — a forged-id pre-claim (#1360) or an
      # agent event_seq_ reset / clock skew carrying a DIFFERENT event. Benign
      # redelivery (the durable agent journal re-sending on reconnect) is now on the
      # separate quiet yuzu_server_guardian_events_redelivered_total and does NOT
      # land here — so this is a security-relevant anomaly signal, not reconnect
      # churn, and the threshold is low. A sustained climb means either drift is
      # being silently discarded (#1414 CC7.3) or an agent is pre-claiming/forging
      # event_ids — investigate, don't just widen the threshold.
      - alert: YuzuGuardianEventsDropped
        expr: |
          increase(yuzu_server_guardian_events_dropped_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Guardian events dropped at ingest (mismatched event_id collision)"
          description: >-
            More than 5 Guardian events were dropped at ingest in the last hour on
            a MISMATCHED-payload event_id collision. These are not benign
            redeliveries (those are counted on
            yuzu_server_guardian_events_redelivered_total) — each is a forged-id
            pre-claim (#1360), an agent event_seq_ reset / clock skew carrying a
            different event, or drift being silently discarded (#1414 CC7.3).
            Check the server `warn` logs for the conflicting event_id + agent, and
            investigate a forged-id campaign or a misbehaving agent before tuning.
          runbook_url: "https://docs.yuzu.io/runbooks/guardian-events-dropped"

      # A sustained OPERATIONAL ingest-fault rate means the classify/insert machinery is
      # broken and event_id conflicts are going UNCLASSIFIED — a genuine collision can then
      # escape yuzu_server_guardian_events_dropped_total entirely (item-7 sec-M2). The
      # metric resets on restart, so alert on increase() over a window. A metric with no
      # alert would be the same blind spot #1414 exists to close, one layer down.
      - alert: YuzuGuardianIngestErrors
        expr: |
          increase(yuzu_server_guardian_events_ingest_errors_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Guardian event ingest is failing (conflicts going unclassified)"
          description: >-
            The Guardian event ingest path reported operational faults (a failed
            BEGIN/prepare/insert/commit, or a redelivery compare that could not run) over
            the last 15 minutes. While this persists, an event_id conflict cannot be
            classified redelivery-vs-collision, so a genuine forged-id collision can
            escape yuzu_server_guardian_events_dropped_total. Check the server logs and
            the guaranteed-state DB health (disk pressure, corruption, lock contention).
          runbook_url: "https://docs.yuzu.io/runbooks/guardian-ingest-errors"

  - name: yuzu-audit
    # Behavioural-data routes (guardian.device.view, dex.device.view, dex.signal.view)
    # audit-on-open then FAIL CLOSED: if the audit row cannot persist they return 503
    # and serve no PII (CC7.2). yuzu_server_audit_emit_failed_total is the only signal
    # this is happening — without this alert a fleet-polled CMDB (ServiceNow) integration
    # blackouts silently (sre-1, #1647).
    rules:
      - alert: YuzuAuditPersistFailures
        expr: |
          increase(yuzu_server_audit_emit_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Audit events failing to persist — behavioural-data routes are 503ing"
          description: >-
            yuzu_server_audit_emit_failed_total is rising. Every REST route that uses
            fail-closed audit-on-open (guardian.device.view, dex.device.view,
            dex.signal.view) is returning 503 and withholding PII, so a ServiceNow /
            CMDB poll blackouts fleet-wide. Check audit.db health (/healthz
            stores.audit) and free disk on the data directory. Note: a bad_alloc-class
            throw in the audit pipeline fails closed the same way but does NOT bump this
            counter (it is catch-logged only) — correlate with a spike in 503s on the
            behavioural routes.
          runbook_url: "https://docs.yuzu.io/runbooks/audit-store-degraded"

      # #2360 retention clock guard. The guard declines a cleanup pass that would
      # expire every datable audit row, so the evidence table survives a forward
      # clock jump. A decline is not itself an outage, but it means this server's
      # clock moved in a way that WOULD have wiped audit evidence -- an
      # unattended host whose time sync is broken is one guard away from losing
      # its SOC 2 trail.
      - alert: YuzuAuditRetentionClockAnomaly
        expr: |
          increase(yuzu_server_audit_clock_anomaly_skips_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention declined a pass - clock moved, or the server was down"
          description: >-
            An audit retention pass declined. Triggers: it would have expired every datable
            row; the gap since the previous pass exceeded a fixed 7 days (an ABSOLUTE
            threshold, not scaled to audit_retention_days); or the stored clock reading
            was AHEAD of the current clock.
            Elapsed time cannot distinguish a forward jump from an outage, so check BOTH the
            host's time synchronisation (restored snapshot, dead CMOS, hand-set date) and its
            uptime history before concluding the clock is at fault. Nothing was deleted;
            retention resumes automatically, paced at the per-pass cap.
          runbook_url: "https://docs.yuzu.io/runbooks/audit-store-degraded"

      # The counterpart signal. Both a declined pass and a broken pass leave rows
      # undeleted, so an audit table that never shrinks looks identical either
      # way - only the pair separates "the guard is working" from "cleanup is
      # broken". Without this alert an unbounded audit.db reads as a healthy guard.
      - alert: YuzuAuditRetentionFailing
        expr: |
          increase(yuzu_server_audit_cleanup_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention passes are failing on a database error"
          description: >-
            yuzu_server_audit_cleanup_failed_total is rising: the audit retention pass
            itself is erroring, so audit.db grows without bound. This is NOT the clock
            guard (that is yuzu_server_audit_clock_anomaly_skips_total). Check audit.db
            health (/healthz stores.audit), free disk, and the server log for
            "AuditStore: retention probe failed" / "AuditStore: cleanup error".
          runbook_url: "https://docs.yuzu.io/runbooks/audit-store-degraded"

      # The per-pass delete cap is what turns an allowed wipe into a paced drain,
      # but it introduces its own failure: if it binds on every pass, expiry is
      # outrunning the drain and audit.db grows without bound. Neither counter
      # above moves in that state, so this is the only signal for it.
      #
      # ASSUMES the default 60-minute cleanup interval: the threshold is "every
      # pass in the window hit the cap", i.e. 6 passes in 6h. A server started with
      # a different cleanup_interval_min needs this number adjusted -- PromQL
      # cannot read the server's own interval, so it cannot be derived here.
      - alert: YuzuAuditRetentionCapBinding
        expr: |
          increase(yuzu_server_audit_retention_cap_reached_total[6h]) >= 6
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention is not keeping up with expiry"
          description: >-
            Every audit retention pass in the last 6 hours hit the per-pass delete cap,
            so a backlog is carried forward each hour and audit.db is growing. Check
            yuzu_server_audit_rows_deleted_total to see whether the backlog is moving at
            all. Sustained firing means the fixed drain rate (25,000 rows per cleanup
            pass) is below this fleet's audit volume, so audit.db grows without bound;
            the cap is a compile-time constant today, so this needs an engineering
            escalation rather than a config change.
          runbook_url: "https://docs.yuzu.io/runbooks/audit-store-degraded"

      # The docs tell operators to alert on this gauge; ship the rule so that
      # instruction is not a dead letter. A failed index build turns the pass's
      # bounded ~315ms hourly lock hold into an unbounded one that grows with the
      # table -- and every audit write waits on that lock. Also reads 0 for a
      # store closed by a failed migration, which is the same "retention is not
      # working" conclusion.
      - alert: YuzuAuditRetentionIndexMissing
        expr: |
          yuzu_server_audit_retention_index_ok == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention is running without its index"
          description: >-
            idx_audit_ttl_id is absent, so every hourly retention pass full-scans
            audit_events under the exclusive store lock that every audit write needs,
            and that cost grows with the table. Check the server log for "could not create
            idx_audit_ttl_id" and for a migration failure. NOTE this gauge is evaluated
            once at startup, so it does not detect an index dropped while the server runs.
          runbook_url: "https://docs.yuzu.io/runbooks/audit-store-degraded"

      # The durable clock reading is what makes anomaly detection survive a
      # restart. If it cannot be written, that half of the guard silently
      # degrades to nothing on the next boot.
      - alert: YuzuAuditRetentionStateNotPersisting
        expr: |
          increase(yuzu_server_audit_retention_persist_failed_total[1h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit retention cannot persist its clock reading"
          description: >-
            The retention pass could not write its clock reading to audit_retention_meta.
            Detection still works within this process, but will not survive a restart --
            a server that reboots with a wrong clock would then see no elapsed-time step.
            Usually a disk or permissions problem on the audit database.
          runbook_url: "https://docs.yuzu.io/runbooks/audit-store-degraded"

  - name: yuzu-bundles
    # Live-query bundle surface (ADR-0011). The manifest map is in-memory + bounded
    # (TTL + cap), so cap-eviction silently discards another operator's in-flight
    # bundle — these alerts make that (and dispatch health) observable until the
    # manifest moves to Postgres.
    rules:
      - alert: YuzuBundleCapEviction
        expr: |
          rate(yuzu_bundle_evictions_total{reason="cap"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Live-query bundle manifest cap is forcing evictions"
          description: >-
            The in-memory bundle manifest map has hit its cap and is evicting
            non-expired bundles to admit new ones — an in-flight bundle may 404 on
            collate for an operator who did not cause the load. Likely a runaway
            agentic dispatch loop. Investigate the dispatching principal; the
            durable Postgres manifest (ADR-0011) removes the cap.
      - alert: YuzuBundleManifestSaturation
        expr: |
          max(yuzu_bundle_manifests) > 3500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Live-query bundle manifest count approaching the 4096 cap"
          description: >-
            In-flight bundle manifests are within ~15% of the cap; sustained growth
            will force cross-operator cap-eviction (see YuzuBundleCapEviction).
      - alert: YuzuBundleDispatchLatencyHigh
        # UP-15: the bundle fan-out is synchronous — a POST holds an HTTP worker
        # across N gRPC writes. This pages before that hold (×concurrency) starves
        # the worker pool; observe-only is not enough while the async-dispatch fix
        # is deferred. 500ms is well above the ms-scale normal case.
        expr: |
          histogram_quantile(0.99,
            sum(rate(yuzu_bundle_dispatch_duration_seconds_bucket[5m])) by (le, surface)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Bundle dispatch fan-out p99 > 500ms (HTTP worker hold risk)"
          description: >-
            The synchronous bundle dispatch fan-out is holding HTTP workers for
            >500ms p99 on surface={{ $labels.surface }}. Under load this risks
            HTTP thread-pool starvation affecting unrelated routes. Reduce
            concurrent bundle dispatches, reduce steps-per-bundle, or prioritise
            the deferred async-dispatch fix (UP-15).

  # Agent daily-sync / installed-software inventory (ADR-0016). The
  # yuzu_inventory_ingest_total{source,outcome} counter is otherwise measured but
  # unoperationalised (gov sre). need_full + error are the degradation signals.
  - name: yuzu-inventory
    rules:
      - alert: YuzuInventorySustainedIngestErrors
        # outcome=error = a store/pool failure on ingest. Correlated with yuzu_pg_*
        # = a transient PG outage (self-heals); uncorrelated + low/persistent = a
        # device stuck on a payload the store keeps rejecting — grep the warn-level
        # SoftwareInventoryStore log for the agent_id.
        expr: |
          sum(rate(yuzu_inventory_ingest_total{outcome="error"}[15m])) > 0.001
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software ingest sustaining errors"
          description: >-
            yuzu_inventory_ingest_total{outcome="error"} has been non-zero for 15m.
            If correlated with yuzu_pg_connect_failed_total it is a transient
            Postgres outage (self-heals via the next sync + weekly full-floor); if
            uncorrelated it is likely one or more devices whose payload the store
            keeps rejecting — grep the warn-level SoftwareInventoryStore logs for
            the agent_id.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryHighNeedFullRatio
        expr: |
          sum(rate(yuzu_inventory_ingest_total{outcome="need_full"}[15m]))
          / clamp_min(sum(rate(yuzu_inventory_ingest_total[15m])), 0.0001) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software need_full ratio > 20%"
          description: >-
            Over 20% of inventory ingest outcomes are need_full for 15m. Expected
            transiently after a server DB restore (cold cache — agents re-send full,
            then settle), or for up to ~24h fleet-wide immediately after a sync
            source's wire-blob-contract version bump (e.g. installed_software's
            blob contract v2, 2026-07) — every agent's first post-upgrade sync is a
            one-time need_full by design, phase-spread across the daily sync window,
            self-healing; check release notes for a recent contract change before
            treating this as an incident. A sustained ratio with no such change
            suggests hash drift or agents stuck in a resend cycle.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryDroppedBlobs
        # outcome=dropped = a blob over the 3 MiB cap was rejected + nacked. UNLIKE
        # outcome=error this NEVER self-heals: the agent resends the same over-cap
        # payload and backs off forever (the agent's own cap should prevent reaching
        # here, so a non-zero rate signals agent/server cap drift after a version
        # skew, or a non-conforming agent). Deliberately a SEPARATE alert — folding
        # it into YuzuInventorySustainedIngestErrors would mislabel a permanent
        # condition as the self-healing transient-PG-outage case (gov sre).
        expr: |
          sum(rate(yuzu_inventory_ingest_total{outcome="dropped"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software ingest dropping over-cap blobs"
          description: >-
            yuzu_inventory_ingest_total{outcome="dropped"} is non-zero: one or more
            agents are sending an installed-software blob over the 3 MiB cap, which
            is dropped + nacked and will NOT self-heal (the agent resends the same
            payload). Likely an agent/server cap-constant drift after a version skew,
            or a non-conforming agent — check the agent version and the warn-level
            "oversized ... blob" server logs for the agent_id.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryReportRejected
        # outcome=rejected = a whole report carrying too many sources (content_hashes /
        # plugin_data map > 64) was rejected at the ingest entry. DISTINCT from
        # outcome=dropped (over-cap blob): this path does NOT nack, so the agent advances
        # to the weekly floor rather than resending forever — different runbook. The
        # framework wires ~1 source, so a non-zero rate signals a malformed / abusive /
        # corrupted agent, not cap drift (gov consistency).
        expr: |
          sum(rate(yuzu_inventory_ingest_total{outcome="rejected"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software ingest rejecting over-cap reports"
          description: >-
            yuzu_inventory_ingest_total{outcome="rejected"} is non-zero: one or more
            agents are sending an inventory report whose source map exceeds the
            kMaxSources cap (64) — the whole report is rejected (NOT nacked; the agent
            advances to its weekly full-floor). The framework wires ~1 source, so this
            signals a malformed/abusive/corrupted agent — check the agent version and the
            warn-level "carries too many sources" server logs for the agent_id.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryReadDegraded
        # An AUTHORITATIVE inventory read (query_software / get_agent_software)
        # returned a degrade (no data), NOT a silent empty. /readyz deliberately
        # stays green under pure pool saturation (it trips only on connection
        # failure, to avoid false LB evictions), so this is otherwise
        # dashboard-invisible: the store-agnostic yuzu_pg_acquire_timeout_total
        # moves but nothing inventory-specific does (#1675).
        # reason = store_not_open | pool_acquire_timeout | query_error.
        expr: |
          sum(rate(yuzu_inventory_read_degrade_total[5m])) by (reason, source) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inventory reads degrading (source={{ $labels.source }}, {{ $labels.reason }})"
          description: >-
            yuzu_inventory_read_degrade_total{source="{{ $labels.source }}",
            reason="{{ $labels.reason }}"} is non-zero: an authoritative inventory
            read (source = installed_software or device_ci) returned a degrade (no
            data) rather than a result. pool_acquire_timeout/query_error correlate
            with yuzu_pg_* saturation or outage; store_not_open means the store
            failed to open at boot. A fleet vulnerability query ("which devices run
            <CVE>") reads as degraded, NOT "installed nowhere" — do not trust a
            zero-result inventory answer while this fires.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryIngestSlow
        # Leading indicator for ingest transaction-hold saturation: full-payload
        # ingests taking >10s. Distinct from the yuzu_pg_acquire_* family, which
        # measures time-to-GET a connection — this measures total txn hold
        # (incl. statement execution), so it fires even when the pool hands out
        # connections quickly but transactions run slow. The histogram buckets now
        # extend into the 10-60s range (#1686), so the saturation tail is resolved
        # into le=15/20/30/45/60 rather than collapsing into +Inf — the
        # +Inf-minus-le=10 complement below is an honest count of full ingests over
        # 10s, and histogram_quantile over the tail now yields a real p99. Fires
        # ahead of YuzuInventoryReadDegraded (sre).
        expr: |
          sum(rate(yuzu_inventory_ingest_duration_seconds_bucket{phase="full",le="+Inf"}[10m]))
          - sum(rate(yuzu_inventory_ingest_duration_seconds_bucket{phase="full",le="10"}[10m]))
          > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software full-payload ingests exceeding 10s"
          description: >-
            More than ~6/min full-payload inventory ingests are holding a Postgres
            connection >10s — a leading indicator of pool saturation under a
            need_full herd, ahead of read-path degradation. Correlate with
            yuzu_pg_pool_waiters and yuzu_pg_acquire_wait_seconds.
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      # Recording rule (#1686): now that yuzu_inventory_ingest_duration_seconds
      # carries 10-60s buckets, histogram_quantile over the tail yields a REAL p99
      # (previously everything >10s collapsed into +Inf, so a quantile pinned at
      # +Inf). Precompute it per (source, phase) so dashboards — and any future
      # tighter ">30s critical" alert — read a cheap series instead of a fan-out
      # quantile at query time. `le` is kept in the by() set (required by
      # histogram_quantile). The [10m] window matches the sibling
      # YuzuInventoryIngestSlow over the same _bucket series: this metric is
      # daily-cadence (ADR-0016 per-agent phase spread), so a shorter window would
      # often see zero ingests on a quiet fleet → NaN gaps.
      - record: yuzu:inventory_ingest_duration_seconds:p99
        expr: |
          histogram_quantile(
            0.99,
            sum by (source, phase, le) (
              rate(yuzu_inventory_ingest_duration_seconds_bucket[10m])
            )
          )
      - alert: YuzuInventoryStaleCountUnavailable
        # The stale-agents freshness count could not be computed (pool saturation
        # or query timeout) on the metrics sweep, so yuzu_inventory_stale_agents is
        # FROZEN at its prior value — a low reading may be stale, not genuine. This
        # is the freeze-detector that travels with the gauge: the 250ms count
        # acquire can expire under moderate contention while the 3000ms read budget
        # still clears, so YuzuInventoryReadDegraded may stay dormant (sre UP-3).
        # Fleet-size-independent, so it ships ACTIVE (unlike YuzuInventoryStaleAgents).
        expr: |
          rate(yuzu_inventory_stale_count_unavailable_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software freshness gauge may be frozen"
          description: >-
            yuzu_inventory_stale_count_unavailable_total is rising: the freshness
            count keeps timing out, so yuzu_inventory_stale_agents is held at its
            last value and may read healthy during an actual outage. Investigate
            Postgres pool saturation (yuzu_pg_pool_waiters, yuzu_pg_acquire_wait_seconds).
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryCatalogRollupStale
        # The /inventory Software-tab catalogue is a precomputed rollup refreshed hourly
        # by the SoftwareCatalogRollup thread. If recomputes stop succeeding (PG outage /
        # the 60s recompute budget exceeded at fleet scale), keep-last-good keeps serving
        # the PRIOR rollup — the page's "updated N ago" stamp ages but there is no
        # automated signal otherwise, and a stale catalogue under-reports a title that
        # hasn't rolled up yet. `> 0` GUARD IS LOAD-BEARING: last_success_timestamp is
        # seeded to 0 (epoch 1970, the "building" sentinel) at thread start, so a naive
        # `now - ts` fires immediately on every cold boot; the guard skips the building
        # window. The never-succeeded / ongoing-failure case is covered by the error-rate
        # alert below, NOT this rule.
        expr: |
          (time() - yuzu_inventory_catalog_rollup_last_success_timestamp) > 7200
          and yuzu_inventory_catalog_rollup_last_success_timestamp > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software catalogue rollup is stale"
          description: >-
            The /inventory catalogue rollup has not refreshed in over 2h (cadence is 1h).
            Keep-last-good is serving an aging catalogue; counts may under-report recent
            installs. Check yuzu_inventory_catalog_rollup_total{outcome="error"} and the
            SoftwareCatalogRollup thread log (Postgres outage or the 60s recompute budget
            exceeded at scale — raise kRollupStatementTimeout or shard the rollup).
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      - alert: YuzuInventoryCatalogRollupFailing
        # Catches the case the staleness alert's `> 0` guard deliberately skips: a server
        # whose recomputes keep FAILING (incl. one that has never succeeded, last_success
        # still 0). A sustained error rate means the catalogue is building/stale with no
        # success to age off.
        expr: |
          sum(rate(yuzu_inventory_catalog_rollup_total{outcome="error"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Installed-software catalogue rollup recomputes are failing"
          description: >-
            yuzu_inventory_catalog_rollup_total{outcome="error"} is rising: the catalogue
            rollup thread cannot complete a recompute. If last_success_timestamp is still 0
            the catalogue has never populated ("building"); otherwise it is frozen at the
            last good rollup. Investigate Postgres availability / the recompute duration
            (yuzu_inventory_catalog_rollup_duration_seconds vs the 60s budget).
          runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"
      # YuzuInventoryStaleAgents — SHIPPED DISABLED. The freshness gauge
      # (yuzu_inventory_stale_agents{source}) is exported and graphable, but there
      # is no fleet-size-independent absolute threshold: >50 is day-one noise on a
      # 100-device pilot (a weekend of offline laptops) and 0.1% ambient churn on a
      # 50k fleet (desensitising). A fleet-relative ratio against
      # yuzu_fleet_agents_healthy needs explicit on()/group_left() vector matching
      # (the label sets differ) and a denominator caveat (offline agents drop
      # "healthy"), so there is no clean self-calibrating form. ENABLE this rule
      # once you have observed your fleet's normal stale-count baseline and set the
      # threshold to ~5-10% of your expected active fleet. Correlate with
      # yuzu_fleet_agents_healthy to separate "agents offline" from "sync source broken".
      # - alert: YuzuInventoryStaleAgents
      #   expr: |
      #     max(yuzu_inventory_stale_agents) by (source) > 50
      #   for: 1h
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "{{ $value }} agents have stale {{ $labels.source }} inventory"
      #     description: >-
      #       yuzu_inventory_stale_agents{source="{{ $labels.source }}"} has exceeded
      #       the freshness threshold for 1h — that many agents have not synced this
      #       inventory source in over two daily cycles. Check for a fleet-wide agent
      #       outage, a broken/disabled sync source, or a network partition.
      #     runbook_url: "https://docs.yuzu.io/runbooks/inventory-ingest"

  # ── yuzu-fleet-spark — DISABLED at rung 1 (reviewed template; enable at rung 2) ──
  # SparkEngine (ADR-0021 Stage-2) is instantiated OBSERVE-ONLY at rung 1: no consumer
  # arms rules, so every yuzu_fleet_spark_* counter is provably 0 in production. These
  # rules are DELIBERATELY COMMENTED OUT until rung 2, for two reasons governance surfaced:
  #   1. They can only fire on a FORGED heartbeat until rung 2 (an enrolled agent
  #      spoofing e.g. yuzu.spark_quarantined=1) — an enabled critical would let ONE
  #      agent page on-call with zero real signal (gov UP-2).
  #   2. The counters are fleet SUMs of monotonic per-agent counters surfaced as gauges,
  #      so a bare `> 0` LATCHES: once any agent reports non-zero it never returns to 0
  #      for that process's lifetime — a transient watch-cap/slow-op blip pages forever
  #      (gov arch-S2 / sre-F1). The correct form is increase()/rate() over a
  #      counter-TYPED metric, a rung-2 change (see the exprs below).
  #
  # ⚠ THE RUNG-2 FIX IS *NOT* "counter-type the fleet sum" — that does not work, and an
  # earlier draft of this comment said it did (governance Gate-4 consistency). A fleet SUM
  # over a CHURNING agent population is not a valid counter: it DECREASES whenever an agent
  # ages out of the staleness window or restarts (its cumulative counters reset to 0), and
  # Prometheus reads any decrease in a counter as a RESET — so increase() would manufacture
  # a false spike out of an agent simply going away. clear_gauge_family() makes it worse:
  # series go absent and reappear.
  #
  # The real fix is a PER-AGENT DELTA: the agent ships the interval delta and the server
  # .inc()s a true monotonic counter it owns. That is the same change that fixes the
  # `absent == 0` reader contract (Gate-3 performance) — today an absent counter is read as
  # 0 rather than "unchanged", which is what forecloses change-gated emit and forces every
  # agent to re-ship unchanged counters on every heartbeat (~68B → ~556B at rung 2, an 8×
  # step, ~16GB/day fleet-wide at 10k agents). Both ends, one change. Tracked by #2083.
  #
  # ENABLE at rung 2 with: (a) the per-agent delta-emit + server-side counter above,
  # (b) uncomment this group, (c) confirm each runbook notes "restart the agent to clear
  # a latched signal". armed_faulted is a live/self-healing gauge and is `> 0`-safe; the
  # cumulative counters use increase(...[15m]) > 0 below. PRESERVE the {os[,mechanism]}
  # labels — File/Registry are Windows-only, Service is Windows+Linux, so NEVER
  # sum without(os) these (a cross-OS aggregate is meaningless).
  #
  # - name: yuzu-fleet-spark
  #   rules:
  #     - alert: YuzuSparkMechanismQuarantined
  #       expr: |
  #         increase(yuzu_fleet_spark_quarantined[15m]) > 0
  #       labels:
  #         severity: critical
  #       annotations:
  #         summary: "Spark {{ $labels.mechanism }} mechanism quarantined on {{ $labels.os }}"
  #         description: >-
  #           A SparkEngine mechanism reported a quarantine — a structural leak that should
  #           stay 0. Detection for that mechanism type is compromised on the affected OS.
  #           Inspect the agent `warn` logs; restart the agent to clear a latched signal.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-mechanism-quarantined"
  #     - alert: YuzuSparkWatchRejected
  #       expr: |
  #         increase(yuzu_fleet_spark_watch_rejected[15m]) > 0
  #       for: 5m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Spark {{ $labels.mechanism }} watch rejections on {{ $labels.os }}"
  #         description: >-
  #           A SparkEngine mechanism is rejecting watch arms (watch-cap reached) — a
  #           denial-of-detection: rules that should be enforced could not arm. Check the
  #           per-type watch cap and the volume of rules of that mechanism type on the OS.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-watch-rejected"
  #     - alert: YuzuSparkArmedFaulted
  #       expr: |
  #         yuzu_fleet_spark_armed_faulted > 0
  #       for: 5m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Spark armed watches went deaf on {{ $labels.os }}"
  #         description: >-
  #           One or more armed spark watches reported FAULTED (armed but no longer
  #           watching) — detection is silently down for those watches. This is a live
  #           gauge (self-heals when the watch recovers) — no latch. Correlate with agent
  #           restarts / OS event-source ACL changes.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-armed-faulted"
  #     - alert: YuzuSparkSlowOp
  #       expr: |
  #         increase(yuzu_fleet_spark_slow_op[15m]) > 0
  #       for: 10m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Spark {{ $labels.mechanism }} slow watch/unwatch ops on {{ $labels.os }}"
  #         description: >-
  #           A SparkEngine mechanism is recording slow watch/unwatch operations — a stalled
  #           or contended watcher. Sustained slow ops can delay detection. Inspect the
  #           mechanism's OS facility (IOCP / TP_WAIT pool / sd-bus / SCM) on the OS.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-slow-op"
  #     - alert: YuzuSparkQueuedDropped
  #       expr: |
  #         increase(yuzu_fleet_spark_queued_dropped[15m]) > 0
  #       for: 5m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Spark queued events dropped on {{ $labels.os }}"
  #         description: >-
  #           The SparkEngine bounded consumer queue dropped events (overflow or shutdown).
  #           On the observe lane this loses detections; once the enforce lane lands (rung 3)
  #           a drop is a silent compliance failure. Check consumer throughput + queue cap.
  #         runbook_url: "https://docs.yuzu.io/runbooks/spark-queued-dropped"

  # ── yuzu-fleet-spark-rung1 — ACTIVE (the one live-actionable spark signal today) ──
  # yuzu_fleet_spark_failed is NOT one of the latching counter-sums above: it is a STATE
  # gauge recomputed and cleared on every 15s sweep (an agent that recovers or restarts
  # leaves it within one sweep), and it carries real signal at rung 1 — boot-time
  # instantiation failure, e.g. thread/pid exhaustion, which is exactly the degraded
  # posture rung 1 exists to make visible (gov UP-11 / sre Gate-6). severity=warning,
  # deliberately NOT critical: the value is agent-self-reported inside the heartbeat
  # trust boundary, so ONE forged or buggy agent can set it to 1 — a warning routes to a
  # ticket, not a page (gov Gate-2 security). Escalate per-fleet policy if failed
  # exceeds a meaningful fraction of yuzu_fleet_spark_reporting + yuzu_fleet_spark_failed.
  - name: yuzu-fleet-spark-rung1
    rules:
      - alert: YuzuSparkBootFailed
        expr: |
          yuzu_fleet_spark_failed > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} agent(s) on {{ $labels.os }} report SparkEngine FAILED"
          description: >-
            Agents reported spark_running=0 without spark_disabled=1 for 30+ minutes:
            SparkEngine failed to instantiate at boot (commonly thread/handle exhaustion —
            the agent deliberately degrades to no-spark instead of crash-looping) or the
            posture was forged. Legacy Guardian detection is unaffected. Check the
            affected agents' warn logs for "SparkEngine: instantiation failed"; a restart
            after resolving host pressure clears the posture within one sweep.
          runbook_url: "https://docs.yuzu.io/runbooks/spark-boot-failed"
  # MASS-ABSENT META-ALERT — COMMENTED until the fleet is past staged rollout (gov UP-12).
  # absent() on yuzu_fleet_spark_reporting would catch "every spark-reporting agent went
  # dark at once" (fleet-wide agent outage / gateway partition) — real alert blindness,
  # because every `> 0` rule above no-matches on absent series. But during a STAGED
  # ROLLOUT (or a fleet with zero rung-1 agents) the series is legitimately absent, so
  # enabling this before the fleet floor is upgraded guarantees a false page. Enable
  # once yuzu_fleet_spark_reporting has a stable baseline:
  #     - alert: YuzuSparkFleetSignalGone
  #       expr: |
  #         absent(yuzu_fleet_spark_reporting)
  #       for: 15m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "All spark fleet telemetry vanished"
  #         description: >-
  #           No agent reported any spark posture for 15m. Either the upgraded-agent
  #           population is gone (mass agent outage, gateway partition) or the server
  #           sweep stopped. Correlate with yuzu_fleet_net_*/agent-online gauges before
  #           reading this as a spark problem.

  # ── yuzu-guardian-journal - DISABLED, and not only because the journal is inert ──
  #
  # #2298 gate 3. Two independent reasons this group is commented out; BOTH must clear
  # before any rule here is enabled.
  #
  # REASON 1 - inert. The durable lifecycle-audit journal does not run until the
  # prefer_spark cutover, so every yuzu_fleet_guardian_journal_* counter is provably 0
  # in production today and an enabled rule could only fire on a FORGED heartbeat.
  # (Same reason the spark group above is commented out at rung 1.)
  #
  # REASON 2 - NO CHURN-ROBUST NEW-INCREMENT ALERT EXISTS OVER THIS SHAPE. This one does
  # not clear at the cutover. It clears only when a per-agent axis exists for the
  # JOURNAL: #2083 is spark-scoped, and the journal equivalent is not filed (see below).
  # These are UNLABELLED fleet SUMS of per-agent CUMULATIVE counters over a CHURNING
  # population, and all three candidate forms fail (governance Gate-4 unhappy-path +
  # Gate-6 sre):
  #
  #   increase()/rate() - an agent ageing out or restarting reads as a counter reset
  #     and manufactures a phantom increment; and a series that first APPEARS at a
  #     non-zero value contributes no increase at all, so it misses the first-and-only
  #     loss these counters exist to catch. (The spark preamble above records the same
  #     analysis for the same reason.)
  #
  #   delta() - needs two samples inside the window. An absent -> non-zero series has
  #     no earlier 0 to diff against: identical first-loss blind spot, different cause.
  #
  #   bare `> 0` - correct for ONE agent (a should-stay-0 monotonic that self-clears on
  #     that agent's restart), WRONG for the fleet sum. The set "some agent, ever,
  #     tripped this since its last restart" only grows as fleet-days accumulate and
  #     only shrinks when that SPECIFIC agent restarts or leaves the 90s staleness
  #     window. At 10k agents with weeks-long uptimes P(sum > 0) -> 1 for any counter
  #     with a non-zero per-agent-week trip rate - and several here have known benign
  #     trip modes - so the rule fires within hours of cutover, never clears,
  #     and the operator silences the group - losing the signal entirely. An earlier
  #     draft of this file shipped bare `> 0` here; that was wrong and is why the rules
  #     below use the rising-edge form instead.
  #
  # THE RULES BELOW USE A RISING EDGE: `(X > 0) unless (X offset 15m > 0)`. That
  # notifies once per absent->present transition rather than continuously, which is the
  # closest to correct available today. One documented refinement to evaluate at enable
  # time, not adopted here because nothing ships enabled: OR-ing in a rise detector,
  # `((X - X offset 15m) > 0)`, would additionally catch a rise in an ALREADY-PRESENT
  # series (a second agent breaking, or the same agent losing more), which the form
  # below cannot see. It is NOT churn-immune, and an earlier draft of this note wrongly
  # claimed it was: an agent RE-ENTERING the staleness window after a >15m absence
  # (reconnect, partition heal, laptop wake) raises the sum by its whole latched value
  # with no new loss, so it fires on reconnection churn - increase()'s disease, just
  # narrower. It is also blind to first appearance on its own (the offset side is
  # absent), so it complements rather than replaces the form below.
  #
  # NEITHER FORM CAN ATTRIBUTE A RISE. "A second agent also broke", "the same agent lost
  # more" and "an agent reconnected" are indistinguishable, because there is no
  # per-agent axis to separate on. That is REASON 2 in concrete form: it is why the loss
  # rules stay disabled even once the cutover clears REASON 1, and it is separate again
  # from prerequisites (a)-(d) below. Closing it needs the per-agent delta plus a
  # server-owned monotonic counter - #2083 is the spark-scoped tracker, and the journal
  # side belongs on #2298's cutover-gate list and is not yet filed there.
  #
  # UNTIL BOTH REASONS CLEAR THESE ARE MONITOR-ONLY: graph them, review them in
  # post-incident analysis, do not page on them.
  #
  # ENABLE-TIME PREREQUISITES, all currently unmet:
  #   (a) an operator surface exposing per-agent yuzu.guardian_journal_* tags - the
  #       series are unlabelled by design, so a firing alert cannot name the affected
  #       endpoints and the runbook advice to "identify the reporting agents" is
  #       unactionable without it;
  #   (b) the per-agent axis above (#2083-class work);
  #   (c) a soak at fleet scale with all 30 families live concurrently with the
  #       revocation sweep - the heartbeat tag-map grows by up to 30 entries per agent
  #       the instant prefer_spark flips, which no pre-cutover soak can observe;
  #   (d) runbooks at the docs.yuzu.io URLs below, which do not exist yet.
  #
  # SEVERITY: warning throughout. Values are agent-self-reported inside the heartbeat
  # trust boundary - one forged or buggy agent can set any of these, and suppression
  # (an agent that simply stops emitting) is indistinguishable from health - so a
  # warning routes to a ticket, never a page. An agent leaving the 90s staleness window
  # RESOLVES these without the underlying loss having healed, and a server outage longer
  # than the 15m offset window re-notifies an already-known incident on recovery (a
  # short restart is suppressed by the offset, not re-notified). The
  # alert is the signal; the audit trail is the evidence.
  #
  # PIPELINE HEALTH: yuzu_fleet_guardian_journal_reporting and ..._tag_rejected are
  # published on EVERY sweep including at 0, unlike the 30 counters. They are the only
  # rules here that CAN be sound, because they are server-owned counts rather than fleet
  # sums of agent monotonics. They differ from each other: TagRejected is
  # unconditionally sound, while TelemetryDark is sound only once Guardian is actually
  # deployed fleet-wide, because its 0 also means "nothing journalled yet" (see its
  # description below).
