  #
  # The remaining should-stay-0 counters (_stage_failures, _field_rejected,
  # _clock_rejected, _quarantined, _quarantine_failures, _prune_failures,
  # _maint_exceptions) take the identical rising-edge shape, added per-counter at
  # enable time if the soak shows them quiet enough to be actionable.
  #
  # _pending is NOT given a rule: it is a live depth gauge per agent, but the published
  # series is a fleet SUM, so at 10k agents it is non-zero essentially always and a
  # `> 0 for: 15m` rule would fire permanently on a healthy fleet. _bytes and
  # _batch_count get no rule either - they are non-zero on any working journal between
  # retention passes, so they are capacity watch signals, not alert conditions.
  #
  # The activity counters (_batches_written, _pruned, _pages, _records_paged,
  # _sent_labels, _evicted_sent_unacked) are context, not alerts. Note _sent_labels is
  # NOT a valid denominator for the eviction counters despite sharing the batch unit:
  # labels are counted in the current agent process while evictions cover batches
  # written up to 7 days earlier across a churning fleet, so after a restart the
  # numerator can exceed it.
