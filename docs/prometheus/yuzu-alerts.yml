  # - name: yuzu-guardian-journal
  #   rules:
  #     # ---- Pipeline health ---------------------------------------------------------
  #     # These two differ: TagRejected is unconditionally sound; TelemetryDark is sound
  #     # only once Guardian is deployed, because its 0 also means "nothing journalled yet".
