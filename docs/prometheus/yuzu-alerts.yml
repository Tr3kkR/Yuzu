  #           missing from the fleet sums. Identify the agent, and re-check the ceiling
  #           before raising it. This is a per-sweep count, not a latch.
  #         runbook_url: "https://docs.yuzu.io/runbooks/guardian-journal-tag-rejected"
  #     # ---- Worker staleness (MAX-rollup ages; flip item 6 + #2364) -----------------
  #     # STRUCTURALLY DIFFERENT from every counter rule in this group: the _seconds_max
  #     # gauges are a fleet MAX of live per-endpoint ages with a meaningful absolute
  #     # threshold, so a plain `> X for: Y` is sound - none of REASON 2's
  #     # increase()/rate()-over-a-churning-sum failure modes apply, and agent churn can
