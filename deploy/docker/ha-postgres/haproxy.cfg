# haproxy.cfg — routes the server's Postgres connections to the current
# Patroni PRIMARY (WS-7, ADR-2002 §11).
#
# This is CONNECTION routing, not a transaction pooler: each client TCP
# connection is proxied straight to a backend node and pinned there for its
# lifetime. That is load-bearing — the coordination substrate (WS-2/WS-3) uses
# LISTEN/NOTIFY and session-level advisory locks, both of which a transaction
# pooler (e.g. pgbouncer in txn mode) would break. Do NOT swap this for a
# transaction pooler.
#
# Primary selection is delegated to Patroni: each node's REST API answers
# GET /primary with 200 ONLY while it is the leader (and /replica with 200 only
# while it is a running replica), so HAProxy always forwards :5432 to whichever
# node Patroni currently reports as primary. On failover HAProxy re-points
# within one health-check interval, and `on-marked-down shutdown-sessions`
# severs connections to the demoted node immediately — so the server's pool
# discovers the dead connection at once rather than waiting for a TCP timeout.

global
    maxconn 800
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    retries 3
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 5s

# Operator/observability endpoint (HAProxy's own stats). Bound container-local
# only — the stats page exposes backend node IPs and health, which peer
# containers should not be able to read. Reach it via `docker exec` on the
# haproxy container (or add authenticated exposure deliberately).
listen stats
    mode http
    bind 127.0.0.1:7000
    stats enable
    stats uri /
    stats refresh 5s

# ── Primary (read-write) — this is what YUZU_POSTGRES_DSN points at ─────────
# Keep the server's DSN as postgresql://…@postgres:5432/yuzu by aliasing this
# service to `postgres` in the compose network (see docker-compose.ha-postgres.yml).
listen postgres_primary
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    # Static IPs (see the compose): a dead/ restarted node keeps a fixed address,
    # so a health check fails cleanly (timeout) rather than on DNS resolution.
    server pg1 10.89.0.11:5432 maxconn 250 check port 8008
    server pg2 10.89.0.12:5432 maxconn 250 check port 8008
    server pg3 10.89.0.13:5432 maxconn 250 check port 8008

# ── Replicas (read-only) — reserved for future read fan-out (not used by the
# server today; the server takes one read-write DSN). Balances across running
# replicas; the primary answers /replica with 503 so it is excluded.
listen postgres_replicas
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 10.89.0.11:5432 maxconn 250 check port 8008
    server pg2 10.89.0.12:5432 maxconn 250 check port 8008
    server pg3 10.89.0.13:5432 maxconn 250 check port 8008
