# Observability overlay — wires docs/prometheus/yuzu-alerts.yml into a
# running Prometheus so the shipped alert rules can be evaluated by a live
# system rather than only promtool fixtures (#2857).
#
# REQUIRED WORKING DIRECTORY: deploy/docker/. This file's own bind-mount
# paths (`./prometheus-observability.yml`, `../../docs/prometheus/...`) are
# relative to THIS FILE's location (modern `docker compose` resolves each
# `-f` file's relative paths against that file's own directory, not the
# invoking shell's cwd) — layering it alongside docker-compose.uat.yml with
# BOTH given as fully-qualified paths from elsewhere (e.g.
# `-f deploy/docker/docker-compose.uat.yml -f deploy/docker/docker-compose.observability.yml`
# run from the repo root) has been verified to resolve correctly; running
# it with BARE filenames from any directory other than deploy/docker/ fails
# to locate the `-f` files at all (loud, not silent) — the risk this note
# guards against is a copy-pasted bare-filename command run from the wrong
# directory, not a proven silent merge failure. When in doubt, `cd
# deploy/docker` first, as below.
#
# THE BASE FILE MUST COME FIRST (governance R4-1, BLOCKING — reproduced by
# execution). `-f docker-compose.uat.yml -f docker-compose.observability.yml`
# is the ONLY correct order. Reversing it
# (`-f docker-compose.observability.yml -f docker-compose.uat.yml`) makes
# the LATER file (docker-compose.uat.yml) win on the `prometheus` service's
# config-file mount — Prometheus silently reverts to `prometheus-uat.yml`
# (no `rule_files:`) while the rules-directory mount below still applies,
# so the container is healthy, every scrape target is up, and it evaluates
# ZERO of the 115 shipped rules. Neither file previously stated that `-f`
# order is load-bearing; this comment is that statement.
#
# Usage (layer on top of the base UAT rig — do NOT run standalone, it has no
# `services:` of its own beyond the override below):
#   cd deploy/docker
#   docker compose -f docker-compose.uat.yml -f docker-compose.observability.yml up -d
#
#   # Verify the rules actually loaded — do NOT trust `docker compose config`
#   # for this (governance R4-1): `rule_files:` is a key INSIDE
#   # prometheus-observability.yml, so it never appears in Compose's own
#   # merged model regardless of whether the merge is correct, and the one
#   # thing `config` CAN show (the rules-directory mount) is present even in
#   # the broken reversed-`-f` order above — so a `config`-based check passes
#   # in exactly the case it needs to fail. Ask Prometheus's own API instead,
#   # which reflects what it actually parsed and evaluated:
#   curl -s localhost:9090/api/v1/rules | python3 -c \
#     "import json,sys; d=json.load(sys.stdin); n=sum(len(g['rules']) for g in d['data']['groups']); print(n); assert n >= 115, f'only {n} rules loaded — wrong -f order, or the mount did not take'"
#   # Equivalent one-liner if you have jq: curl -s localhost:9090/api/v1/rules | jq '[.data.groups[].rules[]] | length'
#   # Or, without starting anything: docker compose -f docker-compose.uat.yml -f docker-compose.observability.yml exec prometheus promtool check config /etc/prometheus/prometheus.yml
#
# Applies to the UAT rig ONLY. `docker-compose.reference.yml` (the
# production single-server template) ships no Prometheus service at all —
# this overlay has nothing to attach to there.
#
# What this does: replaces the `prometheus` service's config-file mount
# (same container-internal target path, ../prometheus/prometheus-uat.yml ->
# prometheus-observability.yml, which is prometheus-uat.yml's scrape_configs
# plus `rule_files:`), mounts the docs/prometheus/ DIRECTORY (not a
# single-file bind — see governance UP4-5 below) into the rules glob
# Prometheus already watches, and enables the lifecycle API so a rules
# change can actually be picked up without recreating the container (see
# governance UP4-4 below).
#
# RELOADING RULES AFTER A CHANGE (governance UP4-4, reproduced: neither this
# file nor docs/uat-environment.md previously said HOW to pick up an edited
# rules file — there is no `--web.enable-lifecycle` anywhere in this repo
# before this fix, so `curl -XPOST :9090/-/reload` returned "423/405
# Lifecycle API is not enabled" and the overlay's stated purpose — "the
# shipped rules are evaluated by a live system" — was false for every
# post-start edit, which is the normal iteration loop for anyone actually
# working on the rules). `--web.enable-lifecycle` is now set below;
# after editing `docs/prometheus/yuzu-alerts.yml`:
#   curl -X POST localhost:9090/-/reload
# A directory mount (not a single-file bind — see below) means the edited
# host file's new content is what Prometheus re-reads on that reload; a
# single-file bind previously would have kept serving the OLD file's
# content across a reload because Docker single-file binds pin to the
# original inode, and most editors replace-by-rename rather than
# edit-in-place (governance UP4-5, reproduced by reasoning from documented
# Docker bind-mount semantics, not independently re-executed here).
#
# Scope: only docker-compose.uat.yml is overlaid today. The same two-line
# addition applies to docker-compose.full-uat.yml (its own
# prometheus-full-uat.yml + a matching overlay service) — not done here
# pending a decision on whether full-uat needs its own overlay file or
# should share this one via a second `docker compose -f` layer; see the
# question left in docs/enterprise-readiness-soc2-first-customer.md WS-D.
#
# Out of scope, tracked as follow-ups (see #2857): an Alertmanager (the
# `severity:` labels below still route nowhere without one — see
# docs/ops-runbooks/slo.md's correction on this exact point) and a version
# marker/checksum on yuzu-alerts.yml so a deployed copy's drift from the
# shipped file is detectable. Also not addressed: a CI regression gate that
# actually boots this overlay and asserts on `/api/v1/rules` (tracked
# sre6-4) — until one exists, treat every claim in this repo that these
# rules are "evaluated by a live system" as aspirational, not shipped;
# "the rules exist and parse" (`promtool check rules`, CI-checked) is the
# only claim this repo can currently substantiate on its own.

services:
  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus-observability.yml:/etc/prometheus/prometheus.yml:ro
      - ../../docs/prometheus:/etc/prometheus/rules:ro
