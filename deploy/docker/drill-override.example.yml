# Disposable port-remap override for a `docker-compose.reference.yml`
# restore drill (`docs/ops-runbooks/restore-drill-2026-09.md`). Committed as
# an example so the drill is reproducible — copy it (don't edit in place if
# you want to keep this as the canonical example) and adjust the host ports
# if these happen to be busy on your box.
#
# Usage:
#   cd deploy/docker
#   export YUZU_VERSION=0.13.0   # or another tag/`local` you have cached
#   export YUZU_POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#   export YUZU_DB_PASSWORD="$(openssl rand -hex 24)"
#   docker compose -p yuzu-drill -f docker-compose.reference.yml \
#     -f drill-override.example.yml up -d
#   # ... run the drill (see the runbook for the full transcript) ...
#   docker compose -p yuzu-drill -f docker-compose.reference.yml \
#     -f drill-override.example.yml down -v   # ALWAYS clean up when done
#
# `!override` forces a full replace of the base file's `ports:` list —
# Compose's default list-merge APPENDS, so without this tag both the base
# 8080/8443/50051/50052 AND the remapped ports below would be requested,
# and the base ones would still collide with anything already using them
# (the three named UAT rigs in docs/uat-environment.md, most notably, all
# bind 8080 and 50051 — check `lsof -i :8080 -i :50051` before starting).
#
# postgres.image is pinned directly (bypassing YUZU_VERSION) to a
# locally-cached build — per-store Postgres schemas are created at runtime
# by the SERVER's migration runner (docker-compose.reference.yml's own
# comment), so the postgres image's own tag is close to irrelevant; only
# the server image version matters for which stores are Postgres-backed
# vs. still-SQLite at that build. Point this at whatever postgres image tag
# you have (`yuzu-postgres:local`, or a released `ghcr.io/tr3kkr/yuzu-postgres:X.Y.Z`).
services:
  server:
    ports: !override
      - "18443:8443"
      - "18080:8080"
      - "61051:50051"
      - "61052:50052"
  postgres:
    image: yuzu-postgres:local
