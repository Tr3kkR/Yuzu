# Prometheus config for the observability overlay (issue #2857).
#
# This is a near-duplicate of ../prometheus/prometheus-uat.yml with ONE
# addition: `rule_files:`. It exists as a separate file, rather than a patch
# to prometheus-uat.yml, because this change's owned-files scope is
# `deploy/docker/` + `deploy/grafana/` — `deploy/prometheus/*.yml` belongs to
# whoever owns the base UAT rig. If prometheus-uat.yml's scrape_configs ever
# change, update both (or fold this file away and add `rule_files:` to the
# base file directly — that is the better long-term home for this addition,
# tracked alongside #2857).
#
# Targets use host.docker.internal to reach the natively-running server —
# matches docker-compose.uat.yml (native server/gateway/agent, containerized
# Prometheus+Grafana+ClickHouse).

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'yuzu-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          component: 'server'

  - job_name: 'yuzu-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9568']
        labels:
          component: 'gateway'
