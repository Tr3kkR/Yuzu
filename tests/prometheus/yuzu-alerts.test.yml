  # CASE 49 -- #3069's whole point: a Postgres/store outage that denies every
  # OIDC login in sight must NOT trip the genuine alert. The total-denied and
  # store-unavailable-denied counters both climb; the genuine counter stays
  # flat at 0 throughout (this outage produced zero POSITIVELY-confirmed
  # deprovision denials, only unresolvable ones). RED if the alert were ever
