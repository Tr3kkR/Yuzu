        eval_time: 45m
        exp_samples: []

  # ── YuzuScimAuditWriteFailures ────────────────────────────────────────────

  # CASE 55 -- a committed SCIM mutation lost its audit evidence write. The
  # `sum by (action)` aggregation strips job/instance from the resulting
  # ALERTS series but the bounded `action` label MUST survive it -- asserted
  # explicitly here, since `by (action)` dropping to a label-less sum would
  # still satisfy `> 0` and pass every other assertion in this file silently.
  - interval: 1m
    name: scim audit write failures - a failure fires and keeps its action label
    input_series:
      - series: 'yuzu_scim_audit_write_failures_total{job="yuzu",instance="s1",action="create"}'
        values: "0x30 1x30"
    promql_expr_test:
