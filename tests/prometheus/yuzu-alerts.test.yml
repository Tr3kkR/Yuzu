        eval_time: 45m
        exp_samples: []

  # ── YuzuAuthSamlDeprovisionedDeniedGenuine ───────────────────────────────

  # CASE 50 -- the SAML analogue of CASE 47.
  - interval: 1m
    name: scim genuine deny SAML - a genuine denial fires
    input_series:
      - series: 'yuzu_auth_saml_deprovisioned_denied_genuine_total{job="yuzu",instance="s1"}'
