  # ── YuzuAuthOidcDeprovisionedDeniedGenuine (#3069) ──────────────────────

  # CASE 47 -- a genuinely-deprovisioned OIDC identity was denied re-login.
  - interval: 1m
    name: scim genuine deny OIDC - a genuine denial fires
