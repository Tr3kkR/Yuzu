  # CASE 51 -- the SAML analogue of CASE 48.
  - interval: 1m
    name: scim genuine deny SAML - a flat counter stays quiet
    input_series:
      - series: 'yuzu_auth_saml_deprovisioned_denied_genuine_total{job="yuzu",instance="s1"}'
        values: "0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuthSamlDeprovisionedDeniedGenuine"}'
        eval_time: 45m
        exp_samples: []

  # CASE 52 -- the SAML analogue of CASE 49: a store-unavailable outage alone
  # must not trip the genuine SAML alert.
  - interval: 1m
    name: scim genuine deny SAML - a store-unavailable outage alone stays quiet
    input_series:
      - series: 'yuzu_auth_saml_deprovisioned_denied_total{job="yuzu",instance="s1"}'
        values: "0x5 1+1x55"
      - series: 'yuzu_auth_saml_deprovisioned_denied_store_unavailable_total{job="yuzu",instance="s1"}'
        values: "0x5 1+1x55"
      - series: 'yuzu_auth_saml_deprovisioned_denied_genuine_total{job="yuzu",instance="s1"}'
        values: "0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuthSamlDeprovisionedDeniedGenuine"}'
        eval_time: 45m
        exp_samples: []

