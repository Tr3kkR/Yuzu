  # CASE 48 -- no genuine denial in the window; quiet.
  - interval: 1m
    name: scim genuine deny OIDC - a flat counter stays quiet
    input_series:
      - series: 'yuzu_auth_oidc_deprovisioned_denied_genuine_total{job="yuzu",instance="s1"}'
        values: "0x60"
