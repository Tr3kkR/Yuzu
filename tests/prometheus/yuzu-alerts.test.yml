            value: 1

  # CASE 44 -- every SCIM deprovision in the window found its OIDC link;
  # stays quiet.
  - interval: 1m
    name: scim D2 OIDC unlinked - a flat counter stays quiet
    input_series:
      - series: 'yuzu_scim_deprovision_unlinked_total{job="yuzu",instance="s1"}'
        values: "0x60"
    promql_expr_test:
