  # counter.
  - interval: 1m
    name: scim genuine deny OIDC - a store-unavailable outage alone stays quiet
    input_series:
      - series: 'yuzu_auth_oidc_deprovisioned_denied_total{job="yuzu",instance="s1"}'
        values: "0x5 1+1x55"
      - series: 'yuzu_auth_oidc_deprovisioned_denied_store_unavailable_total{job="yuzu",instance="s1"}'
