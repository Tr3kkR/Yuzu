# Unit tests for docs/prometheus/yuzu-alerts.yml, run with promtool.
#
# WHERE THESE RUN. CI runs them in the `docs-lint` workflow's own
# `prometheus-rules` job (its own job deliberately -- it is the only Docker Hub
# dependency in that workflow, and a registry outage must report under a
# name that says so). `meson test --suite docs` runs them too, via
# `tests/prometheus/run_promtool_tests.py`, but ONLY where a promtool is
# actually available: that harness needs a native promtool of the pinned major,
# or an explicit `YUZU_TEST_ENABLE_PROMTOOL_DOCKER=1` opt-in, and skips
# otherwise. It skips rather than pulls because `scripts/ci/flake-retry.py` runs
# `meson test` unfiltered on three REQUIRED build legs, and an earlier version of
# this wiring put a Docker Hub dependency on all three (#2553).
#
# To run them yourself from the repo root:
#
#   YUZU_TEST_ENABLE_PROMTOOL_DOCKER=1 python3 tests/prometheus/run_promtool_tests.py
#
# Go through the harness rather than calling promtool directly: it is what pins
# the image, and it fails a run that promtool would exit 0 on (see below). The
# pinned image has exactly ONE home, that script's `PROMTOOL_IMAGE` -- the
# workflow carries no copy of it, so there is nothing here to keep in step.
#
# Do NOT assume 2.x agrees: Prometheus 3.0 made range selectors left-open, which
# shifts increase()/resets() by a sample at window edges -- exactly what these
# cases measure. Run them under the pinned major, not whatever is on PATH.
#
# A GREEN RUN IS NOT AUTOMATICALLY EVIDENCE. `promtool test rules` exits 0 when
# the `rule_files:` glob below matches NOTHING (it prints "WARNING: no file
# match pattern" and then "SUCCESS"), and also when `tests:` is empty. So a
# rules-file rename that misses this file would turn the gate green having
# loaded zero rules. The harness checks for both and fails; if you invoke
# promtool by hand, that check is not running.
#
# WHY THIS FILE EXISTS. An alert rule is code that runs in production and never
# compiles. `promtool check rules` proves only that the PromQL parses -- a rule
# that parses perfectly and can never fire for the case it was written for
# passes it. That is not hypothetical: YuzuAuditRetentionNotRunning shipped with
# an uptime guard that excluded a crash-looping server, which is one of the
# leading causes of the exact condition the rule detects. Nothing caught it,
# because there was nothing to catch it with.
#
# These tests are deliberately written to FAIL against the shipped-and-wrong
# form. Before trusting a change here, mutate the rule and watch the relevant
# case go red -- a green run on an untested rule proves nothing.
rule_files:
  - ../../docs/prometheus/yuzu-alerts.yml

evaluation_interval: 1m

tests:
  # ── YuzuServerRestartLoop ─────────────────────────────────────────────────
  #
  # #2854 rung C: the crash-loop signal in its own right, previously only a
  # grace-exclusion buried inside YuzuAuditRetentionNotRunning below. Both
  # halves pinned: the flagship crash-loop cadence must fire, and an ordinary
  # install-plus-fix restart pair must not.

  # CASE 25 -- the flagship case: a server crash-looping every 30 minutes.
  # Reuses YuzuAuditRetentionNotRunning's own CASE 1 uptime shape (six resets
  # across 3h30m) so the two rules are pinned against the identical failure
  # they now jointly describe.
  - interval: 1m
    name: restart loop - a 30-minute crash loop fires
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop"}'
        eval_time: 3h30m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuServerRestartLoop", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 26 -- the grace that must survive: an install followed by two
  # config-fix restarts (three boot segments, two resets) must stay quiet.
  # RED against a lowered `> 1` threshold.
  - interval: 1m
    name: restart loop - install plus two config fixes stays quiet
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x29 60+60x29 60+60x29"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop"}'
        eval_time: 89m
        exp_samples: []

  # CASE 27 -- the `> 3` boundary is EXCLUSIVE. An hourly restart cadence
  # (four one-hour boot segments, three resets) must ALSO stay quiet -- the
  # threshold is deliberately placed past three, not at `>= 3`. RED against
  # `>= 3` and against narrowing the window from [3h] to [1h] (an hourly
  # cadence puts one reset per hour, so [1h] would see only one reset per
  # window and never trip either way -- this case does not distinguish that;
  # CASE 25 does, since a 30-minute cadence is two resets per [1h] window).
  - interval: 1m
    name: restart loop - an hourly restart cadence stays quiet at exactly 3 resets
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x59 60+60x59 60+60x59 60+60x59"
    promql_expr_test:
      # 3h20m: trailing [3h] window is (20m,200m], which holds all three resets
      # (at 60m, 120m, 180m) without yet losing the first one off the back
      # edge. That reset is the sample PAIR (t=59m,t=60m); it rolls off once
      # the window excludes its PREDECESSOR sample (t=59m), i.e. once
      # eval - 180 >= 59, eval >= 239m -- not 240m, which is one minute late
      # (the pair's own later timestamp, not its earlier one).
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop"}'
        eval_time: 3h20m
        exp_samples: []

  # CASE 28 -- the window is [3h], not the issue text's "e.g. [1h]". Narrowing
  # it must redden this: the same 30-minute crash loop as CASE 25, but the
  # trailing window at eval time captures only the last hour's worth of
  # resets. Under [3h] the alert has already been firing continuously since
  # early in the series (CASE 25 pins that); under a narrowed [1h] window this
  # eval point would see only the resets inside the trailing hour, which for a
  # 30-minute cadence is at most two -- RED (quiet) against `> 3` narrowed to
  # `[1h]`, proving the window choice is load-bearing independent of the
  # threshold.
  - interval: 1m
    name: restart loop - the 3h window is pinned, not narrowable to 1h
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop"}'
        eval_time: 3h45m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuServerRestartLoop", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 29 -- YuzuServerRestartLoop stands ALONE. No audit-retention series present at all --
  # neither yuzu_server_audit_retention_passes_total nor
  # ..._last_pass_unixtime -- and the crash loop still fires. RED against any
  # future edit that re-joins this expression to a retention metric (an
  # `and on(...)` or `unless` clause referencing an absent series would empty
  # the vector and silence it here).
  - interval: 1m
    name: restart loop - fires with no audit-retention series present at all
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop"}'
        eval_time: 3h30m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuServerRestartLoop", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 30 -- the 15m `for:`. The crash loop starts at t=0; the fourth reset
  # (the one that first pushes the count past `> 3`) lands at t=120m, so the
  # condition first becomes true AT 120m, not later -- `for: 15m` from there
  # puts the firing transition EXACTLY at 135m. RED if `for:` is shortened
  # (already firing at 134m) or lengthened (still not firing at 135m -- pinned
  # at the transition itself, not a minute past it, so a `for: 15m` -> `16m`
  # drift cannot hide between two checkpoints that both straddle the wrong
  # side of the true boundary).
  - interval: 1m
    name: restart loop - the 15m for is pinned
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29"
    promql_expr_test:
      # 119m: only three resets (30m, 60m, 90m) are in window; the fourth
      # (120m) has not landed yet. Condition not even true, let alone pending.
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop"}'
        eval_time: 119m
        exp_samples: []
      # 134m: condition has held since 120m (14m < 15m) -- pending, not firing.
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop", alertstate="firing"}'
        eval_time: 134m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop", alertstate="pending"}'
        eval_time: 134m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuServerRestartLoop", alertstate="pending", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      # 135m: exactly 15m elapsed since 120m -- firing. RED against `for: 16m`
      # (134m still shows quiet under both 15m and 16m, but 135m only fires
      # under 15m; a 136m checkpoint would still show firing under 16m too,
      # missing that mutation entirely).
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop", alertstate="firing"}'
        eval_time: 135m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuServerRestartLoop", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 31 -- the two rules legitimately DISAGREE at few-reset counts, and
  # for different reasons: the retention rule keys on the DATABASE's state
  # (anchored, zero passes -> fires regardless of restart count), while the
  # loop alert keys on restart frequency alone (`> 3`; quiet at 2 -- CASE 27
  # separately pins the same quiet result at 3). Same series as CASE 26
  # (install plus two config-fix restarts), but with the reaper also stalled
  # on an anchored database. Pins the disagreement as a known, tested
  # contract -- documented in both rules' comments and the runbook -- rather
  # than an accidental drift target for a future threshold edit on either rule.
  - interval: 1m
    name: restart loop - disagrees with a stalled retention reaper at 2 resets (band also covers 3)
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x29 60+60x29 60+60x29"
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x89"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x89"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 89m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop"}'
        eval_time: 89m
        exp_samples: []

  # ── YuzuAuditRetentionNotRunning ──────────────────────────────────────────
  #
  # The rule must fire when the reaper completes no passes on a database that
  # has EVER had one (the stamp gauge, seeded from the durable anchor at
  # startup, is non-zero), and must leave exactly one state to its sibling:
  # stamp == 0, a database no pass has ever run against, which is
  # YuzuAuditRetentionNeverRan's section below.

  # CASE 1 -- the regression case. A server crash-looping every 30 minutes
  # completes zero retention passes. Under the retired uptime grace
  # (`unless (uptime < 10800 and resets(uptime[3h]) <= 1)`) this fired only
  # because of the resets bound; under the stamp grace it fires because the
  # database is ANCHORED - the seeded stamp survives every restart, so no
  # restart cadence re-enters the grace. It must fire. Red against the canary's
  # `and (` inversion (the anchored stamp then fails the join).
  - interval: 1m
    name: retention not running - crash loop is not excused on an anchored database
    input_series:
      # 30-minute sawtooth: 60,120..1800 then back to 60, seven times (3h30m).
      # Not an operand of the rule any more; kept because it is the honest
      # shape of this server's life (and what YuzuServerRestartLoop reads).
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29 60+60x29"
      # The reaper never completes a pass. Flat, and flat at 0 -- a restart
      # resets it, so a crash-looper cannot accumulate one either.
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x209"
      # The stamp: seeded from the durable anchor at every boot, so it reads
      # the last real pass's epoch across the whole loop. Value is irrelevant
      # to the rule beyond being non-zero.
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x209"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 2 -- the grace that must survive. A server on its FIRST boot against a
  # FRESH database, 55 minutes in, legitimately has no pass yet (the cleanup
  # thread sleeps 60m before its first): the stamp reads exactly 0, the one
  # state the rule excuses. It must stay quiet, or the fix for case 1 has
  # simply traded one wrong answer for another. (That state is
  # YuzuAuditRetentionNeverRan's to own, on its own 3h grace - its section
  # below.)
  - interval: 1m
    name: retention not running - a fresh database is still excused
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x59"
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x59"
      # Seeded 0: no pass has EVER run against this database.
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x59"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 55m
        exp_samples: []

  # CASE 3 -- the rule's original purpose, pinned so no grace change can
  # regress it. A long-running server whose cleanup thread died: pass counter
  # frozen, stamp frozen at the last real pass.
  - interval: 1m
    name: retention not running - a stopped reaper on a long-lived server fires
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "10860+60x239"
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "5x239"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x239"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h30m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 4 -- the healthy state. Reaper running hourly on a long-lived server;
  # the stamp steps forward with each pass.
  - interval: 1m
    name: retention not running - a healthy reaper is quiet
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "10860+60x239"
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "5+1x239"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x59 1699003600x59 1699007200x59 1699010800x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h30m
        exp_samples: []

  # CASE 5 -- the absent-stamp-series arm. The rule uses `unless` rather than
  # `and` specifically so a server that stopped exporting the stamp cannot
  # silence it; with `and`, an absent right-hand side makes the whole expression
  # empty and the alert vanishes exactly when a server is least healthy. It is
  # GREEN as written and RED against `and` -- the canary's mutation, so this
  # case is part of what makes the canary honest.
  - interval: 1m
    name: retention not running - an absent stamp series does not silence the rule
    input_series:
      # No yuzu_server_audit_retention_last_pass_unixtime at all.
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "5x239"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h30m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 6 -- LABEL MATCHING, and it is the only case that can see it. Every
  # other case uses ONE identical label set for both operands, which makes bare
  # matching, `on(instance)` and `on(instance, job)` indistinguishable.
  #
  # The two operands are scraped from the same target, so the rule matches on the
  # full label set. An explicit `on(...)` narrows that, and any OTHER 0-valued
  # stamp series agreeing on the narrowed labels is then allowed to stand in for
  # this server's stamp and suppress the alert. Here a genuinely broken anchored
  # server and a fresh-database neighbour share `job` AND `instance` and differ
  # only in `namespace` -- an ordinary Kubernetes shape. The alert must still
  # fire.
  #
  # RED against `unless on(instance) (...)` -- the join this rule's predecessor
  # shipped with -- and ALSO red against `on(instance, job)`, which merely moves
  # the hole to the next distinguishing label.
  - interval: 1m
    name: retention not running - a fresh neighbour sharing labels cannot suppress it
    input_series:
      # The broken server: anchored database, reaper frozen.
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1",namespace="prod"}'
        values: "5x179"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1",namespace="prod"}'
        values: "1699000000x179"
      # The neighbour: fresh database, stamp seeded 0.
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1",namespace="canary"}'
        values: "0x179"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 2h30m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", namespace="prod", severity="warning"}'
            value: 1

  # ── The load-bearing constants ────────────────────────────────────────────
  #
  # Cases 1-6 pin the SHAPE of YuzuAuditRetentionNotRunning. Case 7 pins its
  # magnitudes ([3h], for: 15m), so a future edit to a threshold has to be
  # deliberate. (The retired uptime grace's constants - `<= 1`, 10800, the
  # resets range - left with it; YuzuAuditRetentionNeverRan's magnitudes are
  # pinned in its own section below.)

  # CASE 7 -- the 3h evaluation window and the 15m `for`.
  #
  # A counter that is flat from t=0 does NOT pin the window: `increase()` over a
  # partial range is also 0, so such a rule fires ~15m in regardless of whether
  # the range is [1h], [3h] or [6h]. The window is only observable when the
  # counter RISES and then stops. Here the reaper completes passes for the first
  # 30 minutes and then dies, so the range boundary is what decides.
  - interval: 1m
    name: retention not running - the 3h window and the 15m for are pinned
    input_series:
      # Long-lived server, no restarts.
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "20000+60x299"
      # Passes rise until t=30m, then frozen.
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "5+1x30 35x239"
      # Anchored throughout: the stamp froze at the last real pass. Non-zero is
      # all the rule reads from it.
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x299"
    promql_expr_test:
      # 3h20m: the [3h] window still reaches back past t=30m, so increase() is
      # non-zero and the rule is quiet. RED if the window is NARROWED.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 3h20m
        exp_samples: []
      # 3h40m: the window has just cleared the last increment (~3h30m), so the
      # condition holds but `for: 15m` has not elapsed. RED if `for` is SHORTENED.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 3h40m
        exp_samples: []
      # 3h55m: condition held through `for`. Firing. RED if the window is
      # WIDENED to [6h], which would still see the t=30m increments here.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 3h55m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # ── YuzuAuditRetentionNeverRan ────────────────────────────────────────────
  #
  # The collapsed grace as a rule of its own: no genuine stamp in the whole
  # window - every sample 0 (never ran) or the INT64_MIN unreadable-anchor
  # sentinel, with at least one 0 (a dead-CMOS negative BESIDE both still
  # fires, with an imprecise story - the sentinel keeps never-ran unprovable)
  # - means no retention pass has EVER run against this database. Cases 32-38
  # (#2854 rung D) plus 39-46 (the same PR's governance hardening rounds:
  # mixed-seed regimes, the R2 window pin, the pinned false-story states, and
  # the structural-grace completeness cases). The readable acceptance argument these
  # encode is the truth table in the rung D design; the machine-checked
  # version of the coverage claim is tests/prometheus/blind_band_manifest.json,
  # gated by blind_band_sweep.py --check.

  # CASE 32 -- the state the rule exists for. Fresh database, reaper dead (a
  # failed migration closed the store at boot and start_cleanup()
  # early-returned): stamp seeded 0 and stays 0. Fires at 3h - the `for:` - and
  # not before. YuzuAuditRetentionNotRunning must stay quiet throughout: this
  # state is excused there BECAUSE it pages here.
  - interval: 1m
    name: retention never ran - a fresh database with a dead reaper fires at 3h
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x199"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x199"
    promql_expr_test:
      # 2h55m: condition true since t=0 but `for: 3h` has not elapsed. Pending,
      # not firing. RED if `for` is shortened.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 2h55m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="pending"}'
        eval_time: 2h55m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="pending", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 3h5m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      # The sibling stays quiet - not even pending - the whole time.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h5m
        exp_samples: []

  # CASE 33 -- the first pass clears it. Same start as case 32, but the reaper
  # is healthy: the first pass lands at 60m and stamps a real epoch. The rule
  # must never reach firing - at the 3h5m point where case 32 fires, this is
  # quiet, which is the entire difference between a working and a dead reaper
  # on a fresh database.
  - interval: 1m
    name: retention never ran - the first pass at 60m clears it
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x59 1x140"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x59 1699003600x140"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 3h5m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h5m
        exp_samples: []

  # CASE 34 -- a NEGATIVE stamp is a pass, not a never. A dead-CMOS host's
  # first pass stamps a negative epoch: the pass HAPPENED, so "never ran" is
  # false and this rule must clear exactly as case 33's positive stamp does.
  # RED if the min arm is dropped (max{0, -100} == 0 stays true for the rest
  # of the window and the rule false-fires at 3h5m) and RED if the two arms
  # are joined with `or` instead of `and` (the max arm alone then suffices) -
  # both mutation-verified against real promtool. This is the case that makes
  # the arms load-bearing rather than decorative.
  - interval: 1m
    name: retention never ran - a negative dead-CMOS stamp is a pass, not a never
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x59 1x140"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x59 -100x140"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan"}'
        eval_time: 3h5m
        exp_samples: []

  # CASE 35 -- the retired grace's blind band, now covered CONTINUOUSLY. A
  # 180-minute restart cadence sits square in the old rule's measured 164-195
  # minute blind band; on an anchored database the new rule must fire and STAY
  # firing across the whole loop - asserted at four points spanning three full
  # restart cycles, because "fires at some eval points" is exactly the
  # auto-resolve hole (#2854 hole 2) this redesign closes. This is the readable
  # in-suite anchor for what the sweep instrument gates exhaustively
  # (blind_band_manifest.json must stay empty).
  - interval: 1m
    name: retention not running - the old blind-band cadence fires continuously
    input_series:
      # 180m sawtooth, three cycles plus headroom (9h30m).
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "60+60x179 60+60x179 60+60x179 60+60x29"
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x569"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x569"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 3h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 5h
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 7h15m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 9h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 36 -- a negative or sentinel stamp does not silence the liveness rule.
  # The anchor seeded INT64_MIN (unreadable/untrusted durable anchor - the
  # #2854 anomaly sentinel) with a dead reaper: not the never-ran state, and
  # the alert must fire. RED against any `stamp > 0`-shaped grace, which would
  # lump every anomaly in with "fresh install" and silence the one rule
  # watching a reaper that is completing nothing.
  - interval: 1m
    name: retention not running - the anomaly sentinel does not earn the never-ran grace
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x239"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "-9223372036854775808x239"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 3h30m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      # And the never-ran rule correctly refuses it too: the sentinel is not 0.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan"}'
        eval_time: 3h30m
        exp_samples: []

  # CASE 37 -- passes rising with a frozen stamp is not a liveness fault. A
  # caller clock above kMaxPlausibleNow completes passes but refuses to stamp
  # (poisoning the gauge with known-garbage would be worse); the reaper IS
  # running, so neither rule here may page - that state belongs to
  # YuzuAuditRetentionClockAnomaly / YuzuAuditRetentionFailing.
  - interval: 1m
    name: retention liveness - a running reaper with a frozen stamp is not a liveness fault
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0+1x239"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x239"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h30m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan"}'
        eval_time: 3h30m
        exp_samples: []

  # CASE 38 -- the two rules are MUTUALLY EXCLUSIVE, per state. One dead reaper
  # on an anchored database (s1), one on a fresh database (s2), side by side:
  # each state pages exactly one of the pair. RED if the two rules are ever
  # collapsed into one `or`-joined expression (one alertname would then carry
  # both states) - keeping them separate, with separate graces and separate
  # remediations, is a design decision this case makes structural.
  - interval: 1m
    name: retention liveness - anchored-dead and fresh-dead page exactly one rule each
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x199"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x199"
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s2"}'
        values: "0x199"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s2"}'
        values: "0x199"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 3h10m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 3h10m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing", instance="s2", job="yuzu", severity="warning"}'
            value: 1

  # CASE 39 -- the mixed 0/sentinel seed regime MUST page (#2854 rung D
  # governance sec-F1, found by Gate 2 and MEASURED against the pre-hardening
  # expressions: neither rule fired at 7h55m). A never-anchored database in a
  # crash loop whose anchor read intermittently fails seeds 0 on the clean
  # boots and INT64_MIN on the failed ones. Under an instant `stamp == 0`
  # grace every 0 sample re-excused the liveness rule, and a min-only arm read
  # the sentinel as "something happened" - a dead reaper paged NOTHING. The
  # never-ran rule's sentinel branch owns this state now. RED against the
  # pre-hardening expressions; reddens again if the sentinel or-branch is
  # dropped.
  - interval: 1m
    name: retention never ran - a mixed 0/sentinel seed crash loop still pages
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x199"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x9 -9223372036854775808x9 0x9 -9223372036854775808x9 0x9 -9223372036854775808x9 0x9 -9223372036854775808x9 0x9 -9223372036854775808x9 0x9 -9223372036854775808x9 0x9 -9223372036854775808x9 0x9 -9223372036854775808x9 0x9 -9223372036854775808x9 0x9 -9223372036854775808x9"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 3h10m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      # The liveness rule stays excused (the window is zeros-and-sentinels
      # with a zero - its grace is verbatim the never-ran condition) - this
      # state is the never-ran rule's, not unowned.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h10m
        exp_samples: []

  # CASE 40 -- a 0/real-stamp flap MUST page the liveness rule (governance
  # UP-1). An anchored database whose anchor row keeps being lost and restored
  # (out-of-band restore loop; a relabel collision merging a fresh and an
  # anchored server onto one instance reads the same) alternates a real stamp
  # with 0 faster than `for: 15m`. Under the instant grace each 0 sample reset
  # the `for:` clock and the rule never latched; the range-form grace sees the
  # real stamp anywhere in [3h] and stays lifted. RED against the
  # pre-hardening instant-grace expression.
  - interval: 1m
    name: retention not running - an anchor-loss flap mixing 0 with a real stamp fires
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x209"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x9 0x9 1699000000x9 0x9 1699000000x9 0x9 1699000000x9 0x9 1699000000x9 0x9 1699000000x9 0x9 1699000000x9 0x9 1699000000x9 0x9 1699000000x9 0x9 1699000000x9 0x9 1699000000x9"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 3h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      # And not the never-ran rule: a real stamp in-window disproves "never".
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan"}'
        eval_time: 3h20m
        exp_samples: []

  # CASE 41 -- the never-ran rule's [3h] RANGE is pinned (governance QE-F1;
  # the analogue of CASE 7's window pin for the liveness rule). A fresh
  # database gets exactly one real pass at t=60m, then loses both the process
  # and the anchor row at t=70m (restart reseeds 0, counter resets, reaper
  # dead after). The genuine stamp leaves a [3h] window at t=250m, so the rule
  # goes pending at ~251m and fires at ~431m. A [1h] window loses the stamp at
  # 130m and fires ~311m - RED at the 5h15m quiet assertion below; a [6h]
  # window holds it to 430m and fires ~610m - RED at the 7h20m firing
  # assertion. Only the shipped [3h] satisfies both.
  - interval: 1m
    name: retention never ran - the 3h range is pinned by a lost-anchor rewind
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x59 1x9 0x380"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x59 1699003600x9 0x380"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 5h15m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 7h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 42 -- total scrape loss on a FRESH database: the never-ran rule keeps
  # firing alone; the liveness rule must NOT join it (the fresh sibling of
  # CASE 13's anchored double-page, governance CA-F3/arch-F4). Under the
  # instant grace this WAS a measured double-page: staleness emptied the
  # instant excusal ~5m after the last scrape while increase() still read the
  # lingering samples. The range-form grace keeps reading the in-window 0
  # samples, so the excusal survives exactly as long as the rule's own left
  # side does. RED against the pre-hardening instant-grace expression.
  - interval: 1m
    name: total scrape loss on a fresh database - never-ran fires alone, liveness stays excused
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x199"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x199"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 3h44m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h44m
        exp_samples: []

  # CASE 43 -- a caller clock above kMaxPlausibleNow on a FRESH database is a
  # PINNED false story, not a hole (governance CH-4/arch-F3/CA-F6, the fresh
  # sibling of CASE 37). Passes complete and count, but every stamp is
  # refused, so the stamp reads 0 forever and this rule fires "no pass has
  # EVER run" while the reaper is demonstrably alive.
  # YuzuAuditRetentionClockAnomaly co-fires in production (not expressible
  # here - it keys on a different counter), and the runbook routes the
  # responder there. Pinned so a future change to this behaviour - e.g. an
  # increase()-based conjunct - has to be re-reasoned against this case
  # rather than drifting silently; the design question is filed, not decided.
  - interval: 1m
    name: retention never ran - an always-refusing clock on a fresh database pages with a false story, pinned
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0+1x199"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x199"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 3h10m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning"}'
        eval_time: 3h10m
        exp_samples: []

  # CASE 44 -- a sustained 0/negative anchor flap MUST page the liveness rule
  # (governance CA-G8-1 + Gate 8 security probe A, both MEASURED silent under
  # the max-only grace this replaces). An anchored database whose only pass
  # stamped a dead-CMOS negative epoch, with the anchor row flapping
  # present/absent (restore loop; or a relabel collision merging a fresh and
  # a dead-CMOS-anchored server), alternates -100 seeds with 0 seeds. The
  # negative stamp is EVIDENCE OF A PASS, so it must lift the grace exactly
  # as a positive one does - the structural grace (excused == the never-ran
  # rule's own condition) is what guarantees no window shape silences both
  # rules. RED against the max-only grace.
  - interval: 1m
    name: retention not running - a 0/negative anchor flap fires, never silences
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x209"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "-100x9 0x9 -100x9 0x9 -100x9 0x9 -100x9 0x9 -100x9 0x9 -100x9 0x9 -100x9 0x9 -100x9 0x9 -100x9 0x9 -100x9 0x9 -100x9"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 3h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      # And not the never-ran rule: min is -100, matching neither of its arms.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan"}'
        eval_time: 3h20m
        exp_samples: []

  # CASE 45 -- the bounded 0-then-negative handoff, pinned (Gate 8
  # unhappy-path, measured green): fresh database, single dead-CMOS pass at
  # 60m whose anchor PERSISTS, reaper dead after. The pre-pass 0 samples and
  # the pre-pass counter samples age out of their [3h] windows together, so
  # the liveness rule's excusal and its own left side flip in step - it
  # fires once the window is negative-only, with no silent gap beyond the
  # increase() window itself.
  - interval: 1m
    name: retention not running - a persisted dead-CMOS anchor pages after the handoff
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x59 1x240"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x59 -100x240"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 4h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan"}'
        eval_time: 4h20m
        exp_samples: []

  # CASE 46 -- the finite negative EPISODE hands back to never-ran (Gate 8
  # unhappy-path, measured green): fresh database, one dead-CMOS pass at 60m
  # whose anchor does NOT survive (restart at 70m reseeds 0), reaper dead
  # after. Once the -100 samples age out (~250m) the window is all-0 again
  # and the never-ran rule latches, firing by ~7h11m - the same shape and
  # timing as case 41's lost-anchor rewind. Not a silent state, a slow
  # handoff; pinned so a future arm edit cannot turn it into one.
  - interval: 1m
    name: retention never ran - a finite dead-CMOS episode hands back to never-ran
    input_series:
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "0x59 1x9 0x380"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "0x59 -100x9 0x380"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing"}'
        eval_time: 7h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNeverRan", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # ── YuzuAuditRetentionMetricMissing ───────────────────────────────────────
  #
  # The companion to the rule above, which cannot detect its own input going
  # missing: `increase()` over a metric with no series is an empty vector, and
  # an alert that selects nothing never fires.

  # CASE 10 -- the metric is absent entirely. The absence alert must fire, and
  # the liveness rule must stay quiet (it has nothing to reason about, and two
  # alerts for one cause would be worse than one). This is the state a
  # Prometheus lands in when the rules file is applied ahead of the servers.
  - interval: 1m
    name: retention metric missing - an absent counter fires the absence alert, not the liveness one
    input_series:
      # Only uptime. No yuzu_server_audit_retention_passes_total anywhere.
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "20000+60x59"
    promql_expr_test:
      # 10m: the condition holds from t=0 but `for: 15m` has not elapsed, so it
      # is PENDING, not firing. RED if `for` is shortened. Case 10 and 11 both
      # evaluated only at 50m before, which is past any plausible `for` -- so the
      # new rule's own duration was unpinned while its siblings' were not.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="firing"}'
        eval_time: 10m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="pending"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="pending", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="firing"}'
        eval_time: 14m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="firing"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="firing", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="firing"}'
        eval_time: 50m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="firing", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 50m
        exp_samples: []
      # A build that exports no retention metrics exports no stamp either, so
      # the never-ran rule has nothing to reason about and stays quiet too.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan"}'
        eval_time: 50m
        exp_samples: []

  # CASE 11 -- the metric is present. The absence alert must stay silent even
  # while the liveness rule is firing.
  #
  # THIS IS NOT A GENERAL EXCLUSIVITY PROOF, and an earlier version of this
  # comment claimed it was ("what makes this a real exclusivity check"). It pins
  # one STATIC state. The two rules DO fire together on the transition, which
  # case 13 measures.
  - interval: 1m
    name: retention metric missing - a present counter keeps the absence alert quiet
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "20000+60x59"
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "5x59"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x59"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing"}'
        eval_time: 50m
        exp_samples: []
      # The liveness rule IS firing here, so this is a genuine "one fires, the
      # other does not" check rather than two quiet rules - for THIS state.
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 50m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 13 -- WHAT ACTUALLY HAPPENS WHEN A SERVER DIES, which is neither of the
  # static states cases 10 and 11 pin. The target stops being scraped at t=20m:
  # `absent()` goes true once the series ages out (~5m staleness), while
  # `increase(passes[3h])` still sees the pre-death samples and returns 0,
  # while the anchored stamp's lingering non-zero samples keep the range-form
  # grace lifted (max_over_time reads them for the same 3h the left side
  # does). So BOTH rules fire, for roughly three hours.
  #
  # That is a real double-page and this case exists to state it honestly rather
  # than let three comments keep implying the two rules partition cleanly. It is
  # pinned so that if someone later makes them exclusive - most likely by adding
  # an `up`-based target-down rule (which WOULD fire here, `up == 0`, unlike the
  # mixed-version gap it does not cover), plus an
  # Alertmanager inhibition - this case goes red and has to be re-reasoned
  # instead of silently changing behaviour.
  #
  # NOT a triple- or quadruple-page: the two assertions after the pair pin that
  # YuzuAuditRetentionNeverRan (the stamp's in-window samples are non-zero, and
  # range selectors still see them) and YuzuServerRestartLoop (no resets) stay
  # quiet here, so widening this measured double-page has to be re-reasoned too.
  #
  # MEASURED against promtool 3.13.1; found by Gate 5 chaos analysis and
  # independently by the architect review (#2553).
  - interval: 1m
    name: total scrape loss - both retention alerts fire, and that is the current behaviour
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "20000+60x20"
      - series: 'yuzu_server_audit_retention_passes_total{job="yuzu",instance="s1"}'
        values: "5x20"
      - series: 'yuzu_server_audit_retention_last_pass_unixtime{job="yuzu",instance="s1"}'
        values: "1699000000x20"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="firing"}'
        eval_time: 45m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionMetricMissing", alertstate="firing", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing"}'
        eval_time: 45m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuAuditRetentionNotRunning", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuAuditRetentionNeverRan"}'
        eval_time: 45m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuServerRestartLoop"}'
        eval_time: 45m
        exp_samples: []

  # First Mcp*-tagged cases in this file (#2792). Pin the runbook's `for: 15m`
  # derivation (docs/ops-runbooks/mcp-stream-pin-displacement.md, "Why 15
  # minutes, not something shorter") empirically rather than leaving it as
  # unverified prose.

  # CASE 14 -- the real wedge. A stuck slot draws repeated refusals every
  # interval for well past 15m, the way a client hammering a genuinely
  # unreleasable pin would. Must fire.
  - interval: 1m
    name: streamed pin slots wedged - a sustained rate fires
    input_series:
      - series: 'yuzu_mcp_bridge_pin_slots_reject_total{held="pins",job="yuzu",instance="s1"}'
        values: "0+1x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing", held="pins", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # CASE 15 -- a single isolated rejection (the charge-to-pin handover blip, or
  # one retry-clearable state-(1)/(2) refusal) must NEVER fire, at ANY eval
  # time -- not "eventually resolves", never even momentarily true. This is a
  # property of the rule's shape, not just the `for:` window: `increase(c[15m])`
  # stays >0 for a span strictly shorter than 15m following a single increment.
  # Measured directly against promtool 3.13.1 (not derived from the paragraph
  # above alone): for a bump at t=10m the underlying condition is false at
  # t=10m, true from t=11m through t=24m inclusive, and false again at t=25m --
  # a true-span of 14m, i.e. the 15m window minus one scrape interval. So
  # `for: 15m` can never be satisfied by one isolated sample -- only a rate
  # that keeps refreshing increase()>0 past where a single instance would have
  # expired can accumulate 15 continuous minutes.
  # Checkpoints: 14m/16m straddle the naive "15m after the bump" guess; 15m is
  # that guess itself; 24m is the true-span's own upper edge, and is also the
  # first eval_time a `for: 15m -> for: 13m` regression would fire at (true-span
  # starts 11m + 13m = 24m) -- confirmed by temporarily mutating the rule to
  # `for: 13m` and watching this exact assertion redden; 25m is where the
  # underlying condition itself goes false; 30m is long after.
  - interval: 1m
    name: streamed pin slots wedged - one isolated rejection never fires
    input_series:
      - series: 'yuzu_mcp_bridge_pin_slots_reject_total{held="pins",job="yuzu",instance="s1"}'
        values: "0x10 1x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 14m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 16m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 24m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 25m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 30m
        exp_samples: []

  # CASE 16 -- pins the "Why 15 minutes" derivation's own faster-than-the-window claim
  # (docs/ops-runbooks/mcp-stream-pin-displacement.md, "A cadence faster than the window
  # is a different case"). A 10-minute retry cadence is faster than the 15-minute window,
  # so it does eventually fire (unlike CASE 15's single rejection or a cadence at/above the
  # window), but not immediately: successive rejections keep refreshing the trailing
  # increase() window before the previous one ages out, so the reading locks into
  # "sustained" starting about a minute after the first rejection (t=11m for a bump at
  # t=10m, matching CASE 15's own measured true-span start) -- then `for: 15m` still has to
  # elapse from THAT point, not from the first rejection. Measured against promtool 3.13.1:
  # empty through 25m, firing from 26m -- a 16-minute delay from the first rejection to
  # first fire, not the naive 15m of `for:` alone. This exists because an earlier revision
  # of the runbook prose stated this delay as "roughly 25 minutes" (conflating the absolute
  # eval-time boundary with the delay-from-first-rejection quantity) -- caught in a Gate 8
  # re-review round, twice, before landing here as a pinned case rather than unpinned prose.
  - interval: 1m
    name: streamed pin slots wedged - faster-than-window cadence fires with a delay, not instantly
    input_series:
      - series: 'yuzu_mcp_bridge_pin_slots_reject_total{held="pins",job="yuzu",instance="s1"}'
        values: "0x10 1x10 2x10 3x10 4x10 5x10 6x10"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 25m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing"}'
        eval_time: 26m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuMcpStreamedPinSlotsWedged", alertstate="firing", held="pins", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # ── YuzuResponseReapNotRunning / YuzuResponseReapMetricMissing /
  #    YuzuResponseReapAnchorNotSurviving / YuzuResponseReapBacklog ──────────
  #
  # #2691 Gate 6 (sre + enterprise-readiness, promtool-reproduced independently):
  # yuzu_server_response_reap_passes_total is LABELED by `result` (unlike
  # AuditStore's unlabeled sibling), and boot-seeded to 0 for every result
  # value, so a `rate(...) == 0` with no sum() fires PERMANENTLY on every
  # healthy install — every quiet-but-healthy result label independently
  # satisfies `==0`. These cases are red against the shipped-and-wrong
  # sum()-less form.

  # CASE 17 -- the regression case. A perfectly healthy reaper runs "noop"
  # every minute for 5h; every other result label sits boot-seeded flat at 0
  # the whole time (exactly server.cpp's zero-seed loop). Without sum() this
  # fires (5 separate always-zero series each satisfy ==0 over the window).
  # With sum() it must stay quiet throughout.
  - interval: 1m
    name: response reap not running - a healthy noop-only reaper does not page
    input_series:
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="noop"}'
        values: "0+1x300"
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="swept"}'
        values: "0x300"
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="capped"}'
        values: "0x300"
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="declined"}'
        values: "0x300"
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="declined_no_anchor"}'
        values: "0x300"
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="skipped_lock"}'
        values: "0x300"
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="failed"}'
        values: "0x300"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuResponseReapNotRunning", alertstate="firing"}'
        eval_time: 5h
        exp_samples: []

  # CASE 18 -- the true-positive case the rule exists for: nothing runs at
  # all (every result label flat at 0, none incrementing). Must fire.
  - interval: 1m
    name: response reap not running - a truly stalled reaper does page
    input_series:
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="noop"}'
        values: "0x300"
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="swept"}'
        values: "0x300"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuResponseReapNotRunning", alertstate="firing"}'
        eval_time: 5h
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuResponseReapNotRunning", alertstate="firing", severity="warning"}'
            value: 1

  # CASE 19 -- absence companion: no series at all must fire the absence
  # alert, and the (sum-based) liveness rule selects nothing and stays quiet.
  - interval: 1m
    name: response reap metric missing - an absent counter fires the absence alert, not the liveness one
    input_series:
      - series: 'yuzu_server_uptime_seconds{job="yuzu",instance="s1"}'
        values: "20000+60x59"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuResponseReapMetricMissing", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuResponseReapMetricMissing", alertstate="firing", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuResponseReapNotRunning", alertstate="firing"}'
        eval_time: 20m
        exp_samples: []

  # CASE 20 -- anchor-not-surviving: exactly one declined_no_anchor pass ever
  # (the expected first-boot bootstrap) must stay quiet; a second one within
  # 24h (the anchor not surviving between passes) must fire.
  - interval: 1m
    name: response reap anchor not surviving - one decline is the expected bootstrap, a second pages
    input_series:
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="declined_no_anchor"}'
        values: "0x60 1+0x300 2+0x300"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuResponseReapAnchorNotSurviving", alertstate="firing"}'
        eval_time: 4h
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuResponseReapAnchorNotSurviving", alertstate="firing"}'
        eval_time: 10h30m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuResponseReapAnchorNotSurviving", alertstate="firing", instance="s1", job="yuzu", result="declined_no_anchor", severity="warning"}'
            value: 1

  # CASE 21 -- backlog: hitting the per-pass cap on every pass for the full
  # 3h `for:` window must page; a single capped pass surrounded by swept
  # passes must not.
  - interval: 1m
    name: response reap backlog - sustained capped pages, an isolated one does not
    input_series:
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="capped"}'
        values: "0+1x200"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuResponseReapBacklog", alertstate="firing"}'
        eval_time: 3h20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuResponseReapBacklog", alertstate="firing", instance="s1", job="yuzu", result="capped", severity="warning"}'
            value: 1

  # CASE 22 -- failing: a lone failed pass (transient blip) must not page; two
  # or more within 3h (a repeating wedge) must. Distinct from NotRunning — the
  # counter IS moving, just onto the wrong label.
  - interval: 1m
    name: response reap failing - a lone failure is quiet, a repeat within 3h pages
    input_series:
      - series: 'yuzu_server_response_reap_passes_total{job="yuzu",instance="s1",result="failed"}'
        values: "0x60 1+0x120 2+0x300"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuResponseReapFailing", alertstate="firing"}'
        eval_time: 2h
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuResponseReapFailing", alertstate="firing"}'
        eval_time: 3h30m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuResponseReapFailing", alertstate="firing", instance="s1", job="yuzu", result="failed", severity="warning"}'
            value: 1

  # ── YuzuResponseIngestDrops / YuzuResponseMalformedIdentityDrops ───────────
  #
  # #2691 Gate 8 (security-guardian): malformed_identity_field is a security
  # control working as intended (an agent sent a NUL-containing identity
  # field, correctly rejected), not store unhealth -- it must not page the
  # store-health alert on its own.

  # CASE 23 -- an agent sending only malformed identity fields must not page
  # YuzuResponseIngestDrops (the store-health alert), but must page the
  # informational companion.
  - interval: 1m
    name: response ingest drops - malformed identity alone does not page store health
    input_series:
      - series: 'yuzu_server_response_ingest_dropped_total{job="yuzu",instance="s1",reason="malformed_identity_field"}'
        values: "0+1x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuResponseIngestDrops", alertstate="firing"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuResponseMalformedIdentityDrops", alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuResponseMalformedIdentityDrops", alertstate="firing", instance="s1", job="yuzu", reason="malformed_identity_field", severity="info"}'
            value: 1

  # CASE 24 -- a genuine store-health drop reason (pool_acquire_timeout) still
  # pages YuzuResponseIngestDrops, unaffected by the exclusion.
  - interval: 1m
    name: response ingest drops - a genuine store-health reason still pages
    input_series:
      - series: 'yuzu_server_response_ingest_dropped_total{job="yuzu",instance="s1",reason="pool_acquire_timeout"}'
        values: "0+1x20"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuResponseIngestDrops", alertstate="firing"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuResponseIngestDrops", alertstate="firing", reason="pool_acquire_timeout", severity="warning"}'
            value: 1
